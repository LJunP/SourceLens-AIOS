quality_freeze_before_worker:
  required_artifacts:
    - closed admission-manifest schema and positive manifest for one new visible synthetic HARNESS_STUB fixture
    - canonicalization rule id, immutable canonicalizer SHA-256/byte length and non-self-referential payload-hash test vectors
    - exact referenced-path, SHA-256 and byte-length inventory
    - fifteen atomic negative admission fixtures, each derived from the valid positive fixture by exactly one mutation
    - one typed expected rejection reason for each negative fixture
    - ownership map
    - P1-001 immutable baseline hash manifest
    - Quality freeze receipt binding this Task Contract and runtime observation
  required_negative_cases:
    - id: N01_UNKNOWN_MANIFEST_FIELD
      single_mutation: add one unknown top-level field
      expected_reason: ADMISSION_SCHEMA_UNKNOWN_FIELD
    - id: N02_MISSING_REQUIRED_FIELD
      single_mutation: remove payload.schema_version
      expected_reason: ADMISSION_SCHEMA_REQUIRED_FIELD_MISSING
    - id: N03_PAYLOAD_HASH_MISMATCH
      single_mutation: replace payload_sha256 with 64 zeroes
      expected_reason: ADMISSION_PAYLOAD_HASH_MISMATCH
    - id: N04_REFERENCED_SHA256_MISMATCH
      single_mutation: replace context.sha256 with 64 zeroes
      expected_reason: ADMISSION_REFERENCE_SHA256_MISMATCH
    - id: N05_REFERENCED_LENGTH_MISMATCH
      single_mutation: increment context.byte_length by one
      expected_reason: ADMISSION_REFERENCE_LENGTH_MISMATCH
    - id: N06_ABSOLUTE_REFERENCE
      single_mutation: replace context.path with one absolute path
      expected_reason: ADMISSION_REFERENCE_ABSOLUTE
    - id: N07_PARENT_TRAVERSAL
      single_mutation: replace context.path with a path containing one parent segment
      expected_reason: ADMISSION_REFERENCE_TRAVERSAL
    - id: N08_SYMLINK_COMPONENT
      single_mutation: replace context.path with the Quality-owned symlink fixture path
      expected_reason: ADMISSION_REFERENCE_SYMLINK
    - id: N09_ADAPTER_OUTSIDE_EXACT_MAP
      single_mutation: replace adapter_entrypoint.path with one different repository file
      expected_reason: ADMISSION_ADAPTER_NOT_ALLOWLISTED
    - id: N10_EVALUATOR_OUTSIDE_EXACT_MAP
      single_mutation: replace evaluator_entrypoint.path with one different repository file
      expected_reason: ADMISSION_EVALUATOR_NOT_ALLOWLISTED
    - id: N11_TASK_IDENTITY_MISMATCH
      single_mutation: replace the manifest task identity only
      expected_reason: ADMISSION_TASK_IDENTITY_MISMATCH
    - id: N12_ENVIRONMENT_IDENTITY_MISMATCH
      single_mutation: replace the manifest environment identity only
      expected_reason: ADMISSION_ENVIRONMENT_IDENTITY_MISMATCH
    - id: N13_CONFIGURATION_IDENTITY_MISMATCH
      single_mutation: replace the manifest configuration identity only
      expected_reason: ADMISSION_CONFIGURATION_IDENTITY_MISMATCH
    - id: N14_OUTPUT_PATH_ESCAPE
      single_mutation: replace output path with one parent-traversing path
      expected_reason: ADMISSION_OUTPUT_ESCAPE
    - id: N15_OUTPUT_ALREADY_EXISTS
      single_mutation: pre-create the exact otherwise-valid evidence directory
      expected_reason: ADMISSION_OUTPUT_EXISTS
  atomic_fixture_rule: Each fixture has one valid pre-state, one mutation and one expected primary reason; aggregate OR fixtures are forbidden.
  mutation_after_freeze_effect: STOP_TASK

minimum_implementation:
  - parse one closed admission manifest with no unknown fields
  - require every manifest reference to equal its exact reference-map path and reject any symlink component
  - verify referenced SHA-256 and byte length before use, bind the exact argv-consumed paths at pre-spawn and post-execution, and revalidate before final evidence freeze
  - derive task, run, adapter, evaluator, verification and evidence identities from admitted bytes instead of P1-001 constants
  - preserve the legacy P1-001 CLI invocation and exact accepted fixture behavior
  - support an explicit bundle argument for execution and fresh replay
  - record the admission-manifest identity and referenced input identities in preflight and Evidence Manifest
  - execute positive, controlled-failure, promotion-probe and replay paths for the frozen admission fixture
  - keep output create-once beneath evaluation-harness/recording and reject symlink or population drift

