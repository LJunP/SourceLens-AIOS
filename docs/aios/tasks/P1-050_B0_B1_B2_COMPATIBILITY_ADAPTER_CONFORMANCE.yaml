title: Provider-Neutral B0 B1 B2 Compatibility Adapter Conformance Pack

objective: >-
  Build one clean-room, provider-neutral, executable compatibility adapter pack
  for the B0, B1 and B2 common interface defined by Baseline Adapter Contract
  v0.2. Against one Quality-frozen visible synthetic TaskSpec and one common
  EnvironmentSnapshot, budget and evaluator identity, execute local
  deterministic conformance drivers, emit schema-valid RunRecord and observable
  execution Evidence, reject forbidden adapter capabilities and independently
  replay the exact candidate. B2 must bind the exact read-only P0 Git snapshot
  and a fresh Quality external truth-binding attestation, then retain a missing
  or failed task outcome rather than emulate an unavailable capability. This
  Task proves local interface and policy conformance only; it does not execute
  or measure a real model, Agent or baseline performance.

why_now:
  - Evaluation Protocol v1.1 requires B0, B1 and B2 to run under one harness or documented compatibility adapters before P1 Exit.
  - P1-048 accepted a narrow actual-execution and independent-reexecution substrate, while the current route still has no accepted B0/B1/B2 compatibility adapter capability.
  - P1-049 is terminal and cannot be resumed or reused; this Task has a different falsifiable output and directly tests the next missing P1 Exit capability within the final route slot.

