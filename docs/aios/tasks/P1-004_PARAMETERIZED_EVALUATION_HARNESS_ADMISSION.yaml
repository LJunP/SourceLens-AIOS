title: Parameterize the accepted Evaluation Harness input admission path
status: FOUNDER_EXECUTION_AUTHORIZATION_REQUIRED
execution_authorized: false

objective: >-
  Refactor the accepted P1-001 Evaluation Harness so that one closed, hash-bound,
  path-safe admission manifest can select a Quality-frozen TaskSpec,
  EnvironmentSnapshot, SystemConfiguration, visible fixture, adapter, evaluator
  and oracle without P1-001 task or path hard-coding. Preserve the exact legacy
  P1-001 behavior and frozen evidence, add fail-closed admission tests, controlled
  failure, replay and Evidence Manifest generation, and stop before any B0/B1/B2
  measurement or capability claim.

why_now:
  - P1-001 passed Founder Gate and provides the accepted deterministic harness and evidence path.
  - The accepted harness still hard-codes P1-001 task identity, fixture paths, adapter, evaluator, verification reference and evidence metadata.
  - B0, B1 and B2 cannot later use one comparable harness until an independently frozen input bundle can be admitted without modifying harness source per experiment.
  - P1-002 and P1-003 are terminal non-PASS tasks and are neither inputs nor implementation sources for this Task.

research_hypothesis:
  statement: >-
    A minimal parameterized admission interface can execute a second visible
    synthetic HARNESS_STUB fixture from frozen hashes, reject identity and path
    drift, reproduce the normalized result, and preserve P1-001 legacy behavior
    without changing accepted schemas, evaluator/oracle bytes, using a Provider,
    or entering Agent Runtime.
  falsifier: >-
    The interface cannot be made reproducible and fail-closed within the exact
    paths and budget, or requires changing accepted schemas, P1-001 frozen
    evaluator/oracle/evidence, using P1-002/P1-003 candidates, live B0/B1/B2,
    network/Provider/Secret access, or P2/P3 capability.

claim_boundary:
  proves_if_accepted:
    - one additional visible synthetic input bundle can be admitted through a closed hash-bound manifest
    - referenced input bytes, adapter and evaluator identities are verified before execution
    - controlled failure, promotion rejection, replay and evidence-manifest plumbing remain reproducible for the admitted bundle
    - legacy P1-001 invocation and accepted fixture behavior remain regression-compatible
  does_not_prove:
    - B0, B1, B2 or A0 performance
    - Verified Task Success Rate or inclusion in its denominator
    - model, Repository Intelligence or software-engineering Agent capability
    - hidden-set validity or P1-003 dataset validity
    - production readiness, hostile-principal resistance, strong isolation or P2/P3 readiness

