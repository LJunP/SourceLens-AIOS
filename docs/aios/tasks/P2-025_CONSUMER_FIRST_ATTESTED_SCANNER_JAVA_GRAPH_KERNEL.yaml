claim_boundary: >-
  Cooperative-local, pure-offline, clean-room consumer-first Evidence
  admission and Java graph projection. It does not claim hostile-principal
  isolation, trusted clock, production custody, Provider execution or P3.
architecture_constraints:
  - External expected manifest identity is known before the consumer reads the manifest bytes.
  - Manifest identity and complete regular-object closed inventory admission finish before any semantic object is parsed.
  - Negative link and nonregular cases are represented only by regular typed descriptors or regular archives.
  - Accepted scanner binding, build receipt and binary are revalidated from exact bytes by the independent consumer.
  - Raw process Evidence binds one exact argv vector, exact scanner path, operation, source root identity, stdout, stderr and exit status.
  - Provider, Secret and all external-effect counts are derived from closed raw inputs and OS observations, never copied from a worker summary.
  - Java symbol identity is repository-root-independent and graph bytes and replay are deterministic across two physical roots.
quality_freeze:
  positive_matrix:
    - Two physically independent Java repositories are scanned by the exact accepted scanner.
    - Both admitted packages produce byte-identical graph projection and replay.
    - Internal, external, unresolved, ambiguous and duplicate relations are explicitly classified.
    - Independent consumer rederives scanner invocation and all six zero external effects.
  negative_matrix:
    - top-level manifest path, type, length or SHA drift
    - semantic read before full inventory admission
    - real symlink or hardlink in admitted inventory
    - typed symlink and hardlink descriptor handling
    - scanner binding, build receipt or binary mutation
    - scanner realpath, executable type or exact argv drift
    - source root realpath, device or inode drift
    - stdout, stderr, exit status or process-tree mutation
    - observed socket stdout or stderr mutation
    - Provider or Secret input injection
    - repository-root identity leakage
    - internal, external, unresolved or ambiguous relation mutation
    - duplicate, missing, reorder, path substitution, identity drift and tamper
acceptance_criteria:
  - Canonical authority and P2 safety entry pass before engineering writes.
  - Complete clean-room implementation and independent consumer matrix pass from a fresh owned root.
  - At least two physical repository roots produce byte-exact graph and replay bytes.
  - All mandatory negative classes reject with false_accepts equal to zero.
  - Independent derivation records network, provider, secret, remote, production and public as zero.
  - One exact candidate is frozen and fresh CTO, Security and Quality reviewers return TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree integrates exactly and one canonical make verify passes.
required_evidence:
  - source and candidate manifests
  - external expected Evidence-manifest identity
  - complete closed inventory and admission receipt
  - accepted scanner binding, build receipt and binary attestations
  - two raw scanner process receipts with stdout and stderr
  - raw process tree, environment, socket observation and filesystem write inventories
  - two exact graph projections and replay receipts
  - per-case raw negative Evidence and independent verifier receipt
  - fresh CTO, Security and Quality Reviews
