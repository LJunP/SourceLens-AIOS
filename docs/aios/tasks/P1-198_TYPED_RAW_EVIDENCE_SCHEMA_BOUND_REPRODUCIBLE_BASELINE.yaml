architecture_constraints:
  - Define a versioned closed schema and exact key set for every authoritative raw Evidence object type.
  - Reject duplicate JSON keys before ordinary JSON parsing and reject unknown or missing fields.
  - Require canonical UTF-8 JSON encoding with exact integer, timestamp and enum semantics; NaN and Infinity are forbidden.
  - Bind request, response, adapter execution, trace, compiler, patch, oracle, test, rollback, observer, environment and configuration objects through typed relationship fields.
  - A manifest binds object identity but never authorizes an object's schema, semantics or cross-binding.
  - Use unique relative object identifiers with path, regular-file type, byte length and SHA-256 identity.
  - Preserve create-once, atomic finalization, closed inventory and owned cleanup across canonical-equivalent parent topologies.
  - The independent evaluator reconstructs all report fields only from frozen raw Evidence and never trusts Worker success, classification, usage or effect claims.
  - Provider and Secret effects remain forbidden until the complete synthetic preformal Gate and one same-cycle fresh CTO, Security and Quality review all PASS.
