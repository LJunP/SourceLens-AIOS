acceptance_criteria:
  - The exact Quality-first freeze completes before Worker start and binds all Quality-owned bytes, this exact Contract, both accepted dependencies, runtime identity, ownership map and the seven recursively closed schemas.
  - Exactly two public synthetic validation tasks are admitted and exactly eight ordered semantic input bindings are hash- and length-bound; every input follows the frozen precedence and post-read identity rule.
  - Every run follows the exact required call chain, uses a direct child with shell false, captures actual argv/cwd/status/stdout/stderr, persists exact AdmissionReceipt stdout bytes create-once and proves ledger stdout SHA-256 equality.
  - The exact P01-P03, F01, A01-A05, I01, R01, O01-O04 and S01-S02 matrix produces its frozen call vector, verdict, reason code, exit status and applicable effect oracle with the exact aggregate mechanical counts.
  - Outputs and Evidence are create-once, exact-population, regular-file-only and hash-bound; path escape, symlink, preexisting leaf, byte drift, overwrite and reseal attempts fail closed in the frozen precedence.
  - P01 and P02 replay equalities hold, R01 is rejected, and P1-001, P1-035, make verify, fresh rebuild and rollback are all PASS without network or package download.
  - The frozen candidate commit/tree, source diff, command ledger, artifact index and Evidence Manifest are complete and independently reproducible.
  - CTO, Security and Quality independently PASS the exact candidate, Contract and Evidence Manifest after implementation, with no implementer self-review.
  - HIDDEN_SET_PROTOCOL and PARAMETERIZED_EVALUATION_HARNESS are accepted atomically under the fixed P1-safe claim boundary; partial capability acceptance is forbidden.
  - No historical failed asset, execution lineage, candidate, partial implementation, hidden material, Evidence or review is read, adopted, replayed or reused.
  - All writes remain inside the exact role-owned paths and external Evidence root, and network, provider, secret, remote, production and public effects remain zero.

failure_criteria:
  - Any Quality asset is authored after Worker observation, changes after freeze, lacks exact identity, or is writable by Worker or Integration.
  - Any schema is open, any semantic binding is missing, extra, reordered, ambiguous or identity-drifted, or any validation precedence differs from this Contract.
  - Any case differs from its exact call vector, verdict, reason, exit status or effect oracle, or any aggregate mechanical count differs.
  - Admission can be bypassed with a prebuilt receipt, semantic content leaks through the sanitized descriptor, or the ledger does not bind exact child stdout bytes.
  - Any output is created before its validation stage, escapes containment, follows a symlink, overwrites a preexisting leaf, is resealed, or remains accepted after post-freeze drift.
  - Replay, P1-001 regression, P1-035 regression, make verify, fresh rebuild, rollback or any independent review is non-PASS.
  - Either mandatory Exit capability would require partial acceptance, a broader claim, an external effect, historical failed asset reuse or a successor/replacement/correction chain.
  - Evidence is incomplete, mutable, non-reproducible or not bound to the exact Contract and candidate commit/tree.

stop_conditions:
  - Any final exact Contract review is non-PASS.
  - A real architecture implementation root prevents this exact runnable vertical slice from satisfying all atomic acceptance criteria.
  - Any forbidden path read or write, historical failed asset read or reuse, or forbidden external effect occurs.
  - Contract, scope, permission, budget, route, runtime, accepted dependency, Quality asset or claim boundary expansion is required.
  - Two implementation iterations fail for the same root cause without new engineering evidence, or the 24-hour or 5-day budget is exhausted.
  - Candidate, branch, worktree or execution retry limits would be exceeded.
  - A higher-severity safety, integrity, custody or containment defect is demonstrated by direct Evidence.

terminal_rule:
  final_contract_any_non_pass: PERMANENTLY_STOP_ROUTE_AND_ESCALATE_FOUNDER
  real_architecture_implementation_failure: PERMANENTLY_STOP_ROUTE_AND_ESCALATE_FOUNDER
  fourth_route_allowed: false
  post_failure_founder_choices:
    - FORMALLY_REVISE_P1_EXIT_GATE
    - STOP_P1
  no_successor_replacement_correction_or_retry: true

evidence:
  required:
    - exact final Task Contract and phase-delegated execution authorization
    - prefreeze convergence spec identity and one-final-exact-Contract freeze receipt
    - Quality ownership map and pre-Worker Quality freeze receipt
    - exact population, byte lengths and SHA-256 identities for all Quality-owned assets
    - runtime executable path, version and SHA-256 observation
    - exact command ledger with argv, cwd, start/end time, status, stdout/stderr identities and effect observations
    - eight semantic input binding validation results in exact order
    - seven closed-schema positive and negative validation results
    - exact 17-case result matrix with per-case call vector, verdict, reason, exit status and effect oracle result
    - aggregate mechanical call and verdict counts
    - exact admission receipt stdout persistence and ledger SHA equality proof
    - output create-once, population, containment, symlink and post-freeze identity results
    - P1-001, P1-035 and make verify regression results
    - deterministic replay comparison and controlled replay-drift rejection
    - fresh local rebuild and rollback verification
    - frozen candidate commit/tree, source diff and write-scope audit
    - closed artifact index and Evidence Manifest with all artifact byte lengths and SHA-256 hashes
    - CTO, Security and Quality independent PASS reviews
    - atomic delegated Task Gate receipt for both mandatory Exit capabilities
  manifest:
    record_type: aios_p1_mandatory_capability_evidence_manifest
    mandatory_exit_capabilities:
      - HIDDEN_SET_PROTOCOL
      - PARAMETERIZED_EVALUATION_HARNESS
    replay_result: PASS
    rebuild_result: PASS
    rollback_result: PASS
    claim_boundary: COOPERATIVE_LOCAL_PUBLIC_SYNTHETIC_ROLE_SEPARATED_HIDDEN_ADMISSION_AND_PARAMETERIZED_HARNESS_REPRODUCIBLE_INTEGRATION_ONLY_NO_REAL_HIDDEN_SET_SECRECY_REPRESENTATIVENESS_CUSTODY_HOSTILE_PRINCIPAL_AGENT_P1_EXIT_P2_P3_OR_PRODUCTION_CLAIM

rollback:
  method: >-
    Before Task Gate, remove only the unmerged Task worktree and branch while
    preserving immutable Evidence and Git objects. After local canonical main
    integration, use a forward revert of the exact integration commit and verify
    the pre-integration tree; never rewrite history.
  destructive_history_rewrite: false
  external_resource_cleanup_required: false

atomic_capability_acceptance:
  required: true
  capabilities_in_order:
    - HIDDEN_SET_PROTOCOL
    - PARAMETERIZED_EVALUATION_HARNESS
  partial_acceptance_allowed: false
  acceptance_unit: ONE_EXACT_CANDIDATE_ONE_EVIDENCE_MANIFEST_ONE_REVIEW_SET_ONE_TASK_GATE
  next_capability_only_after_atomic_acceptance: VTSR_COUNTING_VALIDATOR

claim_boundary: COOPERATIVE_LOCAL_PUBLIC_SYNTHETIC_ROLE_SEPARATED_HIDDEN_ADMISSION_AND_PARAMETERIZED_HARNESS_REPRODUCIBLE_INTEGRATION_ONLY_NO_REAL_HIDDEN_SET_SECRECY_REPRESENTATIVENESS_CUSTODY_HOSTILE_PRINCIPAL_AGENT_P1_EXIT_P2_P3_OR_PRODUCTION_CLAIM

p1_claim_boundary:
  proves_only:
    - one cooperative local public synthetic role-separated hidden-admission mechanics implementation
    - one deterministic parameterized harness integration over exactly two accepted synthetic validation tasks
    - reproducible create-once Evidence, replay, rebuild and rollback for the frozen matrix
  does_not_prove:
    - real hidden-set secrecy or representativeness
    - secret custody or hostile-principal resistance
    - model or Agent capability
    - benchmark validity, VTSR or comparative baseline performance
    - P1 Exit, P2, P3, production readiness or external-effect authorization

forbidden_actions:
  - network access or network calls
  - provider access or provider calls
  - secret access, secret reads or secret material
  - remote reads, remote writes or remote effects
  - production access, production writes or production effects
  - public release, public writes or public effects
  - package installation, dependency download or new runtime service
  - canonical main write before delegated Task Gate and local integration
  - source task repository write or mutation
  - reading, adopting, copying, replaying or reusing any historical failed Task asset, Contract, execution lineage, nonce, candidate, partial implementation, hidden material, Evidence or review
  - changing this final exact Contract, any accepted dependency, any Quality-frozen byte, any schema, oracle, evaluator, case vector, precedence, count, effect oracle or claim boundary after Worker start
  - prebuilt admission receipt injection, admission child bypass, shell execution, semantic input leakage, output overwrite or reseal
  - B0, B1, B2, A0, model, provider, benchmark, VTSR or Agent execution
  - Supervisor, Root Custody, Trust Runtime, Agent Runtime, strong isolation, Multi-Agent Runtime, P2 or P3 implementation
  - partial capability acceptance, retry, successor, replacement, remediation, normalization, closure, feasibility or correction chain
  - irreversible deletion, destructive history rewrite or unbounded execution

delegated_authority:
  phase_local: true
  model: P1_PHASE_LEVEL_FOUNDER_DELEGATION
  task_gate_owner: MASTER_CEO_AGENT
  founder_gate: RESERVED_DECISIONS_ONLY
  founder_reserved_decisions: []
  external_effects:
    network: false
    provider: false
    secret: false
    remote: false
    production: false
    public: false
  master_may_prepare_freeze_review_activate_implement_gate_integrate_cleanup_and_continue: true
  routine_task_founder_approval_required: false
  next_normal_founder_intervention: P1_PHASE_GATE_OR_REAL_FOUNDER_RESERVED_DECISION
  post_acceptance_continuation: MASTER_AUTONOMOUSLY_SELECT_VTSR_COUNTING_VALIDATOR_WITHIN_CURRENT_P1_ENVELOPE

completion_rule: >-
  Completion requires one frozen exact candidate, complete reproducible Evidence,
  exact PASS of every acceptance criterion, independent CTO, Security and Quality
  PASS, and one Master Task Gate accepting both mandatory Exit capabilities
  atomically. Completion does not prove P1 Exit or authorize benchmark, Agent,
  P2, P3, production, hostile-principal or external-effect claims. Any final
  Contract non-PASS or real architecture implementation failure permanently
  stops this route and escalates the Founder under the frozen terminal rule.
