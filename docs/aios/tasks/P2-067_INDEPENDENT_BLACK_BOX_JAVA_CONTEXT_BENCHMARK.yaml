acceptance_criteria:
  - Exact canonical parent 4dfa05eb6af3c062124fbfd7ec6b44246a41e59b and tree a092922aacbf63777b823d5a5284ba111e7d7ee0 remain the source identity and product source bytes remain unchanged.
  - The public and held baseline roots, twelve current-source behavior lineages, DEV4 HELD8 split, source anchors, oracle commitments, environment, two systems, metrics and full 48-dispatch schedule are frozen before the first formal dispatch.
  - B1_SIMPLE_LEXICAL_V1 is an independent simple lexical executable with no SourceLens graph, ranker or memory use; A0_CANONICAL_TCP_QA_V1 invokes the unchanged canonical POST /api/projects/{projectId}/qa through an external loopback TCP client to a separately observed Spring JVM.
  - Each paired cell uses exact-equal source and chunk universe, question bytes, eight context slots and UTF-8 packed byte budget; the only treatment distinction is no SourceLens graph or ranker for B1 versus graph-conditioned canonical context selection for A0.
  - All twelve tasks and both physical replay roots complete exactly once for 24 logical cells and 48 HTTP dispatches with zero retries, reruns, replacements, post-result tuning or denominator exclusion.
  - On the eight held tasks A0 records at least six strict wins, zero losses, macro required-unit Recall@8 delta at least 0.15, macro Precision@8 delta at least -0.05, zero forbidden units and an exact one-sided sign test p-value at most 0.015625.
  - Every A0 held strict win contains at least one independently reconstructed A0-only required unit connected from a common seed by exact committed H2 symbol and relation rows; response provenance fields are not accepted as proof.
  - Independent observers reconstruct request, response, process, listener, file-H2, transaction, post-run SQL, filesystem and zero-effect facts from raw artifacts, and stable semantic projections are exact-equal across the two physical roots.
  - CTO, Security and Quality and Evaluation independently return PASS on the same exact candidate and formal Evidence before any bounded P2 capability credit is proposed.
