shared_adapter_contract:
  common_inputs:
    - exact TaskSpec
    - exact EnvironmentSnapshot
    - adapter-specific SystemConfiguration
    - repetition_id
  common_output: public RunRecord
  same_task_spec_environment_budget_evaluator: true
  adapter_executables:
    B0:
      distinct_entrypoint: true
      loop_limit: 1
      enabled_tools: []
      allowed_behavior: consume_frozen_offline_response_only
      forbidden_behavior:
        - provider_or_network_call
        - repository_read_or_search
        - execution_feedback
        - hidden_evaluator_read
    B1:
      distinct_entrypoint: true
      single_fixed_loop: true
      allowed_tools:
        - file.list
        - file.read
        - search.lexical
        - patch.structured
        - verification.run_declared
      forbidden_features:
        - sourcelens_graph
        - code_chunk_ranker
        - project_or_experience_memory
        - additional_agent
        - network
    B2:
      distinct_entrypoint: true
      exact_p0_snapshot_required: true
      real_repository_analysis_scan_required: true
      missing_inherited_capability_must_be_recorded_failed: true
      synthesized_missing_evidence_forbidden: true
  adapter_may_not_decide_verified_success: true
  evaluator_independent_from_adapters: true
  conformance_is_not_empirical_performance: true

physical_owned_root_contract:
  claim_boundary: cooperative_local
  root_absent_before_atomic_creation: true
  creation: ATOMIC_UNIQUE_TASK_OWNED_MKDTEMP
  root_and_ancestor_checks:
