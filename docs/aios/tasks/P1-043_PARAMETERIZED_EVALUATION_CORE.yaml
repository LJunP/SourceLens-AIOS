  - The Quality-owned independent evaluator verdict path is separate from Worker runtime, create-once, and non-overwritable.
  - Detailed schemas, fixture contents, reason codes, lifecycle transitions, and verdict paths are frozen only in the post-activation executable plan, not in this Contract.

path_and_artifact_safety:
  - Every repository output is a canonical descendant of its declared role root and every external output is a canonical descendant of the exact Task Evidence root.
  - Leaf symlinks, ancestor symlinks, dot-dot traversal, absolute-path escape, and prefix-collision escape are rejected deterministically before read or write.
  - Evidence and reviewer-owned artifacts are create-once and non-overwritable; the Quality ownership manifest freezes the sole writer for each artifact class.
  - Trace redaction never retains Secret or sensitive values, while preserving hashes, byte lengths, redaction metadata, and other integrity fields required for replay and audit.

