architecture_constraints:
  - Create a new versioned adapter composition; do not modify accepted P1-097 or P1-099 adapter bytes.
  - The closed Task set is derived from the exact accepted dataset manifest and must equal REP-001 through REP-006.
  - B1 derives Task identity, source-template identity and verification commands from exact accepted dataset bytes and never hardcodes REP-001 as a universal rule.
  - B1 retains the exact finite local tool classes and keeps model, network, memory and additional-Agent features disabled.
  - B2 invokes the exact accepted-P0 repository_analysis.scan for every Task and retains the accepted P0 commit, tree, analyzer subtree and operation identity.
  - Reference patches, expected failures and post-result or hidden oracle bytes are never execution inputs.
  - Every positive cell binds TaskSpec, source template, configuration, executable, input, output, RunRecord, trace, replay and rollback identities.
  - Observable trace records actions and concise rationale only; hidden chain-of-thought is never requested or retained.
  - Generic runtime semantics are data-driven and contain no P1-125 Task ID, nonce or current-state hardcoding.
quality_freeze:
  positive_matrix:
    task_count: 6
    adapter_ids: [B0, B1, B2]
    repetitions_per_task_and_adapter: 2
    scheduled_cells: 36
    required_stable_projection_pairs: 18
    required_real_b2_scan_children: 12
  negative_matrix:
    - unknown or undeclared Task
    - Task ID, TaskSpec, manifest or source-template identity drift
    - path escape, symlink or non-regular input
    - B1 action, tool, limit or rollback drift
    - B2 accepted-P0 binding or scan-child drift
    - missing, extra, duplicate, reordered or tampered output
    - undeclared external-effect request
    - false-success or rollback failure
  invariants:
    - Every negative case starts from its own create-once disposable fixture.
    - Every scheduled positive cell remains in the denominator.
    - False accepts, non-owned mutations and all six external effects equal zero.
acceptance_criteria:
  - The exact accepted dataset manifest yields exactly six unique representative Task IDs in stable order.
  - All 36 offline positive cells execute through the new versioned composition and produce accepted terminal records.
  - All 18 deterministic repetition pairs have exact-equal stable projection bytes while raw nondeterministic fields remain visible.
  - All 12 B2 cells record a real exact accepted-P0 repository_analysis.scan child invocation.
  - Replay reproduces every stable projection and rejects identity drift.
  - Rollback returns every disposable source root to its exact declared pre-run identity.
  - Every predeclared negative case rejects with its stable expected reason category.
  - False accepts, undeclared executions, non-owned mutations and all six external effects equal zero.
  - No forbidden historical engineering asset or reference patch is read as an execution input.
  - The focused verification entry and projected Task-worktree make verify both pass before candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact governing Founder attachment, activation projection, Contract, authority, Goal and activation-parent identities.
  - Exact accepted dataset manifest and all six TaskSpec identities.
  - New adapter descriptors, configurations, executable identities and closed Task-set binding.
  - Raw 36-cell outputs, RunRecords, traces, stable projections, replay and rollback receipts.
  - Complete isolated negative matrix Evidence and aggregate false-accept, mutation and external-effect counts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: DISPOSABLE_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical start, Goal, governing Founder attachment, activation projection or accepted input identity drifts.
  - A forbidden rejected or terminal engineering asset would have to be read, compared, restored or reused.
  - The exact six-Task matrix cannot be executed within the declared architecture and write scope.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - A Secret, Provider request, network connection or other external effect is required.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
claim_boundary: >-
  One closed-set six-Task cooperative-local offline B0/B1/B2 parameterized
