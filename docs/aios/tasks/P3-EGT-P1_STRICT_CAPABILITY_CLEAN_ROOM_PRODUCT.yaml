frozen_blockers:
  - blocker_id: PRIVATE_CUSTODY_ROOT_NOT_REVALIDATED_ON_RESTART_RESOLVE
    closure: >-
      Revalidate root, every component, owner, 0700, non-symlink leaf 0444, nlink 1,
      byte length and SHA-256 on each resolve, startup recovery and custody-byte read;
      root, owner or intermediate-component drift after materialize fails closed.
  - blocker_id: DOCKER_MUTATION_TIMEOUT_CAN_OUTLIVE_STABLE_ABSENCE_ATTESTATION
    closure: >-
      A timed-out or ambiguous mutation may not attest absence or commit terminal until an
      immutable object ID or positive daemon-termination proof exists; durable nonterminal
      ambiguity is startup-reconciled and a late object beyond the old absence window is tested.
  - blocker_id: ACTUAL_AGENT_TASK_SERVICE_TEST_DOES_NOT_COMBINE_PRODUCTION_AGENT_RUNTIME_AND_DECODER
    closure: >-
      The positive AgentTaskService path uses production AgentRuntime and the production
      deterministic offline decoder; it may not mock both AgentRuntime and the coordinator.
  - blocker_id: FRESH_CHILD_JVM_TEST_DOES_NOT_PROVE_REAL_OCI_EFFECT_AND_CLEANUP_ACROSS_PROCESS_FAILURE
    closure: >-
      Three independent JDK 17 child JVM windows use real Spring startup/ApplicationReadyEvent,
      real durable rows, the pinned OCI effect, exact-ID cleanup and process failure/restart.
  - blocker_id: ASYNC_WORKER_CAN_RUN_BEFORE_START_TRANSACTION_COMMIT
    closure: >-
      Async dispatch occurs only after the start transaction commits; the real Spring proxy,
      transaction and latch prove the Worker cannot reach the Host authority Gate before RUNNING.
  - blocker_id: REAL_MYSQL_V034_PRODUCTION_TRANSACTION_TEST_NOT_EXECUTED_BECAUSE_DOCKER_INTERNAL_NETWORK_SUPPRESSES_HOST_PORT_PUBLICATION
    closure: >-
      A zero-skipped real-MySQL test runs V034 and the production transaction proxy/store through
      rollback, idempotent intent, concurrent CAS, effect, cleanup, replay, late loser and checkpoint exactly once.
