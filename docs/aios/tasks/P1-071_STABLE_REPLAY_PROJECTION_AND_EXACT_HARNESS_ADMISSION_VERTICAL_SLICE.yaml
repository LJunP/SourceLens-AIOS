acceptance_criteria:
  - Founder packet, Goal, source parent, Task authority and all retained input identities match exactly.
  - P1-069 harness, recorder, validator, public oracle, schemas, fixtures and scripts/verify-p1-069-blind-admission-harness.sh are blob-equal to commit f4b5230.
  - The pre-existing P1-069 Makefile target and dependency semantics are unchanged; Makefile changes only append the P1-071 target/dependency and Code Map changes are official-generator-only.
  - Stable-projection v2 public contract/tests pass the Quality satisfiability preflight before Worker mutation.
  - The new executable produces byte-equal visible A/B and withheld A/B canonical projections.
  - The frozen 23-case formal negative matrix executes 23/23 with zero false accepts.
  - Every formal case uses a unique atomically created task-owned disposable root and proves exact rollback.
  - Network, Provider, Secret, remote, production and public effects remain false.
  - Targeted verifier, projection unit/negative tests, retained equality and formal matrix pass on one clean commit.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes.
  - Reviewed tree equals integrated tree and one canonical make verify passes after integration.

