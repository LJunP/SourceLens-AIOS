architecture_constraints:
  - P1-129 remains an isolated compatibility and conformance control; its B1 reference program and any accepted reference answer are forbidden formal inputs.
  - B0 binds the accepted TaskSpec issue plus exact ordered baseline context, uses no tools and has one model turn.
  - B1 materializes one owned disposable source copy and produces only file-listing, file-read and lexical-search observations before the model response; structured patch, verification command and known-reference bytes are forbidden pre-response.
  - B2 invokes the exact accepted P0 repository_analysis.scan and binds the child invocation, input and output identities into its pre-response context.
  - Every profile context is canonical, finite, data-driven and independently hash-bound to its request; profile labels and Worker self-report are not participation Evidence.
  - Every synthetic response traverses the exact accepted P1-149 normalized response, SL-PATCH-IR/2 compiler, owned-copy apply, P1-101 trace/replay, oracle/tests, rollback and independent evaluator path.
  - P1-129 controls run in a separate Evidence namespace and may not be represented as formal profile participation.
  - Formal transport design quarantines response bytes until response cap, transport completeness and exact Secret-byte reflection checks pass; only then may raw response bytes be persisted create-once.
  - Independent rebuild derives adapter participation, usage, effects, peer, observer, taxonomy, denominator and VTSR directly from raw Evidence rather than Worker aggregate fields.
  - System-attributable JSON, completion, Patch-IR, timeout, budget and ordinary execution failures are FAILED, not infrastructure INVALID.
  - Path, symlink, hardlink, create-once, identity, Evidence-write, Secret, peer and non-loopback critical failures retain their severity across helper and process boundaries.
  - No network, Provider or Secret effect is permitted in this Task.
