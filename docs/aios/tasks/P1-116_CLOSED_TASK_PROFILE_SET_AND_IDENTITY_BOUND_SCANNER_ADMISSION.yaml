architecture_constraints:
  - Route task_plan Task IDs and exact Founder profile Task IDs form equal closed sets.
  - Every declared Task has exactly one exact profile and no undeclared Task can obtain an external-effect path.
  - Missing, extra, duplicate, unknown, identity-drifted or reordered bindings fail closed before external effects.
  - No nil, offline-default or third-Task fallback may substitute for an exact Founder profile.
  - Packet, Truth, Contract and authority bind the active Task to the same exact profile.
  - Every owned root, marker and deletable object is bound at creation by dev, ino, uid, gid, type, mode and required content hash.
  - Every cleanup revalidates the exact identity without following symlinks before unlink or rmdir.
  - Identity drift fails closed without deletion; preexisting objects are never overwritten, renamed or removed.
  - The accepted P0 scanner is invoked under an operating-system deny-network boundary.
  - Task 1 must record zero successful network connections, Provider requests and Secret reads.
quality_freeze:
  positive_matrix:
    - Route packet exposes exactly two distinct Task profiles matching the two declared task_plan IDs.
    - Contract, authority and Truth bind the active Task to its exact full Founder profile.
    - Two independent real accepted-scanner runs complete under the OS deny-network boundary.
    - Raw stdout, stderr, command ledger, network observation, output inventory and rollback receipts are retained per run.
    - Rollback restores every disposable owned root to absent without touching non-owned objects.
  negative_matrix:
    - missing Task profile
    - extra Task profile
    - duplicate Task profile
    - unknown Task ID
    - Task/profile identity drift
    - profile order drift
    - nil or offline fallback attempt
    - undeclared third Task external-effect attempt
    - preexisting output root
    - output-root symlink
    - creation-time root identity drift
    - creation-time marker identity drift
    - owned child identity drift
    - owned child replaced by symlink
    - unexpected owned-root child
    - non-owned cleanup attempt
  execution_semantics:
    - Every negative case uses an independent one-time fixture.
    - All identity and profile negatives reject before target execution.
    - Cleanup identity drift rejects without unlinking or removing the drifted object.
acceptance_criteria:
  - Exact packet, Goal, canonical activation parent, Contract, Truth and authority identities pass preactivation validation.
  - Closed Task/profile set validation passes for exactly P1-116 and P1-117.
  - Every predeclared profile-set negative rejects with target execution zero.
  - Two real accepted-scanner runs pass in independently owned disposable roots.
  - OS-level observation proves successful network connections equal zero for both real scans.
  - Raw Evidence for both scans and every isolated negative is retained.
  - Every rollback object is creation-time and deletion-time identity bound.
  - False accepts, non-owned mutations, target execution on pre-execution negatives and all six unauthorized external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact Founder packet, Goal, canonical parent, Contract, authority and closed profile-set identities.
  - Exact accepted P0 analyzer source and scanner artifact identities derived only from canonical accepted bindings.
  - Two raw scanner stdout/stderr streams, command ledgers and OS network observations.
  - Creation-time owned-object ledger and deletion-time rollback verification for every owned object.
  - Independent negative fixtures and raw stable reason codes.
  - Aggregate matrix summary with false-accept, non-owned mutation, target-execution and six-effect counts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify receipt.
rollback:
  strategy: IDENTITY_BOUND_OWNED_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Goal, exact packet, canonical identity, accepted input or activation identity drifts.
  - P1-114 or another rejected engineering asset is required.
  - A required path exceeds this Contract or an external effect beyond the exact packet is required.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the Phase boundary changes.
claim_boundary: >-
  Cooperative-local closed route Task/profile authority, creation-time and
  deletion-time identity-bound cleanup, and OS-denied accepted P0 scanner
  admission with complete raw Evidence only; no Provider execution, model
  performance, empirical baseline, P1 exit, P2/P3 entry, remote, production,
  public, hostile-principal or strong-isolation claim.
