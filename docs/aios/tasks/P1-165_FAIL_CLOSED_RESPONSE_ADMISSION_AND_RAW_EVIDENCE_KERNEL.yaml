architecture_constraints:
  - The production helper is versioned and data-driven; tests may not replace it with labels, Worker aggregates or self-reported PASS fields.
  - Response bytes remain only in a unique owned transient quarantine until one closed decision validates exact request, cell, Task, profile, repetition, context, transport, observer, usage and Evidence identities.
  - Request, context, observation and transport records use closed exact keysets and reject extra, missing, duplicate, ambiguous or contradictory fields.
  - Transport completion requires consistent HTTP framing plus EOF or terminal-event semantics; incomplete, truncated, early-close, missing terminal, duplicate terminal and post-terminal bytes fail closed.
  - Response size is bounded by Contract data and validated while streaming, before durable response persistence.
  - OWNED_CALIBRATION permits only a Task-owned ephemeral loopback server and client and never represents Provider or formal transport.
  - FORMAL_LOOPBACK semantics bind exact peer 127.0.0.1:8787 but Task 1 uses semantic fixtures only; real gateway availability remains a Task 2 diagnostic question.
  - Raw OS observer Evidence binds command, PID, FD, peer, stdout, stderr, exit status and timestamps and is independently reconstructed.
  - Exact Secret-byte reflection scanning covers plain, prefix, suffix, cross-chunk, split-boundary and binary forms; neither sentinel nor its hash may enter retained Evidence.
  - Usage is UNKNOWN when absent; when present it must use consistent non-negative integers and may not be fabricated as zero.
  - Admission and later cell closure are separate stages so adapter, P1-149 and P1-101 identities cannot circularly authorize response persistence.
  - Ordinary Provider completion, JSON, Patch-IR, compiler, oracle and test failures are FAILED research data rather than infrastructure INVALID.
  - Critical path, symlink, hardlink, create-once, identity, Evidence-write, Secret, peer and observer errors retain exact reason codes across helper, process and wrapper boundaries.
  - Independent evaluation reads raw Evidence only and does not trust Worker success, usage, effect, peer, observer, cell-result or aggregate fields.
  - No Secret read, Provider request, non-owned network connection or user-software mutation is permitted.
