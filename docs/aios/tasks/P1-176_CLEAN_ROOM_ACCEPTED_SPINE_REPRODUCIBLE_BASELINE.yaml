architecture_constraints:
  - P1-129 exact adapters are conformance controls only and their answer-bearing program or reference bytes may not enter formal prompts or contexts.
  - A new data-driven profile bridge implements B0 issue-plus-bounded-context, B1 finite local list/read/lexical selection, and B2 exact accepted P0 repository_analysis.scan context.
  - Every admitted Provider response is normalized without semantic alteration and passed through accepted P1-149 and P1-101 execution, replay, oracle, tests and rollback.
  - Pre-admission and ordinary execution failures remain failed denominator cells; no trace or success Evidence is synthesized.
  - The independent evaluator reconstructs only from frozen raw Evidence and never trusts Worker success, result, observer verdict or report fields.
  - Secret reflection is checked over bounded complete response headers and body before any response or transport bytes are persisted.
  - Fixed task-level accounting enforces one formal generation, one Secret entry and 36 request slots across processes and output roots.
  - Evidence uses create-once writes, object-ledger ownership, atomic finalization and a closed inventory; cleanup never recursively removes unowned objects.
quality_freeze:
  formal_tasks: 6
  formal_profiles:
    - B0_A
    - B0_B
