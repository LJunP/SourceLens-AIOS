machine_spec_contract:
  canonical_path: evaluation-harness/harness/p3-executable-transition-system-kernel-v1/machine_spec.json
  sole_semantic_source: true
  schema_version: p3-etsk-machine-spec/v1
  required_domains:
    - states
    - events
    - initial_state
    - terminal_states
    - result_schemas
    - transition_relation
    - guards
    - effects
    - invariants
    - aggregate_trace_contract
  accepted_p3_001_semantics:
    workflow_unbound_before_first_accepted_checkpoint: true
    different_workflow_step_zero_proposals_may_compete: true
    task_id_only_active_reservation_allows_exactly_one_pre_effect_winner: true
    successful_first_checkpoint_binds_workflow: true
    workflow_drift_after_checkpoint_fails_closed: true
    failure_release_requires_accepted_terminal_confirmed_cleanup_and_no_checkpoint: true
    prebinding_one_workflow_at_task_creation_allowed: false
  semantic_duplication_forbidden:
    - STATE_EVENT_SWITCH_TABLE_OUTSIDE_MACHINE_SPEC
    - HARDCODED_TRANSITION_BRANCH_IN_INTERPRETER
    - VERIFIER_ONLY_ALTERNATE_TRANSITION_MODEL
    - TEST_ONLY_ORACLE_THAT_BYPASSES_MACHINE_SPEC

interpreter_contract:
  input: INITIAL_MACHINE_SNAPSHOT_PLUS_ORDERED_EVENT
  output: NEXT_MACHINE_SNAPSHOT_PLUS_TRANSITION_RECORD
  requirements:
    - VALIDATE_MACHINE_SPEC_BEFORE_EXECUTION
    - RESOLVE_EXACTLY_ONE_DECLARED_TRANSITION
    - EVALUATE_ONLY_DECLARED_GUARDS
    - APPLY_ONLY_DECLARED_EFFECTS
    - VALIDATE_DECLARED_RESULT_SCHEMA
    - RECHECK_ALL_DECLARED_INVARIANTS_AFTER_EACH_EVENT
    - REJECT_UNKNOWN_STATE_EVENT_GUARD_EFFECT_OR_RESULT_FIELD
    - NEVER_MUTATE_CALLER_INPUT
    - PRODUCE_DETERMINISTIC_CANONICAL_JSON

verifier_contract:
  independence_boundary: >-
    The verifier may consume the same immutable machine_spec.json but must not
    call the interpreter or trust interpreter-produced snapshots, aggregates,
    transition identifiers, result validity flags, or terminal verdicts.
  replay_requirements:
    - RECONSTRUCT_INITIAL_STATE_FROM_SPEC_AND_DECLARED_RUN_INPUT
    - REPLAY_EVERY_EVENT_IN_ORDER
    - DERIVE_EACH_EXPECTED_TRANSITION_FROM_MACHINE_SPEC
    - RECOMPUTE_EACH_RESULT_VALIDATION
    - RECOMPUTE_EACH_POST_STATE_AND_INVARIANT
    - RECOMPUTE_PER_INVOCATION_AND_TASK_AGGREGATES
    - REQUIRE_TRACE_TO_MATCH_RECOMPUTED_VALUES_BYTE_SEMANTICALLY
    - PROVE_TERMINAL_REPLAY_CANNOT_MUTATE_OTHER_INVOCATION
    - FAIL_CLOSED_WITH_STABLE_REASON_CODE

required_positive_scenarios:
  - STEP_ZERO_COMPETITION_ONE_PRE_EFFECT_WINNER
  - CHECKPOINT_BINDS_WORKFLOW
  - SAME_WORKFLOW_RESUME_AFTER_CHECKPOINT
  - PRECHECKPOINT_CONFIRMED_FAILURE_RELEASES_RESERVATION
  - POSTCHECKPOINT_FAILURE_RETAINS_BOUND_HISTORY
  - TERMINAL_A_REPLAY_PRESERVES_LATER_RESERVATION_B
  - EXACTLY_ONE_TERMINAL_PER_INVOCATION

required_negative_controls:
