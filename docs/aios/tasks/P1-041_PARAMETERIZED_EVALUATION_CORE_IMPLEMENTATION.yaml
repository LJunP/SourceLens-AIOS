rollback:
  anchor: source_identity.parent_commit
  method: >-
    The external Evidence root is retained as the authoritative local Task
    custody and must never be deleted by rollback or cleanup. Before Task Gate,
    use a separate disposable clone to prove that removing the candidate diff
    restores the source parent tree and accepted pre-Task verification. After
    local main integration, the operational rollback is a forward-only revert of
    the exact integration commit, verified in a separate clone against the
    source parent tree. Cleanup may remove only the verified Task worktree and
    branch after Evidence custody is complete; canonical history is never
    rewritten.

