title: Finite Typed Patch IR Trusted Compiler Conformance

objective: >-
  Build and falsify one trusted deterministic compiler for the exact accepted
  REP-001 control. It must admit only four exact SL-PATCH-IR/1 byte programs,
  map them to exactly three Quality-frozen complete postimages plus one
  identity/no-effect rejection, and complete actual Run A, independent fresh
  Run B, zero false accepts and exact rollback against one frozen candidate.
  Proposal bytes remain opaque data and are never interpreted as code, diff,
  AST, expression, path, command, environment or module content.

why_now:
  - P1-053 falsified the exact-host sandbox-exec primitive, not the finite Typed Patch IR architecture.
  - P1-056 is ineligible until this exact compiler substrate passes its Task Gate and canonical integration.
  - This is the smallest runnable and falsifiable P1 increment that restores direct engineering value without building Strong Isolation or a general patch generator.

