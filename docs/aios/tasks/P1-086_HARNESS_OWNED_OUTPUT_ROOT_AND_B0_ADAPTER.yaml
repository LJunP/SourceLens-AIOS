  - Modify authority or safety validators, Strategic Constitution, Master Execution Protocol, Founder Delegation Policy, Evaluation Protocol, P1 Objective or P1 Exit Gate.
  - Permit caller-selected arbitrary output paths or create any Task-owned directory or file before the complete pre-effect path boundary passes.
  - Follow symlinks, overwrite a pre-existing path, delete an unowned or identity-drifted path, or claim hostile-principal or strong-isolation protection.
  - Use network, Provider, Secret, remote, production or public effects.
  - Enter P2 or P3, push or modify a remote, or claim model quality, task success, VTSR, benchmark, P1 Exit or production readiness.
