stop_conditions:
  - Any write escapes the exact Task worktree, custody root or create-once Evidence root.
  - Any unapproved network, Provider, Secret, credential, remote, production, public or registry effect is required or observed.
  - The exact Docker CLI, socket, pinned image, custody bytes, Task authority or activation parent drifts.
  - A process-real run records any false accept, forbidden effect or checkpoint advancement before accepted terminal.
  - Candidate, repair, review, engineering-hour or calendar budget is exhausted.
