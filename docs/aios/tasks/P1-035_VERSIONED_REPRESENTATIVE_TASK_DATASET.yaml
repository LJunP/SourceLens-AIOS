    - six standalone synthetic repository templates
    - deterministic Git materialization recipe and expected commit/tree per task
    - exact expected-base-failure identity per task
    - one visible reference-solution patch per task as a solvability witness
    - explicit development/validation split and declared coverage axes
    - task-local provenance, redistribution and claim-boundary metadata
