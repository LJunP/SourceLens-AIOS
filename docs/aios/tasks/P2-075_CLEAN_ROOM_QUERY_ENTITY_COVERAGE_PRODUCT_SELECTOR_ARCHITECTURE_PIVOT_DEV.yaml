acceptance_criteria:
- One create-once preactivation architecture freeze proves a materially different deterministic query-intent and package/type/member entity-coverage selector before any product-source write.
- One production-owned Java API used by canonical CodeQaRetrievalService and the evaluator owns scoring, normalized-path-first score ties, top-k 10 and the 131072-byte UTF-8 budget.
- The exact accepted P2-069 source pack, benchmark manifest, DEV task cards, B1 results and DEV/HELD non-overlap proof are rehashed before use; only the eight DEV cards and their base archives are opened.
- Product DEV macro precision, macro recall and macro reciprocal rank each strictly exceed the accepted B1 values, and no DEV task has lower recall than its exact B1 task result.
- Two clean OS-sandboxed DEV replays are byte-exact for rankings, selections and metrics; HELD execution count and HELD source reads remain zero.
- Fresh compiler and Surefire roots, closed classpath/sourcepath, disabled annotation processing, exact runtime identities, source-to-class mapping, outer sandbox argv, cwd, closed environment, exit, stdout, stderr and write/post-state inventories are directly bound.
- Real filesystem negatives cover symlink file and ancestor, root escape through supported arguments, output overwrite byte preservation, mutable classpath injection, out-of-root write and HELD request with exact pre/post state.
- A direct reviewer manifest binds raw accepted inputs, product sources/classes, DEV results, Surefire XML/stdout, transactions, negative pre/post state, changed-file inventory, rollback and DEV/HELD non-overlap proof.
- Independent CTO, Security and Quality/Evaluation reviewers all return PASS on the same exact candidate and reviewer manifest before Master Task Gate acceptance.
required_evidence:
- Exact Task authority, Contract, branch, worktree, Evidence root, execution nonce, activation parent and OS write-confinement identity.
- Create-once architecture freeze and preactivation verification, proving zero product-source diff relative to activation parent at freeze time.
- Direct accepted P2-069 source-pack, benchmark-manifest, DEV-task-card, B1-result and DEV/HELD-non-overlap identities plus complete read-set inventory.
- Product-owned selector specification, exact product-path invocation, changed-file inventory and source-to-class inventory.
- Fresh targeted Surefire transaction with XML/stdout/stderr and exact tests/failures/errors/skipped counts.
- Two independent DEV replay transactions, raw rankings, selections, metrics, exact comparison and per-task no-recall-regression proof.
- Negative matrix with per-case exact argv, fixture identities, exit/stdout/stderr and before/after post-state.
- Reviewer Evidence manifest, rollback, three independent final reviews and Master Task Gate receipt.
rollback: >-
  Do not integrate a NON_PASS candidate. Preserve the exact candidate identity and
  terminal Evidence, leave canonical main unchanged, keep P2-069 accepted, keep
  P2-070 through P2-074 terminal accounting immutable, keep formal HELD locked,
  keep P2 delivery at 25% and strict progress at 0%, keep P3 HOLD, and keep the
  Long-term Goal ACTIVE.
stop_conditions:
- Stop before product-source write if the exact architecture freeze, authority-bound roots, OS write confinement or accepted P2-069 input identities do not validate.
- Stop if any P2-070, P2-071, P2-072, P2-073 or P2-074 branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused.
- Stop if any HELD task source leaf, HELD PR-file payload or HELD build result is opened or executed.
- Stop if any compiler, test, replay or fixture write can escape the exact Task worktree or Evidence root, or any runtime/classpath/source input is mutable or unbound.
- Stop if any network, Provider, Secret, remote, production, public, deletion, database, P3 or Long-term Goal termination effect is requested or observed.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse rejected P2-070 through P2-074 engineering lineage.
- Modify accepted P2-069 source-pack bytes, dataset split, DEV/HELD cards, oracle, metric, threshold, schedule or formal HELD custody.
- Evaluate HELD, tune on HELD, rerun-to-pass, create a successor/replacement/remediation chain or consume the locked formal HELD slot before Product Selector DEV acceptance.
- Execute build or test subprocesses without exact offline configuration and hash-bound /usr/bin/sandbox-exec deny-network plus write confinement.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete historical Evidence or worktrees, modify Codex private control-plane state, enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for the exact
  clean-room query-entity-coverage Product Selector and frozen eight-task DEV benchmark.
  It does not claim formal HELD performance, P2 Exit Gate acceptance, P3 eligibility,
  production readiness, public release or Long-term Goal completion.
