title: Frozen Evaluation Matrix and Protocol VTSR Accounting Validator

objective: >-
  Build a clean-room, parameterized, fail-closed and one-command validator that
  admits a frozen evaluation matrix plus run outcome receipts and mechanically
  derives scheduled, eligible, success, failure, infrastructure-invalid,
  reason-code distribution, task aggregation and exact VTSR rational outputs
  under Evaluation Protocol v1.1 sections 7 and 8. P1-048 accepted Run A and
  Run B are exact-hash-bound conformance inputs only, never a baseline claim.

why_now:
  - P1-048 proved one actual local execution, fresh independent reexecution, raw Evidence, stable semantic equality and exact rollback.
  - Evaluation Protocol v1.1 requires a machine validator for VTSR counting rules before any benchmark report can be accepted.
  - Frozen denominator, exclusion and retry semantics are the highest-value local P1 prerequisite that can be completed without Provider, network, Secret or other Founder-reserved effects.

