architecture_constraints:
  - Use exactly one data-driven response byte ceiling shared by transport, create-once raw spool, inventory and independent verifier.
  - The selected response byte ceiling is 4194304 bytes; transport, spool and verifier must reject only bytes above that same value.
  - Stream response bytes directly to a unique owned create-once spool without first retaining the full body in memory.
  - A cap-plus-one response is a per-cell RESPONSE_TOO_LARGE failure with a complete failure receipt, not a matrix-level exception.
  - Ordinary HTTP, timeout, JSON, completion, Patch IR, compiler, apply, oracle, test and evaluator failures remain in the fixed 36-cell denominator.
  - Only Secret leakage, non-loopback connection, path escape, Evidence damage, permission expansion or actual route-budget overrun may abort the matrix early.
  - Use accepted P1-149 execution-spine public interfaces and accepted P1-129 adapter interfaces without modifying their accepted semantics.
  - Independent report reconstruction reads frozen raw Evidence and failure receipts, never the generated report or Worker success claims.
quality_freeze:
  response_bytes_max: 4194304
  synthetic_cells: 36
  synthetic_forced_oversize_cell: formal-001
  synthetic_forced_oversize_reason: RESPONSE_TOO_LARGE
  formal_cells: 36
  b0_cells: 12
  b1_cells: 12
  b2_cells: 12
