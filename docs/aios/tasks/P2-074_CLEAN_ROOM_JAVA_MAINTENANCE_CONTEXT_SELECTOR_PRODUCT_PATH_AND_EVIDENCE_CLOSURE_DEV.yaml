acceptance_criteria:
- Before any product-source write, one create-once preactivation receipt proves the exact authority-bound worktree and Evidence roots are canonical non-symlink descendants, proves positive writes inside each root, rejects writes outside both roots under the exact OS sandbox, and binds the exact sandbox-exec profile, argv, cwd, closed environment, stdout, stderr and exit.
- One public production-owned Java selection API is used directly by CodeQaRetrievalService and by the DEV evaluator and owns ranking, top-k 10, the 131072-byte whole-file UTF-8 budget and score-descending then normalized UTF-8 path-ascending tie-breaking; neither caller reimplements or post-reranks those semantics.
- The exact accepted P2-069 source pack, benchmark manifest, DEV task cards, B1 results and DEV/HELD non-overlap proof are rehashed before use; exactly eight DEV tasks are executed and no HELD source, payload, build result or oracle is opened.
- Product DEV macro precision is greater than 0.15595238095238093, macro recall is greater than 0.8958333333333334 and macro reciprocal rank is greater than 0.8229166666666666 under the same query, corpus, top-k and byte budget, with no DEV task recall below its accepted B1 value.
- Compiler, Surefire, replay and negative transactions use distinct fresh output roots inside the exact worktree or Evidence root, bind explicit closed classpath and sourcepath, disable annotation processing or bind every processor, and record exact JDK, javac, java, Maven and sandbox-exec binary identities plus complete source-to-class and effective test-classpath inventories.
- Two sandboxed clean DEV replays are byte-exact for all result and transaction-semantic outputs; each transaction binds exact candidate commit/tree, argv, cwd, closed environment, stdin, stdout, stderr, exit, input inventory, write inventory and post-state inventory.
- Real negative cases cover authority-root substitution, output-root escape, existing output overwrite, symlink input, symlink output ancestor, manifest drift, source/class drift, classpath drift, HELD request, test-source leakage, nondeterministic tie-break and external write; every case includes direct pre-state, action, exit/error and post-state.
- The reviewer manifest directly binds the exact Contract, authority, candidate commit/tree, changed-file inventory, DEV task cards, B1 results, Product DEV results, DEV/HELD non-overlap proof, Surefire XML and stdout, replay transactions, per-run write/post-state inventories, negative pre/post states, rollback and canonical verification without summary-only substitution.
- CTO, Security and Quality/Evaluation independently accept the same exact candidate and closed Evidence manifest before the Task Gate is accepted.
required_evidence:
- Create-once authority record, closure-envelope specification, OS write-confinement profile and preactivation receipt produced before the first product-source write.
- Exact accepted-baseline leaf verification and complete read-set inventory with pre-read expected and post-read observed identity.
- Production-API ownership proof, CodeQaRetrievalService call-path proof and evaluator call-path proof.
- Exact direct javac compile transaction, full source-to-class inventory, targeted unit transaction, Surefire command/stdout/stderr/exit, XML reports and effective classpath inventory.
- Two independent clean DEV replay transactions with raw full rankings, selected paths, selected bytes, per-task metrics, aggregate metrics and byte-exact comparison.
- DEV task cards, accepted B1 results, Product DEV results and independently recomputed superiority/no-regression receipt.
- DEV/HELD non-overlap proof and zero-HELD-read proof derived from the complete read set.
- Real-filesystem negative matrix with direct pre-state and post-state inventories for every case.
- Candidate commit/tree, changed-file inventory, canonical verification plan, rollback instructions, closed reviewer manifest and three final independent review records.
rollback: >-
  Do not integrate a NON_PASS candidate. Preserve the exact candidate and Evidence
  inventory, leave canonical main and the accepted P2-069 baseline unchanged, close the
  short-lived Task worktree and branch only through supported lifecycle after exact
  terminal accounting, keep formal HELD locked, keep P2 and the Long-term Goal active,
  and keep P3 HOLD.
stop_conditions:
- Stop before product-source write if the authority roots, sandbox profile, exact runtime identities, fresh-root plan, explicit classpath/sourcepath plan, Evidence direct-leaf plan or preactivation receipt is incomplete or fails.
- Stop if any P2-070, P2-071, P2-072 or P2-073 rejected branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused.
- Stop if a HELD task source leaf, PR-file payload, build result or oracle is opened by the Worker or DEV evaluator.
- Stop if any network, Provider, Secret, remote, production or public effect is requested or observed.
- Stop if any write escapes the exact Task worktree or exact create-once Task Evidence root, or if any configured root is accepted without authority binding before mkdir.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse any P2-070, P2-071, P2-072 or P2-073 rejected engineering lineage input.
- Modify the accepted source pack, dataset split, DEV task cards, HELD custody, oracle, metric, baseline result, top-k, 131072-byte budget, threshold or evaluation schedule.
- Let the evaluator own Product ranking, selection, budget or tie-breaking semantics, or let CodeQaRetrievalService use a different Product selector implementation.
- Execute Maven, Gradle, JVM tests, compiler, evaluator or replay with network enabled or without exact OS write confinement and bound closed inputs.
- Run HELD evaluation, tune on HELD, rerun-to-pass, replace a failed Task or create successor, remediation, normalization or closure chains.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete prior terminal Evidence, modify Codex private control-plane state, enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  PASS may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for this exact
  production-owned selector on the frozen eight-task DEV split, raise delivery progress
  to 70% and unlock only the existing formal HELD evaluation slot. It does not establish
  formal HELD performance, strict P2 Exit progress, P3 eligibility, production readiness,
  public release or Long-term Goal completion.
