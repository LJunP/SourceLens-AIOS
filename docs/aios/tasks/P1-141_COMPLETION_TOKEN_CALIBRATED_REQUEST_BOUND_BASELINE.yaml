acceptance_criteria:
  - Exact canonical, Goal, Founder Decision, terminal receipt, G0, P1-101 and P1-129 identities pass before source write.
  - Both canonical authority and P1 safety entries PASS before Worker source write.
  - Offline preflight performs zero Secret reads, zero Provider requests and zero network effects.
  - B0, B1 and B2 representative adapter, trace, replay and rollback controls pass in disposable roots.
  - Create-once, tamper, missing, reorder, duplicate, path, symlink, cross-binding and closed-inventory negatives reject with zero false accepts.
  - Two distinct diagnostics return strict HTTP 2xx completions with complete valid usage within 8192 input and 4096 output reservations.
  - Requests use max_completion_tokens set to 4096 and never rely only on legacy max_tokens.
  - Every effect is preceded by an atomic full-ceiling reservation and create-once request receipt.
  - Live observation is limited to target PID, process and loopback network state; closed Evidence inventory is verified after target exit.
  - Formal Evidence stays at or below 512 MiB and excludes Cargo targets, build caches and undeclared transient artifacts.
  - Exactly 36 formal cells execute once and every result remains in the denominator.
  - Report reconstruction starts from frozen request and response receipts and includes all Evaluation Protocol identities, metrics, failures, costs, uncertainty and reproduction commands.
  - Secret bytes and Authorization header bytes or hashes never enter repository, Evidence, logs, trace, prompt, review or Vault.
  - Automatic retries, non-loopback, remote, production, public and unauthorized effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes.

required_evidence:
  - Exact Founder packet, structured Decision, Goal, Contract, authority and activation-parent identities.
  - Pre-activation authority and P1 safety PASS receipts.
  - Offline preflight, adapter controls and complete isolated negative matrix.
  - Two diagnostic request and response receipt pairs.
  - OS process and loopback network observations plus post-exit closed inventory.
  - Complete 36-cell denominator, RunRecords, traces, replay, rollback and stable projections.
  - Reproducible baseline report and executable reconstruct and verify commands.
  - Exact candidate manifest and fresh CTO, Security and Quality reviews.
  - Integrated-tree equality and canonical make verify receipt.

stop_conditions:
  - Canonical, Goal, Founder Decision, terminal receipt, G0, P1-101 or P1-129 identity drift.
  - Active authority or P1 safety entry returns NON_PASS before source write.
  - Offline preflight reads a Secret, sends a Provider request or produces a network effect.
  - Either diagnostic is not a strict HTTP 2xx completion with complete valid usage within reservation.
  - Provider semantics require max_tokens instead of or in conflict with max_completion_tokens.
  - Formal Evidence exceeds 512 MiB or contains an undeclared Cargo target, build cache or transient artifact.
  - Request or response binding requires ordinal inference.
  - More than two diagnostics or more than one 36-cell formal execution is required.
  - Automatic retry, non-loopback network, Secret persistence or unauthorized external effect occurs.
  - False accepts exceed zero or Evidence is overwritten or deleted.
  - Initial implementation and two same-Task code-only repairs are exhausted.
  - Adjacent iterations repeat the same normalized root cause.
  - Formal execution, any final Reviewer, tree equality or canonical make verify returns NON_PASS.
  - Phase, permission, budget or critical residual-risk expansion is required.

forbidden_actions:
  - Read, restore, compare, copy, reuse or modify P1-139 engineering source, fixture, test, candidate, worktree implementation or raw formal Evidence.
  - Modify, reseal, rerun or reinterpret P1-139 Evidence as accepted.
  - Read or reuse P1-135 rejected engineering assets.
  - Retain Cargo target directories, build caches or undeclared transient toolchain output in formal Evidence.
  - Recursively scan a concurrently mutating Evidence tree during Provider execution.
  - Rerun, replace, omit or beautify a formal cell.
  - Persist, hash, log, trace, review or disclose the Secret or Authorization header.
  - Use ordinal-only request and response mapping.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain.
  - Use non-loopback network or produce remote, production, public or push effects.
  - Enter or execute P2 or P3.

rollback:
  task_worktree: remove_only_after_terminal_evidence_or_accepted_integration
  canonical_integration: non_destructive_git_revert_on_canonical_verify_non_pass
  evidence: append_only_no_overwrite_or_delete

claim_boundary: >-
