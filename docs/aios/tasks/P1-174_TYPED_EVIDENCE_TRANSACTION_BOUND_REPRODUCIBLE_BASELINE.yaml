    - destructive history rewrite
stop_conditions:
  - Canonical route start, Goal, Founder packet, structured Decision, accepted-input or authority identity drifts.
  - Any P1-171 rejected engineering asset is read, compared or reused.
  - The same normalized root cause repeats in adjacent pre-formal implementation iterations.
  - Initial implementation plus four pre-formal same-Task repairs are exhausted.
  - Formal execution begins before the complete pre-formal Gate passes.
  - Formal matrix returns NON_PASS or any post-formal repair, retry or second matrix would be required.
  - Any Secret leakage, non-loopback connection, remote, production or public effect occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
forbidden_actions:
  - Read, restore, compare or reuse P1-171 rejected source, candidate, fixture, matrix, evaluator, test or implementation.
  - Modify historical P1-165/P1-168 Knowledge records or create a governance compatibility Task for them.
  - Read a Secret or call a Provider before the full pre-formal Gate passes.
  - Write outside the allowlisted Task paths or owned external Evidence root.
  - Enter P2 or P3.
  - Push or modify a remote.
