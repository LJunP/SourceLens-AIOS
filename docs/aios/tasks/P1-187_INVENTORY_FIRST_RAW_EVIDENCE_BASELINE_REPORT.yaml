architecture_constraints:
  - Receipt paths are metadata only and never filesystem read authority.
  - Enumerate owned-root objects first, freeze a closed inventory, then bind roles and indexes to inventoried object identities.
  - Validate every intermediate component and final object without following symlinks; reject external hardlinks.
  - Exercise the production admission boundary directly for every adversarial case.
  - Preserve topology, finalization and cleanup raw Evidence for independent reconstruction.
  - Independent evaluation ignores Worker PASS, count, equality and success fields.
  - Validate at least four fresh owned parent topologies including a /private/tmp canonical-like root.
  - Complete all pre-formal engineering and reviews before any Secret read or Provider request.
quality_freeze:
  synthetic_cells: 36
  b0_cells: 12
  b1_cells: 12
  b2_cells: 12
  formal_cells: 36
  accepted_trace_binding: P1_101_EXACT
  accepted_execution_spine_binding: P1_149_EXACT
  false_accepts_max: 0
  formal_replays_max: 1
acceptance_criteria:
  - Inventory-first admission rejects intermediate and final symlinks, external hardlinks, path escape, extra, missing, mutation, reorder and identity drift.
  - Every negative case calls the same production admission boundary used for formal Evidence.
  - Four fresh topologies retain independently reconstructable raw Evidence and exact cleanup ledgers.
  - Synthetic full-pipeline rehearsal completes all 36 cells through accepted B0, B1 and B2, including twelve real accepted-P0 scan children.
  - Accepted P1-149 patch compilation, application, oracle, tests and rollback and accepted P1-101 trace/replay are bound per cell.
  - Pre-formal worker Gate and independent CTO, Security and Quality reviews all PASS before Secret input is enabled.
  - One strict diagnostic precedes exactly one 36-cell formal matrix with no retry or replacement.
  - All 36 formal cells remain in the denominator and an independent evaluator rebuilds the report only from frozen raw Evidence.
  - False accepts, Secret persistence, non-loopback connections and unauthorized external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and phase-delegated authority identities.
  - Closed inventory, object identities, role bindings, topology records and ownership cleanup ledger.
  - Direct production-boundary positive and adversarial results with raw inputs and observed outputs.
  - Accepted adapter, execution-spine, trace/replay, patch, oracle, test and rollback receipts.
  - Pre-formal reviews proving the implementation is ready before Secret and Provider effects.
  - Request, response, observer and usage receipts for the diagnostic and all formal cells.
  - Independently rebuilt report, closed Evidence manifest and reproduction command.
  - Exact candidate manifest, recoverable tag, fresh final reviews and canonical integration receipt.
rollback:
  strategy: OWNED_EVIDENCE_TRANSACTION_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical start, Goal, Founder packet, structured decision or accepted-input identity drifts.
  - Any P1-184 rejected engineering asset is read or reused as implementation input.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus five pre-formal repairs are exhausted.
  - Any pre-formal or final Reviewer returns TARGET_VERDICT NON_PASS.
  - The formal matrix starts before all pre-formal reviews PASS.
  - Formal execution returns NON_PASS or would require a rerun.
  - Secret leaks or any non-loopback, remote, production or public effect occurs.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
forbidden_actions:
  - Read, restore, compare or reuse P1-184 rejected source, candidate, fixture, test, evaluator, matrix, diff or engineering implementation.
  - Treat any receipt-supplied path as filesystem read authority.
  - Read a Secret or call the Provider before complete pre-formal review PASS.
  - Run a second formal matrix, automatic retry or response replacement.
  - Modify user software, ZCode, Codex Tools, LaunchAgent, proxy or system ports.
  - Enter P2 or P3.
  - Push or modify a remote.
claim_boundary: >-
  Cooperative-local inventory-first Evidence transaction, one loopback
  diagnostic, one 36-cell baseline and one reproducible report only. No direct
  OpenAI provenance, upstream behavior, hostile-principal isolation,
  production readiness, P2/P3 entry, remote, production or public claim.
