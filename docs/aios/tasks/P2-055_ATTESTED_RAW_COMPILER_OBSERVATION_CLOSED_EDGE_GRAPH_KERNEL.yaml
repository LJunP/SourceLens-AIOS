architecture_constraints:
  - The accepted scanner must be invoked through canonical accepted P1-116 assets and independently bound by executable realpath, type, byte length, SHA-256, exact argv, operation, source root identity, exit status, stdout and stderr.
  - No semantic payload may be parsed before the top-level transaction manifest and complete closed inventory pass external identity admission.
  - Java semantic truth must come from raw compiler-attributed observations produced by JDK compiler APIs or an equivalent exact compiler oracle, never lexical name matching or Worker labels.
  - The graph-to-observation relation is a closed bijection over every in-scope semantic edge: no graph-only edge, observation-only edge, duplicate mapping or ambiguous mapping is accepted.
  - Every compiler observation binds source path, source span, enclosing symbol, edge kind, resolved owner, receiver type, selected overload descriptor and target symbol identity where applicable.
  - Every positive and negative case freezes one self-contained portable raw transaction without references to deleted temporary roots or machine-specific fixture identity.
  - The independent evaluator reconstructs or executes every frozen transaction and never trusts RESULT.json rejection, graph edge labels or aggregate PASS fields.
  - External-effect conclusions are reconstructed from frozen raw argv and environment, process tree, socket observer stdout and stderr, filesystem write inventory and process exit.
  - Provider and Secret counts are derived from closed raw observations and remain zero.
  - At least two physically distinct repository roots produce byte-exact equal canonical graph projections and replay.
  - A minimal pilot must prove scanner attestation, one compiler-attributed edge, the closed oracle and one portable negative replay before the full matrix.
