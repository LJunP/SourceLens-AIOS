architecture_constraints:
  - Canonical AIOS never reads the Secret and never performs a network or Provider effect.
  - The exact external launcher remains outside Git and binds source, executable, endpoint, model, request pack and output protocol identities.
  - The Founder/operator supplies the Secret exactly once through a no-echo TTY after G0 PASS.
  - No Secret or authorization material may enter argv, environment, shell history, repository, temporary plaintext files or persistent artifacts.
  - The launcher connects only to literal 127.0.0.1:8787 without DNS, proxy, redirect, fallback, model substitution or retry.
  - All formal results remain in the 36-cell denominator and cannot be replaced or rerun.
  - Provider output remains untrusted, quarantined and non-executable.
  - Accepted P1-099 and P1-101 bytes may be invoked as local primitives but cannot masquerade as the 36 formal Provider runs.
  - B2 must invoke the exact accepted P0 repository_analysis.scan child for every formal B2 run.
  - Offline reproduction recomputes the report from the retained raw capture bundle; it does not claim byte-identical stochastic resampling.
