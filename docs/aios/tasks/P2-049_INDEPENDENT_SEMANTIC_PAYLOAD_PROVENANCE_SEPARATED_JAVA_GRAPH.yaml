stop_conditions:
  - Canonical activation parent, Goal, Founder packet, Contract or accepted input identity drifts.
  - Any rejected P2 engineering asset is required or accessed.
  - A required write exceeds this Contract or any external effect is required.
  - The same normalized root cause repeats in adjacent iterations or three same-Task repairs are exhausted.
  - Independent reconstruction cannot derive the complete graph claim from admitted raw Evidence without Worker expectations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NONPASS.
  - P3 entry, push, remote modification, Phase change or permission expansion is required.
