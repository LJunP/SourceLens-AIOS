acceptance:
  product_correctness:
    - The persisted sole-next state is checked before any model invocation, and the model is invoked only for AGENT_EFFECT_FREE_PAYLOAD.
    - Agent output uses one closed state-specific typed schema and rejects unknown, dynamic action, tool, shell, credential, URL and every path-bearing field before workflow mutation or handler execution.
    - A durable exclusive dispatch intent with an exact idempotency identity is committed before a fixed host handler begins.
    - While an intent is in flight, no caller can expose or execute a later state; only successful handler result commitment exposes the next state.
    - Handler failure, process loss and ambiguous persistence reconcile by exact idempotency identity or fail closed without replaying an effect, premature state advance or overtaking.
    - Append-only hash-bound traces cover request, decision, intent, handler, result, checkpoint and rollback or failure for every accepted and denied path.
  required_tests:
    - Fresh H2 concurrency proves exactly one durable owner and exactly one fixed-handler effect.
    - Handler failure and restart prove no premature state advance, no overtaking and no duplicate effect.
    - Persisted complete and host-only prefixes prove zero model invocation before the sole-next-state check.
    - Malformed, trailing-token, unknown-field, tool-like, credential-like, URL-like and relative, absolute, home, drive and UNC path-bearing payloads fail before state mutation and handler execution.
    - Trace integrity tests detect missing, reordered, rewritten and cross-task events.
    - The exact focused matrix and canonical full suite use only the frozen Task-local Maven custody under the closed sandbox envelope.
    - The canonical full suite has zero failures and zero errors; only the existing environment-gated MySQL smoke test may be skipped.
  evidence:
    - Exact candidate commit, tree, parent and allowlisted changed-file inventory.
    - Complete source-to-class identity for every changed production and test source.
    - Dependency custody inventory and immutable post-run verification.
    - Exact focused and full execution transactions, raw stdout, stderr, Surefire XML and pre/post-write inventories.
    - Negative-fixture pre/post states and OS-observed network and filesystem confinement.
    - Independent CTO, Security and Quality/Evaluation review receipts.
  task_gate: ALL_ACCEPTANCE_AND_THREE_INDEPENDENT_REVIEWS_PASS
