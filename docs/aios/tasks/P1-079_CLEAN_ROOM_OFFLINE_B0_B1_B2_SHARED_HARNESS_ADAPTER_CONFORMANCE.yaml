objective: >-
  Implement and execute one clean-room, provider-neutral, fully offline and
  falsifiable compatibility-adapter vertical slice for accepted REP-001. B0,
  B1 and B2 must use distinct executable and SystemConfiguration identities,
  traverse one frozen shared harness boundary end to end, emit typed admission,
  RunRecord, evaluator, replay, stable-projection and rollback records, and
  produce byte-identical stable projections across independently materialized
  Run A and Run B with zero false accepts in the frozen negative matrix.

why_now:
  - Strict P1 completion is 4/8 (50%) and B0_B1_B2_COMPATIBILITY_ADAPTERS is missing.
  - P1-078 is terminal and immutable; this Task is independent and authorizes zero Observable Trace attempts.
  - The accepted P0 source anchor contains a real SourceLens Analyzer that was proven feasible to build and execute offline before Contract freeze.

