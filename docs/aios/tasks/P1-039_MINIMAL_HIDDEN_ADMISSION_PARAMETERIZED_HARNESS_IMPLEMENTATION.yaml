    - exact two-slot public-synthetic admission manifest
    - 16-case matrix and one recipe per case
    - deterministic evaluator, oracle and expected results
    - ownership map, Quality handoff and Quality Freeze Receipt
  worker:
    - minimal hidden-admission adapter
    - parameterized harness library and CLI
    - create-once output-custody implementation
    - deterministic run/result projection
    - self-test invoking all 16 frozen cases
  integration:
    - one P1-039 verification script
    - one Makefile verification target
    - mechanical project code-map update

