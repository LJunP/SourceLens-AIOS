architecture_constraints:
  - Parse Java source with the existing canonical JavaParser dependency before deriving semantic facts.
  - Bind every source endpoint to the exact enclosing AST type declaration rather than the outer file declaration.
  - Cover class, interface, enum, record, nested, local and anonymous type ownership.
  - Ignore comments and string literal contents as semantic sources.
  - Preserve exact original target spelling and source span for every emitted relation.
  - Classify relation targets as exactly INTERNAL, EXTERNAL, UNRESOLVED or AMBIGUOUS.
  - Resolve explicit import, wildcard import, same-package, java.lang and fully qualified targets without inventing facts.
  - Record duplicate and conflicting declarations explicitly and deterministically.
  - Produce byte-exact deterministic output from at least two physically independent repository roots.
  - Keep the default accepted P1 scanner output path byte-exact unchanged; relations require the versioned opt-in interface.
  - Derive external-effect counts from closed raw Evidence rather than constants.
quality_freeze:
  positive_matrix:
    - class extends and implements relations use exact AST source owner and target spans
    - nested and local types bind to their own declarations rather than the outer type
    - anonymous class base relation is represented with deterministic synthetic source identity
    - interface extends, enum implements and record implements are represented
    - explicit import, wildcard import, same-package, java.lang and fully qualified targets classify truthfully
    - generic and array type targets preserve original spelling and resolve the component type
    - two physical repository roots produce byte-exact identical semantic output
    - default P1 scan-result v2 output remains byte-exact compatible without opt-in relations
  negative_matrix:
    - comment pseudo class and extends text emits no relation
    - string literal pseudo class and extends text emits no relation
    - ambiguous wildcard target is AMBIGUOUS rather than silently internal or external
    - unresolved target is UNRESOLVED rather than invented
    - duplicate declaration and conflicting import are explicit and deterministic
    - missing source file
    - mutated source bytes
    - reordered closed inventory
    - duplicate inventory entry
    - symlink source
    - path substitution
    - source root identity drift
    - output mutation
    - stale or cross-root replay binding
  independent_consumer_requirements:
    - execute every declared positive and negative case from fresh owned fixtures
    - validate exact closed input and output inventories
    - derive expected semantic facts independently from frozen typed case descriptors
    - do not trust Worker PASS, counts, classification or external-effect fields
  required_counts:
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - The implementation uses canonical JavaParser 3.26.1 and adds no parser dependency.
  - Comments and strings produce zero semantic relations.
  - Nested, local and anonymous source ownership is correct and deterministic.
  - Target spelling, span, category, resolution and duplicate/conflict state are complete.
  - All resolution states are limited to INTERNAL, EXTERNAL, UNRESOLVED and AMBIGUOUS.
  - Default accepted P1 scan-result v2 bytes and semantics remain exact without relation opt-in.
  - Two physical roots produce byte-exact identical semantic projection and replay.
  - The independent consumer executes all positive and negative cases with zero false accepts.
  - Provider requests, Secret reads and six external effects are independently derived as zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Parser dependency and default P1 compatibility receipts.
  - Worker matrix raw inputs, raw outputs, typed case ledger and closed Evidence manifest.
  - Independent consumer execution receipt and per-case negative results.
  - Two physical-root deterministic replay receipts.
  - External-effect raw observation inventory and independently derived zero counts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality Reviews of the same candidate and Evidence bytes.
