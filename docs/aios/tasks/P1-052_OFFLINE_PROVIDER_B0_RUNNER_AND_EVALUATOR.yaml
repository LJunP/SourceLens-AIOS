minimal_safety_invariants:
  - The implementation contains no network transport and never reads an API key or Secret.
  - Canonical source and accepted dataset bytes are never patch targets or run materializations.
  - Untrusted response bytes are bounded, parsed fail-closed and validated before any patch action.
  - Model-declared paths or verdicts are never treated as execution truth.
  - Accepted REP-001 TaskSpec, baseline context, response format and 1024-token budget remain immutable and hash-bound.
  - The offline request Task input contains only the exact accepted issue text plus the exact ordered accepted baseline-context artifact; source, tests, oracle and reference patch bytes are evaluator-only and never enter the model request.
  - The P1-052 derived TaskSpec and SystemConfiguration are task-owned offline transport inputs, not accepted-dataset mutations or eligible scheduled baseline runs.
  - Parsed summary, changed_paths and tests are independently projected and validated against the accepted response-format bytes before patch evaluation.
  - The only allowed changed path is src/range.mjs; tests, oracle, prompts, schema and harness code are immutable inputs.
  - Each evaluation and replay uses a fresh task-owned disposable materialization from exact REP-001 bytes.
  - Evidence leaves are regular, contained, create-once, task-owned and never follow pre-existing symlinks or hardlinks.
  - Independent replay directly reexecutes the patch and tests and ignores worker or response verdict claims.
  - Rollback restores exact original bytes, base tree and clean state before any disposable materialization is released.

acceptance_criteria:
  - Two request builds from exact frozen inputs produce byte-identical canonical JSON and the frozen expected request SHA-256.
  - The request input is exactly the accepted issue text followed by the accepted baseline-context artifact in artifact order, with no source, test, oracle, reference-patch or hidden evaluator bytes.
  - The task-owned derived TaskSpec and SystemConfiguration validate against the accepted schemas, bind the exact P1-052 output schema, preserve the accepted baseline context and cap model output at 1024 tokens.
  - The request uses model gpt-5.6-sol, developer and user inputs, high reasoning, strict JSON schema, at most 1024 output tokens, no tools, store false, stream false and background false.
  - Static and runtime controls prove that no network, Provider, Secret, remote, production or public effect occurs.
  - The valid completed-response fixture yields exactly one schema-valid patch payload for REP-001 and rejects unexpected output item types, refusal, incomplete, malformed, oversized, duplicate or model-drifted responses.
  - Before patch handling, the exact summary, changed_paths and tests projection validates against accepted response-format SHA-256 6b8ec1d2a6a288e5b908716714589dae963739f2b35a0a29237ff4cbc1355c4b.
  - Patch validation rejects empty/no-op patches, absolute or escaped paths, test/oracle mutation, unexpected files, binary patches, rename/copy/mode changes and declared-versus-actual path drift.
  - Exact REP-001 base issue test exits 1 with REP001_NEGATIVE_RANGE_ORDER while regression exits 0; the accepted valid patch makes both exit 0.
  - Independent replay starts from a distinct fresh materialization, ignores response verdict claims, reruns validation and produces the same stable semantic projection.
  - Rollback restores exact accepted source bytes, frozen base tree and clean state in both executions.
  - Quality-frozen negative controls have zero false accepts and Evidence ownership/path tamper cases fail closed without modifying pre-existing objects.
  - Targeted verification and accepted P1-035/P1-048 regressions pass before exact-candidate review.
  - Fresh CTO, Security and Quality reviewers PASS the same exact candidate before Task Gate.
  - After Task Gate, the reviewed tree is integrated locally and one clean canonical make verify passes.

required_evidence:
  - exact Contract, Task Card, prompt, schema, fixture, request, response and candidate identities
  - exact accepted REP-001 response-format projection and task-owned derived TaskSpec/SystemConfiguration identities
  - request determinism and explicit no-transport verification
  - valid execution and independent replay raw command evidence
  - negative matrix result with exact reason codes and zero false accepts
  - rollback source/tree/clean-state proof
  - fresh CTO, Security and Quality exact-candidate reviews
  - integration tree equality and canonical make verify result

rollback:
  run_level: Restore exact source bytes and verify exact tree and clean state inside each disposable materialization.
  candidate_level: Do not integrate a NON_PASS candidate; preserve Evidence and remove only the verified task-owned clean worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence.

stop_conditions:
  - Worker has not produced an executable request builder and valid fixture evaluation within 8 engineering hours.
  - Any accepted input, prompt, schema, Task Card, source or candidate identity drifts.
  - The derived TaskSpec or SystemConfiguration exceeds 1024 model tokens, enables a tool, claims a scheduled run or fails exact response-format binding.
  - Any network, Provider, Secret, remote, production, public or other Founder-reserved permission is required.
  - Untrusted output can escape the allowed patch path, modify tests/oracles, contaminate canonical or overwrite Evidence.
  - Rollback cannot restore exact accepted bytes, tree and clean state.
  - One bounded same-Task repair is consumed and the exact candidate remains TARGET_NON_PASS.
  - An exact-candidate reviewer returns TARGET_NON_PASS.
  - Canonical integrated tree differs from the reviewed tree or canonical make verify is NON_PASS.

forbidden_actions:
  - reading, restoring or reusing P1-049 or P1-050 rejected candidate, Review or Evidence bodies
  - reading, restoring, fixing, integrating or reusing P1-051 rejected source bytes
  - modifying accepted P1-035 or P1-048 bytes or current authority validators
  - implementing network transport, calling a Provider, reading a Secret or installing dependencies
  - changing the P1 Exit Gate, Phase scope, policy or external-effect permissions
  - creating successor, replacement, normalization, closure, feasibility or remediation chains
  - push, pull request, release, remote mutation, production or public effect
  - P2/P3 entry, Agent Shell, Supervisor, Root Custody, Strong Isolation or Multi-Agent Runtime work
  - claiming Provider, model, empirical baseline, VTSR, Agent, P1 Exit, product, production or hostile-principal capability

