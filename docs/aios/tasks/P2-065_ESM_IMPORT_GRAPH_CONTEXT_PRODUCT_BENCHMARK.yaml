  accepted benchmark task uses .mjs while the current product classifies .mjs
  as unsupported, emits zero symbols and relations, and cannot retrieve a graph-
  related chunk outside the lexical candidate pool. This is the smallest real
  product change that directly tests the frozen P2 hypothesis instead of adding
  another governance or adapter layer.
