stop_conditions:
  - Canonical start, Goal, Founder packet, accepted-input or activation-parent identity drifts.
  - Any rejected engineering asset is read or reused as an implementation input.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus four same-Task repairs are exhausted.
  - Three distinct diagnostics produce no strict Chat Completions 2xx completion.
  - The formal matrix returns NON_PASS or requires a rerun.
  - Any Secret leak, non-loopback connection, remote, production or public effect occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
