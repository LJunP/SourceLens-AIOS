objective: >-
  Build and execute a deterministic task-wide reservation state-machine benchmark
  that falsifies the old task-and-workflow composite active-head model and proves,
  over one frozen finite interleaving schedule, that a task-id-only active frontier
  plus invocation-bound append-only history admits exactly one pre-effect winner,
  leaves every loser at zero effect, and preserves the accepted P3-001 checkpoint
  and workflow-binding semantics across crash, cleanup, replay and release.
why_now: >-
  The accepted P3-001 checkpoint foundation binds workflow only at the first
  accepted checkpoint. The preceding Product route demonstrated that a
  workflow-scoped active reservation can false-accept concurrent step-zero
  proposals for different workflows on the same task. Product implementation is
  locked until this Foundation supplies an executable task-wide oracle.
