title: Complete observable trace recorder, validator and independent replay vertical slice

why_now:
  - P1-066 accepted one real cooperative-local offline B0 patch lifecycle with complete Patch Evidence, independent evaluation and exact rollback.
  - P1-067 ended terminally after its one canonical full verification found a stale generated Project Code Map; its candidate and implementation are not reusable.
  - The current P1 Exit Gate still records OBSERVABLE_TRACE as missing, while the active Phase explicitly allows RUN_RECORDING, DETERMINISTIC_REPLAY, EVALUATOR_AND_ORACLE and OBSERVABLE_TRACE_VALIDATION.
  - A complete, data-driven trace recorder can close one atomic P1 Exit item in the remaining sixteen-hour Task slot; an isolated B2 slice cannot close the combined B0/B1/B2 item because B1 is not accepted.

objective: >-
  Build and falsify a closed, data-driven complete observable trace recorder and
  validator on one real offline REP-001 patch lifecycle. The implementation must
  capture every observable field required by Evaluation Protocol v1.1 section 6,
  retain raw action Evidence, support deterministic replay and independent
  evaluation, and prove exact rollback without inventing model, prompt, rationale,
  resume, retry or intervention Evidence that did not occur.

hypothesis: >-
  A task-agnostic append-only event trace with exact identities, a hash chain,
  typed absence semantics and independent replay can record the complete
  observable lifecycle of one finite offline patch run, reject every frozen
  omission or tamper case with zero false accepts, and reproduce a predeclared
  stable projection across two physically independent runs.

