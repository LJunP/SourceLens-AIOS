minimal_safety_invariants:
  - Canonical source is never a run materialization or tool target.
  - Every run uses a fresh task-owned Evidence root and disposable repository; a pre-existing object is rejected, never overwritten or cleaned.
  - Every root and parent directory is checked component by component with lstat, realpath containment, expected ownership and restrictive mode; no directory component may be a symlink.
  - Every task-controlled input or retained Evidence leaf is a regular non-symlink file with nlink one and exact expected hash and length before a trusted read.
  - Every new Evidence leaf must be absent and is created atomically with exclusive create and no-follow semantics; event, manifest and receipt leaves are create-once and are never overwritten, replaced, renamed or reopened for truncation.
  - A raw stream has one exclusive open, bounded append through the owned descriptor and immutable close; no later writer may reopen it.
  - A fixed host executable is bound by absolute path, realpath, digest, mode, version and architecture and must not be writable by the current user; host executables are not required to have nlink one.
  - Executable, argv, cwd, timeout and minimal non-secret environment are fixed by the frozen Task Card and cannot be supplied by run results.
  - Typed NOT_APPLICABLE or EMPTY values use only predeclared reason codes and cannot hide an observable event.
  - The recorder records observable events but never decides task success; the independent Quality oracle recomputes identities and verdict.
  - A checkpoint close-and-reopen test proves recorder cursor and hash-chain recovery only; it is not Agent resume, P3 runtime or crash-consistency proof.
  - The runner cannot create, preallocate or modify any independent-verdict, verified-Patch-Evidence or final-bundle path.
  - Every mutating run restores exact source bytes, base commit, base tree and clean status.
  - Graph, ranker, memory, multi-Agent, network, Provider, Secret, remote, production and public effects remain disabled.

acceptance_criteria:
  - All accepted input, Contract, authority, candidate, executing-module and Quality Freeze identities match before mutation or child start; no historical route receipt is a product-runtime dependency.
  - The recorder and validator contain no Task ID, run ID, REP-001, IR10, candidate hash or external Evidence path literal as generic validation rules; exact fixture values come only from frozen data.
  - A real fresh offline lifecycle executes the required base failure, finite patch, patched success, independent verification and exact rollback order.
  - The retained real trace records every family required PRESENT by this Contract; only the explicitly allowlisted non-occurring families may use a frozen typed absence, and the oracle cross-checks each reason against the actual action population. No post-hoc Evidence is synthesized.
  - The frozen PRESENT-form conformance fixture covers every section 6 family, survives recorder close plus fresh-instance reopen, and reproduces its exact declared round-trip projection; it cannot be counted as Run A, Run B or VTSR Evidence.
  - In each real run the recorder creates a task-owned checkpoint, closes, and a fresh recorder instance reopens from the exact checkpoint receipt before appending the next event with continuous sequence, cursor and prior-event hash. This proves recorder continuity only, not Agent resume, crash consistency or P3 runtime.
  - Every event has strict sequence, unique ID, run binding, prior-event hash and exact raw input/output identity; no event follows terminal.
  - Recorder output remains pending and contains no final PASS or self-approval; only the independent oracle may write the final evaluation segment.
  - Frozen negatives cover missing, duplicate, reordered and gapped events; hash-chain break; unknown nested member; cross-run substitution; stream, path, type, symlink, hardlink, length and hash tamper; forged absence; tool/result mismatch; denied child start; checkpoint/resume misuse; mutation, test, accounting, terminal and rollback inconsistency; six external effects; process timeout cleanup; candidate and Code Map drift, with zero false accepts.
  - Fresh Run A and independent Quality Run B use distinct physical roots, retain distinct raw Evidence and produce byte-equal predeclared stable projections while preserving dynamic fields outside that projection.
  - Targeted verification, accepted P1-035/P1-055 regressions and official Project Code Map check pass on one clean committed candidate. P1-066 remains covered only by the one post-integration canonical full make verify and is not a separate runtime dependency.
  - The official Project Code Map generator is the final repository-content mutation before the exact candidate commit; no source byte changes are allowed between candidate freeze and reviewed-tree integration. The explicitly separate post-acceptance Truth plus Code Map terminal-sync commit remains allowed.
  - One exact candidate receives one fresh CTO, Security and Quality TARGET_VERDICT PASS review cycle.
  - Reviewed and integrated trees are exactly equal and the one post-integration canonical full make verify passes.
  - Only after all conditions pass may Truth mark OBSERVABLE_TRACE accepted and recompute strict P1 completion; otherwise no P1 completion credit is granted.

success_projection:
  accepted_atomic_p1_exit_item: OBSERVABLE_TRACE
  strict_p1_completion_before_task: 2_COMPLETE_2_PARTIAL_4_NOT_COMPLETE_25_PERCENT
  strict_p1_completion_after_pass: 3_COMPLETE_2_PARTIAL_3_NOT_COMPLETE_37_5_PERCENT
  complete_p1_exit_claim: false
  p2_or_p3_entry_claim: false

candidate_freeze_and_review:
  pre_freeze_implementation_iterations: 2
  exact_candidates: 1
  formal_review_cycles: 1
  post_freeze_source_repairs_allowed: false
  final_source_mutation: official_make_code_map
  clean_candidate_checks:
    - make code-map-check
    - ./scripts/verify-p1-068-complete-observable-trace.sh
    - candidate_worktree_clean_and_tree_unchanged
  formal_runs:
    - Run A executes once in a fresh task-owned root.
    - Run B executes once by a fresh independent Quality actor in a different physical root and does not consume Run A path, receipt or verdict.
    - The predeclared stable projection must be exact byte-equal.
  reviews:
    - Fresh CTO, Security and Quality reviewers inspect the same exact candidate and the same frozen Run A/Run B Evidence.
    - Any TARGET_VERDICT NON_PASS terminally stops the Task; no correction or second review cycle is allowed.

integration:
  method: one_local_squash_commit
  precondition: CTO_SECURITY_QUALITY_TARGET_VERDICTS_ALL_PASS
  reviewed_tree_must_equal_integrated_tree: true
  canonical_full_make_verify_invocations: 1
  make_verify_nonpass_disposition: non_destructive_git_revert_and_terminal_stop
  post_acceptance_truth_sync:
    - Update Truth and mechanically regenerate Project Code Map in the same terminal-sync commit.
    - Run targeted Truth and Code Map checks only; do not run a second full make verify.

rollback:
  run_level: Restore exact frozen source bytes, base commit, base tree and clean status inside the disposable materialization; remove only objects proven task-owned.
  candidate_level: Do not integrate a NON_PASS candidate; preserve its exact Git identity and Evidence.
  integrated_level: Use non-destructive git revert of the exact integration commit; never reset or clean.

stop_conditions:
  - Any required observable family cannot be captured truthfully and would require post-hoc inference or fabricated Evidence.
  - The implementation becomes specific to a Task ID, run ID, REP-001, IR10, candidate hash or external Evidence path instead of frozen input data.
  - Continuing requires reading, restoring, comparing, copying or reusing P1-058, P1-067 or any other terminal or rejected engineering source, fixture, test, candidate, diff or implementation Evidence.
  - Continuing requires modification of accepted P1-035/P1-055/P1-066 bytes, RunRecord schema, Evaluation Protocol, P1 Exit Gate, current Phase boundary, authority validator or Code Map generator.
  - An invalid input can reach mutation or child start, or a result controls path, argv, cwd, env, executable, module, timeout or free-form execution.
  - Evidence, canonical source or a pre-existing object is overwritten, followed, escaped, renamed, deleted or damaged.
  - The two implementation iterations end without all targeted checks passing.
  - Run A or Run B cannot reproduce, stable projections differ, false accepts are nonzero or rollback is not exact.
  - Any one-cycle final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or the one canonical full make verify returns NONPASS.
  - The Task requires network, Provider, Secret, remote, production, public, P2/P3, critical-risk acceptance or an irreversible action.

forbidden_actions:
  - Read or reuse P1-058, P1-067, P1-063, P1-064 or any other terminal or rejected engineering implementation lineage.
  - Modify accepted P1-035, P1-055 or P1-066 implementation, fixture, result or Evidence bytes.
  - Build an Agent Runtime, sandbox platform, authority kernel, Supervisor, Root Custody, strong-isolation system or Multi-Agent Runtime.
  - Execute proposal text, free-form or untrusted code, arbitrary shell, dynamic module targets or result-controlled execution parameters.
  - Configure or use an API key, network, Provider, Secret, remote, production or public effect.
  - Push, open a pull request, release, modify a remote, enter P2/P3 or change the P1 Objective or Exit Gate.
  - Count this Contract, Quality Freeze, Evidence, review or administrative work as capability progress.

