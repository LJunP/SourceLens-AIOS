acceptance_criteria:
- Before any product-source write, create-once freeze one architecture and no more than two complete deterministic parameter sets; bind their exact bytes, SHA-256, top-k 10, 131072-byte budget, normalized-path tie rule and no-oracle/no-HELD constraints.
- Rehash the accepted P2-069 source pack, benchmark manifest, DEV task cards, B1 results and DEV/HELD non-overlap proof before use; every opened accepted input and source leaf must have pre-read expected and post-read observed identities.
- Reproduce the accepted B1 selected paths, selected bytes, ranking identities and aggregate metrics exactly before evaluating a semantic candidate.
- The product-owned Java selector resolves package, type and member ownership plus import, invocation, inheritance and reference edges, and owns bounded forward/backward impact-cone ranking, top-k 10, the 131072-byte UTF-8 budget and normalized-path-first deterministic ties.
- Implementation inputs are limited to canonical main, accepted P2-069 artifacts, query text, B1 lexical candidates and accepted source bytes; DEV oracle labels, task-specific branches, post-result tuning and all P2-070 through P2-076 engineering lineage are prohibited.
- One exact candidate must simultaneously achieve macro precision greater than 0.15595238095238093, macro recall greater than 0.8958333333333334 and macro reciprocal rank greater than 0.8229166666666666, with zero per-task recall regression versus accepted B1.
- The exact candidate passes focused product tests, an exact sandboxed evaluator replay and a second independent byte-exact replay with closed environment, runtime, source-to-class, stdout, stderr, exit and write inventories.
- HELD task sources, payloads, results and oracle remain unopened and unexecuted; the existing formal HELD slot remains locked until independent Product Selector DEV acceptance.
- CTO, Security and Quality/Evaluation independently accept the exact candidate, raw Evidence leaves and Task Gate without reading rejected lineage.
required_evidence:
- Exact architecture freeze, two-or-fewer parameter-set freeze, accepted-input inventory and B1 parity receipt created before product-source mutation.
- Exact authority-bound worktree and Evidence roots plus sandbox-exec deny-network and write-confinement preactivation receipt created before the first mkdir performed by product execution.
- Candidate commit/tree, changed-file inventory, product API call graph binding, complete Java source-to-class identity, JDK 17 and classpath/sourcepath/processor identities.
- Fresh focused-test and Surefire XML/stdout/stderr inventories; fresh evaluator and negative-fixture roots; no reused target/classes or mutable build output.
- Two independent DEV replay transactions containing exact argv, cwd, closed environment, runtime binaries, input/output identities, per-file ranks and scores, selected paths/bytes, per-task metrics and macro metrics.
- Negative cases for authority-root substitution, symlink input, output overwrite, out-of-root write, HELD request, oracle field request, duplicate/ambiguous symbols, malformed Java, graph cycles, non-deterministic ties and budget overflow.
- DEV/HELD non-overlap proof, zero HELD reads, zero external effects, rollback instructions, final reviewer manifest and three independent review records.
rollback: >-
  Do not integrate a NON_PASS candidate. Preserve exact terminal accounting and create-once
  Evidence, leave canonical main unchanged, keep the Product Selector DEV milestone
  unaccepted and the formal HELD slot locked, and perform no destructive cleanup under
  this authorization.
stop_conditions:
- Stop before product-source write if the architecture, both-or-fewer parameter sets, accepted-input identities, B1 parity, exact authority roots or OS confinement envelope is missing or NON_PASS.
- Stop if any P2-070, P2-071, P2-072, P2-073, P2-074, P2-075 or P2-076 branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused.
- Stop if DEV oracle labels influence implementation, a task-specific branch is introduced, a parameter changes after seeing results, or more than two parameter sets are evaluated.
- Stop if any HELD source leaf, task payload, result, oracle or build output is opened or executed.
- Stop if any network, Provider, Secret, remote, production, public, deletion, database or P3 effect is requested or observed.
- Stop if any write escapes the exact Task worktree or Evidence root, or if a build/evaluator transaction is not OS-confined and identity-bound before spawn.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse any rejected P2-070 through P2-076 engineering lineage input.
- Modify accepted source-pack bytes, dataset split, DEV/HELD assignment, oracle, metric, threshold, schedule or baseline results.
- Use DEV ground-truth labels or task IDs as selector implementation input; add task-specific branches; tune after observing candidate metrics; open or execute HELD.
- Execute Maven, Gradle, JVM tests or evaluator subprocesses with network enabled; all real execution remains exact offline under sandbox-exec deny network.
- Write outside the exact Task worktree or Evidence root; reuse mutable compiler/test output; omit closed environment or runtime/source-to-class/write inventories.
- Create a successor, replacement, normalization, feasibility, remediation or automatic retry chain after NON_PASS.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete files or Evidence, modify Codex control-plane state, enter P3, unlock HELD without acceptance or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for one exact
  independently accepted Product Selector DEV candidate. PASS raises delivery progress
  to 70% and unlocks only the existing formal HELD evaluation slot. It does not itself
  claim strict P2 Exit progress, formal HELD performance, P3 eligibility, production
  readiness, public release or Long-term Goal completion.
