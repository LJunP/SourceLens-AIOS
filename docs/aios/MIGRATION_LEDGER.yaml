schema_version: 3
record_type: inherited_asset_disposition
status: P0_ACCEPTED_HISTORICAL_REFERENCE
current_phase_authority: false
rule: This ledger classifies inherited assets. It does not schedule work or prove capability.

vocabulary:
  KEEP: retain as current supporting asset
  REFACTOR: retain value but rework boundaries before capability use
  QUARANTINE: retain but exclude from mainline claims until independently proven
  FREEZE: retain without current expansion
  BUILD_NEW: required future capability does not yet exist

assets:
  - id: RUST_ANALYZER
    paths: [analyzer-rust]
    disposition: REFACTOR
    target_phase: P2
    claim_boundary: File scanning and structured extraction exist; cross-language semantic quality is unproven.

  - id: JAVA_AST_AND_CODE_GRAPH
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/analysis
    disposition: REFACTOR
    target_phase: P2
    claim_boundary: Reusable implementation exists; precision, recall and task value remain unbenchmarked.

  - id: CODE_CHUNKS_SEARCH_AND_RETRIEVAL
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/analysis
      - backend-spring/src/main/java/com/sourcelens/module/agent/service/CodeQaRetrievalService.java
    disposition: REFACTOR
    target_phase: P2
    claim_boundary: Existing regression corpus is not a protected capability benchmark.

  - id: NON_JAVA_SEMANTIC_PARITY
    paths: []
    disposition: QUARANTINE
    target_phase: future evidence decision
    claim_boundary: File discovery does not prove semantic parity across languages.

  - id: AGENT_RUNTIME
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/agent
    disposition: FREEZE
    target_phase: P3
    claim_boundary: Inherited loops do not prove durable planning, checkpoint/resume or trusted execution.

  - id: EXECUTION_ARTIFACT_AND_AUDIT
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/execution
      - backend-spring/src/main/java/com/sourcelens/module/artifact
      - backend-spring/src/main/java/com/sourcelens/module/audit
    disposition: REFACTOR
    target_phase: P3-P5
    claim_boundary: Useful primitives exist but are not a complete Evidence or Trust Runtime.

  - id: AUTOREPAIR
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/autorepair
    disposition: FREEZE
    target_phase: P4
    claim_boundary: PATCH_READY does not currently prove build, tests or independent verification.

  - id: BROAD_PRODUCT_UI
    paths:
      - web-console/src
    disposition: FREEZE
    target_phase: P4 or evidence-driven decision
    claim_boundary: Existing screens are inherited product assets, not the current P1 product loop.

  - id: GITHUB_REMOTE_AND_SAAS
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/repository
    disposition: FREEZE
    target_phase: founder decision after P4
    claim_boundary: No remote write, PR, merge, multi-tenant or SaaS authority is granted.

  - id: TASK_EVIDENCE_PRIMITIVES
    paths:
      - backend-spring/src/main/java/com/sourcelens/module/execution
      - backend-spring/src/main/java/com/sourcelens/module/artifact
      - backend-spring/src/main/java/com/sourcelens/module/audit
    disposition: REFACTOR
    target_phase: P1-P5
    claim_boundary: Reusable primitives exist; the P1 harness and future Patch Evidence Package remain unimplemented.

  - id: EVALUATION_HARNESS
    paths:
      - evaluation-harness
    disposition: BUILD_NEW
    target_phase: P1
    claim_boundary: Defined by AIOS-P1-001; implementation and runs are currently absent.

  - id: PATCH_EVIDENCE_PACKAGE
    paths: []
    disposition: BUILD_NEW
    target_phase: P4
    claim_boundary: Must bind task, source, actions, tests, verifier, risk, approval and rollback.

  - id: SUPERVISOR_ROOT_CUSTODY_STRONG_ISOLATION
    paths: []
    disposition: FREEZE
    target_phase: P3-P5
    claim_boundary: Historical designs and probes do not constitute current runtime capability.

  - id: MEMORY_AND_LEARNING
    paths: []
    disposition: BUILD_NEW
    target_phase: P7
    claim_boundary: Transcript persistence is not measured memory or learning.

  - id: MULTI_AGENT_ORGANIZATION_RUNTIME
    paths: []
    disposition: FREEZE
    target_phase: P8-P9
    claim_boundary: Development-role collaboration is not product Multi-Agent Runtime evidence.
