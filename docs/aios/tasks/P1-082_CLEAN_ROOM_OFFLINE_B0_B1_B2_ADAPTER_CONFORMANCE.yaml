acceptance_criteria:
  - >-
    One exact disposable preactivation fixture using these Contract semantics
    passes both the canonical main authority validator and P1 safety entry before
    any Task activation.
  - >-
    A new external truth binding proves the exact accepted P0 checkpoint
    ad6450e418d8f1b4fd5a789f913525a8dd8bdc10 /
    2c0956ae8598547466f691ead21532a026006bf9, its analyzer-rust blob manifest,
    offline locked build, executable identity and real repository_analysis.scan
    operation without using the non-authoritative 09cf8dd6 snapshot.
  - >-
    B0, B1 and B2 use three byte-distinct executable entrypoints and three
    separately identity-bound SystemConfigurations on one shared harness.
  - >-
    B0 has loop_limit 1 and no tools; B1 uses only a closed finite list/read/
    lexical-search/structured-patch/local-test schedule; B2 invokes only the
    attested sourcelens-analyzer scan primitive with fixed argv, cwd, environment,
    timeout and output caps.
  - >-
    B0-A, B0-B, B1-A, B1-B, B2-A and B2-B use six physically distinct owned
    materialization and Evidence roots; each B run is blind to the corresponding
    A path, receipt and verdict.
  - >-
    Each same-adapter A/B pair produces byte-identical predeclared stable
    projections while preserving distinct raw output and physical receipts.
  - >-
    Replay reexecutes frozen inputs in a new owned root; rollback proves exact
    source, commit, tree and clean-state restoration without reset or clean.
  - >-
    The closed 22-case negative matrix is independently recomputed from isolated
    golden fixtures and records zero false accepts and no forbidden child start,
    mutation or external effect.
  - >-
    B2 scan completion is not promoted to patch success: absent patch and failing
    issue test remain explicit while adapter-conformance may independently PASS.
  - >-
    One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT
    PASS on identical bytes and runnable Evidence; reviewed tree equals the
    locally integrated tree and the single post-integration canonical make verify
    passes.

required_evidence:
  - exact Goal, Founder packet, Contract, authority and accepted-input identities
  - same-fixture dual-entry preactivation receipt
  - P0 snapshot attestation, build ledger, binary identity and independently replayed scan probe
  - immutable Quality Freeze manifest and ownership map
  - candidate and exact diff manifests
  - six raw run records, action ledgers, evaluator and oracle verdicts
  - three A/B stable-projection equality receipts
  - exact replay and rollback receipts
  - 22-case negative matrix receipt with false_accepts=0
  - three fresh exact-candidate review receipts
  - reviewed-tree equality, canonical verify and integration receipts

rollback:
  run_level: >-
    Restore or prove unchanged the exact disposable source bytes, commit, tree and
    clean status; remove only task-owned materializations after identity checks;
    never remove, overwrite or rename final Evidence.
  candidate_level: >-
    Do not integrate a NON_PASS candidate; preserve its exact Git and Evidence
    identity.
  integrated_level: >-
    If the single canonical make verify is NONPASS, use one non-destructive git
    revert of the exact integration commit; never reset or clean.

stop_conditions:
  - either exact preactivation validator entry is NON_PASS
  - exact start, Goal, Founder packet, clean-state or accepted-input identity drifts
  - authority, safety, protocol, P1 Objective, Exit Gate or Phase boundary would need modification
  - the accepted P0 checkpoint cannot be uniquely bound, safely materialized, built offline and locked, or really scanned
  - any archive or materialization contains a symlink, hardlink, special file, unsafe path or unowned object
  - any network, Provider, Secret, remote, production or public effect occurs
  - any run is not physically independent, stable projection differs, replay differs, rollback is inexact or false_accepts is nonzero
  - two adjacent implementation results have the same normalized root cause
  - the single code-only repair, candidate or final-review budget would be exceeded
  - any fresh final Reviewer returns TARGET_VERDICT NON_PASS
  - reviewed and integrated trees differ or the single canonical make verify is NONPASS

forbidden_actions:
