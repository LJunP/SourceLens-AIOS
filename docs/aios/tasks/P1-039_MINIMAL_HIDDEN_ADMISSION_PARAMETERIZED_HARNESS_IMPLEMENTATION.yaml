objective: >-
  Implement one runnable, local, deterministic vertical slice in which a
  parameterized Evaluation Harness calls a frozen hidden-admission interface,
  admits only exact hash-bound public-synthetic task handles, records observable
  evidence, rejects controlled failures, and reproduces the same normalized
  result. The Task atomically closes the P1 Exit Gate engineering capabilities
  HIDDEN_SET_PROTOCOL and PARAMETERIZED_EVALUATION_HARNESS under the declared
  cooperative-local claim boundary only.

why_now:
  - VERSIONED_REPRESENTATIVE_TASK_DATASET is accepted, while hidden-set access separation and a parameterized Evaluation Harness are the next unclosed P1 Exit Gate capabilities.
  - The Founder approved exactly one post-revision implementation route after separating hash-bound historical governance metadata from forbidden failed engineering assets.
  - The smallest falsifiable increment is a public-synthetic, role-separated admission interface actually consumed by one parameterized harness; no real hidden set, baseline execution, Agent Runtime or Trust Runtime is needed.

