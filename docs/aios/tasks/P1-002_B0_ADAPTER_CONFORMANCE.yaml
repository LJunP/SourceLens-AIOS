separation_and_freeze_order:
  - Quality creates and freezes the B0 visible fixture, oracle and evaluator before Worker implementation.
  - The freeze receipt binds this Task Contract, accepted schemas, fixture, oracle, evaluator and runtime identities.
  - Worker may read but cannot modify Quality-owned or immutable paths.
  - Integration may modify only its two exact paths after Worker handoff.
  - Reviewer reads the frozen candidate and evidence; Worker cannot perform final acceptance.

