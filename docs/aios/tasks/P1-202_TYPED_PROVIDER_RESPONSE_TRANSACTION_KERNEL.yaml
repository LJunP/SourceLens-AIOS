acceptance_criteria:
  - One versioned transaction entrypoint validates exact request identity, pre-effect reservation, raw response, usage, route caps and terminal decision.
  - JSON_INVALID is the only UNKNOWN usage class and retains the full input/output reservation.
  - Every parsed invalid-usage class deterministically returns NON_PASS and retains the full reservation.
  - Valid usage uses non-negative integer prompt, completion and total values with exact total equality and reservation/cap compliance.
  - HTTP success and failure both traverse the same typed usage core.
  - Exact request contract rejects response_format, extra keys, role/order/content or identity drift.
  - The formal-executor-compatible CLI directly invokes the production kernel and emits a closed receipt.
  - Thirty-six synthetic cells, the complete negative matrix and deterministic replay pass with zero false accepts.
  - Accepted P1-035/P1-101/P1-129/P1-149 controls pass without mutation.
  - Provider requests, Secret reads and all six external effects equal zero.
  - Focused verification and Task-worktree make verify pass before one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
