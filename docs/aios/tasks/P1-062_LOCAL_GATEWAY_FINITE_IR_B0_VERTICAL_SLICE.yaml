    - fake-server positive and adversarial response fixtures
    - independent evaluator and expected stable projection
  worker_must_not_import_or_call_quality_oracle: true

acceptance_criteria:
  - All offline conformance and adversarial transport/parser tests pass before the real request.
  - Exact request body bytes and a category-level egress manifest are frozen before transport and contain no source, tests, reference patch, evaluator, governance, Truth or credential.
  - Source-bearing Provider submissions are zero or one; once sent, success, refusal, timeout, reset, malformed output or ambiguous delivery is terminal and never retried.
  - The response is bounded and parsed as untrusted bytes; only an exact closed four-state IR choice may reach the accepted P1-055 compiler.
  - Run A and independent Run B use the same retained response with no second Provider request and agree on the stable projection.
  - Both disposable repositories prove exact base commit/tree/clean rollback and cleanup only task-owned paths.
  - Evidence records request and response identities, timing, HTTP status, returned model and usage when present; OpenAI provenance is Founder-attested while exact upstream model, upstream call count and monetary cost remain independently unverified.
  - Credential value, length and hash are absent from Git, Evidence, logs, argv and every post-transport child.

required_evidence:
  - frozen egress artifact identities and exact request-body identity
  - transport receipt with one-shot counter, peer address, status, latency and safe response identity
  - response parser and finite-IR mapping outcome
  - accepted compiler identity and outcome
  - Run A and independent Run B fixed-test results and stable-projection comparison
  - rollback and cleanup receipts
  - closed Evidence manifest with credential leak scan

stop_conditions:
  - exact route, packet, profile, endpoint, model, budget, identity or clean-state drift
  - credential reflection or any credential persistence, logging, hashing or propagation after transport
  - any second metadata request, second source-bearing submission, retry, redirect, proxy, DNS or endpoint fallback
  - source, tests, reference patch, evaluator, governance, Truth or hidden evidence enters egress
  - Provider text can select a path, source, diff, command, argv, executable or non-finite mutation
  - remote, production or public effect
  - Evidence corruption, scope expansion, second candidate or need for another Founder-reserved decision

forbidden_actions:
  - read, restore, compare, repair or reuse P1-052 or P1-056 rejected engineering bytes
  - expose or persist the supplied credential or screenshot contents
  - rewrite Founder-attested OpenAI provenance as independently verified exact upstream model, upstream request count or monetary cost
  - let the model read repository source or tests, execute tools, write source directly or produce a free-form patch
  - start P2, P3, agent shell, remote write, production or public activity
  - create a successor, replacement, normalization, closure, feasibility or remediation chain

