objective: >-
  Implement and execute one bounded empirical B0 vertical slice for the visible
  accepted REP-001 task. Submit exactly one source-bearing Chat Completions
  request to the Founder-supplied literal-loopback compatible gateway, accept
  only one of four finite P1-055 typed IR choices, compile through the accepted
  trusted compiler, run the frozen local tests, independently replay the same
  retained response without another Provider call, and preserve truthful closed
  Evidence and rollback identity.

why_now: >-
  P1 is 2/8 complete and has no empirical Provider baseline. Previous work
  repeatedly stopped before real engineering. This is the smallest runnable,
  falsifiable vertical slice that turns the accepted TaskSpec and finite IR
  substrate into real evidence without authorizing agent shell, arbitrary model
  patches, remote writes, production effects, P2 or P3.

