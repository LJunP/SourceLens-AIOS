  admitted_slots:
    - admission_handle: PUBLIC-SYNTHETIC-H01
      task_id: SL-P1-REP-005-PROFILE-DISPLAY-NAME
      task_spec_path: evaluation-harness/datasets/p1-representative-task-dataset-v1/tasks/SL-P1-REP-005-PROFILE-DISPLAY-NAME/task-spec.json
    - admission_handle: PUBLIC-SYNTHETIC-H02
