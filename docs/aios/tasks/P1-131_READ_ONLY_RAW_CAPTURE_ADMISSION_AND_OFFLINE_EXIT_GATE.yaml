  - Baseline report includes numerator, denominator, invalid count, failures and reason distribution.
  - P2 preregistration contains a falsifiable hypothesis, primary metric and stop conditions.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
