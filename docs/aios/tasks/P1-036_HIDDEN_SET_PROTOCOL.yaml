atomic_mutation_matrix:
  - case_id: M01_PROTOCOL_VERSION_DRIFT
    base: frozen_public_positive_package
    target: public-enrollment-receipt.json#/protocol_version
    single_mutation: replace 1.0.0 with 1.0.1
    expected_reason_code: PROTOCOL_IDENTITY_MISMATCH
    expected_exit_status: 2
  - case_id: M02_IMPLEMENTATION_ROLE_PRIVATE_ACCESS
    base: frozen_public_positive_package
    target: evaluation-request.json#/requested_access
    single_mutation: replace PUBLIC_AGGREGATE_ONLY with PRIVATE_HIDDEN_CONTENT
    expected_reason_code: ROLE_SEPARATION_VIOLATION
    expected_exit_status: 2
  - case_id: M03_HIDDEN_TASK_ID_DISCLOSURE
    base: frozen_public_positive_package
    target: aggregate-response.json
    single_mutation: add hidden_task_id with one synthetic string
    expected_reason_code: HIDDEN_DISCLOSURE_VIOLATION
    expected_exit_status: 2
  - case_id: M04_HIDDEN_ORACLE_DISCLOSURE
    base: frozen_public_positive_package
    target: aggregate-response.json
    single_mutation: add hidden_oracle with one synthetic string
    expected_reason_code: HIDDEN_DISCLOSURE_VIOLATION
    expected_exit_status: 2
  - case_id: M05_REQUEST_PUBLIC_RECEIPT_HASH_DRIFT
    base: frozen_public_positive_package
    target: evaluation-request.json#/public_enrollment_receipt_sha256
    single_mutation: replace the hash with sixty-four lowercase zeroes
    expected_reason_code: REQUEST_BINDING_MISMATCH
    expected_exit_status: 2
  - case_id: M06_RESPONSE_REQUEST_HASH_DRIFT
    base: frozen_public_positive_package
    target: aggregate-response.json#/evaluation_request_sha256
    single_mutation: replace the hash with sixty-four lowercase zeroes
    expected_reason_code: RESPONSE_BINDING_MISMATCH
    expected_exit_status: 2
  - case_id: M07_ATTESTATION_RESPONSE_HASH_DRIFT
    base: frozen_public_positive_package
    target: execution-attestation.json#/aggregate_response_sha256
    single_mutation: replace the hash with sixty-four lowercase zeroes
    expected_reason_code: RESPONSE_BINDING_MISMATCH
    expected_exit_status: 2
  - case_id: M08_AGGREGATE_POPULATION_DRIFT
    base: frozen_public_positive_package
    target: aggregate-response.json#/aggregate_counts/eligible
    single_mutation: replace the frozen population integer with one less
    expected_reason_code: POPULATION_ACCOUNTING_MISMATCH
    expected_exit_status: 2
  - case_id: M09_UNKNOWN_PUBLIC_FIELD
    base: frozen_public_positive_package
    target: public-enrollment-receipt.json
    single_mutation: add one undeclared field named extra
    expected_reason_code: CLOSED_SCHEMA_VIOLATION
    expected_exit_status: 2
  - case_id: M10_ARTIFACT_BYTE_DRIFT
    base: frozen_public_positive_package
    target: evaluation-request.json
    single_mutation: append exactly one LF byte without updating package identity
    expected_reason_code: ARTIFACT_IDENTITY_MISMATCH
    expected_exit_status: 2
  - case_id: M11_PATH_ESCAPE
    base: frozen_public_positive_package
    target: package-manifest.json#/artifacts/0/path
    single_mutation: replace the canonical relative path with ../outside.json
    expected_reason_code: PATH_CONTAINMENT_VIOLATION
    expected_exit_status: 2
  - case_id: M12_SYMLINK_PUBLIC_ARTIFACT
    base: frozen_public_positive_package
    target: aggregate-response.json
    single_mutation: replace the regular file with a symlink to another in-root file
    expected_reason_code: SYMLINK_FORBIDDEN
    expected_exit_status: 2

