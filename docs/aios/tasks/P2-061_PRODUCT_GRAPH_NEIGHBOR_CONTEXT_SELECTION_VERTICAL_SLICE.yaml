acceptance_criteria:
  - Quality freezes the exact accepted P1 six-task dataset identity, ordered source-unit universe, relevant-neutral-forbidden oracle, 512-byte canonical context budget and deterministic lexical control before Worker product mutation.
  - The real Code QA product path delegates repository-context selection to one bounded service while preserving the existing request, citation, retrieval mode and PRIMARY versus ADJACENT_CONTEXT response semantics.
  - A direct graph neighbor absent from the initial lexical candidate pool can be recovered only from the same scan through exact repository-relative path and valid span matching; graph failure deterministically falls back to the original lexical selection.
  - Control and treatment use the same source-unit universe, 512 UTF-8 byte budget, six-task denominator and independent Quality evaluator; the lexical control never loads graph, oracle or treatment-only logic.
  - Public DEV treatment macro recall is strictly greater than lexical control with no per-task regression, zero forbidden context, zero false accepts and byte-exact stable projection across two physical roots before the unique candidate is frozen.
  - One out-of-sample validation run on the frozen candidate yields treatment macro recall strictly greater than control, at least one additional relevant unit, no per-task regression and zero forbidden context.
  - Same-scan, canonical path, symbol uniqueness, relation allowlist, span, content hash, one-hop fan-out, chunk count and byte budget controls reject cross-scan, ambiguous, malformed and oversized graph additions.
  - Existing Code QA regression tests and Task-local selector tests pass offline without Provider, Secret, network, remote, production or public effects.
  - Fresh CTO, Security and Quality Reviews all return TARGET_VERDICT PASS on the same exact candidate and benchmark result before integration.
  - Reviewed and integrated trees are exact-equal and one canonical make verify passes; only then may the P2 context benchmark Exit item become ACCEPTED.
required_evidence:
  - Quality-owned pre-Worker dataset, source-unit, oracle, control, budget and out-of-sample split freeze identities.
  - Product unit and controller integration tests covering graph-neighbor uplift, lexical fallback, path and scan containment, relation and symbol ambiguity, budget and UTF-8 accounting.
  - Independent DEV and one-shot validation raw results with equal-universe/equal-budget reconstruction, two-root replay, forbidden-context and false-accept matrices.
  - Exact candidate commit, tree, diff and allowlisted source identities plus offline command, exit, stdout, stderr and bounded cooperative-local effect observations.
  - Fresh exact-candidate CTO, Security and Quality Review receipts and, only after all PASS, integration tree equality plus canonical make verify receipt.
rollback: >-
  Before integration all work remains on the unique P2-061 branch/worktree and
  external Evidence root. A terminal NON_PASS preserves exact Evidence and a
  content-addressed diff before the branch/worktree is removed. An integrated
  regression is rolled back by a non-destructive revert of the unique integration
  commit; no data migration or backfill is involved.
stop_conditions:
  - Any rejected P2 engineering source, candidate, evaluator, fixture, test or formal Evidence is read, compared, restored, copied or reused.
  - Quality cannot freeze the six-task universe, oracle, 512-byte budget, denominator and out-of-sample boundary before Worker product mutation.
  - DEV fails to strictly beat lexical control, regresses any task, admits forbidden context or produces a false accept within four total implementation iterations.
  - The product slice requires analyzer, parser, graph producer, database schema, migration or Provider changes.
  - Candidate, source universe, oracle, budget, denominator or evaluator identity drifts, or two physical roots do not replay byte-exactly.
  - One-shot validation does not strictly beat control, regresses any task, admits forbidden context or would require post-validation repair or a second candidate.
  - Any external effect is nonzero or UNKNOWN, any final Reviewer returns TARGET_VERDICT NON_PASS, or canonical tree equality or make verify fails.
  - The same normalized root cause occurs in two adjacent implementation iterations or the Task budget is exhausted.
forbidden_actions:
  - Read, restore, compare, copy, execute or reuse rejected P2 engineering lineage.
  - Modify analyzer-rust, parser, graph producer, database schema or migrations; create an authority, governance, parser or general Evidence platform.
  - Read out-of-sample oracle bytes before candidate freeze or tune the selector, universe, budget, denominator or acceptance threshold after observing validation.
  - Access network, Provider, Secret, remote, production or public systems; push, fetch, create a PR, release, deploy or enter P3.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain for this Task.
claim_boundary: >-
  A PASS may establish only an offline cooperative-local product-path context
  selection value result on the exact accepted six-task benchmark and exact
  candidate. It does not establish immutable repository custody, hostile-principal
  security, kernel-complete observation, production readiness, Founder P2 Phase
  Gate approval or P3 entry. Activation, documents, hashes and DEV feasibility do
  not themselves create capability credit.
