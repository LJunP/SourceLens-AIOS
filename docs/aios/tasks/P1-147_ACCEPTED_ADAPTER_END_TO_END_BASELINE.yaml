architecture:
  composition_rule: >-
    Each cell must directly execute its accepted adapter and bind that
    execution as input to the Provider and evaluator path. Prompt labels and
    self-reported adapter identifiers are non-authoritative.
  b0: >-
    Execute the accepted B0 conformance adapter, retain its exact execution
    identity, and use the admitted context in direct-model Patch Artifact
    generation.
  b1: >-
    Execute the accepted deterministic finite-tool adapter and its real
    accepted tool actions. Do not misrepresent it as a live model-directed
    tool loop; its frozen output and trace must participate in Provider
    context and independent evaluation.
  b2: >-
    Execute the accepted SourceLens adapter and exact accepted P0
    repository_analysis.scan child; bind the scan output and child receipt
    into Provider context, trace and evaluation.
  provider_output: >-
    Admit only the finite SL-PATCH-IR/1 Artifact population before any write
    or execution. Compile through the accepted P1-055 deterministic compiler.
  execution: >-
    Apply the compiled postimage only in a unique owned disposable repository
    copy, then execute the independent task oracle and frozen tests.
  trace: >-
    Every cell must enter the accepted P1-101 admission, execution, validation,
    result and rollback trace/replay semantics with directly observed
    identities.
quality_freeze:
  offline_preflight:
    - Syntax and import checks pass for every new executable.
    - Exact accepted P1-035, P1-055, P1-101 and P1-129 identities are admitted.
    - B0, B1 and B2 each complete one synthetic local end-to-end composition.
    - Every representative composition proves real adapter execution, finite Patch Artifact admission, disposable application, oracle, tests, trace, replay and rollback.
    - B2 proves one exact accepted P0 repository_analysis.scan child invocation.
    - Negative matrix rejects missing, tampered, reordered, duplicate, cross-bound, path-escaped, symlinked, non-finite and self-reported-only evidence.
    - Synthetic local transport reads zero Secrets, sends zero Provider requests and produces zero false accepts.
acceptance_criteria:
  - Offline preflight passes in full before the sole Secret read or any Provider effect.
  - One strict diagnostic completion automatically enters one non-repeatable 36-cell formal matrix.
  - B0, B1 and B2 each execute exactly 12 eligible formal cells and every cell stays in the denominator.
  - Every formal cell retains exact request, response, accepted-adapter execution, P1-101 trace, finite Patch Artifact, disposable application, oracle, tests and OS-observer identities.
  - Verified success is decided only by the independent evaluator from oracle and test evidence; transport completion never implies task success.
  - Invalid, excluded, failed and successful counts are mutually exclusive and close exactly over 36 cells; failures equal eligible runs without verified success.
  - Report rebuild does not read the original report and reconstructs only from the frozen closed raw Evidence inventory.
  - Independent verification rechecks identity, association, counts, usage, failure taxonomy, adapter participation and Evaluation Protocol fields.
  - Zero VTSR or a negative conclusion remains an admissible research result when the engineering and evidence Gate passes.
  - False accepts, Secret persistence, non-loopback connections and unauthorized external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, structured decision, Goal, Contract and authority identities.
  - Raw offline preflight and isolated negative-case records.
  - One diagnostic and 36 formal request/response receipts with closed inventories.
  - Direct accepted-adapter executions, P1-101 traces, finite Patch Artifacts, oracle/test outcomes and rollback records.
  - Report-independent rebuild input inventory, rebuilt report and independent verifier result.
  - Candidate manifest, recoverable Evidence tag, fresh reviews, tree equality and canonical verify receipt.
rollback:
  strategy: DISPOSABLE_OWNED_REPOSITORY_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical parent, Goal, Founder decision, accepted-input or Contract identity drifts.
  - P1-145 or another rejected engineering lineage would be required.
  - The same normalized root cause occurs in adjacent implementation iterations.
  - Nine total implementation iterations, 48 engineering hours or 8 calendar days are exhausted.
  - Diagnostic is NON_PASS, formal execution is NON_PASS, or formal matrix rerun would be required.
  - Secret bytes enter repository, Evidence, logs, traces, prompts, reviews or Vault.
  - A non-loopback, remote, production or public effect occurs.
  - Any final Reviewer, reviewed/integrated tree equality or canonical make verify is NON_PASS.
  - Phase, P1 Exit Gate or permission boundary changes.
