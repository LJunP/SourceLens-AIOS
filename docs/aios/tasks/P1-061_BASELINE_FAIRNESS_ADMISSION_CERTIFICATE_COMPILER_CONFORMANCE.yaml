acceptance_criteria:
  - exact Contract receives one fresh parallel CTO, Security and Quality PASS round before activation
  - current authority validator passes immediately after activation
  - Quality freezes the declared artifacts before Worker mutation and Worker does not edit Quality paths
  - Quality and Worker independently execute every finite admission constraint
