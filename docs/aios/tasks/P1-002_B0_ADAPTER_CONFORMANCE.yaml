  engineering_hours: 16
  calendar_days: 3
  implementation_iterations_inside_same_task: 2
  measurement_retries: 0
  provider_calls: 0
  network_calls: 0
  new_runtime_services: 0
  new_databases: 0

required_evidence:
  - Task Contract, accepted schema, fixture, oracle and evaluator hashes
  - Quality freeze receipt and ownership map
  - runtime and dependency observation
  - actual commands, argv, cwd, start/end time, exit status and stream hashes
  - positive and controlled-failure RunRecords
  - replay comparison
  - B0 configuration, context, response-format and prerecorded-response bindings
  - Evidence Manifest with closed artifact population and checksums
  - source diff, candidate commit/tree and rollback point
  - full P1-001 regression result
  - CTO, Security and Quality independent review reports

acceptance_criteria:
  - accepted TaskSpec, EnvironmentSnapshot, SystemConfiguration and RunRecord schemas remain byte-identical
  - P1-001 frozen evaluator, oracle, fixtures and evidence remain byte-identical and its verification still passes
  - recorder extension preserves the P1-001 default record type and behavior exactly
  - B0 preflight requires adapter_id B0, loop_limit 1, zero enabled tools and zero tool budget
  - exact issue, ordered context, response format, prerecorded response and configuration identities are hash-bound
  - one positive visible synthetic invocation produces a schema-valid B0 RunRecord and PASS from the frozen B0 conformance evaluator
  - one controlled invalid response is recorded as failure and cannot be promoted to success
  - fresh replay produces byte-equal normalized projection and evaluator verdict
  - Evidence Manifest detects mutation, addition, removal and path escape
  - evidence states live_model_invoked false, provider_calls 0, included_in_vtsr_denominator false and benchmark_claim false
  - no canonical main, inherited workspace, network, Provider, Secret, remote or production effect occurs
  - full repository verification passes
  - CTO, Security and Quality reviews are PASS

failure_criteria:
  - a live model, network, Provider or Secret is required
  - evidence is incomplete, mutable, irreproducible or claim-inflating
  - controlled failure can be promoted to success
  - Worker changes Quality-owned, immutable or forbidden paths
  - accepted P1-001 artifacts or regressions drift
  - completion requires P2 Repository Intelligence or P3 Runtime/Trust work

stop_conditions:
  - budget exhausted without meeting acceptance criteria
  - source, fixture, oracle or evaluator contamination
  - scope, permission, budget or claim expansion required
  - two implementation iterations fail for the same cause without new evidence
  - any forbidden effect or high-severity evidence-integrity issue occurs

completion_rule: >-
  Frozen artifacts, verified evidence, full regression, independent PASS reviews and
  Founder Gate are required. Completion does not authorize a live B0 measurement,
  B1/B2/A0 work, VTSR reporting, main advance, P2/P3 entry, remote or production effects.
