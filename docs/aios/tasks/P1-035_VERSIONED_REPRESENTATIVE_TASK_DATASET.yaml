  deterministic_materializations: 12_OF_12
  exact_commit_tree_replays: 6_OF_6
  base_failure_sanity_checks: 6_OF_6
  declared_archetypes_covered: 6_OF_6
  split_counts_exact: 4_DEVELOPMENT_2_VALIDATION_0_HIDDEN
  mutation_vectors_rejected: 12_OF_12
  network_provider_secret_remote_production_effects: 0

acceptance_criteria:
  - The dataset has one immutable semantic version, one closed manifest, six unique task IDs and exact 4/2/0 development/validation/hidden split counts.
  - Every TaskSpec validates against the accepted task-spec.schema.json without changing that schema.
  - Every source template materializes twice into byte-identical logical source identity with the frozen exact Git commit and tree and a clean worktree.
  - Every base repository executes its issue-specific required command and produces the predeclared failing exit status, proving the task is live rather than already solved.
  - The six tasks cover all six frozen archetypes and the manifest makes no broader representativeness claim.
  - Dataset population, source files, TaskSpecs, recipes and coverage artifacts are hash-bound and symlink/path escape attempts fail closed.
  - All 12 single-mutation negative vectors produce their exact typed failure and no mutation can be reported as PASS.
  - Fresh-clone verification, deterministic replay, rollback verification, P1-001 regression and make verify are PASS.
  - CTO, Security and Quality final independent reviews of the frozen exact candidate are PASS.
  - The Task Gate Evidence uses the fixed P1-safe engineering-artifact-only claim boundary.

failure_criteria:
  - Any TaskSpec cannot be validated or deterministically materialized from tracked dataset bytes.
  - Any source identity, task ID, split, provenance, manifest entry or coverage axis is ambiguous or mutable without a version change.
  - A base task is already passing, cannot execute locally, needs a downloaded dependency or cannot be reproduced twice.
  - The validator accepts a missing, extra, escaped, symlinked, hash-drifted or post-freeze dataset artifact.
  - Dataset construction depends on historical P1-002 through P1-034 implementation or hidden material.
  - Evidence, replay, rebuild, rollback or any final independent review is non-PASS.

stop_conditions:
  - A write occurs outside the exact allowed paths or a forbidden external effect occurs.
  - Goal, Contract, parent commit/tree, accepted schema or P1-001 dependency identity drifts.
  - The objective requires a hidden-set implementation, model/provider execution, new runtime infrastructure, P2/P3 work or a broader permission.
  - Two implementation iterations fail for the same root cause without new engineering evidence.
  - The 16-hour or 3-day budget is exceeded.
  - A real architecture root prevents the clean-room capability from producing runnable engineering output.

evidence:
  required:
    - exact Task Contract and phase-delegated authorization
    - dataset asset freeze receipt and ownership record
    - frozen dataset manifest, file identities and population
    - actual command ledger with argv, cwd, start/end and exit status
    - TaskSpec validation results
    - double materialization commit/tree comparison
    - base-failure sanity-check results
    - 12-vector mutation result matrix
    - P1-001 regression and make verify results
    - candidate commit/tree and source diff
    - replay, fresh-clone rebuild and rollback results
    - closed artifact index and P1-safe Evidence Manifest
    - CTO, Security and Quality independent reviews
    - delegated Task Gate receipt

rollback:
  method: >-
    Before Task Gate, delete the unmerged Task worktree and branch. After local
    main integration, reset by a forward revert of the exact accepted candidate
    integration commit; preserve Evidence and the original candidate Git objects.
  destructive_history_rewrite: false

claim_boundary: P1_EXIT_CAPABILITY_ENGINEERING_ARTIFACT_ONLY_NO_BENCHMARK_AGENT_P2_P3_PRODUCTION_OR_HOSTILE_PRINCIPAL_CLAIM

