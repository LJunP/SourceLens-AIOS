acceptance_criteria:
  - The one machine lint verifies every declared canonical and external accepted-input path, byte length and SHA-256 before Contract review.
  - The one parallel CTO, Security and Quality start-review round returns PASS for these exact Contract bytes before activation.
  - Quality freezes and self-validates source cases, coverage map, expected verdicts, negative cases and oracle before Worker mutation, including both exact manifests and all 80 manifest-reachable leaves without directory discovery.
  - The builder and validator are deterministic local functions and do not read Reviewer, expected-verdict or oracle bytes.
  - All eleven section 6 coverage requirements are present exactly once and every required field has an explicit observed or justified not-applicable state.
  - Both accepted P1-048 source runs produce valid raw complete traces and zero missing coverage requirements; all external paths come only from the frozen Quality card and no free CLI path is accepted.
  - Run A and Run B stable semantic projections are exact canonical-JSON byte equal while required raw physical and duration values remain captured outside the projection.
  - Every mandatory negative control is rejected with zero false accepts and zero unresolved results.
  - No hidden chain-of-thought, private reasoning, Secret or unredacted sensitive content is created or retained.
  - One targeted command reproduces the complete characterization and all negative controls without network or mutation of accepted input Evidence.
  - Formal Trace A and independent Trace B use the same frozen candidate and Quality bytes; the Trace B executor does not read Trace A path, bytes, result or verdict before emitting Trace B.
  - The one candidate manifest binds commit, tree, diff and every Quality, Worker and Integration file using direct byte hashing without digest-output column parsing.
  - Fresh CTO, Security and Quality reviewers return TARGET_VERDICT PASS for the same exact candidate, manifest and targeted result in one review round.
  - Only after Task Gate may the reviewed tree be integrated locally; integrated tree equals reviewed tree and one clean canonical full make verify passes.

required_evidence:
  - exact Goal, route packet, Contract, authority and accepted P1-048 input identities
  - Quality freeze receipt and manifest identities
  - runnable targeted result with eleven-of-eleven coverage, 14-of-14 ordered actions, 19-of-19 commands, 80-of-80 manifest leaves, exact dual-source stable equality and all negative-control verdicts
  - create-once Trace A and independent Trace B raw records, stable projections and artifact manifests
  - candidate commit, tree, direct-byte diff identity and per-file manifest
  - fresh CTO, Security and Quality exact-candidate target verdicts
  - reviewed and integrated tree equality plus canonical make verify result

p1_exit_projection_if_accepted:
  completed_item: 3
  completed_item_count_before: 2
  completed_item_count_after: 3
  strict_completion_percent_after: 37.5
  phase_exit_claim: false

rollback:
  source_level: Never modify accepted P1-048 source or Evidence.
  candidate_level: Preserve Evidence, do not integrate a NON_PASS candidate, and remove only the verified-clean task worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence; never reset or clean.

stop_conditions:
  - Any accepted P1-048 canonical or external path, byte length, SHA-256 or accepted lifecycle drifts.
  - Contract admission needs a second correction or second start-review round.
  - Quality freeze is absent, inconsistent, contaminated or not finished before Worker mutation.
  - Worker does not start within one engineering hour after Contract review entry.
  - No runnable falsifiable targeted command and result exists within four engineering hours.
  - Any section 6 requirement is missing, duplicated, implicit, irreconcilable or represented by an unapproved not-applicable reason.
  - Any free path, recursive discovery, unmanifested leaf, symlink, hardlink, non-regular object or read-time source identity replacement is accepted.
  - Any mandatory negative control is accepted, any false accept or unresolved result exists, or stable semantic projections differ.
  - Hidden chain-of-thought, private reasoning, Secret, external effect or unredacted sensitive content is produced or retained.
  - Accepted P1-048 Evidence, canonical source or a pre-existing object is overwritten, followed, escaped, renamed, deleted or damaged.
  - Candidate mutates after freeze, manifest omits an exact candidate or Quality identity, or any fresh Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical full make verify is NONPASS.
  - Network, Provider, Secret, remote, production, public, P2 or P3 permission is required.

forbidden_actions:
  - modify Goal, Strategic Constitution, Master Execution Protocol, Founder Delegation Policy, Evaluation Protocol, authority validators or P1 Exit Gate
  - mutate accepted P1-048 source or Evidence bytes or promote its accepted claim
  - read, restore, compare, retry, rename or reuse P1-057 or P1-056 engineering assets
  - create successor, replacement, normalization, remediation, closure, feasibility, corrected candidate, second candidate or re-review chain
  - build a generic Agent runtime, model recorder, Provider adapter, shell, sandbox, Supervisor, Root Custody, Strong Isolation or Multi-Agent Runtime
  - network, Provider, Secret, dependency download, remote, production, public, push, pull request or release
  - claim model, Agent, benchmark, VTSR, P1 Exit, production, sandbox or hostile-principal capability

