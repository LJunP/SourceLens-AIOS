acceptance_criteria:
  - Quality freezes one exact six-task dataset identity with four public DEV tasks and two sealed validation tasks before Worker implementation.
  - Actual Worker, Evaluator and orchestrator source bytes are externally bound by path, regular-file type, byte length and SHA-256 before the sealed transaction starts.
  - The execution receipt independently reconstructs the real Git candidate, source manifest and runtime source identities rather than trusting caller-provided candidate strings.
  - Every formal run preserves raw bounded argv, environment, owned process tree, socket observation, filesystem write inventory and exit status sufficient to reconstruct all six zero-effect claims.
  - Lexical baseline and graph treatment use the same source-unit universe, context byte budget, denominator and independently admitted raw transaction.
  - Baseline query timing executes no graph, symbol or other treatment-only computation.
  - The four-task DEV pilot strictly beats the lexical baseline with equal per-task budget, zero forbidden context, byte-exact replay, zero false accepts, zero external effects and two-root equality before candidate freeze.
  - The only sealed six-task validation strictly beats the lexical baseline on the primary metric and does not regress the validation split.
required_evidence:
  - Exact accepted P1 dataset, preregistration and scanner identities plus a Quality-owned six-task freeze and externally bound sealed oracle capsule.
  - Closed source manifests for actual Worker, Evaluator and orchestrator bytes, plus runtime reconstruction against the candidate Git tree.
  - Four-task public DEV pilot Evidence from two physical repository roots with exact baseline and treatment byte budgets.
  - One candidate-freeze receipt proving validation issue and oracle bytes were unavailable to Worker before freeze.
  - One sealed six-task raw transaction, exact replay, complete denominator and independently rebuilt benchmark report.
  - Task-local raw observer receipts and negative controls for process, socket, write-inventory and effect-claim drift.
  - Negative matrix for baseline contamination, undeclared evaluator input, mutation, missing, duplicate, reorder, cross-binding, forbidden context and source-identity drift.
  - One exact candidate and one fresh CTO, Security and Quality final review cycle.
rollback: >-
  Remove only the owned disposable P2-059 worktree and generated P2-059
  Evidence; after canonical integration use non-destructive git revert if
  rollback is required.
stop_conditions:
  - The four-task DEV treatment does not strictly beat the lexical baseline within the four authorized implementation iterations.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Validation oracle or expected output is required to guide Worker implementation.
  - Baseline identity, equal-budget accounting or two-root replay drifts.
  - Target-only computation enters the baseline timing path.
  - Actual executing source bytes or Git candidate identity cannot be independently bound before sealed validation.
  - Raw observer Evidence cannot independently reconstruct all six zero external-effect claims.
  - Any undeclared evaluator input or network, Provider, Secret, remote, production or public effect occurs.
  - The single sealed result does not strictly beat baseline, regresses validation, or would require a rerun or second candidate.
  - Any final Reviewer, tree equality check or canonical make verify is NON_PASS.
forbidden_actions:
  - Read, compare, copy or reuse P2-058 source, candidate, evaluator, fixture, test or formal Evidence as engineering input.
  - Read or reuse any other rejected P2 engineering lineage.
  - Read sealed validation issue, oracle or expected output before candidate freeze.
  - Use a historical baseline-result file as evaluator input or expected answer.
  - Accept caller-asserted candidate or source identity without reconstructing it from Git and exact source bytes.
  - Represent external effects with literal booleans unsupported by raw Task-local observations.
  - Create an authority, parser, validator, governance, Evidence-platform, successor, replacement, correction, normalization, closure, feasibility or remediation Task.
  - Rerun, replace or beautify the single sealed validation.
  - Enter P3, push a remote, or make production or public claims.
claim_boundary: >-
  One cooperative-local offline DEV-first source-bound observed context value
  benchmark only; no P2 Phase completion, production-readiness, UI, model,
  remote or public capability claim follows unless the exact six-task Task Gate
  is accepted.
