    - V14_HARDLINK_TARGET_SYMLINK_HARDLINK_OR_NONREGULAR_FILE_VIOLATION
  replay_case_rule: >-
    R01 changes only candidate_patch_sha256 in the second frozen deterministic
    replay projection, reseals the fixture manifest, and must reach
    REPLAY_MISMATCH after both projections otherwise validate.
  recipe_fields:
    - case_id
    - base_fixture_id
    - target_json_pointer
    - exact_old_value_sha256
    - exact_new_value
    - derived_manifest_reseal_fields
    - expected_verdict
    - expected_reason_code
    - expected_exit_status
    - effect_oracle

