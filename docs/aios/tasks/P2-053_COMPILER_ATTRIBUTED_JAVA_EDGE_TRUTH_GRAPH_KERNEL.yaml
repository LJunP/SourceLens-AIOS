quality_freeze:
  positive_matrix:
    - worker.run resolves to demo/api/Worker.run with the exact attributed descriptor.
    - choose("stable") resolves to Service.choose(String) rather than an ambiguous name match.
    - names.size resolves to java/util/List.size with an external JDK classification.
    - inheritance and implementation edges bind attributed TypeElement identities.
    - adjacent documentation references bind only to the declaration they directly precede.
    - two physically distinct roots produce byte-identical semantic graph projections.
    - independent oracle and worker graph agree on every edge owner, descriptor and classification.
    - raw transactions independently rebuild and replay without worker success fields.
    - the exact inherited P2-041 Knowledge event validates without mutating historical bytes.
  negative_matrix:
    - same simple method name on unrelated owners
    - inherited receiver dispatch
    - overloaded arity
    - overloaded parameter type
    - interface implementation dispatch
    - unresolved receiver
    - compiler diagnostic ambiguity
    - static field owner mismatch
    - instance field owner mismatch
    - documentation comment separated by another declaration
    - source path substitution
    - source mutation
    - manifest mutation
    - scanner executable identity drift
    - compiler executable identity drift
    - missing raw stdout
    - missing raw stderr
    - missing classfile inventory
    - raw transaction reorder
    - semantic graph mutation
    - provenance injected into semantic projection
    - symlink input
    - hardlink input
    - extra inventory member
    - missing inventory member
    - stale replay receipt
    - superficial legacy Knowledge Review
  required_counts:
    physical_repository_roots: 2
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - Full compiler-oracle edge truth matrix passes.
  - Worker graph agrees byte-for-byte with the independent edge truth projection.
  - Two-root semantic projections are byte-identical and root provenance remains separate.
  - Complete raw positive and negative transactions rebuild and replay independently.
  - Every required root-cause regression is directly covered.
  - Founder Knowledge sync compatibility test passes only for the exact frozen legacy event.
  - False accepts, Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes after integration.
required_evidence:
  - Exact Founder source packet, structured Decision, Goal, activation parent, Contract and Task authority identities.
  - Compiler and accepted scanner executable path, type, byte length and SHA-256 identities.
  - Two-root source, manifest, argv, stdout, stderr, diagnostic, classfile and process receipts.
  - Canonical attributed symbol and edge projections plus exact replay receipts.
  - Positive and negative matrix receipt with zero false accepts and external effects.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality Reviews of the same candidate and Evidence bytes.
