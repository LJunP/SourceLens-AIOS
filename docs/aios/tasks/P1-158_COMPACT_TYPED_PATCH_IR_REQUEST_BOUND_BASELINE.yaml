acceptance_criteria:
  - Authority and P1 safety pass before implementation and before the Secret is read.
  - Offline preflight proves accepted P1-129 adapters, P1-149 execution spine and all six representative tasks.
  - The exact formal request schema is exercised through a synthetic local transport with zero Provider requests.
  - All six representative Task Patch IR payloads fit the frozen output ceiling at or below 2048 tokens.
  - Compiler, owned-copy apply, oracle, tests, P1-101 trace/replay, rollback and independent evaluator pass offline.
  - Timeout, HTTP, content, IR, compiler, apply, oracle, test, evaluator, path, symlink and inventory negatives reject with zero false accepts.
  - One no-echo Secret entry starts exactly one 36-request formal matrix with no diagnostics or retries.
  - Every scheduled cell creates request and response-or-failure receipts and remains in the fixed denominator.
  - Ordinary cell failures never abort the matrix and never disappear from raw Evidence.
  - The report is rebuilt without reading the original report and independently verified from frozen raw Evidence.
  - A negative, low or zero VTSR remains eligible for report acceptance when Evidence and reconstruction pass.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, structured Decision, Goal, activation parent, Contract and authority identities.
  - Offline preflight receipt with zero Secret reads, Provider requests and false accepts.
  - Frozen 36-cell request plan and per-cell request, response-or-failure, adapter, Patch IR, compiler, trace, oracle, test, rollback, evaluator and observer receipts.
  - Closed raw Evidence inventory and stable failure taxonomy.
  - Rebuilt and independently verified REPRODUCIBLE_BASELINE_REPORT with reproduction command.
  - Exact candidate commit, tree and manifest plus fresh CTO, Security and Quality reviews.
  - Reviewed-tree/integrated-tree equality and one canonical make verify receipt.
rollback:
  strategy: OWNED_DISPOSABLE_COPY_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical start, Goal, Founder decision, accepted-input or activation-parent identity drifts.
  - P1-156 or any rejected engineering asset is read or reused as an implementation input.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus four same-Task repairs are exhausted.
  - The formal matrix would need a second execution, a second Secret read, more than 36 Provider requests or any retry.
  - Secret leaks, a non-loopback connection occurs, Evidence is damaged, a path escapes or permissions expand.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - P1 Objective, Exit Gate or Phase boundary changes.
forbidden_actions:
  - Read or reuse P1-156 rejected source, diff, fixture, test, response or formal Evidence.
  - Modify accepted P1-101, P1-129 or P1-149 semantics.
  - Let the Provider write files, run shell commands or access the repository directly.
  - Retry an ordinary failed cell or rerun the 36-cell matrix.
  - Persist the Secret or Authorization header in any sink.
  - Modify ZCode, Codex Tools, LaunchAgent, system proxy, ports or user software configuration.
  - Enter P2 or P3.
  - Push or modify a remote.
claim_boundary: >-
  Cooperative-local compact typed-Patch-IR failure-tolerant baseline research
