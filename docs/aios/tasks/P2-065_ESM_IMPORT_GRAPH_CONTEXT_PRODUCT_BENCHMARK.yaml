acceptance_criteria:
  - Every accepted .mjs fixture is chunked and scanned as JavaScript with deterministic MODULE symbols and static relative ESM relations.
  - Local import and re-export resolution is repository-relative, root-independent, same-repository, regular-file-only and fail-closed for escape, symlink, absent, ambiguous, external-package and overlong identities.
  - Persisted ESM relation endpoints both exist in the exact same-scan symbol set and contain no physical repository root.
  - The real Code QA selector can load a graph-related same-scan chunk by exact normalized file path even when that chunk was absent from lexical candidates.
  - Rust, focused backend and complete relevant regression tests pass with no forbidden external effect.
  - Treatment and control use exactly equal within-task UTF-8 byte budgets on every scheduled task and all six accepted tasks remain in the denominator.
  - Treatment macro task-relevant-evidence recall is strictly greater than deterministic lexical retrieval and no task has a negative paired recall delta.
  - Forbidden-context admission is not greater than baseline and exact replay, latency, uncertainty and failure taxonomy are retained.
  - Exactly one post-freeze validation execution is performed and no post-validation tuning occurs.
  - CTO, Security and Quality and Evaluation independent candidate reviews all return PASS before canonical integration.
required_evidence:
  - Exact source commit, tree, Contract, branch, worktree, dependency, toolchain and external-effect identities.
  - Raw scanner output and deterministic two-root replay for positive and negative ESM fixtures.
  - Focused and full relevant Rust and Spring test commands with stdout, stderr, exit status and duration.
  - Frozen task-relevant evidence units, per-task UTF-8 byte budgets and ordered four-development/two-validation split before outcomes.
  - Raw treatment and control selections, metrics, paired deltas, bootstrap interval, exact sign-flip sensitivity, forbidden-context counts and latency for all six tasks.
  - Exact one-candidate manifest, rollback evidence and independent CTO, Security and Quality and Evaluation receipts.
rollback: >-
  Abandon the Task branch or revert only the exact reviewed P2-065 candidate
  integration commit. Preserve immutable Evidence; do not modify accepted
  dataset, preregistration, rejected P2 lineage, P2 Gate facts or the long-term
  Goal.
stop_conditions:
  - Canonical source, Founder decision, accepted preregistration or dataset identity drifts before the corresponding freeze.
  - Product implementation requires a path, external effect, dependency download, Phase change or permission outside this Contract.
  - Task-relevant evidence units or byte budgets cannot be frozen before treatment outcome inspection.
  - Any validation task, failed task or invalid result is removed from the complete six-task denominator.
  - Treatment and control byte budgets differ within any task or forbidden-context admission exceeds baseline.
  - The single candidate is frozen, the two implementation iterations are consumed, or a post-validation implementation change is requested.
  - A high-severity source-identity, path-containment, evaluator-independence, replay or rollback blocker remains open.
forbidden_actions:
  - Read, compare, copy, execute or reuse rejected P2 engineering, candidate, held, hidden or evaluator lineage.
  - Read validation reference-solution patch bytes before the post-freeze validation transaction.
  - Modify the accepted P1-219 preregistration, accepted dataset manifest, task denominator, oracle, primary metric or Gate threshold after outcomes.
  - Use regex-only repository-wide guessing as the authority for ESM graph edges.
  - Persist an absolute repository root, cross-scan edge, missing endpoint or external package as an internal ESM module relation.
  - Access network, Provider or Secret; write remote, production or public state; push, create a PR or release.
  - Enter P3, claim P2 completion without accepted Evidence, or terminate the project or long-term Goal because this Task stops.
claim_boundary: >-
  One offline cooperative-local P2 product Task may add bounded .mjs admission,
  parser-derived repository-relative ESM graph context and exact same-scan Code
  QA retrieval, then compare it with deterministic lexical retrieval on the
  complete accepted six-task sample under equal UTF-8 byte budgets. Task
  activation is not capability progress; Task failure cannot terminate P2, the
  SourceLens project or the active long-term Goal; P3 and all external effects
  remain unauthorized.
