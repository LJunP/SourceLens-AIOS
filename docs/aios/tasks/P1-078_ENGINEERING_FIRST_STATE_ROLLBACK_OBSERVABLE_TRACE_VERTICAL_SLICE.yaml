acceptance_criteria:
  - The exact Founder packet, baseline, Goal, authority documents and validators remain byte-identical.
  - One feasible, self-tested Quality-owned acceptance set is frozen exactly once before Worker source write.
  - Every acceptance invariant depending on a host primitive has retained direct probe Evidence.
  - Worker changes only its SUT, trace producer and runtime-harness scope.
  - Run A and physically independent Run B both pass from the same frozen candidate and Quality inputs.
  - Every SUT and evaluator action is present in the correctly typed lifecycle ledger.
  - The disposable Git worktree returns to the exact frozen logical state with truthful physical-transition Evidence.
  - Stable projections are byte-equal after only predeclared nonsemantic normalization.
  - Every mandatory negative case is rejected with zero false accepts.
  - Network, Provider, Secret, remote, production and public effects remain false.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes.
  - Reviewed tree equals integrated tree and one canonical full make verify passes after integration.

