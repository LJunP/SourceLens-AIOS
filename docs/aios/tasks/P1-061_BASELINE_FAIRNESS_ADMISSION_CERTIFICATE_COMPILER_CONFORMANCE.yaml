objective: >-
  Implement one deterministic local compiler and two independently authored
  validators for a closed Baseline Fairness Admission Bundle. For fully
  enumerated B0, B1 and B2 configuration cells, the compiler emits only an
  ADMIT or REJECT certificate with reason codes proving common TaskSpec,
  source, environment, evaluator, repetition and budget bindings and explicit
  treatment differences. A canonical-readiness mode must inspect the accepted
  P1-035 dataset and truthfully report the exact missing inputs that prevent a
  real B0/B1/B2 schedule today.

why_now: >-
  P1 Exit Gate item 4 is NOT_COMPLETE. The current canonical repository has
  accepted TaskSpecs but no matching environment instance or real B0/B1/B2
  configurations. This Task converts that readiness gap into runnable,
  falsifiable local engineering without executing an adapter or model. It is
  the final permitted provider-free prerequisite; PASS does not complete item
  4 and the next decision must concern real Provider/model execution rather
  than another offline prerequisite.

