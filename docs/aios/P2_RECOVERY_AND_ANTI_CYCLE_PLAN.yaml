root_causes:
  - id: PROOF_INFRASTRUCTURE_PRECEDED_PRODUCT_VALUE
    statement: Evidence, isolation and governance mechanisms were repeatedly built before the smallest representative product-value experiment was stable.
  - id: REPRESENTATIVENESS_FROZEN_TOO_LATE
    statement: Dataset representativeness, baseline semantics and independent unit definitions were challenged after substantial task construction instead of before implementation.
  - id: ALL_IN_ONE_TASK_SCOPE
    statement: Multiple tasks combined dataset curation, runtime isolation, product execution, provenance, statistics and final evaluation into one failure surface.
  - id: REVIEW_FINDINGS_NOT_GATE_RELEVANCE_FILTERED
    statement: Reviewer findings that did not determine the P2 Exit Gate were allowed to extend preactivation and repair chains.
  - id: GOVERNANCE_ACTIVITY_MISREAD_AS_PROGRESS
    statement: Large governance and evidence deltas were observable while accepted P2 capability and product change remained zero.
  - id: NO_ACCEPTED_MILESTONE_CHECKPOINTS
    statement: Task succession was driven by terminal task outcomes instead of requiring an accepted delivery milestone before advancing the route.

progress_model:
  strict_gate:
    rule: BINARY_ACCEPTED_GATE_ONLY
    current_percent: 0
    allowed_percent_values:
      - 0
      - 100
  delivery_milestones:
    - id: P2_RECOVERY_BASELINE_ACCEPTED
      percent: 25
      acceptance: Representative benchmark foundation and an Evaluation-Protocol-conformant simple retrieval baseline are independently accepted.
    - id: P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED
      percent: 70
      acceptance: A nonempty product-source context-selector change strictly beats the accepted baseline on the frozen DEV set without regression.
    - id: P2_RECOVERY_FORMAL_HELD_MATRIX_COMPLETE
      percent: 85
      acceptance: The predeclared held matrix completes once with closed raw evidence, independent evaluation and no dataset, metric or candidate drift.
    - id: P2_EXIT_GATE_ACCEPTED
      percent: 100
      acceptance: CONTEXT_BENCHMARK_BEATS_SIMPLE_RETRIEVAL_BASELINES is ACCEPTED in canonical strict Phase Gate evidence.
  zero_credit_activities:
    - governance_document_created
    - validator_or_schema_created
    - review_or_receipt_created
    - evidence_inventory_created
    - time_or_budget_consumed
    - task_terminal_non_pass
    - nonintegrated_candidate
  current_delivery_percent: 0

