quality_freeze_rule: >-
  After Task activation and before Worker implementation, a non-Worker Quality
  Asset Author freezes the exact Trace schema, action plan, normalized identity
  projection, reason-code precedence, independent evaluator, negative vectors,
  ownership map and create-once verdict rules. Expected values must be derived
  from the accepted selected control and Evaluation Protocol, not from Worker
  output. The freeze receipt binds every Quality byte and the physical author.
  The final Quality reviewer must be a fresh physical Agent distinct from the
  Quality Asset Author, evaluator author, Worker and owner.

trace_contract: >-
  The Trace records observable execution only and never hidden chain-of-thought.
  Every predeclared event category required by Evaluation Protocol v1.1 Section
  6 is present or carries an explicit frozen not_applicable reason. Events have
  a unique ordinal, event type, run/task/source/environment/tool identities,
  bounded argv and logical cwd, start/end observation, exit code or signal,
  stdout/stderr SHA-256 and byte lengths, mutation or patch identity, test or
  verifier result, stop reason, prior-event hash and event hash. The terminal
  Trace root covers the closed event population; omission, duplication,
  reordering, substitution or post-hoc exclusion fails closed.

source_environment_and_tool_binding: >-
  Before any control action, formal execution verifies the exact frozen
  candidate commit and tree, clean task worktree, a closed manifest of every
  executed Task-local source byte, accepted dataset/TaskSpec/base identities,
  a P1-011 source-bound Environment Snapshot, and every execution tool's
  supplied absolute path, realpath, SHA-256, byte length, mode, version and
  architecture. Declared target runtime and observed host execution tools are
  separate fields and may never be presented as the same fact. Formal Evidence
  retains the pre-evaluation binding and actual observed identities.

execution_flow:
  - Materialize the selected accepted source into a uniquely owned disposable repository and verify exact base commit, tree and clean state.
  - Capture and verify a P1-011 source-bound Environment Snapshot without changing accepted P1-011 bytes.
  - Run the issue-specific base test and retain its exact expected failure; run the base regression test and require PASS.
  - Apply only the accepted P1-035 reference patch, verify exact patch and changed-path scope, then require issue-specific and regression tests PASS.
  - Run the frozen independent Quality evaluator without trusting a Worker verdict.
  - Roll back the disposable repository to the exact base commit/tree and clean state.
  - Repeat from a second fresh materialization and require byte-equal normalized semantic projection while retaining physical paths and wall-clock observations outside that projection.

runtime_and_process_rule: >-
  No arbitrary shell, PATH lookup, host executable override or inherited host
  environment is allowed. Every child uses a frozen absolute executable and
  argv array, bounded logical cwd, replacement allowlist-only environment,
  bounded stdout/stderr and timeout, shell=false and process-group termination
  where supported. NODE_BIN, NODE_OPTIONS, NODE_PATH, HOME, TMPDIR, dynamic
  loader variables, tokens, Provider and Secret variables are rejected before
  spawn. Exit zero alone never proves PASS.

