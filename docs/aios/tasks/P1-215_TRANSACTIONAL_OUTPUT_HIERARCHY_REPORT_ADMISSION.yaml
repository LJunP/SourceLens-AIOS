  - Fresh Quality Reviewer P1-215
stop_conditions:
  - Any final Reviewer TARGET_VERDICT NON_PASS.
  - A second candidate or post-freeze correction would be required.
  - A rejected path produces non-zero filesystem delta.
  - Immutable P1-207 Evidence changes or a formal rerun would be required.
  - Provider, Secret, network, remote, production or public effect occurs.
  - Reviewed and integrated tree differ.
  - Canonical make verify returns NONPASS.
  - Phase, Exit Gate or permission boundary changes.
forbidden_actions:
  - Read, restore, compare, copy or reuse P1-213 rejected engineering assets.
  - Modify, supplement, delete or rerun P1-207 immutable formal Evidence.
  - Create an authority, parser, validator or Evidence-platform pretask.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain.
  - Freeze a second candidate or conduct a review-correction cycle.
  - Read a Secret or call any Provider or network endpoint.
  - Enter P2 or P3.
  - Push or modify a remote.
claim_boundary: >-
  Cooperative-local pure-offline transactional report admission and deterministic
  reconstruction of the immutable P1-207 raw formal result only. This Task does not
