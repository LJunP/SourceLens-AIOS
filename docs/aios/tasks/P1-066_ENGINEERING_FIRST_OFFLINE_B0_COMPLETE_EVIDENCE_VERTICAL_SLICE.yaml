    - required action schedule and observable command fields
    - independent evaluator rules and stable semantic projection
    - negative cases for schema, identity, path, tamper, substitution, rollback and external effects

minimal_safety_invariants:
  - Canonical source is never a run materialization or patch target.
  - The adapter admits only exact bytes accepted by compileFiniteTypedPatchIr and never executes proposal text, free-form code, a diff, an AST or a module supplied by the result.
  - Each run uses a fresh task-owned disposable repository and a fresh task-owned Evidence root.
  - Input and Evidence leaves are contained, regular, non-symlinked and identity-bound; pre-existing objects are not overwritten or cleaned.
  - Commands are fixed local Node and Git invocations with fixed argv, cwd, timeout and minimal non-secret environment.
  - Run B independently reexecutes frozen inputs and does not consume Run A path, receipt or verdict.
  - Every mutating run restores exact base source bytes, commit/tree and clean state.
  - Network, Provider, Secret, remote, production and public effects remain false.

acceptance_criteria:
  - The exact accepted REP-001 TaskSpec, source template, tests, finite compiler and IR10 result identities are verified before materialization or execution.
  - The result envelope, TaskSpec, Environment Snapshot and System Configuration are closed and mutually bound; missing, duplicate, malformed or unknown fields fail closed.
  - IR10 is admitted by the accepted compiler as CORRECT_END_START; unsupported or identity-drifted IR rejects before source mutation or child start.
  - Base issue test fails with the frozen issue assertion and base regression passes; after finite postimage admission both issue and regression tests pass.
  - Observable Evidence records action, argv-equivalent, cwd-equivalent, exit/signal, duration, raw stdout/stderr length and SHA-256, source and input identities, evaluator outcome and rollback.
  - Environment/config mismatch, duplicate or missing result, unknown member, malformed schema, hash/length drift, path/type/symlink, unsupported IR, cross-run substitution, Evidence tamper, rollback omission and forbidden external-effect requests all reject with zero false accepts.
  - Fresh Run A and independent Quality Run B use distinct disposable roots, retain distinct physical Evidence and produce exact byte-equal predeclared stable projections.
  - Rollback restores exact source bytes, frozen base commit/tree and clean state.
  - Targeted verification and accepted P1-035/P1-055 regressions pass.
  - Fresh CTO, Security and Quality reviewers return TARGET_VERDICT PASS for one exact candidate and its actual runnable Evidence; a correctable first-cycle finding may receive one same-Task repair and one final review cycle.
  - After Task Gate, the reviewed tree is integrated locally, integrated tree equals reviewed tree and one canonical full make verify passes.

required_evidence:
  - exact Goal, Phase packet, Contract, accepted input and candidate identities
  - Quality Freeze manifest and ownership record
  - Run A and independent Run B raw action/stream records and stable projections
  - evaluator verdicts, negative-case outcomes and zero-false-accept count
  - source, environment, system configuration, result and compiler bindings
  - exact rollback receipts and distinct materialization identities
  - fresh CTO, Security and Quality exact-candidate verdicts
  - reviewed/integrated tree equality and canonical make verify result

rollback:
  run_level: Restore exact frozen source bytes in the disposable materialization, verify base commit/tree and clean state, and remove only objects proven task-owned.
  candidate_level: Do not integrate a final NON_PASS candidate; preserve Evidence and recoverable Git identity.
  integrated_level: Use non-destructive git revert of the exact integration commit; never reset or clean.

stop_conditions:
  - A terminal or rejected engineering lineage must be read, restored, compared, copied or reused.
  - The finite result ceases to be exact, bounded or non-executable data.
  - Invalid input reaches mutation or child start, or any external effect occurs.
  - Evidence, canonical source or a pre-existing object is overwritten, damaged, followed, renamed, deleted or cleaned.
  - Run A or Run B cannot be reproduced, stable projections differ, false accepts are nonzero or rollback is not exact after the bounded same-Task repair allowance.
  - The second formal review cycle returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or the one post-integration canonical make verify returns NONPASS.
  - The Task requires network, Provider, Secret, remote, production, public, P2/P3, critical-risk acceptance or an irreversible action.

forbidden_actions:
  - Read, restore, compare, copy or reuse any P1-063, P1-064 or other terminal/rejected engineering source, fixture, test, candidate, diff or implementation Evidence.
  - Repair, integrate or rereview P1-064, or start P1-065 under the stopped route.
  - Build another authority kernel, governance foundation, custom source lexer/parser, sandbox platform, Agent Runtime, Supervisor, Root Custody or Multi-Agent Runtime.
  - Execute proposal text, free-form/untrusted code, arbitrary shell, dynamic module targets or result-controlled argv/cwd/env/path.
  - Configure or use an API key, network, Provider, Secret, remote, production or public effect.
  - Push, open a PR, release, modify a remote, enter P2/P3 or change the P1 Objective/Exit Gate.
  - Count documents, hashes, manifests, reviews or administrative changes as capability progress.

