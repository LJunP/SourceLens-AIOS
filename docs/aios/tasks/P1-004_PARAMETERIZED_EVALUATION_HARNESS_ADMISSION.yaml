admission_manifest_contract:
  quality_owner: Quality and Evaluation Agent
  schema_path: evaluation-harness/fixtures/admission/schema/admission-manifest.schema.json
  positive_manifest_path: evaluation-harness/fixtures/admission/manifests/positive.json
  envelope:
    required_fields:
      - schema_version
      - payload
      - payload_sha256
    unknown_fields: forbidden
    nested_unknown_fields: forbidden_by_closed_schema
  canonicalization:
    rule_id: P1_004_CANONICAL_JSON_LF_PAYLOAD_HASH_V1
    canonicalizer_path: evaluation-harness/evaluator/schema-validator.mjs
    canonicalizer_export: canonicalJson
    parser_input: UTF8_JSON_WITH_EXACTLY_ONE_TRAILING_LF_AND_NO_BOM
    duplicate_object_member_names: rejected_by_recanonicalization_mismatch
    canonical_file_bytes: canonicalJson(parsed_envelope) followed by one LF
    payload_hash_preimage: canonicalJson(parsed_envelope with payload_sha256 field completely omitted) followed by one LF
    payload_hash_algorithm: SHA-256
    self_reference_rule: payload_sha256 is completely omitted from its own hash preimage
    verification_order:
      - reject invalid JSON or schema
      - require input bytes equal canonical_file_bytes
      - compute payload hash from payload_hash_preimage
      - compare computed hash with payload_sha256
      - verify the Quality freeze inventory hash and byte length of the complete manifest file
  exact_reference_map:
    task_spec: evaluation-harness/fixtures/admission/visible/task-spec.json
    environment_snapshot: evaluation-harness/fixtures/admission/visible/environment-snapshot.json
    system_configuration: evaluation-harness/fixtures/admission/visible/system-configuration.json
    context: evaluation-harness/fixtures/admission/visible/context.json
    response_format: evaluation-harness/fixtures/admission/visible/response-format.json
    controlled_failure: evaluation-harness/fixtures/admission/visible/controlled-failure.json
    controlled_failure_result: evaluation-harness/fixtures/admission/visible/controlled-failure-result.json
    expected_result: evaluation-harness/fixtures/admission/oracle/expected-result.json
    oracle: evaluation-harness/fixtures/admission/oracle/oracle.json
    adapter_entrypoint: evaluation-harness/adapters/harness_stub/adapter.mjs
    evaluator_entrypoint: evaluation-harness/evaluator/evaluate.mjs
  execution_closure_exact_files:
    adapter:
      - evaluation-harness/adapters/harness_stub/adapter.mjs
      - evaluation-harness/evaluator/schema-validator.mjs
    evaluator:
      - evaluation-harness/evaluator/evaluate.mjs
      - evaluation-harness/evaluator/schema-validator.mjs
  path_rules:
    - every reference must equal the repo-relative POSIX path for its exact reference-map key
    - absolute paths, empty segments, dot segments, parent traversal, backslashes, NUL bytes and percent-encoded path substitutions are rejected
    - lstat must prove every path component from repository root through the final file is not a symlink
    - the final object must be a regular file
  output_contract:
    allowed_parent: evaluation-harness/recording/p1-004-admission-evidence
    leaf_name_rule: one normalized run-id segment containing only ASCII letters, digits, hyphen and underscore
    creation_rule: parent exists, contains no symlink component, and the leaf does not exist before create-once mkdir
    escape_or_existing_effect: reject before any run artifact is written
  consumed_byte_binding:
    - the parent harness must read each JSON input once into a Buffer after identity verification and parse that same Buffer
    - immediately before each adapter or evaluator spawn, record SHA-256 and byte length for every file in that execution closure and every referenced input passed in argv
    - argv must contain the same normalized exact paths whose identities were verified
    - immediately after child termination, recompute and record the same identities before accepting its output
    - pre-spawn and post-execution identities must equal each other and the Quality freeze inventory
    - any mismatch invalidates the run and stops the Task
    - this is a cooperative-local bounded observation and does not claim hostile-principal race resistance

