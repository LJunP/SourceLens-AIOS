acceptance_criteria:
  - Full offline preflight passes before any Secret read or Provider request.
  - Offline preflight proves real P1-149 execution-spine composition, accepted P1-101 trace/replay, accepted P1-129 adapters, independent evaluator behavior and a complete negative matrix with zero false accepts.
  - Up to three distinct Chat Completions diagnostic shapes are frozen before the no-echo Secret read and none contains text.format.
  - The first strict diagnostic HTTP 2xx completion immediately activates one and only one 36-cell formal matrix.
  - All thirty-six cells remain in the denominator and no result is replaced, rerun or beautified.
  - Every cell retains exact request, response, execution-spine, patch, trace, oracle/test, rollback, evaluator and OS observer identities.
  - Independent rebuild does not read the generated report as input and independent verification rejects missing, extra, mutated, reordered, duplicate, cross-bound, symlink or path-escape Evidence.
  - False accepts, non-loopback connections, Secret persistence, remote, production and public effects equal zero.
  - A reproducible baseline report satisfying Evaluation Protocol v1.1 is retained even when VTSR is neutral or zero.
  - Focused verification and Task-worktree make verify pass before one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, structured Decision, Goal, activation parent, Contract and authority identities.
  - Full offline preflight and negative-matrix receipts created before Secret access.
  - Diagnostic request/response and OS observer receipts for every consumed diagnostic slot.
  - Closed raw formal Evidence inventory for all thirty-six cells.
  - Independent rebuild, independent verification and reproducible report identities.
  - Exact candidate manifest, fresh final reviews, tree equality and canonical make verify receipt.
rollback:
