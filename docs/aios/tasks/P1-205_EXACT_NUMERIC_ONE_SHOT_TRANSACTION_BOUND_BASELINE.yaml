architecture_constraints:
  - Parse and validate integer fields from raw JSON numeric lexemes before any IEEE-754 conversion.
  - Reject fraction, negative, underflow, overflow, unsafe integer, noncanonical integer and checked-addition overflow with stable typed reasons.
  - Bound JSON input bytes, nesting depth, member count and parser resources, with distinct syntax, resource, duplicate-key and internal-failure reasons.
  - Route every post-effect response through one typed terminal closure that retains its full reservation.
  - Bind the trusted request digest from the frozen Contract and authority, never from caller-supplied expected identity.
  - Use a Task-scoped atomic create-once ledger with consumed state to close duplicate reservation, replay and concurrent double consumption.
  - Run synthetic and formal responses through the same production entrypoint.
  - Bind accepted P1-149 and P1-101 identities through request, response, transaction, Patch IR, compiler, apply, oracle, tests and rollback.
  - Keep exactly 36 scheduled cells in a closed mutually exclusive result taxonomy.
  - Keep the independent evaluator independent of Worker fixtures, expected success fields and production implementation.
preformal_gate:
  synthetic_cells: 36
  false_accepts_max: 0
  provider_requests: 0
  secret_reads: 0
  task_worktree_make_verify: PASS_REQUIRED
  frozen_candidates: 1
  reviewer_target_verdicts:
    cto: PASS_REQUIRED
    security: PASS_REQUIRED
    quality: PASS_REQUIRED
  source_mutation_after_pass: FORBIDDEN
acceptance_criteria:
  - All exact numeric, parser resource and checked-addition boundary tests return the predeclared typed verdict.
  - Every synthetic success, failed, empty, truncated, non-2xx and malformed response uses the production response entrypoint and typed terminal closure.
  - Trusted request identity cannot be coherently rebound by caller-controlled bytes and digest.
  - Duplicate reservation, process replay and concurrent double consumption are rejected by the atomic ledger.
  - Accepted P1-129 adapters, P1-149 execution spine and P1-101 trace/replay participate with exact identity.
  - The complete filesystem and OS loopback-observer negative matrix has zero false accepts.
  - The unique preformal candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS before any Secret or Provider effect.
  - One strict diagnostic and exactly one 36-cell formal matrix stay within all request, token, response-byte and cost caps without retry.
  - A raw-Evidence-only independent reconstruction produces a complete report and fixed 36-cell denominator without trusting Worker success fields.
  - Formal results preserve INVALID, EXCLUDED, FAILED and SUCCESSFUL as mutually exclusive closed categories; a negative or zero VTSR remains valid.
  - One final exact candidate and frozen formal Evidence receive fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Goal, Founder packet, structured Decision, activation parent, Contract and authority identities.
  - Exact numeric/parser boundary matrix and typed terminal-closure receipts.
  - Atomic one-shot ledger reservation, consume, replay and concurrency receipts.
  - Synthetic 36-cell full-pipeline rehearsal and negative matrix with zero false accepts and zero external effects.
  - Accepted P1-129/P1-149/P1-101 composition and replay identities.
  - Preformal candidate manifest and fresh CTO, Security and Quality reviews of the same exact bytes.
  - Diagnostic plus unique formal 36-cell raw request/response, transaction, trace, execution-spine, oracle, tests, rollback and observer Evidence.
  - Raw-Evidence-only report reconstruction, closed inventory, aggregate counts and reproduction command.
  - Final candidate manifest, final fresh reviews, reviewed/integrated tree equality and canonical make verify result.
rollback:
  strategy: TASK_SCOPED_ATOMIC_LEDGER_AND_OWNED_DISPOSABLE_REPOSITORY_ROLLBACK_THEN_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical start, Goal, Founder packet, structured Decision or accepted-input identity drifts.
  - Any P1-202 or other rejected engineering asset is read or reused as implementation input.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus four pre-formal same-Task repairs are exhausted.
  - Any preformal Reviewer returns TARGET_VERDICT NON_PASS.
  - Any Secret or Provider effect occurs before the complete preformal Gate passes.
  - Formal execution returns NON_PASS or would require source mutation or a second matrix.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, Secret leaks, or any non-loopback, remote, production or public effect occurs.
  - The P1 Objective, Exit Gate, Phase boundary, scope, budget or permissions change.
forbidden_actions:
  - Read, restore, compare or reuse P1-202 or any other rejected source, candidate, fixture, test, matrix, evaluator or oracle.
  - Modify the common authority validator, parser or schema semantics.
  - Read a Secret or call a Provider before the complete preformal Gate passes.
  - Modify source, tests, fixtures, oracle or evaluator after preformal PASS.
  - Rerun, replace or beautify the formal 36-cell matrix.
  - Build a generic authority platform, Supervisor, Trust Runtime or strong-isolation system.
  - Enter P2 or P3.
  - Push or modify a remote.
  - Modify ZCode, Codex Tools, LaunchAgent, system ports, proxy or user software configuration.
