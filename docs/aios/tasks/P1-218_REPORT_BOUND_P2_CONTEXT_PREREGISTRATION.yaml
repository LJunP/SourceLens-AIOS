architecture_constraints:
  - Bind the accepted P1-217 report by exact path, byte length, SHA-256, acceptance commit and tree.
  - Freeze the future experiment before any P2 implementation or execution.
  - Treat the accepted zero-of-thirty-six P1 result as a truthful baseline artifact, not as evidence that a P2 context strategy will improve performance.
  - Use a closed schema and reject missing, extra, duplicate, mutated, stale or cross-bound identities.
  - Do not read or reuse rejected P2 engineering assets.
  - Do not enter P2 or create Provider, Secret, network, remote, production or public effects.
