acceptance_criteria:
- Before any product-source write, one create-once architecture and parameter freeze proves the exact full-source scan boundary, JDK 17 public compiler APIs, persisted-graph schema, production selection API, B1 seed parity and no more than two deterministic parameter sets.
- The graph builder receives complete normalized Java compilation units only from the authority-bound repository root during AnalysisService scan, and never compiles or reconstructs CodeChunk candidates at query time.
- Every persisted Java package, type and member owner is declaration-proven; every import, invocation, inheritance or reference relation resolves from one attributed Element to one attributed Element; simple-name broadcast, reference-site ownership and unresolved or ambiguous edges are absent.
- CodeGraphPersistenceService persists the attributed graph and the real CodeQaController plus CodeQaRetrievalService path consumes the persisted graph together with accepted CodeChunk records through the same production selection API used by the DEV evaluator.
- Persistence integration uses only one fresh process-local H2 in-memory test database destroyed at process exit, with mechanical proof that no existing, user, canonical, Codex-control-plane or operational datasource is reachable or modified.
- One exact candidate simultaneously and strictly exceeds accepted B1 macro precision 0.15595238095238093, macro recall 0.8958333333333334 and macro MRR 0.8229166666666666, with zero per-task recall regressions under top-k 10 and the 131072-byte UTF-8 budget.
- Product tests pass from fresh compiler and Surefire roots and two OS-sandboxed DEV replays are byte-exact with full source-to-class, full-source-to-graph, graph-to-chunk and per-replay transaction provenance.
- AF_INET and AF_INET6 network probes fail closed, OS write confinement holds, evaluator-bound HELD/oracle requests fail before access, HELD reads and executions remain zero, and all external effects remain false.
- CTO, Security and Quality/Evaluation independently accept the exact candidate and closed reviewer manifest before the Master Task Gate accepts it.
required_evidence:
- Create-once architecture freeze, two-or-fewer parameter-set freeze and exact accepted B1 parity receipt created before any product-source write or DEV result access.
- Exact authority-bound repository, worktree and Evidence roots; JDK, JavaCompiler, JavacTask, Trees, Elements, sandbox-exec and sandbox-profile identities; AF_INET and AF_INET6 deny probes; OS write-confinement transcript.
- Full-source compilation-unit inventory with pre-read and post-read path, byte length and SHA-256; attributed declaration and edge inventory; persisted-graph inventory; graph-to-selected-chunk traceability for every graph substitution.
- Fresh process-local H2 in-memory database profile, connection identity, lifecycle transcript and post-exit destruction proof, plus negative proof that all existing or operational datasource inputs are unreachable.
- Fresh compiler, test, replay and negative roots with explicit classpath, sourcepath, annotation-processing state, exact source-to-class mapping, runtime binaries, argv, cwd, closed environment, exit, stdout, stderr and write/post-state inventories.
- Two sandbox-exec deny-network DEV replay transactions binding exact accepted P2-069 DEV cards and B1 results, exact candidate parameters, per-task rankings, selected paths/bytes, precision, recall, reciprocal rank, macro metrics and byte-exact comparison.
- Real production-bound negative tests for query-time compilation, benchmark-only bridge use, ambiguous and unresolved symbol ownership, simple-name broadcast, symlink input, output overwrite, root escape, HELD request, oracle field request, AF_INET and AF_INET6 access.
- Exact candidate commit/tree, changed-file inventory, clean worktree, reviewer raw manifest binding every required leaf directly, rollback instructions and independent CTO, Security and Quality/Evaluation verdicts.
rollback: >-
  Do not integrate a NON_PASS candidate; preserve its exact terminal Evidence, leave the
  accepted P2-069 baseline and all prior terminal accounting unchanged, keep formal
  HELD locked, and retire only the short-lived P2-078 Task resources through supported
  lifecycle operations without deleting canonical or accepted Evidence.
stop_conditions:
- Stop before product-source write if the architecture/parameter freeze, exact authority roots, accepted P2-069 identities, B1 parity, JDK17 public compiler boundary, fresh H2-only database boundary, AF_INET/AF_INET6 probes, OS write confinement or evidence-root closure does not PASS mechanically.
- Stop if any P2-070 through P2-077 rejected branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused as implementation input.
- Stop if any HELD source, payload, oracle, result or build output is opened, or if a DEV task ID, task-specific branch, oracle label or post-result tuning influences the implementation.
- Stop if any existing, user, canonical, Codex-control-plane or operational database is reachable or modified, or if the process-local H2 database survives process exit.
- Stop if any network, Provider, Secret, remote, production, public, deletion or out-of-authority filesystem effect is requested or observed.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse P2-070 through P2-077 rejected engineering lineage, restore a rejected branch, or treat terminal accounting as implementation input.
- Compile or reconstruct candidate chunks at query time, use a benchmark-only evaluator bridge, broadcast by simple name, treat reference sites as owners, or persist unresolved or ambiguous graph edges.
- Modify the accepted source pack, DEV/HELD split, query, corpus, oracle, metric, threshold, top-k, byte budget, schedule or B1 result; open HELD; tune after results; or rerun to pass.
- Connect to or modify any existing datasource; create any database except one fresh process-local H2 in-memory test database destroyed at process exit.
- Execute Maven, JVM tests or evaluator processes with network enabled; all builds and replays must use exact offline inputs plus hash-bound sandbox-exec deny-network confinement.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production, public release or deletion.
- Create a successor, replacement, remediation, normalization, closure or further Product DEV retry under the unchanged acceptance Gate; enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for one exact
  JDK17 scan-time compiler-attributed persisted-graph Product Selector DEV candidate.
  PASS may raise delivery progress to 70% and unlock only the existing formal HELD slot;
  it does not establish formal HELD performance, strict P2 Exit progress, P3 entry,
  production readiness or Long-term Goal completion. NON_PASS consumes the final Product
  DEV slot, keeps delivery at 25%, strict progress at 0%, formal HELD locked, P2 and the
  Long-term Goal active, and permits no further Product DEV retry handoff under the
  unchanged Gate.
