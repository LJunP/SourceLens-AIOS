objective: >-
  Implement and execute one clean-room, provider-free complete-observable-trace
  vertical slice for accepted visible synthetic control SL-P1-REP-001. Bind the
  actual executing host binary and executing architecture before any child
  process or source mutation, capture every observable field required by
  Evaluation Protocol v1.1 section 6, independently replay the same frozen
  inputs in a distinct materialization, prove stable projection equality,
  reject the frozen negative matrix with zero false accepts, and prove exact
  rollback.

why_now:
  - Canonical P1 strict completion is 4/8 (50%) and complete observable trace remains NOT_COMPLETE.
  - Accepted P1-035, P1-048, P1-055, P1-066 and P1-071 provide visible synthetic inputs and accepted local execution patterns without supplying a complete-trace Gate claim.
  - The Founder authorized this exact clean-room Task as the first real engineering Task of the offline Exit-Gate closure route.
  - Closing this one missing Gate item directly raises strict P1 completion; route activation, Contract, Truth, Reviews and receipts receive no engineering credit.

