architecture_constraints:
  - Open every admitted source object exactly once and read it sequentially from that descriptor.
  - Record typed pre-read and post-read descriptor identity including type, dev, ino, nlink and byte length.
  - Compute SHA-256 over the exact bytes supplied to downstream consumers.
  - Supply verifier, receipt, replay and consumer logic from one immutable buffer or capsule; never reopen the source path.
  - Reject source object mutation, replacement or ambiguity before producing an accepted transaction receipt.
  - Keep the implementation parent-independent and free of historical Evidence sibling or fixed staging dependencies.
  - Keep all work cooperative-local, offline and inside unique owned disposable roots.
quality_freeze:
  positive_topologies:
    - unique owned repository-adjacent parent
    - unique owned nested temporary parent
    - unique owned /private/tmp canonical-like parent
  required_negative_cases:
    - symlink
    - hardlink
    - rename
    - inode replacement
    - same-byte replacement
    - truncation
    - growth
    - content mutation
    - missing object
    - extra object
    - reorder
    - receipt tamper
  required_pre_post_fields:
    - type
    - dev
    - ino
    - nlink
    - byte_length
    - sha256
  false_accepts_max: 0
  external_effects:
