    Custody proves only that hidden content was not delivered in Worker/Integration
    context and that no access was observed in the bounded task ledger. It does not
    prove filesystem capability denial, model-training novelty, hostile-principal
    secrecy, OS isolation or P3 Trust. An opaque commitment ID is not a hidden source
    or task identity.

