pre_activation_review_policy:
  initial_reviews: [CTO Agent, Security Agent, Quality and Evaluation Agent]
  maximum_bounded_contract_repairs: 1
  repair_boundary: Only exact blockers raised by the initial reviews; no objective, capability, path, budget, permission or claim expansion.
  final_rule: The repaired exact bytes must receive three new exact PASS reviews. Any remaining non-PASS abandons the Task before activation without successor or replacement.

implementation_boundary:
  module: evaluation-harness/validators/run-outcome-semantics.mjs
  exported_signature: validateRunOutcome(runRecord)
  input: one in-memory object
  effects:
    filesystem_read: only the fixed accepted RunRecord schema during module initialization
    filesystem_write: none
    child_process: none
    network: none
    clock: none
    randomness: none
  terminal_mapping:
    completed: [agent_complete]
    failed: [test_failure, tool_error, model_error, uncaught_exception]
    timed_out: [wall_clock_timeout]
    budget_exhausted: [token_budget, tool_budget, cost_budget]
    policy_blocked: [policy_violation]
    invalid_infrastructure: [infrastructure_failure]
    cancelled: [human_cancel]
  cross_field_rules:
    - completed requires empty error_taxonomy and empty policy_violations.
    - policy_blocked requires a non-empty policy_violations array and error_taxonomy containing policy.
    - every non-policy_blocked outcome requires an empty policy_violations array.
    - invalid_infrastructure requires error_taxonomy containing infrastructure.
    - invalid_infrastructure requires one accepted non-null invalid_run_reason; every other terminal_status requires invalid_run_reason to be null.
    - The accepted schema check is mandatory and mechanically enforces this nullability and closed enum before semantic checks; the implementation may not bypass or weaken it.
  validation_precedence:
    - RUN_RECORD_SCHEMA_INVALID
    - TERMINAL_STOP_REASON_MISMATCH
    - POLICY_VIOLATION_SEMANTICS_MISMATCH
    - ERROR_TAXONOMY_MISMATCH
    - PASS
  pass_result:
    closed_keys: [schema_version, record_type, verdict, run_id, terminal_status, disposition, outcome_identity_sha256]
    constants:
      schema_version: "1.0"
      record_type: aios_p1_run_outcome_semantics
      verdict: PASS
    input_bindings:
      run_id: runRecord.run_id
      terminal_status: runRecord.terminal_status
    disposition_mapping:
      completed: COMPLETED_PENDING_INDEPENDENT_VERIFICATION
      failed: ELIGIBLE_FAILED
      timed_out: ELIGIBLE_FAILED
      budget_exhausted: ELIGIBLE_FAILED
      policy_blocked: ELIGIBLE_FAILED
      invalid_infrastructure: INFRASTRUCTURE_INVALID_PENDING_PREDECLARED_REASON_CHECK
      cancelled: ELIGIBLE_FAILED
    identity_projection:
      ordered_keys: [run_id, terminal_status, stop_reason_code, invalid_run_reason, error_taxonomy, policy_violations]
      array_order: preserved exactly as recorded
      bytes: UTF-8 canonicalJson(projection) plus exactly one LF
      digest: SHA-256 lowercase hexadecimal
  failure:
    type: RunOutcomeFailure
    enumerable_properties: [reasonCode]
    fixed_name: RunOutcomeFailure
    fixed_message: message equals reasonCode exactly
    input_content_or_free_form_message: forbidden
    frozen_observation:
      constructor_name: RunOutcomeFailure
      error_name: RunOutcomeFailure
      error_message: exact reasonCode string
      own_enumerable_keys: [reasonCode]
      input_substring_present: false

quality_test_envelope:
  freeze_before_worker: true
  files:
    - evaluation-harness/fixtures/run-outcome-semantics/OWNERSHIP_MAP.json
    - evaluation-harness/fixtures/run-outcome-semantics/TEST_PLAN.json
    - evaluation-harness/fixtures/run-outcome-semantics/GOLDEN_RESULTS.json
    - evaluation-harness/fixtures/run-outcome-semantics/run-cases.mjs
    - evaluation-harness/fixtures/run-outcome-semantics/records/**
    - evaluation-harness/fixtures/run-outcome-semantics/FREEZE_RECEIPT.json
  valid_cases:
    - V01 completed/agent_complete
    - V02 failed/test_failure
    - V03 failed/tool_error
    - V04 failed/model_error
    - V05 failed/uncaught_exception
    - V06 timed_out/wall_clock_timeout
    - V07 budget_exhausted/token_budget
    - V08 budget_exhausted/tool_budget
    - V09 budget_exhausted/cost_budget
    - V10 policy_blocked/policy_violation with error_taxonomy [unknown, policy] and policy_violations [z-policy, a-policy] in that exact non-sorted order
    - V11 invalid_infrastructure/infrastructure_failure with error_taxonomy [unknown, infrastructure] in that exact non-sorted order and shared_harness_failure
    - V12 cancelled/human_cancel
  negative_cases:
    - N01 completed/test_failure returns TERMINAL_STOP_REASON_MISMATCH.
    - N02 failed/agent_complete returns TERMINAL_STOP_REASON_MISMATCH.
    - N03 timed_out/tool_error returns TERMINAL_STOP_REASON_MISMATCH.
    - N04 budget_exhausted/wall_clock_timeout returns TERMINAL_STOP_REASON_MISMATCH.
    - N05 policy_blocked/test_failure returns TERMINAL_STOP_REASON_MISMATCH.
    - N06 invalid_infrastructure/uncaught_exception returns TERMINAL_STOP_REASON_MISMATCH.
    - N07 cancelled/agent_complete returns TERMINAL_STOP_REASON_MISMATCH.
    - N08 policy_blocked with empty policy_violations returns POLICY_VIOLATION_SEMANTICS_MISMATCH.
    - N09 failed with one policy violation returns POLICY_VIOLATION_SEMANTICS_MISMATCH.
    - N10 completed with non-empty error_taxonomy returns ERROR_TAXONOMY_MISMATCH.
    - N11 policy_blocked without policy taxonomy returns ERROR_TAXONOMY_MISMATCH.
    - N12 invalid_infrastructure without infrastructure taxonomy returns ERROR_TAXONOMY_MISMATCH.
    - N13 missing run_id returns RUN_RECORD_SCHEMA_INVALID.
    - N14 failed with shared_harness_failure invalid_run_reason returns RUN_RECORD_SCHEMA_INVALID.
    - N15 invalid_infrastructure with null invalid_run_reason returns RUN_RECORD_SCHEMA_INVALID.
  precedence_cases:
    - P01 has missing run_id plus wrong terminal/stop pair and returns only RUN_RECORD_SCHEMA_INVALID.
    - P02 has wrong terminal/stop pair plus policy violation mismatch and returns only TERMINAL_STOP_REASON_MISMATCH.
    - P03 has policy violation mismatch plus taxonomy mismatch and returns only POLICY_VIOLATION_SEMANTICS_MISMATCH.
  frozen_goldens:
    - Quality independently freezes exact pass-result objects, canonical bytes, byte lengths and outcome_identity_sha256 for V01-V12.
    - Quality freezes the complete failure observation for N01-N15 and P01-P03: constructor name, error name, exact reasonCode message, own enumerable key population [reasonCode], reasonCode, and input_substring_present false.
    - Golden generation may use a Quality-owned independent standard-library script before Worker implementation and may not import Worker code.
  oracle:
    - Each V/N case uses a distinct complete RunRecord; negative cases change exactly their named condition from a valid semantic record.
    - V10 and V11 freeze deliberately non-sorted multi-element arrays; their exact independent identity goldens must fail an implementation that sorts either array.
    - P cases are the only multi-fault vectors and mechanically establish every adjacent validation-precedence edge.
    - All 30 case IDs occur exactly once and the actual result population equals the frozen golden population.
    - The full 30-case matrix runs twice; each population equals the frozen oracle and the two populations are byte-identical.

execution_surface:
