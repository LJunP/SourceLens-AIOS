architecture_constraints:
  - Consume exact scanner output bytes and bind the scanner invocation, output path, byte length and SHA-256.
  - Derive canonical file and symbol identities only from normalized repository-relative data, never the repository absolute path.
  - Bind every symbol to language, file identity, kind and a valid source span.
  - Classify every relation endpoint as internal, external or unresolved without ambiguity.
  - Sort nodes and edges deterministically and reject duplicate canonical identities.
  - Provide an executable CLI, Java TypeScript and Rust fixtures, exact replay and a closed output manifest.
  - Reject missing, duplicate, ambiguous, tampered, path-escaping, identity-drifted and malformed-span input.
  - Do not read or reuse any rejected P2 engineering asset.
quality_freeze:
  positive_matrix:
    - Exact accepted scanner invocation produces a bound scanner-output identity.
    - Equivalent repositories under different absolute roots produce byte-identical graph projections.
    - Java TypeScript and Rust fixtures produce deterministic file, symbol and relation records.
    - Internal external and unresolved endpoints are explicit and mutually exclusive.
    - Stable replay reproduces the same graph bytes and closed manifest.
  negative_matrix:
    - duplicate canonical file identity
    - duplicate canonical symbol identity
    - ambiguous relation endpoint
    - missing scanner-output field
    - scanner-output byte-length drift
    - scanner-output SHA-256 drift
    - path escape
    - absolute-path identity leak
    - source-span out of bounds
    - source-span inverted
    - malformed language
    - endpoint identity drift
    - closed-manifest extra output
    - closed-manifest missing output
    - replay mutation
  required_counts:
    java_fixtures_minimum: 1
    typescript_fixtures_minimum: 1
    rust_fixtures_minimum: 1
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
