acceptance_criteria:
  - Canonical authority, strict phase predecessor and P1 safety pass before Worker source mutation.
  - The accepted P1-129 36-positive and 53-negative controls pass unchanged in an isolated namespace.
  - Six TaskSpec records produce exactly 36 synthetic cells across B0, B1 and B2 with two repetitions each.
  - B0, B1 and B2 request identity sets are profile-distinct because real profile observations differ, not because labels or nonsemantic salts differ.
  - B1 pre-response Evidence contains only permitted observations and contains no reference patch, expected output, program replacement bytes or Quality oracle.
  - B2 produces twelve real exact accepted P0 repository_analysis.scan child invocations.
  - All 36 synthetic responses traverse the exact accepted P1-149 execution spine and P1-101 trace/replay path.
  - Raw-only independent rebuild rejects mutated Worker usage, adapter, effect, success, peer, observer and taxonomy claims.
  - Exact Secret sentinel reflection tests cover exact, cross-chunk, prefix, suffix, split-boundary and binary cases without retaining the sentinel or its hash.
  - Critical error propagation tests cover path escape, symlink, hardlink, create-once, missing, extra, mutation, reorder, duplicate, cross-binding and Evidence-write failure.
  - A bounded-concurrency synthetic load test proves create-once Evidence and accounting remain race-free.
  - All negative matrices produce zero false accepts and zero unauthorized external effects.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same candidate and raw preflight Evidence.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
  - This Task grants no P1 Exit capability credit and cannot read a Secret or call the Provider.
