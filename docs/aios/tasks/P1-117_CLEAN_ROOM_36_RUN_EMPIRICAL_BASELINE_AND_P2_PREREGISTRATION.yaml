frozen_experiment_design:
  research_question: >-
    Across the accepted six-task representative dataset, what are the
    reproducible run-level outcomes, evidence-completeness characteristics and
    failure distributions when the B0, B1 and B2 P1-117 clean-room wrappers
    select from a task-specific finite typed-operation catalog using only
    predeclared safe disclosures under two predeclared configurations and a
    common evaluator?
  primary_metric: VERIFIED_TASK_SUCCESS_RATE
  scheduled_run_count: 36
  task_count: 6
  task_ids:
    - SL-P1-REP-001-RANGE-NORMALIZATION
    - SL-P1-REP-002-CONFIG-VALIDATION
    - SL-P1-REP-003-SAFE-PATH-JOIN
    - SL-P1-REP-004-COMMAND-RESULT-MAPPING
    - SL-P1-REP-005-PROFILE-DISPLAY-NAME
    - SL-P1-REP-006-DEDUPE-REFACTOR
  systems:
    - B0_DIRECT_MODEL
    - B1_SIMPLE_TOOL_AGENT
    - B2_CURRENT_SOURCELENS
  variants:
    - A
    - B
  repetitions_per_task_system_variant: 1
  aggregation:
    run_level_denominator: ALL_36_SCHEDULED_RUNS
    task_system_variant_success: INDEPENDENT_EVALUATOR_ACCEPTED_AND_COMPLETE_EVIDENCE
    invalid_run_policy: ONLY_PREDECLARED_SHARED_INFRASTRUCTURE_REASON_CODES
    ordinary_setup_timeout_budget_policy_failure: COUNT_AS_FAILED_RUN
  practical_claim_boundary: >-
    Descriptive finite-selection P1 baseline only. This does not test open
    coding or prove direct multi-task execution by the previously accepted
    adapters. No superiority, model-quality, OpenAI-direct,
    production-readiness or P2-admission claim.
preregistration_freeze:
  required_before:
    - SECRET_READ
    - PROVIDER_REQUEST
  must_bind:
    - exact Contract and Task authority
    - exact 36-run matrix and ordering
    - dataset and six TaskSpec identities
    - six exact task-scoped Environment Snapshot identities with the shared accepted snapshot-id alias explicitly disclosed
    - B0 B1 B2 executable and SystemConfiguration identities
    - accepted P0 B2 scanner artifact and external truth binding
    - environment, model, prompt, policy and response-format identities
    - evaluator, metric, success, failure and invalid-run semantics
    - request, token, cost, time and external-effect guardrails
    - negative matrix and stop conditions
    - first offline P2 context-engine hypothesis and practical stop condition
  mutation_after_freeze: FORBIDDEN
architecture_constraints:
  - All inputs derive from accepted canonical assets and the exact Founder packets.
  - No rejected Task engineering asset may be read, compared, copied or reused.
  - P1-117 uses new task-local clean-room wrappers and a finite typed-operation catalog; it does not modify accepted adapters or claim their direct multi-task execution.
  - Each accepted TaskSpec is bound to one exact task-scoped Environment Snapshot by full file SHA-256 and byte length; the shared accepted snapshot-id string is only a disclosed alias and never the authoritative identity.
  - The preregistration is exact-byte frozen before any Secret read or Provider request.
  - Every formal run uses one unique run identity and one independently owned disposable output root.
  - Every scheduled run emits a RunRecord even when it fails, times out or reaches a policy or budget stop.
  - Raw request-safe Evidence excludes Secret, restricted source and authorization headers.
  - Raw response-safe Evidence, observable trace, external truth binding, stable projection, replay and rollback are retained for every run.
  - B2 must invoke the exact P1-116 admitted accepted P0 repository_analysis.scan artifact.
  - Deterministic fields replay exactly and stochastic differences remain visible rather than normalized away.
  - Request count, token totals and cost accounting are append-only and fail closed at the exact Founder caps.
  - Cost remains UNKNOWN_GATEWAY_METERING_UNAVAILABLE when trustworthy metering is unavailable.
  - The task-local accounting envelope records unknown cost as status UNKNOWN_GATEWAY_METERING_UNAVAILABLE with currency USD and amount null; conformance to the canonical numeric-cost RunRecord schema is not claimed.
  - Only exact loopback 127.0.0.1 port 8787 egress is permitted; redirects, proxies, DNS and fallback endpoints are forbidden.
  - Secret bytes never enter repository, Evidence, logs, traces, prompts, reviews or Vault.
  - Adapter conformance, sample outcomes and Founder-attested gateway provenance do not prove model performance or OpenAI direct provenance.
quality_freeze:
  positive_matrix:
    - Six exact accepted TaskSpecs cross-bind to their Environment Snapshots and dataset identities.
    - B0, B1 and B2 each expose distinct P1-117 clean-room wrapper executable and SystemConfiguration identities.
    - Each of B0, B1 and B2 executes variants A and B for all six TaskSpecs.
    - All 36 scheduled entries execute independently and remain in the denominator.
    - B2 records a real exact accepted P0 child scanner invocation for every B2 run.
    - Every run retains the complete predeclared Evidence set and an identity-bound rollback receipt.
    - Independent recomputation derives the same aggregate counts from raw run Evidence.
  negative_matrix:
    - preregistration missing or mutated
    - unknown or duplicate matrix entry
    - missing scheduled run
    - task dataset identity drift
    - TaskSpec Environment Snapshot mismatch
    - executable or SystemConfiguration identity drift
    - B2 scanner artifact or external truth-binding drift
    - request count, input token or output token cap exceeded
    - automatic retry requested
    - non-loopback, redirect, proxy, DNS or fallback endpoint requested
    - restricted source or Secret sink requested
    - missing, reordered or identity-drifted trace event
    - RunRecord, stable projection or replay mismatch
    - rollback identity drift or non-owned cleanup attempt
    - post-hoc run exclusion or result-aware preregistration mutation
  execution_semantics:
    - Every negative case uses an independent, one-time, locally owned fixture.
    - Pre-execution negatives reject with Provider requests and Secret reads equal to zero.
    - No negative fixture may be repaired and reused as a later test lineage.
acceptance_criteria:
  - Exact Goal, route packet, direct-entry correction packet, canonical activation parent, Contract, Truth and authority identities pass preactivation validation.
  - The P1-116 corrected integration receipt and all three fresh PASS reviews match their exact retained bytes.
  - An immutable preregistration binds the complete experiment design before any Secret read or Provider request.
  - Offline preflight validates all 36 scheduled entries, all accepted input identities and the complete negative matrix with zero Provider requests and Secret reads.
  - Exactly 36 independent formal runs are retained with no missing, duplicate or post-hoc excluded scheduled entry.
  - Provider requests do not exceed 60, automatic retries equal zero, input tokens do not exceed 500000 and output tokens do not exceed 100000.
  - Only authorized loopback Provider connections occur; non-loopback, remote, production and public effects equal zero.
  - Every formal run retains request-safe and response-safe raw Evidence, RunRecord, observable trace, external truth binding, stable projection, replay and rollback.
  - Every B2 formal run records an actual exact accepted P0 repository_analysis.scan child invocation.
  - The complete negative matrix rejects every case with false accepts and forbidden external effects equal zero.
  - Independent recomputation matches raw denominator, numerator, failures, invalids, reason distribution, latency, token and available cost accounting.
  - One offline P2 context-engine preregistration states a falsifiable hypothesis, baseline, metric, practical effect threshold, budget and stop condition without entering P2.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - The reviewed exact tree equals the canonical integrated tree and exactly one post-integration canonical make verify invocation passes.
  - EMPIRICAL_BASELINE_AND_P2_PREREGISTRATION changes from MISSING to ACCEPTED only after the complete Task Gate.
required_evidence:
  - Exact Founder packets, Goal, canonical parent, Contract, authority and P1-116 corrected integration identities.
  - Frozen preregistration plus pre-Secret and pre-Provider timestamped identity receipt.
  - Exact 36-entry matrix, accepted dataset, TaskSpec, Environment Snapshot, executable, configuration, evaluator and scanner identities.
  - Per-run request-safe and response-safe raw streams, RunRecord, trace, truth binding, stable projection, replay and rollback receipts.
  - Append-only request, token, cost, latency and external-effect ledger.
  - Independent negative fixtures with raw stable reason codes and zero false accepts.
  - Aggregate baseline report, independent recomputation and one-command reproduction receipt.
  - Offline P2 context-engine experiment preregistration.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and exact formal Evidence.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify receipt.
rollback:
  strategy: IDENTITY_BOUND_DISPOSABLE_RUN_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Goal, packet, canonical activation parent, accepted input, Contract, authority or preregistration identity drifts.
  - A rejected Task engineering asset is required or any required path exceeds this Contract.
  - Offline preflight cannot validate the complete 36-entry matrix before Secret or Provider use.
  - Secret bytes enter a prohibited sink or a non-loopback, remote, production or public effect occurs.
  - Provider request, retry, token or monetary cap is exceeded or cannot fail closed.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated tree equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the P1 Phase boundary changes.
claim_boundary: >-
  Cooperative-local preregistered 36-run B0/B1/B2 finite safe-disclosure
  typed-operation-selection descriptive empirical baseline, complete
  replayable Evidence and one offline P2 experiment preregistration only; no
  open-coding or accepted-adapter direct multi-task execution claim, no
  canonical numeric-cost RunRecord conformance claim, and no model
  superiority, direct OpenAI provenance, production readiness, P2/P3 entry,
  remote, production, public, hostile-principal or strong-isolation claim.
