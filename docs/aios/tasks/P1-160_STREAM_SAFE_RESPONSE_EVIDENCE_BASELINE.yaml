acceptance_criteria:
  - Canonical authority and P1 safety pass before any Worker source mutation and before formal execution.
  - One response-byte cap drives transport, spool, inventory and verifier behavior without conflicting literal ceilings.
  - Cap-minus-one and exact-cap responses are admitted; cap-plus-one is rejected as RESPONSE_TOO_LARGE.
  - Synthetic formal-001 produces a complete per-cell failure receipt and formal-002 through formal-036 continue to completion.
  - Synthetic denominator equals 36, automatic retries equal zero, false accepts equal zero and no external effects occur.
  - Complete offline preflight passes before any Secret read or Provider request.
  - The sole formal execution issues exactly 36 requests, one per cell, with no retries and preserves every result.
  - All ordinary formal cell failures remain in the denominator and do not abort the matrix.
  - B0, B1 and B2 each contribute twelve cells through accepted adapter and P1-149 execution-spine participation.
  - The independent evaluator reconstructs the report only from frozen raw Evidence and verifies identity, counting, usage, failure taxonomy, closed inventory and reproduction command.
  - Negative, low or zero VTSR remains an acceptable Research Artifact when engineering and Evidence gates pass.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, structured Decision, Goal, activation parent, Contract and authority identities.
  - Raw cap-minus-one, exact-cap, cap-plus-one and cap-drift preflight Evidence.
  - Synthetic 36-cell records, complete formal-001 failure receipt, matrix aggregate and closed inventory.
  - Formal request and response/failure receipts for all 36 cells.
  - Accepted adapter, P1-101 trace/replay and P1-149 compiler/apply/oracle/test/rollback identities.
  - Independent report reconstruction, verification, reproduction command, costs, uncertainty and failure taxonomy.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: OWNED_DISPOSABLE_ROOT_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical start, Goal, Founder decision, accepted-input or activation-parent identity drifts.
  - Any P1-158 rejected engineering source, diff, fixture, test or implementation is read or reused.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus three same-Task repairs are exhausted.
  - A second formal 36-cell matrix or second Secret read is required.
  - Formal matrix cannot complete all 36 planned cells.
  - Secret leakage, non-loopback connection, path escape, Evidence damage, permission expansion or actual budget overrun occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
forbidden_actions:
  - Read, recover, compare or reuse P1-158 rejected source, diff, fixture, test or implementation.
  - Modify accepted P1-101, P1-129 or P1-149 semantics.
  - Read a Secret or call the Provider before complete offline preflight PASS.
  - Retain a Secret in any repository, Evidence, log, trace, prompt, review or Vault sink.
  - Connect to a non-loopback peer or modify ZCode, Codex Tools, LaunchAgent, system proxy, ports or user software configuration.
  - Rerun, replace or beautify the formal matrix.
  - Enter P2 or P3.
  - Push or modify a remote.
claim_boundary: >-
  Cooperative-local P1 clean-room stream-safe request-bound baseline Evidence
  and reproducible report only. No P2/P3 entry, non-loopback, remote,
  production, public, hostile-principal, direct upstream provenance,
