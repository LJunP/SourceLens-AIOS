      - Quality ownership map, fixture inventory and freeze receipt
      - runtime identity and command ledger with actual argv, cwd, start/end and exit status
      - implementation diff and changed-path ownership report
      - all fixture inputs, expected outcomes and actual outputs with hashes
      - normalized VTSR reports and replay comparison
      - controlled failure and tamper evidence
      - immutable-input before/after comparison
      - full verification output
      - candidate commit/tree and bundle
      - rebuild and rollback receipts
    forbidden_future_artifacts:
      - independent review reports
      - offsite verification receipt
      - Founder Gate decision
  post_review_evidence_index:
    path: manifests/POST_REVIEW_EVIDENCE_INDEX.json
    freeze_stage: AFTER_THREE_PASS_REVIEWS_BEFORE_OFFSITE
    create_once: true
    required_bindings:
      - CandidateEvidenceManifest SHA-256 and root
      - exact candidate commit/tree and bundle SHA-256
      - CTO Review SHA-256 and PASS
      - Security Review SHA-256 and PASS
      - Quality Review SHA-256 and PASS
      - Founder Gate Decision Packet SHA-256
    rule: It references frozen prior artifacts and cannot rewrite or absorb their bytes.
  offsite_verification_receipt:
    path: offsite/OFFSITE_VERIFICATION_RECEIPT.json
    create_stage: AFTER_OFFSITE_COPY_AND_FRESH_RESTORE
    create_once: true
    required_bindings:
      - PostReviewEvidenceIndex SHA-256
      - offsite package manifest/root/checksums
      - fresh bundle clone commit/tree
      - rebuild and rollback verification results
      - bound volume UUID
  founder_gate_decision:
    sequence: Founder decision occurs only after the three frozen evidence levels above and binds them as parent evidence; it is not a child artifact required by an earlier manifest.
  manifest_rule: sorted relative path + NUL + lowercase SHA-256 + NUL + decimal byte length + LF
  frozen_artifact_mutation: forbidden

acceptance_criteria:
  - exact Task Contract and Founder execution authorization remain valid and hash-bound
  - Quality freezes the exact 20-case fixture/oracle set before Worker implementation starts
  - all normative counting and report invariants are implemented without changing accepted P1 schemas
  - every required verification command passes
  - replay is byte-identical
  - CandidateEvidenceManifest is hash-bound and immutable before review
  - PostReviewEvidenceIndex binds the three PASS reviews without rewriting candidate evidence
  - OffsiteVerificationReceipt binds the frozen post-review package after fresh restore
  - fresh rebuild and rollback verification pass
  - CTO, Security and Quality each return PASS on the exact frozen candidate
  - offsite package restore verification passes on the bound volume
  - no capability or benchmark claim exceeds the declared claim boundary

failure_criteria:
  - any accepted P1-001 artifact or authority binding drifts
  - any numerator, denominator, invalid, failure, retry, repetition, exclusion or reason-code rule is ambiguous or mechanically inconsistent
  - any false-success, post-hoc exclusion, identity drift or tamper fixture is accepted
  - replay differs for identical inputs
  - any required test, rebuild, rollback, review or offsite verification is non-PASS
  - any forbidden effect occurs

stop_conditions:
  - objective, path, budget, permission, metric, role or claim expansion is required
  - implementation requires a live B0/B1/B2/A0 run, Provider, network, Secret, remote or production effect
  - implementation requires P2 Repository Intelligence or P3 Runtime/Trust capability
  - accepted schemas, protocols, P1-001 evidence or historical terminal records must be modified
  - work is attempted outside the exact branch/worktree/write scope or a residual transient path remains
  - calendar or engineering budget is exceeded
  - both allowed implementation/candidate iterations are exhausted without three independent PASS reviews
  - evidence integrity, rebuild, rollback or offsite recovery cannot be proven
  - canonical main, Goal, authority or authorization window drifts before Gate
  - any automatic retry, resume, successor, replacement or correction chain is proposed

rollback:
  rollback_anchor: authorization_parent_commit
  canonical_main_during_implementation: unchanged_after_activation_commit
  candidate_preservation: complete Git bundle plus external Evidence Manifest
  restore_test: fresh clone bundle, verify candidate commit/tree, verify activation parent topology, then run required checks
  main_advance: separate Founder Gate authorization required

explicit_non_authorizations:
  - this contract candidate does not authorize its own execution
  - no B0, B1, B2 or A0 execution or performance measurement
  - no benchmark, VTSR score, Agent capability or P1-exit claim
  - no P2 or P3 entry
  - no network, Provider, Secret, remote, production or public effect
  - no model-initiated canonical repository write or Agent shell capability
  - no Supervisor, Root Custody, strong isolation, Multi-Agent Runtime or Trust Runtime work
  - no reuse or acceptance of P1-002, P1-003 or P1-004 rejected candidates
  - no canonical main advance without a separate Founder Gate decision

completion_rule: >-
  After future execution authorization, the Task may autonomously proceed inside
  this envelope through implementation, bounded ordinary repair, Evidence, rebuild,
  rollback, independent review and offsite verification. It then stops at Founder
  Gate. A Task PASS does not itself authorize a baseline run, main advance, next
  Task, P2/P3 entry or any capability claim.
