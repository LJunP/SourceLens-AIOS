    B0 is not allowed to mutate source. Any source mutation is a Task NON_PASS;
    restoring after mutation does not convert the run to PASS.
  integration_failure: non_destructive_git_revert
  destructive_reset_clean_or_historical_evidence_removal_allowed: false

stop_conditions:
