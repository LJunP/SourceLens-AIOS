  Implement and independently evaluate one provider-neutral offline B0 adapter
  that conforms to the accepted Baseline Adapter Contract common interface,
  validates all four P0 contracts and their cross-bindings, consumes only one
  accepted visible development TaskSpec plus a Quality-frozen prerecorded
  response, and emits a schema-valid RunRecord without invoking a model,
  Provider, network, tool, patch execution or evaluator verdict.

