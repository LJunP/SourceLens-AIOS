implementation_order:
  - Quality and Evaluation freezes the six source templates, TaskSpecs, expected-base-failure oracles, reference-solution patches, coverage declaration, materialization recipe and dataset manifest under the dataset root.
  - Record a Quality-asset freeze receipt before validator implementation begins.
  - Dataset Validator Engineer implements the validator and self-test without changing frozen dataset bytes.
  - Run deterministic double materialization, TaskSpec validation, typed base-failure checks, solved-state witness checks, population checks and mutation rejection.
  - Freeze one candidate, then generate Evidence, independent reviews and a delegated Task Gate receipt.

