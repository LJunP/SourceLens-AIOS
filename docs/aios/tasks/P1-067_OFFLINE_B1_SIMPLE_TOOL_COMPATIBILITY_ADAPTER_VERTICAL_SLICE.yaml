minimal_safety_invariants:
  - Canonical source is never a run materialization or tool target.
  - The adapter accepts only a closed finite typed tool plan and maps it to exact fixed operations; it does not interpret proposal text or result-controlled execution parameters.
  - local-file-edit can apply only the postimage produced by the accepted finite Typed Patch IR compiler for exact IR10 to the exact REP-001 source path.
  - local-node-test can run only the two exact TaskSpec verification commands with fixed argv, cwd, timeout and minimal non-secret environment.
  - Each run uses a fresh task-owned disposable repository and a fresh task-owned Evidence root; pre-existing objects are not overwritten or cleaned.
  - Every tool action joins one run ID and records exact ordinal, tool, operation, inputs, process outcome and raw stream identity.
  - Run B independently reexecutes frozen inputs and does not consume Run A path, receipt or verdict.
  - Every mutating run restores exact base bytes, commit, tree and clean state.
  - Graph, ranker, memory, multi-Agent, network, Provider, Secret, remote, production and public effects remain disabled.

acceptance_criteria:
  - Exact Goal, Phase packet, Contract, TaskSpec, source, EnvironmentSnapshot, SystemConfiguration, target runtime, compatibility profile, compiler, IR10 and candidate identities are verified before mutation or child start.
  - SystemConfiguration uses adapter_id B1, loop_limit 3 and exactly the two TaskSpec-declared tools; EnvironmentSnapshot exposes the same tools with only isolated permissions.
  - The closed tool plan has exactly three ordered actions and cannot supply path, argv, cwd, env, executable, module, timeout, code, shell, diff or AST.
  - The adapter independently compiles exact IR10 and returns only normalized fixed action descriptors; the runner, adapter or fixture cannot decide task success.
  - Base issue test fails with the frozen assertion and base regression passes; after the exact structured patch, issue and regression tests both pass.
  - Observable Evidence records every fixed base, tool and rollback action, raw stdout/stderr lengths and hashes, candidate provenance, source/input identities, evaluator outcome and exact rollback.
  - Forbidden tool, step gap/duplicate/reorder, over-budget plan, unknown member, identity drift, dynamic parameter, external effect, cross-run substitution, Evidence tamper and rollback omission reject with zero false accepts before unsafe execution.
  - Fresh Run A and independent Quality Run B use distinct physical roots, retain distinct Evidence and produce exact byte-equal predeclared stable projections.
  - Targeted verification plus accepted P1-035, P1-055 and P1-066 regressions and Code Map check pass.
  - One exact candidate receives CTO, Security and Quality TARGET_VERDICT PASS; one same-Task repair and one final review cycle are the maximum.
  - After Task Gate, reviewed tree is integrated locally, integrated tree equals reviewed tree and one canonical full make verify passes.

required_evidence:
  - exact authority, Contract, candidate, accepted-input and executing-module identities
  - Quality Freeze identity and ownership receipt
  - Run A and independent Run B action records, stable projections and exact comparison
  - negative-case outcomes and zero-false-accept count
  - exact rollback, distinct materialization and candidate provenance receipts
  - final CTO, Security and Quality verdicts
  - reviewed/integrated tree equality and canonical make verify result

rollback:
  run_level: Restore exact frozen source bytes in the disposable materialization, verify base commit/tree and clean state, and remove only objects proven task-owned.
  candidate_level: Do not integrate a final NON_PASS candidate; preserve Evidence and recoverable Git identity.
  integrated_level: Use non-destructive git revert of the exact integration commit; never reset or clean.

stop_conditions:
  - The Task would require reading, restoring, comparing, copying or reusing terminal or rejected engineering lineage.
  - The plan ceases to be closed, finite and typed, or an invalid input reaches mutation or child start.
  - A result can control path, argv, cwd, env, executable, module, timeout or free-form execution.
  - Evidence, canonical source or a pre-existing object is overwritten, damaged, followed, renamed, deleted or cleaned.
  - Run A or Run B cannot reproduce, stable projections differ, false accepts are nonzero or rollback is not exact after the bounded same-Task repair allowance.
  - The second formal review cycle returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or the one post-integration canonical make verify returns NONPASS.
  - The Task requires network, Provider, Secret, remote, production, public, P2/P3, critical-risk acceptance or an irreversible action.

forbidden_actions:
  - Read, restore, compare, copy or reuse any P1-063, P1-064 or other terminal/rejected engineering source, fixture, test, candidate, diff or implementation Evidence.
  - Modify accepted P1-066 implementation bytes or treat them as writable Task outputs.
  - Build a shared Agent Runtime, authority kernel, governance foundation, custom source parser, sandbox platform, Supervisor, Root Custody or Multi-Agent Runtime.
  - Execute proposal text, free-form/untrusted code, arbitrary shell, dynamic module targets or result-controlled argv/cwd/env/path.
  - Configure or use an API key, network, Provider, Secret, remote, production or public effect.
  - Push, open a PR, release, modify a remote, enter P2/P3 or change the P1 Objective/Exit Gate.
  - Count this Contract, Evidence, reviews or administrative changes as capability progress.

