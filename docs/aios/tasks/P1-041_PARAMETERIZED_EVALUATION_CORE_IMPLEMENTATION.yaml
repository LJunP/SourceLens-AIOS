acceptance_criteria:
  - Quality freezes one executable evaluation plan and ownership manifest after activation and before Worker implementation; their identities remain unchanged through candidate review.
  - The parameterized runner consumes the accepted dataset and frozen plan rather than a hard-coded single Task path.
  - Every scheduled run produces a typed terminal observation and complete observable command trace; no unclassified run enters VTSR counting.
  - VTSR numerator, denominator, failure, infrastructure-invalid, retry, repetition, predeclared exclusion, post-hoc exclusion and reason-code counts are mechanically consistent with frozen observations.
  - Retry never increases the denominator; an infrastructure-invalid run is excluded from numerator and denominator only for a Quality-frozen predeclared reason attributable to the shared harness, remains in raw results, and is linked to a rerun under the same configuration; ordinary setup failure, timeout, crash, missing Evidence or policy failure attributable to the system under test remains an eligible failed denominator entry.
  - Post-hoc exclusion never improves the primary VTSR, and no blanket infrastructure-invalid classification can shrink the denominator.
  - One positive plan, controlled failures and fresh replay produce the exact Quality-frozen expected outcomes with deterministic normalized identities.
  - Worker runtime output and independent evaluator verdict are written to separate create-once roots, and Worker cannot create, replace or mutate the verdict.
  - All repository and Evidence outputs are resolved beneath the exact role-owned roots without symlink traversal; escaped, symlinked, pre-existing or non-create-once verdict targets fail closed before mutation.
  - P1-001, P1-011 and P1-035 regressions plus complete make verify PASS on the frozen candidate.
  - Evidence Manifest, retained Evidence custody, rebuild and rollback verification PASS and CTO, Security and Quality final independent reviews are all PASS.
  - Zero network, Provider, Secret, remote, production or public effect and zero historical failed-engineering-asset reuse are evidenced.

failure_criteria:
  - A scheduled run lacks a typed outcome, trace, input identity or evaluator linkage.
  - Replay changes a normalized result without a predeclared nondeterminism rule.
  - Counting can promote failure, invalid infrastructure, retry or post-hoc exclusion into verified success or improve primary VTSR incorrectly.
  - Infrastructure-invalid classification is not predeclared, is attributable to the system under test, lacks its same-configuration rerun linkage or removes the raw result.
  - Quality assets or expected results are changed after Worker implementation starts or derived from Worker output.
  - Worker can write or replace the independent evaluator verdict.
  - Evidence, rebuild, rollback or any final independent review is non-PASS.
  - A forbidden effect, historical asset contamination or write-scope violation occurs.

stop_conditions:
  - Phase objective, total Phase budget, allowed paths, permissions, roles, claim boundary or external-effect boundary must expand.
  - Historical failed engineering assets, accepted evaluator/data assets, canonical source or Evidence are contaminated.
  - The same real implementation architecture root cause remains unresolved after two bounded implementation iterations.
  - The single candidate fails deterministic replay, rebuild, rollback or CTO, Security or Quality final review.
  - Any network, Provider, Secret, remote, production, public or other unauthorized irreversible effect occurs.

