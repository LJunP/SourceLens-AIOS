    - accepted schema, P1-001 accepted artifact, source identity or hidden-custody boundary drifts
    - P2 Repository Intelligence or P3 Runtime/Trust capability is required
    - any Stop Condition

source_strategy:
  sourcelens_internal_candidates:
    allowed_split: development
    required_count_minimum: 1
    required_count_maximum: 2
    source_kind: internal_issue
    rights_status: FOUNDER_ASSERTED_SUFFICIENT_INTERNAL_RESEARCH_RIGHTS_REQUIRED
    internal_custody: RESTRICTED
    public_redistribution: PROHIBITED
    candidate_fix_commits:
      - fix_commit: 040cff0219b7413a5dd5861b4f7be7a250db6d69
        fix_tree: ff17d10e2f3de7550d183fe3cf0b43a2936014d9
        base_commit: 627bb64c5d636a24cea24c6d21d3500c3aeafcb1
        base_tree: d745083c99e25cfef2170a3a8551393720589bbf
      - fix_commit: 77892349578febc43c1c4054081d4c9cfa5c3cfc
        fix_tree: c34240cc6a486d17872a505dda8ef508e41d0364
        base_commit: 040cff0219b7413a5dd5861b4f7be7a250db6d69
        base_tree: ff17d10e2f3de7550d183fe3cf0b43a2936014d9
      - fix_commit: 09cf8dd6a1bcee138b949d117804d652000eb7cc
        fix_tree: daa58725d293b954887dbe5b17aab5219b618658
        base_commit: 77892349578febc43c1c4054081d4c9cfa5c3cfc
        base_tree: c34240cc6a486d17872a505dda8ef508e41d0364
    selection_rule: >-
      Select one or two non-overlapping bounded tasks only after reconstructing a
      defensible problem statement and issue-specific oracle. A commit message alone
      is not original Issue evidence; such tasks must be labeled INTERNAL_RECONSTRUCTED_TASK.
      Mixed or inseparable commits are excluded rather than silently split. If only one
      SourceLens candidate qualifies, the remaining development slot is filled by one
      additional eligible public OSS task without changing the 4/2/2 split.
  public_oss_candidates:
    required_count_minimum: 6
    required_count_maximum: 7
    development_minimum: 2
    development_maximum: 3
    validation: 2
    hidden: 2
    count_formula: total_public = 8 - selected_SourceLens_internal_count
    max_external_repositories: 4
    source_kind: public_issue
    preferred_code_licenses:
      - MIT
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
    selection_rules:
      - Each accepted repository has a license blob and hash plus any NOTICE/attribution requirement.
      - Code, Issue text, reference patch and oracle/test rights are classified independently.
      - Repository license does not automatically authorize redistribution of Issue text.
      - If Issue-text redistribution is not allowed, store a curator-authored factual task description and retain only a source URL, retrieval hash and restricted provenance outside public artifacts.
      - Validation and hidden repositories are disjoint from development repositories.
      - The two hidden tasks come from two different external repository lineages.
      - Public visibility is not evidence of absence from model training data.
      - Security vulnerabilities under embargo, tasks containing Secrets or personal data, and dependency-install or production tasks are excluded.

