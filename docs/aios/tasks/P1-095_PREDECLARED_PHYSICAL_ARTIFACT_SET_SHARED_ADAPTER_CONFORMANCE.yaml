quality_freeze_after_activation:
  owner: P1-095 Quality Freeze Author
  worker_may_modify: false
  freeze_once: true
  required_artifacts:
    - exact executable evaluation contract
    - B0, B1 and B2 distinct SystemConfigurations
    - complete closed relative artifact path set for each adapter
    - per-path object type, byte role and single-write or mutable role
    - accepted-P0 snapshot and built-analyzer external truth binding
    - frozen non-secret child environment allowlist
    - positive oracle
    - mandatory negative matrix
  required_architecture:
    - The closed path sets exist before any Worker source write.
    - Runtime validates membership before the first byte of every write.
    - Runtime cannot add, infer, reorder or extend a path set.
    - The final verifier independently enumerates physical inventory and exact-compares it with the frozen set.
    - Inventory evidence is written outside the run root and cannot become a self-derived in-root allowlist.

acceptance_criteria:
  - B0, B1 and B2 have distinct executables and distinct SystemConfigurations but use the same accepted TaskSpec, EnvironmentSnapshot, budget, RunRecord interface, evaluator, replay and rollback protocol.
  - B2 executes the exact Quality-bound accepted-P0 sourcelens-analyzer binary with operation repository_analysis.scan; a fabricated result, missing child, receipt-only claim or argv drift is rejected.
  - Every runtime write is checked against the immutable Quality-frozen closed path set before the first write.
  - Final verification independently enumerates every run root and rejects missing, extra, reordered, type-drifted, symlinked, hardlinked, inode-drifted or post-freeze entries.
  - Child processes receive only the frozen non-secret environment allowlist and do not inherit SSH_AUTH_SOCK, API keys, tokens, credentials or proxy variables.
  - Six independent runs complete: B0 A/B, B1 A/B and B2 A/B.
  - Each adapter pair has exact replay and exact stable-projection equality.
  - B1 proves exact source rollback; B0 and B2 prove exact no-mutation.
  - The complete mandatory negative matrix reports false accepts zero and nonowned residuals zero.
  - Targeted verification passes within at most two implementation iterations.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same exact bytes and Evidence.
  - The reviewed tree equals the integrated tree and one post-integration canonical make verify invocation passes.
  - B0_B1_B2_COMPATIBILITY_ADAPTERS changes to ACCEPTED only after the complete Task Gate passes.

required_evidence:
  - Exact Contract, Founder packet, Goal and activation-parent identities.
  - Quality freeze commit, manifest and self-test proving no Worker source existed when the closed sets were frozen.
  - Accepted-P0 snapshot, analyzer subtree, offline locked build and executable identities.
  - Six raw run roots and six independently enumerated inventory receipts.
  - Three exact stable projections, B1 rollback receipt and B0/B2 no-mutation receipts.
  - Mandatory negative matrix with per-case expected and actual rejection categories.
  - Child environment projection proving secret and proxy variables are absent.
  - Exact candidate commit, tree, binary diff/hash manifest and non-overwriting Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and formal Evidence.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.

rollback:
  run_level: >-
    Remove only task-owned disposable run and materialization roots after
    verification; never delete or rename a pre-existing object.
  candidate_level: >-
    Do not integrate a NON_PASS candidate; preserve exact Evidence, tag and the
    clean task branch.
  integrated_level: >-
    Use a non-destructive git revert of the exact integration commit if the
    single canonical make verify returns NONPASS.
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite

stop_conditions:
  - A required change falls outside the allowlisted paths or current P1 boundary.
  - The Quality-frozen closed artifact sets cannot be completed before Worker source write.
  - The exact accepted P0 snapshot cannot be independently bound, built offline and executed without a forbidden external effect.
  - Any runtime write occurs before frozen-path membership validation.
  - Any required negative case is false-accepted or leaves a nonowned residual.
  - The unique code-only repair is exhausted or repeats the same normalized root cause.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - The reviewed and integrated trees differ.
  - Canonical make verify returns NONPASS.
  - Evidence is overwritten, deleted, escaped or externally mutated.
  - A network, Provider, Secret, remote, production, public, P2/P3 or critical-risk decision is required.

forbidden_actions:
  - Read, restore, compare, copy, replay or reuse P1-093 branch source, candidate tree, diff, manifest, fixtures, oracle, tests, run roots or formal engineering Evidence.
  - Read or reuse any other rejected Task engineering asset.
  - Modify the P1 Objective, P1 Exit Gate or immutable authority validators.
  - Let Worker modify Quality-owned fixtures, evaluator, oracle, expected result or closed artifact sets.
  - Derive, complete, reorder or extend an allowlist from post-run physical inventory.
  - Mock, fabricate or replace the required B2 repository_analysis.scan child execution.
  - Use network, Provider, Secret, remote, production or public effects.
  - Push, modify a remote, enter P2/P3 or build Supervisor, Root Custody, Trust Runtime, Multi-Agent Runtime or hostile-principal isolation.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain.

claim_boundary: >-
  One cooperative-local, provider-neutral, offline B0/B1/B2 shared-harness
  compatibility-adapter conformance artifact with predeclared physical output
  sets, real accepted-P0 repository_analysis.scan, exact replay and rollback
  only. No model performance, baseline benchmark, VTSR, complete P1, P2, P3,
  production, public, hostile-principal or strong-isolation claim.
