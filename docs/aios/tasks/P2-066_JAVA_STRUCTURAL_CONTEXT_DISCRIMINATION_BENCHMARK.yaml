acceptance_criteria:
  - The exact twelve-task normative dataset contains eight DEV and four withheld representative Java repository-maintenance cases with hash-bound source, license, provenance, base commit and tree, issue and clarifications, natural lexical ambiguity, language, build, environment snapshot, allowed tools, network, time and cost, tests, regressions, forbidden changes, oracle, evaluator, Evidence, risk and approval fields required by Evaluation Protocol section 2; its queries, source bytes, split, exclusions, causal-relevance records, validation oracles, candidate universe, chunk projection, packing and 4608-byte per-system budgets are sealed before the first normative B0 or B1 output, while every pre-V5R9 draft, rehearsal and control output remains non-normative and is never reused.
  - All twelve scoring tasks are independent after repository, issue lineage, control-flow, reference-change and patch-similarity deduplication; renamed or templated clones share one statistical unit and therefore cannot satisfy the twelve-task denominator, bootstrap or sign-flip threshold.
  - B1 and A0 invoke the identical compiled canonical CodeQaController.codeQa MockMvc request path, scanTaskId, CodeChunkService rows, chunking, query, evidence reference, LLM-null and embeddings-disabled state, UTF-8 packer and post-materialization timing window; only the GraphService relation view differs.
  - A closed product-execution attestation independently binds the compiled test and product source, absolute tool identities, fixed argv and redacted environment, build exit, MockMvc request and response, unique controller invocation, GraphService invocation and row-source counts, H2 driver and database transaction, same-scan persisted row dump, parser-to-persistence provenance and exact process observations; direct retrieval calls, injected edges, cross-scan rows, missing controller or graph calls and forged invocation ids are rejected.
  - B1 exposes an independently verified empty graph view, while A0 reads only canonical Java-parser rows persisted by CodeGraphPersistenceService into H2 and returned by the canonical GraphService for the same scan; evaluator-owned or injected edges are forbidden.
  - Before A0, all twelve task-level B0 and twelve task-level B1 system transaction sets are valid and retained, each with exactly two prescribed physical-root replays; the one globally strongest baseline has macro task-relevant-evidence recall at most 0.85, at least six tasks have strongest-baseline recall below 1.0, all oracle units exist in exact source bytes, all causal mutation probes pass, budgets are equal and forbidden context is zero.
  - If and only if the discrimination gate passes, exactly one A0 system/candidate transaction set is admitted for all twelve tasks, with exactly two prescribed physical-root replays per task and no additional execution or rerun; otherwise the Task terminates NON_DISCRIMINATIVE_BENCHMARK_NON_PASS with zero capability credit and without reading or running A0.
  - The globally stronger baseline is selected once by macro recall with a deterministic frozen tie-break; no per-task maximum or ensemble is used, and A0 must strictly beat both B0 and B1.
  - A0 macro recall delta against that baseline is at least 0.15, at least four tasks convert from incomplete to complete evidence, at least six paired task deltas are positive, none are negative, the 10000-resample paired-bootstrap 95-percent lower bound is above zero and the exact two-sided sign-flip p-value is at most 0.05.
  - Forbidden-context admission is not greater than the global strongest baseline; A0 median post-materialization context-selection latency is at most 2.0 times B1 on the same product execution face; all twelve tasks remain in every denominator.
  - Raw physical roots remain visible, while the root-independent semantic projection is byte-exact equal across two distinct physical roots; all executions retain closed argv, redacted env, source, graph-row, output, duration, exit and external-effect evidence.
  - CTO, Security and Quality/Evaluation independently reconstruct the single candidate and all gates from immutable raw Evidence and each returns PASS before any canonical integration or P2 capability credit.
required_evidence:
  - Exact canonical source commit/tree, Contract, authorization packet, activation parent, branch, worktree, evidence root, toolchain, argv, redacted environment and all six external-effect identities.
  - One ACTIVE authority and active_work projection that bind the exact Contract write_ownership partition and reduce the Worker effective write set to harness, replay and reports only; Owner and Quality paths are absent from Worker authority.
  - The Generic Harness Worker starts in a fresh no-history Agent context whose prompt contains only the sealed public freeze identity, hash-bound canonical product inputs and its exact read/write authority; it does not inherit Master, CTO, Security or Quality conversation state, and a create-once startup receipt records that context boundary before the Worker reads any task input.
  - Immutable supersession identities and reason-coded NON_PASS receipts for every pre-final-seal draft, including the V5R7 and V5R8 pre-seal Security NON_PASS states and all unsealed V5R9 moving roots, exact B0, B1 and A0 formal execution counts of zero for each, and proof that no prior rehearsal, control output or invalid stage identity is reused as V5R9 formal Evidence; unchanged source bytes may be admitted only after fresh V5R9 closed-inventory, hash and point-of-use verification.
  - Closed create-once V5R9 public dataset, Quality-custody oracle, causal, product-binding, product-execution attestation, adapter and evaluator inventories, their read-only physical seals and a point-of-use verifier invoked before every B0, B1, A0 and final evaluation transaction.
  - Twelve source inventories and source-byte hashes, independent issue-to-causal-relevance records, original behavior probes, twelve causal mutants, twenty-four exact evidence anchors and exact before/after behavior or minimal reference-change assertions outside Worker visibility.
  - Raw B0 and B1 transactions for all twelve tasks, the global comparator choice, complete pre-treatment discrimination calculations and an admission receipt that precedes any A0 execution.
  - Canonical-JSON, duplicate-key-free raw product-execution transactions that bind the actual physical execution roots, compiled test and product classes, source and tool hashes, fixed argv and redacted environment, build and process exits, MockMvc requests and responses, unique controller and GraphService observations, H2 driver and same-scan persisted-row receipts and independently reconstructed zero external effects.
  - At most one raw A0 system/candidate transaction set with exactly two prescribed physical-root replays per task, persisted same-scan graph-row identities and source hashes, per-task selections, stable units, UTF-8 packed bytes, metrics, paired deltas, bootstrap samples, sign-flip counts, forbidden-context counts and B1/A0 comparable latency samples.
  - Exact two-root raw inventories and normalized projection equality, one candidate manifest, product-tree unchanged proof, rollback proof and independent CTO, Security and Quality/Evaluation receipts.
rollback: >-
  Abandon only the P2-066 Task branch/worktree and preserve create-once Evidence.
  If the reviewed non-product harness, evaluator or governance candidate has
  already been integrated, use a non-destructive Git revert of that exact
  integration commit. Product source and accepted P2-065 terminal facts remain
  byte-identical throughout.
stop_conditions:
  - Canonical source, Founder decision, V5R9 frozen input identity, source inventory, product binding or any pre-treatment byte drifts before its corresponding transaction.
  - The normative freeze is not representative repository-maintenance work, omits any Evaluation Protocol TaskSpec field, contains designed query-repetition decoys or randomized target naming that mechanically rigs lexical exclusion, or cannot close Security and CTO product-execution attestation requirements before its first control; no normative B1 or A0 may run on any superseded draft or control lineage.
  - B0 or B1 is invalid, omitted, rerun or removed; the global strongest baseline exceeds 0.85 macro recall; fewer than six tasks are incomplete; any oracle, causal, equal-budget or zero-forbidden check fails.
  - B1 and A0 cannot use the same canonical controller path and compiled source with the graph relation view as the sole treatment variable, or A0 graph provenance cannot be proven as persisted same-scan canonical parser output.
  - Any Worker access reaches validation oracles, causal private records, Quality outputs or A0 outcomes before the permitted freeze boundary.
  - Any result has an unknown source unit, duplicate unit, path escape, symlink or hardlink, cross-scan row, non-finite or negative duration, unequal byte budget, self-reported effect, open schema or unbound physical root.
  - A path, dependency, external effect, implementation iteration, candidate, repair, validation rerun, post-outcome tuning or permission outside this Contract is required.
  - A high-severity source-identity, root-containment, graph-provenance, evaluator-independence, replay, rollback or product-tree-unchanged blocker remains open.
forbidden_actions:
  - Restore, read, compare, copy, execute or reuse P2-065 rejected engineering, candidate bundle, hidden or validation content, raw evaluator lineage or implementation assets.
  - Read validation relation or causal oracles, output or reference-change bytes from the Worker context, or disclose them through Contract, branch, harness, logs or public Evidence.
  - Reuse a Master, CTO, Security or Quality Agent context as the Generic Harness Worker, or pass any reviewer conversation, validation-custody locator, validation selector, raw validation oracle identity, validation nonce or post-run validation reveal into the Worker prompt; DEV references remain governed by the public development split.
  - Change, replace, reword, rebudget or refreeze any task, source, query, oracle, split, exclusion, causal-relevance record, candidate universe, packing rule, metric or threshold after the first valid V5 control output.
  - Run A0 before an independently reconstructed PASS discrimination gate, admit more than one A0 system/candidate set, execute any system/task outside its exact two prescribed physical-root replays, rerun a control, tune after any outcome or remove an invalid or failed task from the denominator.
  - Compare a direct retrieval service B1 with a controller A0, inject evaluator-owned graph edges, accept cross-scan rows, use graph reachability as its own relevance oracle, enable embeddings/LLM or mix B0 wall-clock latency into the B1/A0 product latency guardrail.
  - Use a task-provided command, downloader, network, Provider, Secret, remote, production or public capability; push, create a PR, release or modify product source.
  - Enter P3, claim P2 or Long-term Goal completion, overwrite P2-065 terminal facts, or terminate P2, the SourceLens project or the active Long-term Goal because this Task stops.
claim_boundary: >-
  One offline cooperative-local P2 Research Task may build only generic harness,
  evaluator, dataset, replay and governance support around the unchanged current
  canonical Java Code QA product; freeze twelve new source-bound Java tasks;
  compare B0 and graph-disabled B1 before admitting one graph-enabled A0; and
  claim at most bounded Java structural-maintenance context-discrimination
  evidence for the exact ad705 SourceLens repository after exact independent
  review. It does not establish cross-repository or cross-language
  generalization. Activation, a valid run or a local metric alone is not P2
  capability credit, product or production readiness, P2 completion, P3 entry
  or Long-term Goal completion. Task NON_PASS leaves P2 active and returns
  scheduling to Master subject to the remaining envelope.
