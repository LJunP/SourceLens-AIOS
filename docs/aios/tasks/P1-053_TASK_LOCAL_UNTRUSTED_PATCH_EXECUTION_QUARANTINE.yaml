minimal_safety_invariants:
  - The runtime boundary is the exact deny-default OS profile; patch-content text, regex, token or AST capability denial is not an accepted security boundary.
  - No network transport, Provider call, real Secret read, remote mutation, production effect or public effect is implemented or exercised.
  - The trusted parent is not patch-controlled and the untrusted child cannot write canonical source, task Evidence or any materialization content.
  - Accepted P1-035 and P1-048 bytes remain immutable and every run uses a fresh task-owned disposable materialization.
  - Every materialization directory is real, contained and uniquely owned; every canary and Evidence leaf is regular, non-symlink, link-count one and create-once; cleanup removes only an object whose exact creation identity the current run owns.
  - The formal negative matrix touches no real Secret, real external address, pre-existing Evidence or user asset.
  - Dynamic import, computed access, symlink, parent traversal and file-URL probes reach runtime denial instead of being rejected by patch text inspection.
  - Profile, sandbox executable, Node, argv, cwd, environment or materialization identity drift fails before child launch.
  - Any child descendant, usable socket, forbidden file access or synthetic canary drift is a false accept and immediate terminal failure.
  - Each Run performs exact inverse patch rollback and verifies the frozen base tree, source hashes, population and clean state before releasing its materialization.

acceptance_criteria:
  - Current exact macOS, sandbox-exec signature and bytes, Node, trusted-parent Git, profile, runner, argv, cwd, rebuilt environment and accepted inputs are hash-bound in executable Evidence.
  - A safe exact REP-001 patch runs issue and regression tests in quarantined children using the two direct Node commands and both exit zero.
  - Independent Run A and Quality-owned Run B use distinct fresh materializations, repeat admission, patch, tests and rollback, and produce byte-identical stable projections after excluding physical path, inode, PID and timing fields.
  - Host, canonical and Evidence synthetic canary classes each deny read, write-existing, create, rename, unlink and hardlink operations; pre-existing canary identity fields and hashes remain unchanged and absent targets remain absent.
  - Synthetic loopback bind and connect probes are denied before any listener or connection becomes usable; no DNS or real external address is used.
  - A synthetic Secret environment canary and synthetic Secret file canary are invisible and unreadable to the child; no real Secret is read.
  - Dynamic import, computed global access, symlink escape, parent traversal and file-URL escape are admitted to a quarantined child and denied by the runtime profile.
  - Child-process spawn, shell execution and timeout-descendant probes create no descendant process.
  - Profile-byte, sandbox-identity, argv, cwd, environment-key, materialization-population, symlink, hardlink, link-count and mode drift cases fail before child launch.
  - The frozen negative matrix records zero false accepts and no forbidden or external effect.
  - Targeted verification and accepted P1-035/P1-048 regressions pass before exact-candidate review.
  - Fresh CTO, Security and Quality reviewers PASS the same exact candidate commit and tree before Task Gate.
  - After Task Gate, the reviewed tree is integrated locally, equals the reviewed tree exactly and one clean canonical make verify passes.

