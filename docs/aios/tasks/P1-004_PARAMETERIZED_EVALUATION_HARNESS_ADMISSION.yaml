  candidate_completion_requires:
    - all acceptance criteria
    - frozen candidate commit/tree and Evidence Manifest
    - rebuild, rollback and offsite PASS
    - CTO, Security and Quality PASS
  founder_gate_required: true
  automatic_main_advance: false
  automatic_next_task: false
  explicit_non_authorizations:
