architecture_constraints:
  - Implement only from accepted canonical specifications and accepted P1 assets.
  - Do not inspect, compare or reuse P1-171 rejected engineering assets.
  - Treat every Evidence run as a typed transaction with explicit states: CREATED, ADMITTED, FINALIZING, FINALIZED or FAILED_PRESERVED.
  - Bind every input and created object by normalized absolute path, type, mode, device, inode, link count, byte length, SHA-256 and current-execution creation identity where applicable.
  - Cleanup authority is an object-level append-only ledger; path containment, process UID or directory ownership alone never proves deletion authority.
  - Preserve and reject unknown, unregistered, identity-drifted, symlink, hardlink, same-UID injected and cross-device objects.
  - Never recursively delete an unregistered object or a subtree containing an unregistered object.
  - Finalization uses create-once staging, file and directory fsync, atomic same-device rename and a post-rename closed-inventory observation before emitting a finalization receipt.
  - The Worker emits raw outcomes only; it does not author the independent verdict or false-accept count.
  - The independent oracle consumes frozen case taxonomy plus raw stdout, stderr, exit status, filesystem snapshots, receipt identities and observer Evidence.
  - The oracle must not read Worker PASS, rejected, expected_reason, false_accept, success or equivalent verdict fields.
  - Formal execution is permanently disabled until the entire pre-formal Gate passes.
