global_base_failure_oracle:
  required_output_tokens:
    - "not ok"
    - exact assertion_id
  forbidden_output_tokens:
    - SyntaxError
    - ERR_MODULE_NOT_FOUND
    - MODULE_NOT_FOUND
    - ENOENT
    - timeout
    - signal
  forbidden_exit_modes:
    - timeout
    - signal
    - spawn_error

atomic_mutation_matrix:
  - case_id: M01_DATASET_VERSION_DRIFT
    base: frozen_dataset
    target: dataset-manifest.json#/dataset_version
    single_mutation: replace 1.0.0 with 1.0.1 without changing artifact identities
    expected_verdict: FAIL
    expected_reason_code: DATASET_VERSION_MISMATCH
    expected_exit_status: 2
  - case_id: M02_TASK_POPULATION_MISSING
    base: frozen_dataset
    target: dataset-manifest.json#/tasks/5
    single_mutation: remove exactly one declared task entry
    expected_verdict: FAIL
    expected_reason_code: TASK_POPULATION_MISMATCH
    expected_exit_status: 2
  - case_id: M03_UNDECLARED_ARTIFACT_EXTRA
    base: frozen_dataset
    target: dataset root
    single_mutation: add exactly one undeclared regular file extra.txt
    expected_verdict: FAIL
    expected_reason_code: ARTIFACT_POPULATION_MISMATCH
    expected_exit_status: 2
  - case_id: M04_TASKSPEC_HASH_DRIFT
    base: frozen_dataset
    target: tasks/SL-P1-REP-001-RANGE-NORMALIZATION/task-spec.json
    single_mutation: append exactly one LF byte
    expected_verdict: FAIL
    expected_reason_code: ARTIFACT_IDENTITY_MISMATCH
    expected_exit_status: 2
  - case_id: M05_SOURCE_HASH_DRIFT
    base: frozen_dataset
    target: tasks/SL-P1-REP-002-CONFIG-VALIDATION/source-template/src/config.mjs
    single_mutation: append exactly one LF byte
    expected_verdict: FAIL
    expected_reason_code: ARTIFACT_IDENTITY_MISMATCH
    expected_exit_status: 2
  - case_id: M06_SPLIT_COUNT_DRIFT
    base: frozen_dataset
    target: dataset-manifest.json#/split_counts/development
    single_mutation: replace integer 4 with integer 5
    expected_verdict: FAIL
    expected_reason_code: SPLIT_COUNT_MISMATCH
    expected_exit_status: 2
  - case_id: M07_DUPLICATE_TASK_ID
    base: frozen_dataset
    target: dataset-manifest.json#/tasks/5/task_id
    single_mutation: replace the sixth task_id with the first task_id
    expected_verdict: FAIL
    expected_reason_code: TASK_ID_DUPLICATE
    expected_exit_status: 2
  - case_id: M08_ARCHETYPE_COVERAGE_MISSING
    base: frozen_dataset
    target: dataset-manifest.json#/tasks/5/archetype
    single_mutation: replace behavior_preserving_refactor with bounded_logic_bug_fix
    expected_verdict: FAIL
    expected_reason_code: ARCHETYPE_COVERAGE_MISMATCH
    expected_exit_status: 2
  - case_id: M09_PROVENANCE_MISSING
    base: frozen_dataset
    target: tasks/SL-P1-REP-003-SAFE-PATH-JOIN/task-spec.json#/source/provenance
    single_mutation: replace provenance with an empty string
    expected_verdict: FAIL
    expected_reason_code: PROVENANCE_INVALID
    expected_exit_status: 2
  - case_id: M10_PATH_ESCAPE
    base: frozen_dataset
    target: dataset-manifest.json#/tasks/0/task_spec_path
    single_mutation: replace canonical path with ../outside.json
    expected_verdict: FAIL
    expected_reason_code: PATH_CONTAINMENT_VIOLATION
    expected_exit_status: 2
  - case_id: M11_SYMLINK_ARTIFACT
    base: frozen_dataset
    target: tasks/SL-P1-REP-004-COMMAND-RESULT-MAPPING/source-template/src/result.mjs
    single_mutation: replace the regular file with a symlink to another in-root file
    expected_verdict: FAIL
    expected_reason_code: SYMLINK_FORBIDDEN
    expected_exit_status: 2
  - case_id: M12_EXPECTED_FAILURE_ORACLE_DRIFT
    base: frozen_dataset
    target: tasks/SL-P1-REP-005-PROFILE-DISPLAY-NAME/expected-base-failure.json#/assertion_id
    single_mutation: replace the assertion_id with REP005_UNDECLARED
    expected_verdict: FAIL
    expected_reason_code: BASE_FAILURE_ORACLE_MISMATCH
    expected_exit_status: 2

