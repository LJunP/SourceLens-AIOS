    - git clean
    - destructive history rewrite
stop_conditions:
  - Accepted canonical input, Goal, route packet, profile or activation identity drifts.
  - A rejected engineering lineage is required.
  - A required write path exceeds this Contract.
  - Provider or Secret is unavailable inside the exact authorized local boundary.
  - A request would exceed the call, token or monetary cap.
  - A restricted-source, Secret, remote, production or public effect is observed.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the Phase boundary changes.
claim_boundary: >-
  Reproducible bounded empirical B0/B1/B2 baseline on the accepted P1 dataset
  using only the Founder-attested OpenAI-compatible loopback gateway. This does
  not prove direct OpenAI provenance, model superiority, production readiness,
  P1 exit, P2/P3 entry, remote capability, public capability, hostile-principal
  security or strong isolation.
