engineering_rules:
  - Implement only from current canonical accepted assets.
  - Resolve absolute references as absolute paths and relative references only against their declared owned root, then enforce containment.
  - Calibrate the OS observer with an owned held-open loopback connection before reading Secret.
  - Persist request receipt before effect and response bytes plus response receipt before the final observer verdict.
  - One strict diagnostic HTTP 2xx completion automatically enters the sole formal matrix.
  - Execute all 36 formal cells once; retain every failure in the denominator.
  - Ordinary code errors consume same-Task repair iterations and do not create a new route or Task.
quality_freeze:
  offline_preflight:
    - Syntax and import checks pass for every new executable module.
    - Canonical authority and P1 safety entrypoints pass before source mutation and before Secret input.
    - Exact accepted P1-129 adapters and P1-101 trace/replay identities are admitted.
    - B0, B1 and B2 each execute one complete representative control.
    - An owned held-open loopback connection yields durable observer evidence.
    - Observer, filesystem, request/response, inventory and cross-binding negatives all reject.
    - False accepts, Secret reads and Provider requests equal zero.
  formal_execution:
    - The diagnostic result and all 36 formal cells have request-bound receipts.
    - Exactly 36 formal Provider requests execute after one strict diagnostic.
    - All formal cells remain in the denominator without rerun or replacement.
    - The report is reconstructed from frozen receipts and independently verified.
acceptance_criteria:
  - Complete offline preflight passes before the sole Secret read and first Provider request.
  - One strict loopback diagnostic HTTP 2xx completion is durably retained.
  - Exactly 36 formal Provider requests execute with zero automatic retries.
  - The reproducible report satisfies Evaluation Protocol v1.1 and is rebuilt from frozen request/response receipts.
  - False accepts, Secret persistence and unauthorized external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, structured decision, Contract, authority, Goal and activation identities.
  - Offline preflight raw and aggregate outputs.
  - Observer calibration and negative-case evidence.
  - Diagnostic and 36 formal request/response receipts with closed inventories.
  - Accepted-adapter, trace, replay, rollback and evaluator evidence.
  - Reproducible baseline report, rebuild command, independent verify command and result.
  - Exact candidate, manifest, recoverable Evidence tag and fresh reviews.
rollback:
  strategy: DISPOSABLE_OWNED_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical parent, Goal, Founder decision, accepted input or Contract identity drifts.
  - P1-143 rejected engineering or another rejected lineage would be required.
  - The same normalized root cause occurs in adjacent implementation iterations.
  - Task 1 consumes 40 engineering hours or 6 calendar days.
  - Formal execution is NON_PASS or would require a rerun.
  - Secret bytes enter repository, Evidence, logs, traces, prompts, reviews or Vault.
  - A non-loopback, remote, production or public effect occurs.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify is NON_PASS.
  - Permissions, Phase boundary or P1 Exit Gate changes.
