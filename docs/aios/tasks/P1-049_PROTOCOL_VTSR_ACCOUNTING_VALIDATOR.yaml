quality_freeze_after_activation:
  owner: Quality and Evaluation Agent
  worker_may_modify: false
  worker_must_start_within_engineering_hours: 1
  governance_and_pre_worker_budget_engineering_hours: 1.2
  freezes:
    - executable Task Card, commands and exact accepted-input identities
    - primary 8-entry matrix, outcome receipts and expected canonical outputs
    - independent genericity matrix with previously unseen task, system and environment identities
    - task-level k-of-n aggregation rules and reason-code taxonomy
    - negative-control cases, expected reason codes and maximum false accepts zero

minimal_safety_invariants:
  - Matrix, outcomes and fixture leaves are regular, nlink one and identity-bound before use; every existing path component is inspected without following symlinks and frozen leaves also match exact size and SHA-256.
  - Repository fixture globs are matched only against normalized repository-relative paths physically contained under the canonical repository.
  - Each formal Run A, Run B and comparison root is a disjoint strict child of the exact task execution_evidence_root, absent before its assigned executor exclusively creates it, and never used through a symlinked ancestor.
  - Output parent directories and newly created output directories are real owned directories bound by device, inode, uid and mode; directory nlink is not treated as a leaf-file invariant.
  - Pre-existing, symlinked, hardlinked or escaped file targets fail closed before any unrelated mutation.
  - Each output leaf is atomic, create-once, regular and nlink one; no source receipt or Quality fixture is modified.
  - Worker cannot create or modify the Task Card, matrices, outcomes, oracle, expected result or independent verdict.
  - Before its root is finalized and hash-bound, the Run B executor receives and reads only the frozen Contract, Quality Task Card, matrices, outcomes, accepted exact inputs and exact candidate; it neither receives nor reads any P1-049 Run A path, output, receipt, log, projection, manifest or verdict.
  - Master compares stable projections only after both disjoint run roots are finalized; the comparison receipt binds physical roots, executor identities, input identities, execution order and run_b_executor_received_or_read_run_a false.
  - Canonical JSON ordering is deterministic and input object or array ordering cannot change semantic output bytes.
  - Implementation contains no current Task, control, run ID or current receipt hash hardcoding.

scratch_cleanup:
  retained_evidence_rule: Finalized Run A, Run B, comparison, review, manifest and raw Evidence bytes are never removed by run-level rollback or verifier cleanup.
  permitted_scope: Only disposable scratch created by the same verifier or run executor may be removed by that owner.
  create_receipt_fields:
    - canonical_parent
    - absolute_path
    - device
    - inode
    - uid
    - mode
    - task_local_random_marker
  pre_cleanup_checks:
    - inspect every existing path component with lstat and follow no symlink
    - prove strict physical containment under the exact owner scratch parent
    - match the full create receipt and reject substituted or hardlinked leaves
    - emit a cleanup receipt listing only exact task-owned scratch bytes removed
  mismatch_behavior: FAIL_CLOSED_WITH_ZERO_DELETION

acceptance_criteria:
  - ./scripts/verify-p1-vtsr-accounting.sh exits zero on the exact candidate without network or external side effects.
  - Worker implementation and verifier contain no AIOS-P1-048, SL-P1-REP-006, accepted run ID, candidate ID or current result hash literals; Quality's unseen-identity genericity fixture passes.
  - The frozen primary oracle schedules 8 entries and derives invalid 1, denominator 7, numerator 2, failures 5 and exact VTSR 2/7 with an exact reason-code distribution.
  - SUCCESS is derived only from exact identity, independent evaluator PASS, required tests PASS, Evidence completeness, valid rollback, no forbidden or policy action and declared scope; input success or verdict fields are ignored as authority.
  - Timeout, budget exhaustion, Agent crash, missing Evidence, policy violation and ordinary setup failure remain denominator failures.
  - Only a predeclared reason code with affects_shared_harness true can become infrastructure-invalid; its raw record remains, invalid_count increments and rerun_required is true.
  - Retry or attempt records stay inside one scheduled key and do not add denominator entries; duplicate outcome, unscheduled key or task/system/environment/repetition identity drift fails closed.
  - Post-hoc exclusion requests remain denominator failures and cannot improve VTSR.
  - Task-level predeclared k-of-n aggregation, every count and every reason code are mechanically retained.
  - Denominator zero yields vtsr null and REPORT_NOT_ACCEPTABLE; NaN, Infinity or a percentage without counts is forbidden.
  - Worker fresh Run A and independent Quality fresh Run B stable projections are exact canonical JSON byte-equal despite permissible input ordering changes; Quality finalizes Run B without receiving or reading any P1-049 Run A artifact.
  - Frozen negative controls cover authoritative-success spoofing, missing Evidence, policy violation, invalid rollback, retry inflation, duplicate outcome, unscheduled outcome, identity tamper, post-hoc exclusion, undeclared infrastructure invalid, valid shared-harness invalid, zero denominator, ordering, symlink, hardlink, path escape, pre-existing output and P1-048 receipt digest tamper with zero false accepts.
  - Targeted verifier, accepted P1-035 regression, accepted P1-048 verifier, affected project checks and candidate make verify pass before exact-candidate review.
  - Fresh CTO, Security and Quality exact-candidate reviews pass; the exact reviewed tree is fast-forward integrated and canonical make verify passes before Task Gate acceptance.

required_evidence:
  - exact Contract, authority record, Quality Task Card, fixtures, candidate and accepted-input identities
  - primary expected versus actual canonical ledger and VTSR summary
  - executable negative-control results with expected reason codes and zero false accepts
  - Worker Run A raw artifacts and independent Quality Run B raw artifacts
  - exact stable-projection equality, input-order invariance and a Master comparison receipt proving disjoint physical roots and Run B read isolation
  - targeted verifier, P1-035 regression, P1-048 regression and affected project-check results
  - fresh CTO, Security and Quality exact-candidate target verdicts
  - integration tree equality, canonical make verify and Task Gate receipt

negative_control_minimum:
  maximum_false_accepts: 0
  cases:
    - SUCCESS_FIELD_ONLY_WITHOUT_INDEPENDENT_PASS
    - PASS_WITH_MISSING_EVIDENCE
    - PASS_WITH_POLICY_VIOLATION
    - PASS_WITH_INVALID_ROLLBACK
    - RETRY_AS_EXTRA_DENOMINATOR_OR_DUPLICATE_OUTCOME
    - UNSCHEDULED_OUTCOME
    - TASK_SYSTEM_ENVIRONMENT_REPETITION_IDENTITY_TAMPER
    - POST_HOC_EXCLUSION
    - UNDECLARED_INFRASTRUCTURE_INVALID
    - PREDECLARED_SHARED_HARNESS_INVALID
    - ZERO_DENOMINATOR
    - INPUT_ORDER_PERMUTATION
    - SYMLINK_HARDLINK_PATH_ESCAPE_OR_PREEXISTING_OUTPUT
    - P1_048_RECEIPT_DIGEST_TAMPER

rollback:
  run_level: Preserve every finalized Evidence root and byte. Remove only disposable scratch whose exact create receipt, physical containment, owner and path-component identities all match, then retain a cleanup receipt; any mismatch performs zero deletion.
  candidate_level: Do not integrate a NON_PASS candidate; preserve Evidence and remove only the verified task-owned clean worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence.

stop_conditions:
  - P1-048 accepted candidate, Task Gate receipt or terminal Truth identity drifts before activation.
  - Worker has not started within 1 engineering hour after activation.
  - Continuing requires modifying P1-048 or reading or reusing a historical rejected or terminal asset body.
  - Current Task, control, run ID or receipt hash hardcoding cannot be eliminated.
  - Any counting rule drops a scheduled denominator entry, hides a system failure as invalid, permits post-hoc VTSR improvement, trusts an input success field or emits a percentage without counts.
  - Quality ownership is contaminated, Run B receives or reads any P1-049 Run A artifact, or Evidence is overwritten, hardlinked, symlinked or escapes its root.
  - One bounded same-Task repair is consumed and the exact candidate remains TARGET_NON_PASS.
  - The 12 engineering-hour, 3 calendar-day, one-correction, one-repair or one-candidate bound is exhausted.
  - Network, Provider, Secret, remote, production, public, P2, P3, baseline empirical claim, B0/B1/B2 adapter, hidden-set, evaluator-risk characterization or another Founder-reserved expansion is required.

forbidden_actions:
  - modifying P1-048 Contract, Task Card, runner, verifier, results, Evidence or accepted claim
  - reading, restoring, retrying or reusing any historical rejected or terminal engineering, Quality, Review or Evidence asset body
  - creating successor, replacement, normalization, closure, feasibility or remediation chains
  - changing the P1 Exit Gate, Phase route, Founder policy or authority-validator semantics
  - network, Provider, Secret, dependency download, remote, production or public effects
  - push, pull request, release or remote mutation
  - P2 or P3 entry, Agent Shell, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime work
  - claiming baseline, B0/B1/B2, hidden-set, evaluator-disagreement, Agent, P1 Exit, production, portability or hostile-principal capability from this Task

