acceptance_criteria:
  - complete offline preflight PASS before any Secret read or Provider request
  - packet, Truth, Contract, and authority Founder-reserved profiles are exactly equal
  - exactly 36 scheduled runs produce 36 terminal retained outcomes
  - six tasks each have distinct B0, B1, and B2 configurations and two independent runs
  - all three cross-run stable-projection pairs per task are exact canonical-JSON byte equal
  - raw stochastic identity is retained and not forced equal
  - B2 records the exact accepted-P0 analyzer child invocation
  - every predeclared negative case retains complete raw Evidence and is rejected
  - false_accepts equals zero
  - undeclared_executions equals zero
  - nonowned_mutations equals zero
  - remote, production, public, and non-loopback effects equal zero
  - VTSR denominator includes every eligible scheduled run and reports invalid and failure reason counts
  - one-command replay rebuilds the aggregate report from retained raw Evidence
  - physical rollback and cleanup receipts verify owned-root restoration
  - fresh CTO, Security, and Quality TARGET_VERDICT all PASS the same exact candidate
  - reviewed tree equals integrated tree and one canonical make verify PASS
required_evidence:
  - offline preflight receipt with Provider request count zero and Secret read count zero
  - frozen analyzer executable identity
  - exact 36-run schedule and run ledger
  - raw per-run Evidence packages
  - cross-run stable-projection comparison receipts
  - raw per-case negative Evidence and cleanup receipts
  - observed-effect receipts
  - VTSR aggregate and failure taxonomy
  - reproduction command and replay receipt
  - rollback receipts
  - exact candidate manifest and Evidence tag
  - fresh CTO, Security, and Quality final reviews
  - exact integration and canonical make verify receipt
stop_conditions:
  - offline preflight cannot pass inside the initial implementation plus one code-only repair
  - any Secret read or Provider request occurs before offline preflight PASS
  - Provider requests exceed 72 or any automatic retry occurs
  - any non-loopback, remote, production, or public effect occurs
  - any Secret reaches a prohibited sink
  - a failed or rejected engineering asset is read, compared, restored, or reused
  - the 36-run schedule, accepted inputs, or frozen claim boundary drifts
  - false accept, undeclared execution, non-owned mutation, or Evidence overwrite occurs
  - the same normalized root cause repeats after the sole code-only repair
  - any fresh final Reviewer TARGET_VERDICT is NON_PASS
  - reviewed tree differs from integrated tree
  - canonical make verify is NONPASS
forbidden_actions:
  - modify P1-106 or any rejected engineering asset
  - read P1-106 candidate, source, fixture, test, oracle, or formal Evidence
  - modify accepted B0/B1/B2 adapter bytes
  - modify canonical authority or safety validator semantics
  - use a constant false field as proof of independent effect observation
  - omit or aggregate away raw negative-case Evidence
  - self-compare one run as two independent runs
  - send restricted source, test, reference patch, evaluator, governance, Truth, Secret, or hidden material to Provider
