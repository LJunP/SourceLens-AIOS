acceptance_criteria:
  - The formal plan is the exact ordered cross-product of six accepted tasks and six profile/repetition configurations with 36 unique cells.
  - B0, B1 and B2 formal contexts are independently built without reference-solution or answer-bearing program bytes.
  - Complete P1-129 conformance controls, all six P1-149 tasks and P1-101 replay pass offline with zero Provider requests, Secret reads and false accepts.
  - The synthetic 36-cell rehearsal exercises transport, admission, profile bridge, P1-149/P1-101 composition, evaluator, accounting and finalization without Provider or Secret effects.
  - Secret reflection, response cap, usage, observer, path, ledger, concurrency, inventory, cleanup, tamper, false-success and report-as-input negatives all reject.
  - One operator-owned no-echo Secret entry drives exactly 36 loopback Provider requests with zero retry and no unauthorized external effect.
  - Every scheduled cell is terminal and included in the fixed denominator; negative or zero VTSR does not invalidate an otherwise truthful report.
  - The independent report rebuild uses raw Evidence only and satisfies Evaluation Protocol v1.1.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS before exact integration and one canonical make verify.
required_evidence:
  - Exact Founder packet/decision, Goal, activation parent, Contract and authority identities.
  - Readiness-probe identity and proof that it is not a formal cell or repeated diagnostic.
  - Frozen 36-cell plan, profile contracts and no-answer-leakage checks.
  - Complete offline pre-formal receipts, raw negative Evidence and false-accept accounting.
  - Fixed append-only accounting ledger, per-cell request/response/observer/admission/spine/evaluation receipts and terminal outcomes.
  - Closed raw Evidence inventory, independent rebuild/verifier receipt and reproducible report.
  - Candidate commit/tree/diff manifest, fresh reviews, reviewed/integrated tree equality and canonical make verify result.
rollback:
  strategy: OWNED_DISPOSABLE_COPY_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical, Goal, Founder decision, accepted-input, readiness-probe or activation-parent identity drifts.
  - P1-174 rejected engineering or formal Evidence is read or reused.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus three pre-formal repairs are exhausted.
  - The formal matrix would be run more than once or any Provider request would be retried.
  - Secret reflection/leakage, non-loopback effect, accounting bypass, Evidence integrity failure or canonical mutation occurs.
  - A final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - P1 Objective, Exit Gate, Phase sequence or permission boundary changes.
forbidden_actions:
