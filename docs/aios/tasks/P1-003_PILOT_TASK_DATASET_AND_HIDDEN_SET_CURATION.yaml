    - issue_retrieved_at_utc
    - issue_original_bytes_sha256_or_null
    - code_license_spdx_or_internal_rights_label
    - code_license_blob_sha256
    - notice_and_attribution_status
    - internal_usage_rights_status
    - public_redistribution_status
    - issue_text_rights_status
    - patch_rights_status
    - oracle_and_test_rights_status
    - secret_personal_data_and_large_file_scan_result
    - issue_lineage_id
    - patch_similarity_cluster_id
    - model_training_exposure
    - bounded_task_category
    - dependency_artifact_manifest_ref
    - admission_decision
    - exclusion_reason_codes
  closed_enums:
    source_origin:
      - SOURCELENS_HISTORY
      - PUBLIC_ISSUE
    public_visibility:
      - PUBLIC
      - INTERNAL
    worker_visibility:
      - VISIBLE
      - WITHHELD
    expected_patch_visibility:
      - QUALITY_ONLY
      - NOT_RETAINED
    model_training_exposure:
      - UNKNOWN
      - PLAUSIBLE_PUBLIC_EXPOSURE
      - KNOWN_EXPOSURE
    issue_lineage_status:
      - UNIQUE
      - DUPLICATE
      - UNKNOWN
    patch_similarity_status:
      - UNIQUE
      - DUPLICATE
      - UNKNOWN
    within_dataset_contamination:
      - NO_KNOWN_OVERLAP
      - SUSPECTED
      - KNOWN
    public_redistribution_status:
      - ALLOWED
      - RESTRICTED
      - PROHIBITED
      - UNKNOWN
    asset_internal_usage_rights_status:
      - ALLOWED
      - RESTRICTED
      - PROHIBITED
      - UNKNOWN
    asset_rights_field_binding:
      - issue_text_rights_status
      - patch_rights_status
      - oracle_and_test_rights_status
    internal_usage_rights_status:
      - ALLOWED
      - RESTRICTED
      - PROHIBITED
      - UNKNOWN
    bounded_task_category:
      - CI_OR_BUILD_WORKFLOW
      - BACKEND_BEHAVIOR
      - FRONTEND_BEHAVIOR
      - TEST_ORACLE_OR_REGRESSION
      - SCRIPT_OR_AUTOMATION
      - CONFIGURATION_OR_DEPENDENCY
    eligibility:
      - CURATION_ELIGIBLE
      - REGRESSION_ONLY
      - EXCLUDED
  admission_rules:
    - UNKNOWN or PROHIBITED internal usage rights for bytes that would be copied exclude those bytes from canonical, custody and offsite packages.
    - RESTRICTED internal-usage assets may remain only in separated private research custody and private offsite; their public redistribution status remains PROHIBITED.
    - Public redistribution PROHIBITED does not prohibit private internal custody when internal usage rights are independently RESTRICTED or ALLOWED.
    - ALLOWED does not authorize public release; public release remains Founder-reserved.
    - UNKNOWN issue_lineage_status or patch_similarity_status excludes a candidate from hidden.
    - Model-training exposure UNKNOWN may remain curation-eligible only with the explicit no-model-unseen claim boundary.
    - Exclusions remain in a reason-coded candidate exclusion ledger.
    - SourceLens paths are eligible only when the Founder rights assertion covers the exact path and no uncovered imported or third-party bytes enter custody.
  task_spec_mapping:
    SourceLens_internal_research: >-
      TaskSpec source.redistribution is restricted, meaning internal controlled use
      only. The admission ledger separately records public_redistribution_status as
      PROHIBITED; this is not a public-release authorization.
    public_asset: TaskSpec source.redistribution mirrors the independently verified asset disposition.

task_eligibility:
  required_for_each_of_eight_tasks:
    - TaskSpec validates against the accepted TaskSpec v1 schema without schema modification.
    - A curation-only EnvironmentSnapshot validates against the accepted EnvironmentSnapshot schema, can be materialized, and uses the exact no-model sentinel defined below.
    - Immutable base commit and tree reconstruct to a clean source snapshot.
    - A real public Issue or explicitly labeled internal reconstructed problem statement is bound.
    - An issue-specific oracle or behavioral assertion exists and is not only golden-patch byte equality.
    - The base revision demonstrates the declared failing behavior or explicit unmet assertion.
    - The reference patch makes issue-specific and required regression verification pass.
    - Curation verification runs only in an already available fixed-digest disposable OCI environment with zero network, zero Secret, zero Provider, zero remote and zero production effect.
    - Reference patch changes no more than five source/test files and no more than 250 effective non-generated, non-lockfile lines.
    - Each required verification command completes within 600 seconds.
    - Source, Issue, patch, tests and oracle internal usage rights are ALLOWED or explicitly RESTRICTED with separated internal custody.
    - Expected patch, private assertions and hidden evaluator bytes are unavailable to future implementation Workers.
  cross_dataset_constraints:
    - Exact split counts are development=4, validation=2, hidden=2.
    - Duplicate issue_lineage_id or patch_similarity_cluster_id among any two eligible tasks is forbidden, including within the same split.
    - Repository identity overlap across splits is zero.
    - Issue lineage overlap across splits is zero.
    - Patch-similarity cluster overlap across splits is zero.
    - SourceLens history appears only in development.
    - The two hidden tasks use two distinct external repository lineages.
    - At least two language or build ecosystems and three bounded engineering task categories are represented.

curation_environment_snapshot_contract:
  purpose: SOURCE_AND_ORACLE_CURATION_ONLY
  accepted_schema: docs/aios/schemas/environment-snapshot.schema.json
  exact_no_model_sentinel:
    model_ref: curation://no-model
    provider: none
    model_id: no-model-curation-only
    model_version: "1"
    parameters: {}
    prompt_version: curation-no-prompt-v1
    policy_version: p1-pilot-curation-policy-v1
  claim: >-
    These values satisfy the accepted schema while truthfully recording that this Task
    performs no model or baseline run. They are not a live-model configuration.
  later_transition: >-
    Before B0/B1/B2/A0 execution, a separately authorized task must freeze exact model,
    prompt, policy and SystemConfiguration identities and create a new dataset version
    with new TaskSpec and EnvironmentSnapshot hashes. Silent replacement is forbidden.

baseline_context_freeze_rule: >-
  Every TaskSpec requires an exact baseline_context and response format. Context must
  be generated by one deterministic, patch-blind rule frozen before baseline execution.
  The rule may use only the Issue text, path-sorted top-level tree, build descriptors,
  README and declared public source artifacts, with complete-line truncation to a fixed
  byte/token budget. It must not select paths or lines from the reference patch, changed
  file list, hidden oracle, private tests or expected output. Context bytes, ordering,
  SHA-256, response-format bytes and response-format SHA-256 are frozen per task. Any
  rule or byte change creates a new dataset version. This is P1 baseline fairness, not
  P2 Repository Intelligence.

environment_and_oracle_rules:
  acquisition_stage:
    network: PROPOSED_REQUIRES_FOUNDER_EXECUTION_AUTHORIZATION
    third_party_code_execution: forbidden
    dependency_install_or_build: forbidden
    dependency_materialization: >-
      Only deterministic direct retrieval of exact declared artifacts is allowed.
      Package-manager online resolution, install scripts, repository hooks, build
      plugins and candidate source execution are forbidden during acquisition.
  verification_stage:
    begins_only_after: SOURCE_ADMISSION_AND_ACQUISITION_FREEZE
    network: forbidden
    secrets: forbidden
    provider: forbidden
    remote_effects: forbidden
    production_effects: forbidden
    execution_location: external disposable source snapshots inside an existing fixed-digest OCI environment only
    execution_claim: P1_DISPOSABLE_OFFLINE_EVALUATION_ENVIRONMENT_NOT_P3_TRUST_RUNTIME
    minimum_environment_boundary:
      network: none
      secrets: none
      user: non_root
      root_filesystem: read_only
      writable_mounts:
        - exact task-local source and output root only
      host_mounts:
        - no canonical repository
        - no historical Evidence
        - no home directory
        - no credential store
        - no container-engine socket
      capabilities: drop_all
      privileged: false
      lifecycle: one bounded command group followed by teardown and population check
    allowed_execution: >-
      Only exact predeclared issue-specific and regression commands approved in the
      frozen TaskSpec and Security admission may run after image, command and dependency
      hashes are frozen. No installer, package-manager network, repository hook,
      submodule, LFS, privileged command or host mutation is allowed. If the existing
      evaluation environment cannot enforce this minimum boundary, the candidate is
      excluded; this Task must not design a replacement carrier or sandbox.
  oracle_rules:
    - Prefer executable tests and behavioral assertions over golden-patch byte equality.
    - Expected patches may support Quality analysis but cannot be the sole success oracle.
    - Per-task evaluator/oracle plans are Quality-owned and frozen before future baseline implementation.
    - Existing P1-001 evaluator, fixture, oracle and Evidence remain byte-identical and cannot evaluate these real tasks.
  visible_oracle_custody:
    owner: Quality and Evaluation Agent dedicated curation instance
    external_root: /Users/lijunpeng/Desktop/cc/project/.sourcelens-datasets/AIOS-P1-003/pilot-v0.1-quality-oracles
    public_safe_repository_output: evaluation-harness/datasets/pilot-v0.1/oracles/visible-public-safe
    pre_baseline_freeze_receipt: VISIBLE_ORACLE_FREEZE_RECEIPT.json
    required_binding_per_task:
      - task_id
      - evaluator_id
      - evaluator_version
      - evaluator_bytes_sha256
      - issue_specific_command_and_assertion_hash
      - regression_command_hash
      - reference_patch_hash
      - base_failure_evidence_hash
      - reference_patch_success_evidence_hash
    validation_rule: >-
      The public validator bytes may be invoked by Quality with an external hash-bound
      reference patch handle. It emits only typed verdicts and hashes; validation/hidden
      expected patches and private oracle bytes never enter Worker-visible output.

dependency_artifact_contract:
  manifest_name: DEPENDENCY_ARTIFACT_MANIFEST.json
  required_fields_per_artifact:
    - ecosystem
    - coordinate
    - canonical_url
    - sha256
    - byte_length
    - license_spdx_or_status
    - license_or_notice_sha256
    - internal_usage_rights_status
    - public_redistribution_status
    - offsite_eligibility
    - direct_or_transitive
  closure_rule: >-
    Every artifact used by an eligible task must appear in the frozen manifest. The
    complete closure must be enumerable without executing candidate source, repository
    hooks, install scripts or lifecycle plugins. Tasks whose closure cannot be frozen
    this way are excluded.
  execution_rule: >-
    Verification uses the frozen read-only dependency cache with network disabled.
    UNKNOWN or PROHIBITED internal-use artifacts are absent from custody and offsite.

proposed_network_boundary:
  current_status: NOT_AUTHORIZED_BY_THIS_DRAFT
  future_mode: ANONYMOUS_READ_ONLY_PUBLIC_SOURCE_ACQUISITION
  exact_hosts:
    - github.com
    - api.github.com
    - codeload.github.com
    - raw.githubusercontent.com
    - repo.maven.apache.org
  allowed_protocols:
    - HTTPS
  allowed_operations:
    - unauthenticated GET and HEAD for public metadata, archives, license, Issue and dependency artifacts
    - anonymous Git upload-pack clone or fetch for exact public commits; smart-HTTP POST is allowed only for the exact git-upload-pack service and path
  forbidden_operations:
    - SSH
    - Git receive-pack, push, fork, pull request, release, comment or any remote write
    - POST other than the exact anonymous git-upload-pack smart-HTTP operation
    - authenticated request, PAT, cookie, GitHub CLI login or Provider credential
    - LFS, submodule recursion, arbitrary redirect outside the exact host allowlist
    - URL userinfo, query credentials, signed temporary URLs or unredacted authorization material
    - package publish or dependency resolution outside repo.maven.apache.org
  credential_isolation:
    temporary_home: required_empty_directory
    environment:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    required_git_config_overrides:
      - credential.helper=
      - http.extraHeader=
    forbidden_environment_classes:
      - token
      - cookie
      - authorization_header
      - proxy_credentials
      - ssh_agent
      - provider_secret
  ledger_requirements:
    - canonical URL without userinfo or sensitive query plus SHA-256 of the exact request target
    - argv and cwd
    - start and end UTC
    - exit status
    - response or artifact byte count
    - response or artifact SHA-256
    - redirect chain and host decision
  preflight_receipt:
    name: NETWORK_AND_CREDENTIAL_PREFLIGHT_RECEIPT.json
    required_checks:
      - effective Git credential.helper is empty
      - effective Git http.extraHeader is empty
      - temporary HOME is empty except declared task files
      - token, cookie, authorization header, proxy credential and SSH agent variables are absent
      - every scheme and host is in the exact allowlist
      - remote-write verbs and Git receive-pack are rejected
      - request, repository and byte counters start at zero
    non_pass_effect: STOP_BEFORE_FIRST_NETWORK_EFFECT
  freeze_transition: >-
    After acquisition freeze, network returns to zero for environment materialization,
    base/fix verification, rebuild, review and all future baseline evaluation.
  post_freeze_requirement: >-
    The actual network ledger must show zero requests after the acquisition-freeze
    timestamp, and all request/byte/repository counters must close exactly against the
    frozen budget ledger.

