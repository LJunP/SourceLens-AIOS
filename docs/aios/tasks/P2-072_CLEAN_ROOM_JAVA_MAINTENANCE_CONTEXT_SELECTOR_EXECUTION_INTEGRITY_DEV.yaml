acceptance_criteria:
- A preactivation create-once execution envelope mechanically proves every planned compiler, test, replay and negative-fixture write is contained by the exact Task worktree or Evidence root before any Worker product write.
- The candidate contains a non-empty product-source diff and the canonical CodeQaRetrievalService invokes the new JavaMaintenanceContextSelector on its real context-selection path.
- The exact candidate source is compiled with JDK 17 into the Evidence-root class directory, and the source bytes, class bytes, classpath, JDK identity and candidate commit/tree are create-once bound before DEV execution.
- All Maven or direct Java compiler/test processes use an exact hash-bound sandbox-exec deny-network outer command, closed environment, exact cwd and create-once raw stdout, stderr and exit records.
- Only the eight accepted P2-069 DEV task cards and source leaves are opened; the four HELD tasks remain unopened and their formal slot stays locked.
- B1 and Product use the same frozen DEV queries, corpus membership, top-k 10 and UTF-8 byte budget 131072; Product macro precision and recall are not below B1, every task has zero recall regression, and Product macro MRR is strictly above B1.
- Two independent clean DEV replays are byte-exact and bind per-file score, selected ordering, selected bytes, per-task metrics and macro metrics.
- Real-filesystem negative tests fail closed for symlink input, output overwrite, output-root escape, classpath escape, mutable unbound class input, candidate identity drift and HELD request.
- CTO, Security and Quality/Evaluation independently accept the exact candidate and closed Evidence inventory before the Task Gate is accepted.
required_evidence:
- Preactivation execution-envelope manifest, mechanical validation receipt, exact root ancestry and no-symlink proof.
- Exact candidate commit/tree, changed-file inventory, product invocation proof and rollback instructions.
- Exact source-to-class manifest with source and class path, byte length, SHA-256, JDK, javac, classpath and candidate binding.
- Sandboxed compiler, targeted unit-test and DEV replay transactions with outer argv, cwd, closed environment, exit, raw stdout, raw stderr and network-deny profile identity.
- Surefire report inventory, negative-fixture inventory and real-filesystem negative-test receipt.
- Two run-specific DEV transactions, exact comparison receipt, HELD non-open proof and complete create-once Evidence inventory.
- Three independent final review records and one Master Task Gate decision.
rollback: >-
  Do not integrate a NON_PASS candidate. Preserve its exact candidate and Evidence
  inventory, close only the P2-072 Task lifecycle, and keep canonical main, P2-069
  acceptance, P2-070/P2-071 terminal accounting, the locked formal HELD slot, P2,
  P3 HOLD and the Long-term Goal unchanged.
stop_conditions:
- Stop before Worker write if the preactivation execution envelope is absent, mutable, non-create-once, path-escaping, symlink-affected or fails mechanical validation.
- Stop before product execution if source-to-class, candidate, JDK, classpath, sandbox outer invocation, closed environment, stdout, stderr, Surefire or fixture identities are incomplete or drift.
- Stop if any P2-070 or P2-071 branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused as implementation input.
- Stop if any HELD task source leaf, PR payload or build result is opened or any formal HELD evaluation is attempted.
- Stop if any network, Provider, Secret, remote, production, public, database, deletion or write-outside-authorized-roots effect is requested or observed.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse rejected P2-070/P2-071 engineering lineage.
- Write compiler, test, replay or negative-fixture output below /private/tmp, /tmp, the user home outside the exact Evidence root, or any other unbound root.
- Evaluate HELD, tune on HELD, change accepted source-pack bytes, DEV/HELD split, oracle, metric, threshold, top-k, byte budget or schedule.
- Run Maven, Gradle, javac, java or another build/test subprocess outside exact sandbox-exec deny-network containment.
- Use network, Provider, Secret, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, remote, production or public release.
- Delete terminal Evidence, modify Codex private control-plane state, enter P3, create a successor/remediation chain or terminate the Long-term Goal.
claim_boundary: >-
  PASS may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED on the frozen
  eight-task DEV split, raise delivery progress to 70 percent and unlock only one
  formal HELD evaluation slot. It does not establish the P2 Exit Gate, authorize a
  HELD run, enter P3, claim production readiness or close the Long-term Goal.
