bundle_contract:
  schema_language: AIOS_FINITE_CLOSED_SHAPE_V1
  schema_rule: >-
    The schema is a finite data description, not JSON Schema. Every object node
    declares its complete required key set and rejects unknown or missing keys;
    array item shapes, scalar types, enums, constants and integer bounds are
    explicit. Quality and Worker independently execute the schema recursively
    against every positive and mutated artifact. Parsing a schema without
    applying it to the instance is NON_PASS.
  input_status: SYNTHETIC_CONFORMANCE_ONLY_NOT_BASELINE_RESULT
  output_population_exactly:
    - report.json
    - reproduce.json
    - manifest.json
  report_requirements:
    - frozen research question and explicit conformance-only status
    - exact accepted input identities
    - dataset and synthetic configuration identities
    - unique scheduled run IDs and internally consistent success, failure and invalid counts
    - predeclared invalid-run reason codes, failure taxonomy and no post-output exclusion
    - cost and latency fields with synthetic-conformance labels
    - limitations, decision and stop or continue rationale
    - benchmark_claim, baseline_result_claim, vtsr_claim and p1_exit_claim all false
  reproduction_requirements:
    - reproduce.json contains one closed argv_template array only; no shell string
    - argv_template names the frozen compiler entrypoint and exact repository-relative schema and input paths, with only REPOSITORY_ROOT and FRESH_OUTPUT_ROOT runtime tokens
    - the resolver substitutes those two tokens without shell evaluation and rejects every unknown token
    - the resolved exact argv must invoke the frozen compiler from the frozen input into a newly created, previously absent, uniquely owned output root
    - the compiler must create all three bundle files and then invoke the independent Worker validator on the fresh bundle before returning PASS
    - repository-relative input paths and an absolute fresh output root only after token resolution
    - local Node.js standard-library command only
    - exact input, schema, compiler and validator SHA-256 and byte lengths
    - network, Provider, Secret, remote, production and public effects false
  manifest_requirements:
    - exact two non-manifest file identities, lexicographically sorted and unique
    - manifest root binds UTF-8 path, NUL, lowercase SHA-256, NUL, decimal byte length and LF
    - create-once output; no overwrite, symlink follow or pre-existing output adoption
  determinism: identical frozen input and exact implementation bytes must produce byte-identical output bundle in distinct owned roots
  reproduction_proof: >-
    Formal Run A and Run B each execute the exact resolved argv from
    reproduce.json, never a direct substitute command and never validation of
    pre-existing output. Each run rebuilds all three files in its own fresh
    root, validates them, and compares report.json, reproduce.json,
    manifest.json, manifest root and stable projection byte-for-byte with the
    retained reference compilation.

