architecture_constraints:
  - Preserve scan_result_schema_version 2 and all existing accepted scanner fields; add a separately versioned backward-compatible projection field.
  - Produce symbol-instance identity only from language normalized repository-relative path symbol kind symbol name exact location state span and deterministic disambiguator.
  - Never include repository absolute root package text containing an absolute root or process-specific values in projected identity.
  - Classify every projected relation target as INTERNAL EXTERNAL or UNRESOLVED using producer semantics and deterministic resolution, never identifier-prefix heuristics.
  - Represent missing producer locations explicitly as UNKNOWN; never coerce line zero into a valid source span.
  - Extend TypeScript import and Rust use extraction with actual DEPENDS_ON producer relations and retain existing Java relation production.
  - Sort projected symbol instances and relations deterministically and reject malformed repository-relative paths or duplicate projected identities.
  - Do not read restore compare copy or reuse any rejected P2 engineering asset.
quality_freeze:
  positive_matrix:
    - The real scanner emits a versioned typed relation projection for Java TypeScript and Rust relation-bearing fixtures.
    - Equivalent repositories under different absolute roots emit byte-identical typed projections.
    - Duplicate symbol names in different files remain distinct deterministic instances.
    - Internal external and unresolved target classes are explicit mutually exclusive and producer-derived.
    - Unknown locations remain explicit UNKNOWN and deterministic ordering is stable across replay.
  negative_matrix:
    - repository absolute path leakage
    - repository-relative path escape
    - absolute projected path
    - duplicate projected symbol instance identity
    - duplicate projected relation identity
    - malformed source span
    - ambiguous internal endpoint classified as internal
    - unresolved endpoint classified by prefix heuristic
    - missing location coerced into a valid span
    - scanner projection replay mutation
  required_counts:
    java_relation_fixtures_minimum: 1
    typescript_relation_fixtures_minimum: 1
    rust_relation_fixtures_minimum: 1
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
