  bounded_repair_allowed_only_before_candidate_freeze: true
  mutation_after_candidate_freeze_allowed: false
  run_a_run_b_and_reviews_bind_same_candidate_commit_tree_manifest: true
  formal_run_nonpass_action: TERMINAL_STOP_NO_UNFREEZE_OR_CORRECTED_CANDIDATE

acceptance_criteria:
  - Quality freezes and self-validates the exact Task Card, four program bytes, three full postimages, one no-effect outcome, fixed command/environment profile, negative schedule, stable projection and rollback oracle before Worker mutation.
  - Admission uses length, SHA-256 as a non-authorizing index, and final exact raw Buffer equality against the four frozen bytes before UTF-8 decoding, JSON parsing, materialization, mutation or test child start.
  - The exact four legal programs execute exhaustively and map one-to-one to their frozen outcome; identity produces zero mutation and zero child starts, the two safe-wrong postimages are rejected, and only ARG1/ARG0 passes issue and regression tests.
  - Compiler output is exactly the frozen three full postimages plus the no-effect outcome; it performs table lookup only and cannot generate diff, AST, source, expression, identifier, literal, path, executable, argv, cwd, env or module content.
  - Proposal bytes never reach path, source template, postimage template, executable, argv, cwd, env, module specifier, terminal control, error text or Evidence leaf name; retained proposal Evidence is limited to length and SHA-256.
  - Compiler TCB has no filesystem, child-process, network or dynamic-execution import/API; trusted runner may start only Quality-frozen absolute Node and local Git commands with fixed argv, cwd, timeout, maxBuffer and minimal non-secret env.
  - The deterministic byte-closure schedule covers every-position/every-other-byte substitution, every strict truncation and every one-byte prefix/suffix; legal-to-legal mutations receive their target legal outcome and all other cases reject with zero false accepts.
  - The explicit malformed/payload, filesystem/Evidence/canary and outcome/evaluator-tamper matrices all execute with their frozen expected result; every invalid-input rejection proves mutation_attempts zero, child_start_attempts zero, canary unchanged and external effects all false.
  - Every materialization and Evidence root is fresh, exclusive, task-owned, contained and non-symlinked; target and Evidence leaves are regular and nlink one; pre-existing, symlinked, hardlinked, escaped, identity-drifted or unowned objects are never overwritten, followed, renamed, deleted or cleaned.
  - Sidecars are same-directory create-once/no-follow objects; only exact task-owned materialized T0 with verified preimage/type/mode/nlink may be atomically replaced, and root/target/sidecar identity is rechecked before and after replacement.
  - Base issue test exits with the frozen expected failure while regression passes; the correct frozen postimage makes both tests pass; safe-wrong outcomes remain evaluator failures.
  - After targeted verification, one exact final candidate commit/tree/manifest is frozen and repair closes; Run A and independent fresh Run B execute the same candidate and frozen inputs in distinct roots without candidate mutation.
  - Run B independently reexecutes every legal program and frozen negative control without reading Run A path, receipt or verdict; raw physical Evidence is retained and the predeclared stable projections are exact byte equal with zero residual physical variants.
  - Each mutating outcome rolls back through the frozen complete base postimage and restores exact source bytes, base commit/tree and clean state; identity/no-effect proves that no mutation occurred.
  - Fresh CTO, Security and Quality reviewers return TARGET_VERDICT PASS for the same exact candidate and Evidence; Reviewer NON_PASS terminates the Task without candidate correction.
  - Only after Task Gate may the reviewed tree be squash-integrated locally; integrated tree equals reviewed tree and one clean canonical full make verify passes.

required_evidence:
  - exact Contract, route packet, Goal, authority and Quality freeze identities
  - candidate commit/tree, diff hash, allowed-path population and per-file mode/length/SHA manifest
  - Run A and independent Run B raw commands, streams, action receipts, negative results and stable projections
  - byte-closure schedule counts/digest, legal transitions, rejected count and zero false accepts
  - full postimage table, evaluator outcomes, filesystem/Evidence/canary controls and static TCB checks
  - exact rollback receipts and distinct materialization identities
  - stable projection exact-byte comparison
  - fresh CTO, Security and Quality exact-candidate verdicts
  - reviewed/integrated tree equality and canonical make verify result

rollback:
  run_level: Restore only the exact task-owned materialized T0 through the frozen complete base postimage, verify base commit/tree and clean state, and remove only objects whose create receipt, device, inode and marker still prove ownership.
  candidate_level: Do not integrate a NON_PASS candidate; preserve raw Evidence and a recoverable evidence tag, then remove only a verified-clean task-owned worktree.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence; never reset or clean.

stop_conditions:
  - Quality freeze is incomplete, inconsistent, contaminated or not finished within 0.8 engineering hours after activation.
  - Worker implementation does not start within the first engineering hour or pre-Worker work exceeds 1.4 engineering hours.
  - Legal input or output population ceases to be finite, exact and exhaustively auditable.
  - Any proposal byte reaches a forbidden dataflow sink or any invalid input reaches mutation, test or child start.
  - Any non-frozen postimage, extra changed path, new file, mode drift or source identity drift occurs.
  - Compiler or driver requires generic JSON interpretation, arbitrary text generation, AST/diff/source execution, dynamic execution, open command selection or broader TCB.
  - Evidence, canary, canonical source or a pre-existing object is overwritten, damaged, followed, renamed, deleted or cleaned.
  - An abnormal residual process, external effect, escaped path, ownership drift or cleanup ambiguity occurs.
  - One pre-freeze bounded repair is consumed and targeted verification still does not pass.
  - Candidate is mutated after freeze, Run A or Run B is NONPASS, stable projections differ, false accepts are nonzero, or rollback is not exact.
  - Any fresh Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical full make verify is NONPASS.
  - Network, Provider, Secret, remote, production, public, dependency download, Docker, VM, root, Strong Isolation, P2 or P3 permission is required.

forbidden_actions:
  - reading, restoring, retrying, fixing, replaying or reusing P1-052 rejected or P1-053 failed engineering assets
  - arbitrary diff, generic AST, free-form source, expression, path, command, argv, cwd, env, module or executable selection
  - eval, Function, vm, WebAssembly, dynamic import, shell or model-selected child process
  - model-generated source, test, script, module, command, build hook or package lifecycle execution
  - real or third-party untrusted repository execution, native addon, package installation or dependency download
  - Docker, VM, root, entitlement, code signing, Strong Isolation, Supervisor, Root Custody, Full Trust Runtime or Multi-Agent Runtime
  - network, Provider, Secret, remote, production, public, push, pull request, release or external side effect
  - P2/P3 entry, P1 Exit Gate change, general Agent, benchmark, hostile-principal, production or P1 Exit claim
  - successor, replacement, normalization, closure, feasibility, remediation, corrected candidate, extra Task or Route V2/V3 chain

