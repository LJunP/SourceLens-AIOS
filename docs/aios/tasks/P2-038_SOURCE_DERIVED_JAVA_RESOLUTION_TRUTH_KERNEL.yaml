architecture_constraints:
  - Admit a closed source inventory before parsing any Java semantic object.
  - Bind every source entry by normalized repository-relative path, regular-file type, byte length and SHA-256.
  - Parse the exact admitted bytes in memory with the canonical accepted JavaParser dependency.
  - Derive package, imports, declarations, lexical owner chain, exact source span and EXTENDS/IMPLEMENTS facts from those bytes.
  - Resolve qualified targets only by exact qualified identity; explicit or wildcard imports must never rewrite a qualified target.
  - Resolve unqualified targets with data-driven lexical, explicit-import, same-package, attested-java.lang and wildcard precedence.
  - Treat duplicate or ambiguous candidates as typed ambiguity and never invent an INTERNAL or EXTERNAL identity.
  - Bind external inventory entries by path, regular-file type, byte length and SHA-256 under one closed inventory.
  - Product replay and independent consumer must independently rederive the same typed facts from the exact admitted inputs.
  - Do not build the P2-039 graph transaction or run the P2-040 benchmark in this Task.
adversarial_prefreeze_gate:
  positive_matrix:
    - exact qualified same-repository target
    - lexical nested declaration target
    - exact single-type explicit import target
    - exact same-package target
    - attested java.lang target
    - unique wildcard-import target from external inventory
    - EXTENDS and IMPLEMENTS facts with exact source spans
    - two physical repository roots produce byte-exact stable semantic projection
  mandatory_negative_matrix:
    - qualified target with colliding same-simple-name explicit import
    - qualified target with colliding wildcard import
    - source bytes changed while package and import claims stay stale
    - compilation-unit path changed while source bytes stay stale
    - external inventory relative path drift
    - external inventory type drift
    - external inventory byte-length drift
    - external inventory SHA-256 drift
    - external inventory missing entry
    - external inventory extra entry
    - duplicate declaration identity
    - ambiguous explicit imports
    - ambiguous wildcard imports
    - missing lexical owner
    - source manifest reorder
    - source manifest duplicate
    - source path escape
    - source symlink
    - source mutation after admission
    - product and independent-consumer verdict disagreement
  required_results:
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
    external_effects_all_false: true
acceptance_criteria:
  - Exact admitted source bytes are the only authority for package, import, declaration, owner, span and relation facts.
  - Qualified targets cannot be hijacked by same-simple-name explicit or wildcard imports.
  - Unqualified resolution precedence is deterministic, data-driven and fail-closed on ambiguity.
  - External inventory path, type, byte length, SHA-256 and closed membership are validated before use.
  - The product and independent consumer agree on every positive and negative semantic case.
  - A small adversarial semantic probe and the complete targeted matrix pass before candidate freeze.
  - Two physical repository roots yield byte-exact stable semantic projections and replay.
  - False accepts, Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Closed source and external-inventory manifests with exact path, type, byte length and SHA-256.
  - Raw parser facts and stable semantic projection for all positive cases.
  - Per-attack raw inputs, product result and independent-consumer result for every negative case.
  - Adversarial semantic probe receipt and complete targeted matrix receipt.
  - Raw command, exit status, stdout and stderr receipts proving the offline execution boundary.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
rollback:
