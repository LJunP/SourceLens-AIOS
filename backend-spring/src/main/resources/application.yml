server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: sourcelens

spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3307/sourcelens?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: sourcelens
    password: sourcelens123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
sourcelens:
  jwt:
    secret: ${JWT_SECRET:SourceLens-2026-SuperSecretKey-ForDevelopmentOnly-PleaseChangeInProduction}
    expiration: 86400000
    denylist:
      redis-enabled: true
  analyzer:
    path: ${ANALYZER_PATH:sourcelens-analyzer}
    timeout-seconds: 300
    max-stdout-bytes: ${SOURCELENS_ANALYZER_MAX_STDOUT_BYTES:67108864}
  workspace:
    base-path: ${SOURCELENS_WORKSPACE:/tmp/sourcelens/repos}
    sandbox-cleanup-enabled: ${SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_ENABLED:false}
    sandbox-retention-hours: ${SOURCELENS_WORKSPACE_SANDBOX_RETENTION_HOURS:24}
    sandbox-cleanup-batch-size: ${SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_BATCH_SIZE:100}
    sandbox-cleanup-cron: ${SOURCELENS_WORKSPACE_SANDBOX_CLEANUP_CRON:0 15 4 * * *}
  sandbox:
    executor: ${SOURCELENS_SANDBOX_EXECUTOR:local}
    docker:
      image: ${SOURCELENS_SANDBOX_DOCKER_IMAGE:alpine/git:latest@sha256:8d6ede0b29c666ac111c732468c4d758c1c08f054f211dd98f15d421a6ffab40}
      memory: ${SOURCELENS_SANDBOX_DOCKER_MEMORY:512m}
      cpus: ${SOURCELENS_SANDBOX_DOCKER_CPUS:1.0}
      network: ${SOURCELENS_SANDBOX_DOCKER_NETWORK:none}
      user: ${SOURCELENS_SANDBOX_DOCKER_USER:1000:1000}
      pids-limit: ${SOURCELENS_SANDBOX_DOCKER_PIDS_LIMIT:256}
      read-only-root: ${SOURCELENS_SANDBOX_DOCKER_READ_ONLY_ROOT:true}
      tmpfs: ${SOURCELENS_SANDBOX_DOCKER_TMPFS:/tmp:rw,noexec,nosuid,size=64m}
  artifacts:
    cleanup-enabled: ${SOURCELENS_ARTIFACT_CLEANUP_ENABLED:false}
    retention-days: ${SOURCELENS_ARTIFACT_RETENTION_DAYS:30}
    cleanup-batch-size: ${SOURCELENS_ARTIFACT_CLEANUP_BATCH_SIZE:200}
    cleanup-cron: ${SOURCELENS_ARTIFACT_CLEANUP_CRON:0 30 3 * * *}
  audit:
    cleanup-enabled: ${SOURCELENS_AUDIT_CLEANUP_ENABLED:false}
    retention-days: ${SOURCELENS_AUDIT_RETENTION_DAYS:90}
    cleanup-batch-size: ${SOURCELENS_AUDIT_CLEANUP_BATCH_SIZE:500}
    cleanup-cron: ${SOURCELENS_AUDIT_CLEANUP_CRON:0 0 4 * * *}
  execution-logs:
    cleanup-enabled: ${SOURCELENS_EXECUTION_LOG_CLEANUP_ENABLED:false}
    retention-days: ${SOURCELENS_EXECUTION_LOG_RETENTION_DAYS:30}
    cleanup-batch-size: ${SOURCELENS_EXECUTION_LOG_CLEANUP_BATCH_SIZE:1000}
    cleanup-cron: ${SOURCELENS_EXECUTION_LOG_CLEANUP_CRON:0 20 4 * * *}
  repository:
    allow-local-file: ${SOURCELENS_ALLOW_LOCAL_FILE_REPOS:false}
    allow-pat-credentials: ${SOURCELENS_ALLOW_PAT_CREDENTIALS:true}
  autorepair:
    submit-pr-enabled: ${SOURCELENS_AUTOREPAIR_SUBMIT_PR_ENABLED:false}
    pr-allowed-git-hosts: ${SOURCELENS_AUTOREPAIR_PR_ALLOWED_GIT_HOSTS:github.com}
  github-app:
    app-id: ${GITHUB_APP_ID:}
    private-key-pem: ${GITHUB_APP_PRIVATE_KEY_PEM:}
    webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    allowed-api-hosts: ${GITHUB_ALLOWED_API_HOSTS:api.github.com}
    webhook-delivery-cleanup-enabled: ${GITHUB_WEBHOOK_DELIVERY_CLEANUP_ENABLED:false}
    webhook-delivery-retention-days: ${GITHUB_WEBHOOK_DELIVERY_RETENTION_DAYS:30}
    webhook-delivery-cleanup-batch-size: ${GITHUB_WEBHOOK_DELIVERY_CLEANUP_BATCH_SIZE:500}
    webhook-delivery-cleanup-cron: ${GITHUB_WEBHOOK_DELIVERY_CLEANUP_CRON:0 45 3 * * *}
  agent:
    tools:
      write-patch-enabled: ${SOURCELENS_AGENT_WRITE_PATCH_ENABLED:false}
      exec-test-enabled: ${SOURCELENS_AGENT_EXEC_TEST_ENABLED:false}
      create-pr-enabled: ${SOURCELENS_AGENT_CREATE_PR_ENABLED:false}
  encrypt:
    password: ${ENCRYPT_PASSWORD:SourceLensDefaultPassword2026}
    salt: ${ENCRYPT_SALT:SourceLensSalt2026}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
