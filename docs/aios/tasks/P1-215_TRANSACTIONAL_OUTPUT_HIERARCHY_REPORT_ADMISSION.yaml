acceptance_criteria:
  - Caller owns one append-only creation journal before any output mutation.
  - Every owned object is journaled with path, type, device, inode and creation order.
  - Any failure reverses the journal before propagation and rollback is idempotent.
  - Rollback removes only objects created by this invocation whose identity still matches.
  - Exact path, ancestor, descendant, case-fold, Unicode-normalization, device/inode, symlink and hardlink aliases fail closed.
  - ENAMETOOLONG, permission denial, non-directory ancestor, identity drift and rename failure prove zero filesystem delta.
  - All destructive tests use unique owned disposable copies and clean them after PASS or NON_PASS.
  - The immutable P1-207 input remains byte-identical before and after every execution.
  - The report is rebuilt only from immutable raw Evidence and records 36/0/28/8/0 exactly.
  - Generated reports are never admitted as input or expected-answer oracles.
  - Provider requests, Secret reads, network, remote, production and public effects remain zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
required_evidence:
  - complete pre-freeze positive and destructive negative matrix receipt
  - per-rejection before/after filesystem snapshot equality proof
  - transaction journal and rollback identity receipts
  - immutable P1-207 pre/post closed-inventory equality receipt
  - raw-Evidence-only report reconstruction receipt
  - exact candidate manifest and tree identity
  - fresh CTO, Security and Quality final reviews
  - reviewed/integrated tree equality receipt
  - one canonical make verify receipt after integration
independent_reviewer:
