acceptance_criteria:
  - JAVA-CTX-v1 uses exactly four public DEV Tasks and six Quality-held validation Tasks over the activation-parent 216 Java files and 934 source chunks.
  - B0 is deterministic lexical, B1 is deterministic lexical plus same-file adjacent, and A0 is B1 plus one-hop fail-closed source-local explicit-import or same-package context.
  - Every Task uses the same source-unit universe and a maximum of eight chunks and 8192 UTF-8 bytes for B0, B1 and A0.
  - A0 macro oracle-span recall exceeds both B0 and B1 by at least 0.15 absolute on DEV and separately on validation.
  - All six validation Tasks have a strictly positive A0 paired delta against both B0 and B1.
  - False accepts, forbidden context, budget violations, oracle leakage, excluded Tasks and external effects are all zero.
  - Two fresh physical roots produce byte-identical ranking, path, span, reason and selected-context byte projections.
  - A0 p95 latency is no greater than two times B1 p95 latency under the same harness.
  - Focused product tests, the existing twenty-two-case retrieval regression and the full backend test suite pass.
  - Independent CTO, Security and Quality reviews all return TARGET PASS for the same unique candidate.
required_evidence:
  - Exact JAVA-CTX-v1 source-universe manifest with 216 Java files, 934 chunks, stable ordering, byte lengths and SHA-256 identities.
  - Quality-created DEV and hidden validation Task records, oracle records, denominator, counting rules and separation receipt.
  - Closed B0, B1 and A0 run records for every admitted Task with budget and latency measurements.
  - One unique candidate identity and proof that validation executed exactly once only after DEV admission.
  - Fresh-root replay comparison, focused product tests, twenty-two-case regression and complete backend test receipts.
  - Independent CTO, Security and Quality TARGET verdicts bound to the exact candidate and Evidence inventory.
rollback: >-
  Revert only the P2-064 candidate commit from the Task branch or local canonical
  integration, remove no historical assets, retain all create-once Evidence and
  return the Code QA product path to the activation-parent behavior.
stop_conditions:
  - DEV does not strictly beat both controls under the frozen acceptance thresholds.
  - Validation does not reproduce the strict advantage or any validation Task regresses against either control.
  - Source universe, budget, denominator, Evaluator or counting rule drifts.
  - Any false accept, forbidden context, budget violation, oracle leakage, regression, determinism failure, rollback failure or source-identity failure occurs.
  - The same normalized root cause recurs after the only allowed same-Task repair.
  - Two implementation iterations, one candidate, 32 engineering hours or eight calendar days are exhausted.
  - Independent final review or canonical verification is NON_PASS.
  - Completion would require rejected P2 lineage, a second P2 Task, expanded permissions or any external effect.
forbidden_actions:
  - Read, restore, compare, copy or reuse any rejected P2 engineering, candidate, test, fixture, Evaluator, Evidence or Review lineage.
  - Create any successor, replacement, correction, normalization, closure, feasibility or remediation Task or chain.
  - Modify graph producers, analyzer-rust, JavaAstParser, database schema, migrations, general parsers, authority platforms, Evidence platforms, Supervisor, Root Custody, Trust Runtime or future-Phase infrastructure.
  - Change P1-219 accepted bytes, the Long-term Goal, Strategic Constitution, P2 Objective, P2 Exit Gate or P3 HOLD.
  - Use network, Provider, Secret, remote, production, public release, fetch, push or pull-request effects.
