acceptance_criteria:
  - The complete serialized control-plane observation of the old Codex Goal is retained as external historical evidence with a SHA-256 digest and cannot regain repository authority.
  - A root AGENTS.md points Codex to the canonical AIOS authority order and excludes legacy context by default.
  - Governance validation reads and hashes the external truth binding, parses its claims, and validates the bound snapshot artifacts.
  - Snapshot verification is read-only by default and cannot rewrite evidence inside the snapshot directory.
  - The exact snapshot has a separately located hash-verified copy; physical-media limitations are stated without overclaim.
  - P0-05 forbids mutation of the inherited worktree and requires a disposable reconstruction for every Git write.
  - No business source, UI, database migration, product behavior, or P1 implementation changes.
required_evidence:
  - archived serialized old Goal control-plane observation and SHA-256
  - original and secondary snapshot verification receipts
  - pre-change and post-change inherited-worktree status comparison
  - governance validator positive and negative tests
  - snapshot verifier immutability test
  - exact changed-path inventory and diff
  - hash-bound P0-04C overlay that applies cleanly to the exact frozen snapshot
  - independent CTO, Security, and Quality and Evaluation verdicts

independent_reviewer: Quality and Evaluation Agent
additional_reviewers:
  - CTO Agent
  - Security Agent

stop_conditions:
  - The inherited SourceLens worktree changes.
  - A preserved snapshot artifact hash cannot be reconciled.
  - A proposed change touches business code, UI, database migrations, or P1 behavior.
  - The Goal control plane requires falsely marking the retired objective complete.
  - A reviewer finds an unresolved critical evidence or source-integrity defect.
forbidden_actions:
  - deleting the old Goal or legacy files
  - marking the old Goal complete when its objective was not achieved
  - writing to the inherited SourceLens worktree or its Git index
  - destructive Git operations, stashing, cleaning, history rewrite, or remote push
  - product development, Runtime implementation, UI work, database changes, or P1 entry

