acceptance_criteria:
  - P1-071 is accepted on canonical main and its single canonical make verify receipt remains PASS.
  - No accepted P1-069 or P1-071 source byte changes.
  - The exact matrix contract, plan and negative catalog are frozen before Worker execution.
  - The five-entry scheduled matrix executes serially with every raw terminal/control result retained.
  - Independent recomputation derives numerator 1, denominator 4, invalid 1 and failures 3 from raw artifacts.
  - Actual primary-evaluator disagreement and candidate-claim false-success confusion are retained without post-hoc rewriting.
  - Every mandatory history/accounting mutation is rejected with zero false accepts.
  - Every disposable root is uniquely and atomically created, ownership-bound and exactly rolled back.
  - Network, Provider, Secret, remote, production and public effects remain false.
  - Targeted verification passes on one clean exact candidate.
  - One exact candidate receives one fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes.
  - Reviewed tree equals integrated tree and one canonical make verify passes after integration.

