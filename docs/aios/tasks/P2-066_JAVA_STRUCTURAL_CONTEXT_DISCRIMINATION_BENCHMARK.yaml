objective: >-
  Determine, on one pre-frozen twelve-task Java structural-maintenance benchmark,
  whether the current canonical SourceLens Code QA path with persisted same-scan
  graph relations selects materially more causally relevant source context than
  deterministic lexical retrieval and the identical canonical product path with
  an explicitly empty graph view, under equal UTF-8 byte budgets and without
  modifying product source.
why_now: >-
  P2 is the strict current Phase, its only Exit item remains MISSING and accepted
  capability credit remains zero. P2-065 was a valid neutral benchmark whose
  B0 and A0 both achieved recall 1.0; it cannot discriminate incremental graph
  value. This independent Task uses new source-bound Java cases, freezes the
  complete public and Quality-private oracle boundary before either product
  control, and fails closed before A0 unless B0 and B1 demonstrate adequate
  headroom. The normative sample must be representative repository-maintenance
  work with source, license, provenance and natural ambiguity; a constructed
  lexical-confound may be retained only as a non-scoring adversarial subset.
  The Task evaluates the already accepted canonical product capability and does
  not restore or reuse any rejected P2-065 engineering lineage.
