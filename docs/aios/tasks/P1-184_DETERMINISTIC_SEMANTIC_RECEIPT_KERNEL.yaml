architecture_constraints:
  - Parse exact UTF-8 JSON with duplicate-key rejection, finite safe integers and no trailing bytes other than the required LF.
  - Use one closed versioned receipt schema; unknown top-level, semantic, identity, count, Evidence or observation fields reject.
  - Stable projection may omit only the closed observational allowlist and must preserve all verdict, reason, expected, actual, count, taxonomy, identity and Evidence fields.
  - Ordering rules are explicit and data-driven; arrays remain order-sensitive unless the schema explicitly declares a set projection.
  - Independent verification reconstructs stable bytes from frozen raw receipt bytes and never trusts Worker PASS or equality claims.
  - Multiple create-once owned parent topologies, including a canonical-like /private/tmp root, must produce exact-equal semantic bytes and leave no undeclared staging or lock residue.
  - The kernel remains offline and does not read a Secret, call a Provider, mutate canonical source or grant P1 capability credit.
