evidence_contract:
  candidate_provenance:
    - candidate commit and tree are captured after source freeze and must equal the reviewed exact bytes
    - source manifest binds every changed repository path by type, byte length and SHA-256
    - Evidence manifest binds the exact source manifest and exact candidate commit/tree
    - stale, same-Task prior-candidate and cross-candidate provenance must reject
  raw_negative_case_contract:
    - every case uses a unique owned disposable fixture root
    - every case persists exact input fixture, mutation descriptor, raw stdout, raw stderr, exit status and verifier receipt
    - aggregate negative ledger is derived from raw case receipts and is never an oracle
    - missing, extra, duplicate, reordered, mutated or cross-bound case objects must reject
  external_effect_contract:
    - each target execution persists exact command, argv, process exit and sandbox policy identity
    - network observation persists raw observer stdout, stderr, exit status and observed sockets
    - Provider and Secret counts are derived from the closed command and input inventory, not Worker constants
    - aggregate six-effect summary is independently reconstructed from raw observation receipts
  containment_and_identity:
    - validate every manifest path for containment, lstat regular type, non-symlink, byte length and SHA-256 before reading
    - reject absolute-path escape, parent escape, wrong root, symlink, non-regular input, mutation and identity drift before semantic parsing

implementation_requirements:
  - invoke the exact accepted scanner artifact on two physically distinct Java repository roots under OS deny-network policy
  - retain raw scanner command, stdout, stderr, exit and socket-observer Evidence for both roots
  - consume only scanner JSON schema version 2 and preserve exact admitted raw bytes
  - derive repository-root-independent canonical file and symbol identities
  - bind every symbol and relation to exact file identity and source span
  - classify every relation endpoint as resolved_internal, external or unresolved
  - resolve Java relations only when package, import, declaration and span Evidence supports the binding
  - deterministically order nodes, edges, classifications and serialized output
  - produce byte-identical graph output from both physical roots
  - produce byte-identical exact replay from frozen admitted scanner bytes
  - avoid new dependencies and avoid any network-capable build step
  - independent verifier must rederive provenance, graph semantics, case verdicts, counts and external effects from raw bytes
  - Worker-authored PASS, counts, ledgers, provenance or effect summaries are never sufficient proof

mandatory_positive_cases:
  - exact accepted-scanner identity admission
  - real accepted scanner invocation on Java root A
  - real accepted scanner invocation on physically distinct Java root B
  - repository-root-independent byte-identical graph projection
  - byte-identical exact replay
  - same-package resolved internal Java call
  - imported cross-package resolved internal Java call
  - external Java endpoint classification
  - unresolved Java endpoint classification
  - exact source-span and symbol-identity binding

mandatory_negative_cases:
  - unimported cross-package same-name symbol cross-binding
  - ambiguous wildcard-import same-name binding
  - fabricated symbol span
  - relation source span outside source file
  - internal endpoint changed to external or unresolved
  - external endpoint changed to internal
  - unresolved endpoint changed to internal
  - scanner stdout mutation
  - scanner receipt missing
  - scanner receipt duplicate
  - evidence manifest reorder
  - unexpected extra Evidence object
  - path escape
  - wrong-root substitution
  - symlink input
  - non-regular input
  - byte-length drift
  - SHA-256 drift
  - candidate commit drift
  - candidate tree drift
  - source manifest drift
  - stale same-Task candidate binding
  - cross-candidate binding
  - raw negative stdout missing
  - raw negative stderr missing
  - raw negative exit-status mutation
  - aggregate ledger drift
  - false-accept summary drift
  - external-effect summary drift
  - forged zero-network observation
  - Provider-count drift
  - Secret-count drift

acceptance_criteria:
  - all mandatory positive and negative cases execute from fresh owned disposable roots
  - at least two real accepted scanner invocations are proven by raw receipts
  - two-root projection and exact replay are byte-identical
  - all graph identities are repository-root-independent and source-span-bound
  - every relation endpoint classification is data-derived and independently checked
  - every negative verdict and aggregate count is reconstructable from per-case raw Evidence
  - candidate commit, tree, source manifest and Evidence manifest are exact and mutually bound
  - targeted false accepts equal 0
  - network, Provider, Secret, remote, production and public effects equal 0
  - no rejected P2 engineering asset is read, restored, copied, compared or reused
  - one exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes
  - reviewed tree equals integrated canonical tree and one canonical make verify passes

required_evidence:
  - exact Founder packet, structured Decision, Goal, activation parent, Contract and Task authority identities
  - exact accepted scanner binding, build receipt, binary identity and raw invocation receipts
  - two admitted raw scanner outputs and their closed inventories
  - deterministic graph outputs, stable projection comparison and replay receipt
  - per-case raw negative fixture, mutation, stdout, stderr, exit and verdict receipts
  - raw OS observer receipts and independently reconstructed six-effect summary
  - exact candidate commit, tree, source manifest, Evidence manifest, diff/hash manifest and recoverable Evidence tag
  - independent verifier package and receipt
  - fresh CTO, Security and Quality Reviews of the same candidate and Evidence bytes

rollback:
  strategy: OWNED_DISPOSABLE_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_INTEGRATION_ONLY
  source_mutation_before_integration: task_worktree_only
  canonical_reset_or_clean_allowed: false

stop_conditions:
