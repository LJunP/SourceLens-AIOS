architecture_constraints:
  - The full Founder-selected non-Secret Provider selector must identify exactly one ZCode record before Secret extraction.
  - The Secret bridge may deliver only through one child process environment or an owned mode-0600 temporary file.
  - Secret values and derived hashes must never enter repository, Evidence, logs, traces, prompts, reviews or Vault.
  - Provider requests may use only the exact loopback peer and completion path; redirects, proxies, DNS and fallback endpoints are forbidden.
  - Each request must reserve its full conservative token ceiling before Secret access or network effect; reservations are never released or rewritten.
  - Current accepted adapters and observable-trace assets are invoked from canonical bytes and are not forked or rewritten.
  - Every B2 formal run must bind one real exact accepted P0 repository_analysis.scan child invocation.
  - Failed, timed-out, malformed or policy-stopped formal runs remain in the denominator.
  - Observable traces retain actions and concise rationale only, never hidden chain-of-thought.
