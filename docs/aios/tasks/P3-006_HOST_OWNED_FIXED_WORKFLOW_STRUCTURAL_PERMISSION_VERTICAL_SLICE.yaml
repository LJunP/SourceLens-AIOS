    - backend-spring/src/main/java/com/sourcelens/module/execution
    - backend-spring/src/test/java/com/sourcelens
    - backend-spring/src/test/resources
  product_source_required: true
  required_product_source_diff: NON_EMPTY_TESTABLE
  task_local_database_fixtures_only: true
  build_output_root: backend-spring/target
  network_allowed: false
  provider_allowed: false
