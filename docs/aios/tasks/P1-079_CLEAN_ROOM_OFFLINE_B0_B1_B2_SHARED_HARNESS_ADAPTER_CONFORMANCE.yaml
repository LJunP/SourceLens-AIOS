normalized_root_cause:
  freeze_location: evaluation-harness/fixtures/offline-b0-b1-b2-shared-harness-v1/negative-catalog.json
  format: P1079.<STAGE>.<CASE_ID>.<REASON_CODE>
  source: LOWEST_STAGE_CASE_ASSERTION_ORDINAL_FROM_FROZEN_CLOSED_ASSERTION_CATALOG
  volatile_path_time_duration_run_id_inode_or_stack_text_included: false
  adjacent_verdicts_compare_exact_normalized_id: true
  repeated_adjacent_id_action: TERMINAL_STOP
  unmapped_failure_id: P1079.INTERNAL.UNMAPPED_FAILURE
  unmapped_failure_verdict: NON_PASS

candidate_and_review:
  exact_candidates: 1
  post_candidate_source_contract_quality_or_oracle_change_allowed: false
  exact_diff_hash_manifest_required: true
  recoverable_local_evidence_tag_required: true
  final_review_cycle_count: 1
  required_fresh_target_verdicts:
    cto: PASS
    security: PASS
    quality: PASS
  review_sections:
    - TARGET_VERDICT
    - IN_SCOPE_FINDINGS
    - INHERITED_OR_OUT_OF_SCOPE_OBSERVATIONS
  all_reviews_must_bind_same_commit_tree_manifest_and_bytes: true

acceptance_criteria:
  - Every frozen authority, normative, schema, accepted-input, REP-001 and P0 anchor identity matches exactly.
  - The B2 snapshot, materialization, capability inventory, SystemConfiguration and external truth-binding attestation receive five exact prefreeze PASS verdicts before Quality freeze and Worker mutation.
  - B0, B1 and B2 have distinct executable and configuration identities and enforce the Baseline Adapter Contract v0.2 semantics.
  - B2 invokes the real repository_analysis.scan capability built offline from the exact accepted P0 anchor; absent capabilities remain explicitly failed or missing.
  - All six independent positive runs traverse admission, run, RunRecord, evaluator, replay, projection and rollback with all external effects false.
  - Each variant's A/B stable projections are byte-identical and the frozen rollback boundary is exact.
  - Every frozen mandatory negative case rejects and false accepts equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes.
  - The reviewed tree equals the local canonical integrated tree.
  - Exactly one single-process canonical make verify after integration returns PASS.

claim_boundary: ONE_VISIBLE_SYNTHETIC_COOPERATIVE_LOCAL_OFFLINE_PROVIDER_NEUTRAL_EXECUTABLE_B0_B1_B2_COMPATIBILITY_ADAPTER_CONFORMANCE_WITH_EXACT_B2_P0_SNAPSHOT_TRUTH_BINDING_DISTINCT_SYSTEM_CONFIGURATIONS_INDEPENDENT_AB_REPLAY_STABLE_PROJECTION_ROLLBACK_AND_ZERO_FALSE_ACCEPTS_ONLY

progress_on_full_gate_pass_only:
  capability_transition: B0_B1_B2_COMPATIBILITY_ADAPTERS_MISSING_TO_ACCEPTED
  strict_p1_completion_before: 4_COMPLETE_1_PARTIAL_3_NOT_COMPLETE_50_PERCENT
  strict_p1_completion_after: 5_COMPLETE_1_PARTIAL_2_NOT_COMPLETE_62_5_PERCENT
  observable_trace_credit: 0
  empirical_baseline_credit: 0

prohibited_claims:
