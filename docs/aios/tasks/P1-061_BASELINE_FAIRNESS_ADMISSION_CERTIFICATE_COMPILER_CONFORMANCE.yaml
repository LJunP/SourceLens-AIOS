  - canonical-readiness inspects current accepted canonical inputs and returns BLOCKED with all frozen missing-input reasons without creating substitutes
  - Formal Run A and independent Run B use the same candidate and produce exact-equal stable certificate bytes
  - fresh CTO, Security and Quality TARGET_VERDICT values are PASS on the same exact candidate commit/tree
  - integrated tree equals reviewed tree and one canonical full make verify passes
  - Truth records prerequisite accepted, Gate item 4 remains NOT_COMPLETE and P1 remains 2 of 8 complete

