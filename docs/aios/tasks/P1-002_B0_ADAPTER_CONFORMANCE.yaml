  synthetic_fixture: required
  live_model_invocation: forbidden
  provider_calls: 0
  network: forbidden
  secrets: forbidden
  remote_effects: forbidden
  production_effects: forbidden
  enabled_tools: []
  loop_limit: 1
  canonical_main_write_during_implementation: forbidden

