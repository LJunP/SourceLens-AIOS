preactivation_gate:
  status: REQUIRED_BEFORE_ANY_WORKER_PRODUCT_SOURCE_WRITE
  exact_system_sandbox_exec: /usr/bin/sandbox-exec
  sandbox_profile_order:
  - (allow default)
  - (deny network*)
  exact_java_major: 17
  exact_bridge_rule: >-
    The Java bridge reads the bound stdin payload until EOF, emits the bound stdout
    result, flushes stdout, retains stderr and exits normally without closing
    System.in, System.out or System.err.
  required_bindings:
  - exact /usr/bin/sandbox-exec identity and outer argv
  - exact sandbox profile bytes and SHA-256
  - exact cwd and closed environment
  - exact JDK 17 java and javac identities
  - exact bridge source, compiled class and classpath identities
  - exact stdin payload, EOF event, stdout, stderr and exit status transcript
  - exact write-root inventory proving all compiler and fixture writes stayed inside the Task worktree or Evidence root
  failure_lifecycle: TERMINATE_BEFORE_PRODUCT_EXECUTION_WITH_ZERO_PRODUCT_SOURCE_WRITES
acceptance_criteria:
- The preactivation sandbox-stream lifecycle gate passes before any Worker product-source write and its create-once receipt binds every required preactivation identity and transcript field.
- The exact accepted P2-069 benchmark manifest, DEV task cards, B1 results and non-overlap proof are rehashed before use; only the eight DEV tasks are opened or scored and all four HELD tasks remain unopened.
- The candidate contains a non-empty Product source diff on the canonical Code QA retrieval path and no mutation to the accepted dataset, split, oracle, metric, threshold or schedule.
- The Product selector and accepted B1 control use the same frozen query, corpus, top-k 10 and 131072-byte UTF-8 budget for every DEV task with deterministic path tie-breaking.
- Product DEV macro precision is at least 0.15595238095238093, macro recall is at least 0.8958333333333334, macro MRR is at least 0.875, and no DEV task recall regresses below its accepted B1 value.
- Exact Product source-to-class, JDK 17, classpath, sandbox-exec outer argv, cwd, closed environment, exit, stdout, stderr, Surefire and fixture inventories are create-once bound for every compiler, test and replay process.
- Two independently materialized DEV replay roots are byte-exact across the frozen result set, and both runs bind the exact candidate commit/tree and accepted P2-069 input identities.
- Real-filesystem negatives fail closed for symlink input, output overwrite, output-root escape, mutable or unbound classpath, HELD request, manifest drift and out-of-root write.
- No network, Provider, Secret, remote, production, public, P3 or HELD effect occurs; all writes stay inside the exact Task worktree or create-once Task Evidence root.
- CTO, Security and Quality/Evaluation independently accept the same exact candidate and closed Evidence inventory before the Master Task Gate is accepted.
required_evidence:
- Create-once preactivation sandbox-stream lifecycle receipt and full write-root inventory proving zero product-source writes existed before PASS.
- Exact accepted P2-069 input identity manifest, read-set inventory and DEV/HELD non-overlap proof.
- Product design, changed-file inventory, source-to-class manifest and targeted unit/Surefire transaction.
- Two complete sandboxed DEV replay transactions with raw rankings, selections, byte budgets, per-task metrics, macro metrics and byte-exact comparison receipt.
- Real-filesystem negative-test receipt binding exact fixture bytes, symlink identities, commands, stdout, stderr, exit and post-state.
- Exact candidate commit/tree, canonical-parent diff, closed environment, rollback instructions and three independent final review records.
rollback: >-
  Do not integrate a candidate that has not passed the complete Task Gate. Preserve
  exact create-once Evidence, retain P2-069 as the sole accepted milestone, keep HELD
  locked, and remove only the short-lived Task branch/worktree through supported Git
  lifecycle after exact terminal accounting; do not alter rejected lineage Evidence.
stop_conditions:
- Stop before any Worker product-source write if the exact sandbox-stream lifecycle preactivation gate does not PASS in one frozen execution.
- Stop if any P2-070, P2-071 or P2-072 rejected branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused as implementation input.
- Stop if accepted P2-069 baseline identity drifts, any HELD source leaf is opened, or dataset, split, oracle, metric, threshold or schedule bytes change.
- Stop if any compiler, test, replay or negative-fixture write escapes the exact Task worktree or Evidence root, or any classpath leaf lacks a source-to-class binding.
- Stop if any network, Provider, Secret, remote, production or public effect is requested or observed.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse rejected P2-070, P2-071 or P2-072 engineering lineage as implementation input.
- Relax the exact sandbox profile, close System.in, System.out or System.err, use mutable ignored target/classes as unbound product input, or substitute self-reported execution summaries for outer process Evidence.
- Modify the accepted P2-069 baseline, dataset, split, oracle, metric, thresholds, schedule or HELD custody.
- Run HELD evaluation, tune on HELD, rerun-to-pass, replace a failed Task or create successor, remediation, normalization or closure chains.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete terminal Evidence, modify Codex control-plane state, enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED after exact
  independent acceptance of a clean-room Product Selector on the frozen eight-task DEV
  split. It cannot claim formal HELD performance, the strict P2 Exit Gate, P3 eligibility,
  production readiness, public release or Long-term Goal completion.
