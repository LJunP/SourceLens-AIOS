objective: >-
  Implement the smallest deterministic machine validator required by Evaluation
  Protocol v1.1 to bind a frozen evaluation matrix to RunRecord and independent
  verification evidence, calculate Verified Task Success Rate without denominator
  drift, preserve every failure and invalid attempt, and emit a replayable,
  internally consistent counting report. The Task uses only synthetic counting
  fixtures and does not execute or measure B0, B1, B2 or A0.

why_now:
  - P1-001 passed Founder Gate and established a deterministic harness-conformance evidence path.
  - Evaluation Protocol v1.1 requires a machine validator for VTSR counting rules before any benchmark report can be accepted.
  - The canonical repository currently contains the normative VTSR rules but no accepted implementation of the evaluation matrix or aggregate counting validator.
  - P1-002, P1-003 and P1-004 are terminal non-PASS historical Tasks and are not implementation inputs for this Task.
  - This is real P1 evaluation code, not governance expansion and not a retry, resume, replacement, successor or correction of a prior Task.

research_hypothesis:
  statement: >-
    A deterministic validator can mechanically derive the exact VTSR numerator,
    denominator, failures, infrastructure-invalid attempts, exclusions,
    repetitions, task aggregation and reason-code distribution from a frozen
    synthetic evaluation matrix and hash-bound evidence, while rejecting identity
    drift, false-success promotion and post-hoc denominator improvement.
  falsifier: >-
    The protocol rules cannot be represented without changing accepted P1 schemas,
    cannot be evaluated deterministically within the declared paths and budget, or
    require a live baseline, Provider, network, Secret, P2/P3 capability, prior
    rejected candidate or an unbounded governance mechanism.

