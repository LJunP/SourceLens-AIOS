architecture_constraints:
  - Implement the raw-Evidence transaction and compiler-native graph as one vertical slice, not as a general Evidence platform.
  - Use two physically independent owned Java repository roots and freeze exact source bytes and physical identities before cleanup.
  - Bind exact javac and javap executable identity, versions, argv, minimal environment, process results and generated classfiles.
  - Retain independent per-case raw receipts for all positive and negative cases before generating aggregate conclusions.
  - Close and hash the complete Evidence inventory before deleting the owned source roots.
  - Make the independent consumer operate only on the closed retained transaction after source-root cleanup.
  - Resolve explicit import, same package, wildcard, qualified, nested lexical and nearest inherited hiding through actual compiler attribution.
  - Derive canonical nodes, edges, source spans and endpoint classes from the same admitted semantic transaction.
  - Produce byte-identical root-independent graph replay for both physical roots.
  - Keep false accepts and all six external effects at zero.
quality_freeze:
  positive_matrix:
    - explicit import resolves to the compiler-attributed declared target
    - same-package reference resolves to the same canonical identity
    - wildcard import resolves only when compiler attribution is unique
    - fully-qualified reference resolves to the exact declared target
    - nested lexical reference binds the nearest nested declaration
    - inherited nested type hiding binds the nearest inherited declaration
    - two physical repository roots produce byte-identical canonical graph projection
    - independent post-cleanup consumer reconstructs every accepted graph fact from frozen raw Evidence only
  negative_matrix:
    - java.lang and wildcard ambiguity
    - multiple wildcard ambiguity
    - unresolved reference
    - undeclared internal endpoint
    - source symlink
    - source hardlink
    - source mutation
    - source missing
    - duplicate case receipt
    - receipt reorder
    - cross-root receipt binding
    - javac executable drift
    - javap executable drift
    - classfile mutation
    - closed inventory extra
    - closed inventory missing
    - self-reported PASS without raw proof
    - consumer access to deleted source root
    - Provider count forgery
    - Secret count forgery
    - network observation forgery
  required_counts:
    physical_repository_roots: 2
    positive_semantic_cases_minimum: 6
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - The executable CLI completes the full positive and negative matrix from a fresh owned root.
  - Every admitted source, tool, process result and classfile has exact path, type, byte length and SHA-256 binding.
  - The closed Evidence inventory is frozen before source-root cleanup.
  - The independent consumer rebuilds both graph projections after cleanup without historical or Worker-only input.
  - Both canonical graph projections are byte-identical and repository-root independent.
  - All required Java resolution precedence cases match actual compiler attribution.
  - Every negative case rejects and false accepts equal zero.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same candidate and Evidence bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Raw per-case source, tool, process, classfile, observer and filesystem receipts.
  - Closed Evidence manifest frozen before source-root cleanup.
  - Worker matrix receipt and independent post-cleanup evaluator receipt.
  - Two root-independent byte-exact canonical graph projections.
  - Negative matrix with zero false accepts and independently reconstructed external-effect counts.
  - Exact candidate commit, tree, tracked diff hash, manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
rollback:
