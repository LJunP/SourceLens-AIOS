schema_version: 1
record_type: sourcelens_aios_task_contract

task_id: AIOS-P0-004A
phase: P0
title: Contain active AIOS truth drift and legacy-context pollution
objective: Make every active project entry expose the frozen P0 truth while retaining legacy material only as explicitly cited historical evidence.
why_now: Active Dashboard and Founder surfaces contradicted canonical P0 facts, and default retrieval of old phase documents could reactivate the retired roadmap.
task_spec_ref: docs/aios/truth/project_state.yaml#blocking_risks
owner_role: Product Intelligence Agent
worker_role: Truth Containment Worker

write_scope:
  - AIOS truth, gate, migration and operator-entry files
  - status banners and first-page authority wording in legacy and supporting documents
  - Dashboard phase, metric and project-task boundary copy
  - governance and frontend assertions that prevent the same truth drift
  - directly related project metadata and generated code-map index
read_context:
  - docs/aios/STRATEGIC_CONSTITUTION.md
  - docs/aios/MASTER_EXECUTION_PROTOCOL.md
  - docs/aios/truth/project_state.yaml
  - docs/aios/MIGRATION_LEDGER.yaml
  - docs/aios/P0_GATE.md
dependencies: []

risk_level: medium
baseline_ref: docs/aios/STRATEGIC_CONSTITUTION.md
acceptance_criteria:
  - Active entries expose P0 Strategic Foundation, P0 IN_PROGRESS and P0 Gate NOT_READY or NO-GO without presenting retired phases as current.
  - Dashboard exposes Verified Task Success Rate as not measured and presents P0-05 as the only current project-development task.
  - Existing product navigation is explicitly labeled inherited runtime guidance and cannot be mistaken for AIOS project intake or investment priority.
  - Legacy strategy, status, handoff, backlog, scorecard, progress and activity files are excluded from default Agent context in both the migration ledger and their headers.
  - Governance validation fails if decisive phase, gate, task-status, active-copy or context-policy facts regress.
  - No legacy file is deleted, moved or rewritten beyond bounded authority containment.
required_evidence:
  - AIOS governance validation output
  - active-entry legacy-claim scan
  - legacy-context header scan
  - frontend UI regression result
  - frontend production build result
  - Git diff whitespace result

