phase_execution_claim:
  current_task_claim: NONE_P1_TERMINAL_STOPPED_PENDING_PROJECT_LEVEL_DISPOSITION
  phase_local_allowed:
    - local evaluation foundation engineering under an exact Task Contract
    - synthetic fixtures, deterministic tests, replay, Evidence, rollback and independent review
    - local canonical main integration after Master Task Gate
  historical_terminal_rules:
    - P1-002 through P1-034 historical Tasks, preparations, Evidence and Reviews remain immutable and cannot resume, retry, supply implementation assets or continue through successor, replacement or correction chains.
    - Historical terminal execution lineage is permanently closed, but it does not permanently ban one clean-room implementation of a still-missing P1 Exit Gate capability under the 2026-07-17 Founder recovery decision.
    - P1-036 through P1-040 remain terminal Historical Evidence and are not reopened by the project-level rebaseline or delivery-architecture simplification.
    - P1-041 is terminal Historical Evidence after a read-scope compliance failure; its partial Quality assets are unaccepted and non-reusable.
    - P1-042 is terminal Historical Evidence after a pre-activation Master write-scope compliance failure; it was never activated, produced no engineering candidate and permanently stopped P1 pending project-level disposition.
    - The Founder project-level reopen permits one new role-local clean-room Slice 1 Task; it does not reopen P1-041 or authorize historical failed engineering-asset reuse.
    - Each rebaseline Slice uses one minimal Task Contract candidate with at most one bounded pre-freeze correction; exact bytes freeze only after three-party PASS and permit zero post-freeze correction.
    - Detailed schemas, fixtures, writer maps, artifact lifecycle and evaluator handoff freeze after Task activation and before Worker implementation as Quality-owned executable Evidence, not as a Contract version chain.
  mandatory_priority_rule:
    - Only the four Founder-approved rebaseline slices may be selected, in ordinal order, until the P1 Exit Gate evidence is complete or P1 terminally stops.
    - Peripheral validators, auxiliary governance tools and work without direct P1 Exit Gate value are ineligible.
  not_authorized_in_current_phase:
    - B0/B1/B2/A0 execution without an exact phase-local Task Contract
    - P2 or P3 entry
    - unapproved external effects
    - product or benchmark capability claims without Evaluation Protocol evidence
  deferred_to_p2_or_later:
    - Repository Intelligence capability improvement and benchmark claims.
  deferred_to_p3_or_later:
    - Single-Agent runtime, model-initiated writes, Agent shell, Supervisor, Root Custody, platform identity and strong isolation.
  forbidden_without_separate_founder_authority:
    - network or provider use involving restricted source
    - remote branch, pull request or merge
    - production side effects
    - public capability claims
    - canonical main advance outside an accepted task gate

