    production: false
    public: false
acceptance_criteria:
  - A versioned executable single-read transaction API accepts regular nlink-one inputs only.
  - Instrumented positive controls prove exactly one open and one complete read per admitted source object.
  - Pre/post descriptor identity and the exact consumed-byte digest are retained in each raw receipt.
  - Downstream verifier and replay consume the same immutable capsule and perform zero source-path reopens.
  - All declared mutation, identity, topology, inventory and receipt-tamper negatives reject with stable reason codes.
  - The complete matrix passes in all declared fresh parent topologies including /private/tmp.
  - Every run proves owned cleanup and zero undeclared lock or staging residue.
  - False accepts, Provider requests, Secret reads and all six external effects equal zero.
  - Focused verification and Task-worktree make verify pass before one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and authority identities.
  - Raw positive and negative transaction receipts with closed inventory and stable reason codes.
  - Instrumented open/read counters and pre/post typed descriptor identity for every admitted object.
  - Immutable capsule identities and independent evaluator reconstruction from raw receipts.
  - Multi-topology run manifests, cleanup receipts and zero-effect aggregate.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
