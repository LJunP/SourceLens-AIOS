    - deterministic replay, P1-001 regression, P1-035 regression and make verify results
    - candidate commit/tree and source diff
    - fresh-clone rebuild and rollback results
    - closed artifact index and P1-safe Evidence Manifest
    - CTO, Security and Quality independent reviews
    - delegated Task Gate receipt

rollback:
