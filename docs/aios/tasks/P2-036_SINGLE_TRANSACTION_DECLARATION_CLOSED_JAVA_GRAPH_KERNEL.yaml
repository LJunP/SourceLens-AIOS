architecture_constraints:
  - Reimplement from accepted canonical specifications and inputs; do not inspect or reuse rejected P2 engineering.
  - Keep declaration indexing, resolution, edge admission and finalization inside one typed transaction boundary.
  - Use product-code JavaParser facts; comments, strings and file names cannot create declarations or relations.
  - Use repository-relative source identities and binary dollar owner chains without root, timestamp or nonce leakage.
  - Do not modify the accepted JavaAstParser or backend pom bytes.
  - Do not build a full Java compiler, generic classpath authority, governance system or Evidence platform.
quality_freeze:
  positive_matrix:
    - Nested, local, interface, enum, record and annotation declarations receive exact stable source and binary identities.
    - INTERNAL EXTENDS and IMPLEMENTS targets resolve to exactly one declaration in the same transaction.
    - Exact attested explicit and wildcard external matches resolve EXTERNAL; zero and multiple matches remain targetless.
    - Lexical member, explicit import, same-package, attested implicit, wildcard and qualified lookup precedence is deterministic.
    - Three physically independent repository roots produce byte-exact graph and replay outputs.
    - Replay re-admits raw declarations, relations and external inventory before rebuilding semantic closure.
    - Accepted P1 scanner source and backend pom stay byte-exact and targeted scanner regressions pass.
  negative_matrix:
    - canonical reserialization with missing INTERNAL target
    - canonical reserialization with another existing but wrong INTERNAL target
    - duplicate declaration producing a non-unique target
    - INTERNAL edge changed to unattested EXTERNAL
    - UNRESOLVED or AMBIGUOUS carrying target identity
    - incompatible source kind, target kind or relation kind
    - source span, owner chain, local ordinal or binary-name cross-binding
    - declaration delete, append or reorder without synchronized edges
    - external inventory mutation, duplicate, missing, path drift, symlink or hash drift
    - comment or string pseudo-declaration
    - root path, timestamp or nonce identity leakage
    - canonical bytes valid while semantic closure is false
    - nonzero external-effect observation
  required_counts:
    physical_repository_roots: 3
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - All declarations and relations satisfy the closed typed transaction contract.
  - Every INTERNAL edge binds exactly one same-transaction declaration and every EXTERNAL edge binds one exact attested external symbol.
  - All targetless and semantic-attack cases fail closed with zero false accepts.
  - Three physical roots and raw-fact replay produce byte-exact deterministic graph output.
  - Accepted scanner and pom identities remain byte-exact and targeted regressions pass offline.
  - Independent consumer re-derives declaration indices, relation targets, semantic closure, deterministic graph and zero external effects from raw Evidence.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Accepted scanner, pom, source manifest and external inventory identities.
  - Raw declaration and relation facts, closed indices, resolved edges and canonical graph from three roots.
  - Worker matrix and independent consumer receipts with semantic attack results and zero false accepts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality Reviews of the same candidate and Evidence bytes.
