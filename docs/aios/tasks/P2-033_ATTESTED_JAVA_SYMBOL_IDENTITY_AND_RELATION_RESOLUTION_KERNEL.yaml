external_symbol_inventory_contract:
  schema_version: p2-033-attested-external-symbol-inventory/v1
  transport: REGULAR_JSON_FILE_NON_SYMLINK
  external_identity_binding:
    required: true
    fields:
      - path
      - byte_length
      - sha256
  closed_top_level_keys:
    - schema_version
    - inventory_id
    - symbols
  closed_symbol_keys:
    - source_qualified_name
    - binary_name
    - kind
    - artifact_id
    - origin_sha256
  rules:
    - Symbols are sorted uniquely by binary_name and duplicate identities reject.
    - EXTERNAL classification requires one exact inventory entry after Java resolution precedence.
    - A wildcard import is a search scope only and never proves target existence.
    - Zero matches produce UNRESOLVED and multiple matches produce AMBIGUOUS.
symbol_identity_contract:
  repository_root_independent: true
  source_qualified_name: PACKAGE_PLUS_LEXICAL_SOURCE_OWNER_CHAIN
  binary_name: PACKAGE_PLUS_DOLLAR_SEPARATED_BINARY_OWNER_CHAIN
  local_type_identity: ENCLOSING_BINARY_NAME_PLUS_STABLE_LEXICAL_LOCAL_ORDINAL_AND_SIMPLE_NAME
  required_source_span_fields:
    - relative_path
    - begin_line
    - begin_column
    - end_line
    - end_column
  forbidden_identity_inputs:
    - repository_absolute_path
    - execution_timestamp
    - random_nonce
    - scan_root_basename
resolution_contract:
  stages:
    - PARSER_NATIVE_DECLARATION_INDEX
    - JAVA_PRECEDENCE_RELATION_RESOLUTION
  classifications:
    - INTERNAL
    - EXTERNAL
    - UNRESOLVED
    - AMBIGUOUS
  relation_kinds:
    - EXTENDS
    - IMPLEMENTS
  precedence:
    - lexical_member_type
    - explicit_single_type_import
    - same_package_top_level_type
    - java_lang_or_attested_implicit_scope
    - on_demand_import_scope
    - exact_qualified_name
  fail_closed_rules:
    - INTERNAL requires one admitted declaration identity.
    - EXTERNAL requires one exact attested inventory identity.
    - Multiple valid targets are AMBIGUOUS and zero valid targets are UNRESOLVED.
    - Comments and string literals cannot create declarations or relations.
    - Duplicate declarations, malformed inventories, missing source files and identity drift reject admission.
