implementation_contract:
  frozen_matrix:
    required_identity_fields:
      - schema_version
      - matrix_id
      - dataset_version
      - frozen_at_utc
      - protocol_sha256
      - allowed_infrastructure_invalid_reason_codes
      - task_aggregation_rules
      - scheduled_entries
      - payload_sha256
    canonicalization:
      input_encoding: UTF-8 without BOM
      JSON_rule: object keys recursively sorted lexicographically by UTF-16 code units, array order preserved, integers rendered in base-10 without leading zero, strings serialized by the exact string rule below, no insignificant whitespace, exactly one trailing LF
      numeric_domain: integers only; non-integer JSON numbers are rejected
      duplicate_member_rule: reject before semantic JSON parsing
      string_rule:
        - reject unpaired UTF-16 surrogate code points and do not apply Unicode normalization
        - encode quotation mark U+0022 as bytes 5c22 and reverse solidus U+005C as bytes 5c5c
        - encode U+0008, U+0009, U+000A, U+000C and U+000D as bytes 5c62, 5c74, 5c6e, 5c66 and 5c72 respectively
        - encode every other U+0000 through U+001F code point as bytes 5c75 followed by exactly four lowercase ASCII hexadecimal digits
        - never escape solidus U+002F
        - encode every other Unicode scalar value literally as UTF-8
      canonical_file_bytes: canonical JSON of the complete matrix object followed by exactly one LF
      payload_hash_preimage: canonical JSON of the root object with only the root payload_sha256 member omitted followed by exactly one LF
      payload_hash_algorithm: SHA-256 lowercase hexadecimal
      verification_order:
        - reject invalid UTF-8, BOM, duplicate member, non-integer number or schema failure
        - require input bytes equal canonical_file_bytes
        - compute payload hash over payload_hash_preimage
        - compare with payload_sha256 before resolving any referenced path
    scheduled_entry_identity:
      - schedule_id
      - task_id
      - system_configuration_id
      - environment_snapshot_id
      - repetition_id
      - disposition
      - predeclared_exclusion_reason
      - scheduled_run_id
    disposition_values:
      - ELIGIBLE
      - PREDECLARED_EXCLUDED
    invariants:
      - schedule_id is unique
      - scheduled_run_id is unique among eligible entries
      - the task/configuration/environment/repetition tuple is unique
      - predeclared exclusion exists in frozen bytes before any outcome bytes
      - unknown fields, duplicate JSON members, noncanonical bytes, path traversal and symlinks are rejected
  observation_input:
    required_bindings:
      - schedule_id
      - scheduled_run_id
      - ordered attempt records with attempt_id and one-based attempt_index
      - RunRecord identity and SHA-256
      - independent verification receipt identity and SHA-256
      - patch-apply result
      - issue-specific test result
      - required regression result
      - evidence-completeness result
      - rollback-valid result
      - declared-scope result
      - post-hoc exclusion annotation, if any
    attempt_identity:
      - attempt_id is globally unique in the observation set
      - attempt_index starts at 1 and is contiguous within one schedule_id
      - RunRecord.run_id equals scheduled_run_id for the first attempt and scheduled_run_id followed by /infra-rerun/ plus decimal attempt_index for later infrastructure reruns
      - every attempt repeats the frozen task_id, system_configuration_id, environment_snapshot_id and repetition_id identity
      - every RunRecord.dataset_version exactly equals frozen_matrix.dataset_version
      - usage.retries remains internal to one attempt and does not create an attempt or denominator entry
    terminal_selection:
      - zero or more leading attempts may be predeclared infrastructure-invalid
      - the first non-infrastructure-invalid attempt is the unique final primary outcome
      - no attempt may follow the final primary outcome
      - all-infrastructure-invalid attempts without a final primary outcome produce REPORT_INCOMPLETE and cannot yield a final VTSR report
      - an undeclared invalid reason, identity mismatch, index gap, duplicate or post-terminal attempt rejects the observation set
    rule: Outcome bytes cannot alter frozen matrix identity, eligibility or aggregation rules.
  verified_success_requires_all:
    - one eligible scheduled entry has a final non-infrastructure-invalid RunRecord
    - patch applies to the frozen source revision
    - issue-specific tests pass
    - required regressions pass
    - independent evaluator verdict is PASS
    - policy_violations is empty
    - Patch Evidence Package is complete and internally consistent
    - rollback evidence is valid
    - result remains inside declared task scope
  counting_rules:
    - each eligible scheduled task/configuration/environment/repetition tuple contributes exactly one primary denominator entry
    - usage.retries records retries inside that denominator entry and never adds denominator entries
    - completed output lacking any verified-success condition counts as failed, never as verified success
    - timeout, budget exhaustion, crash, missing evidence, policy violation and system-attributable setup failure count as failed
    - infrastructure-invalid classification requires a matrix-predeclared shared-harness reason code
    - an infrastructure-invalid attempt remains in raw counts and requires a same-identity rerun before the final report is complete
    - a same-identity infrastructure rerun does not create a second denominator entry
    - predeclared excluded entries do not enter the primary denominator
    - post-hoc exclusion annotations are reported but cannot remove or improve a primary denominator entry
    - every scheduled stochastic repetition contributes its own denominator entry
    - task-level success uses only the frozen per-task k-of-n rule
    - unscheduled, duplicate or identity-mismatched outcomes are rejected and cannot change counts
  report_contract:
    required_counts:
      - eligible_scheduled_count
      - primary_denominator
      - verified_success_numerator
      - failed_run_count
      - infrastructure_invalid_attempt_count
      - predeclared_excluded_count
      - post_hoc_exclusion_count
      - reason_code_distribution
    required_invariants:
      - verified_success_numerator is not greater than primary_denominator
      - verified_success_numerator plus failed_run_count equals primary_denominator
      - every eligible schedule_id has exactly one final primary outcome
      - every raw attempt is represented in the reason-code and invalid-attempt accounting
      - VTSR ratio is emitted as exact numerator/denominator plus a deterministic six-decimal projection
      - denominator zero produces NOT_COMPUTABLE and never PASS or a fabricated percentage
      - report identity binds matrix, observations, validator, runtime and protocol hashes
    decimal_projection:
      scale: 6
      rounding: ROUND_HALF_UP_FOR_NONNEGATIVE_RATIONAL
      algorithm: q = floor((2 * verified_success_numerator * 1000000 + primary_denominator) / (2 * primary_denominator)); format q as an integer part and exactly six fractional digits
      denominator_zero: emit null decimal and status NOT_COMPUTABLE
  replay:
    normalized_report_bytes: same canonical JSON rule as frozen_matrix.canonicalization and exactly one trailing LF
    requirement: identical frozen inputs produce byte-identical normalized report and report SHA-256

