acceptance_criteria:
  - The one machine lint verifies every declared accepted-input path, byte length and SHA-256 before Contract review.
  - The one parallel CTO, Security and Quality start-review round returns PASS for these exact Contract bytes before activation.
  - Quality freezes and self-validates the reference oracle, observation corpus, expected verdicts, denominator rules and stable projection before Worker mutation.
  - Evaluator under test is a deterministic pure decision function with no reference-oracle, expected-verdict, reviewer, filesystem, child-process, network or dynamic-execution input.
  - Artifact bytes are decoded and their byte lengths and SHA-256 values are independently recomputed; self-reported consistency booleans are ignored.
  - Raw external-effect events are reconciled against an exact six-key declaration, and acceptance requires both sources to prove all effects false.
  - Every frozen scheduled case executes exactly once; missing, duplicate, reordered or post-hoc excluded cases fail closed and cannot improve any denominator.
  - The diagnostic comparator quantifies the deliberately adversarial false-success risk; it never supplies the accepted evaluator verdict.
  - The hardened evaluator matches the independent oracle for every frozen case with zero false accepts, zero false negatives and zero unresolved cases.
  - Every count and rate reconciles to exact integer numerator and denominator fields; percentages without counts are forbidden.
  - Run A and independent Run B use the same frozen candidate and inputs in distinct fresh create-once task-owned roots.
  - Run B rereads frozen inputs and does not read Run A path, receipt, result, projection or verdict.
  - Run A and Run B stable semantic projections are exact canonical-JSON byte equal while physical paths, inode, PID, time and duration remain raw-only.
  - The candidate manifest binds candidate commit, tree, diff length and SHA-256 plus every candidate and Quality file path, mode, byte length and SHA-256; omitted identities reject before a formal run.
  - One targeted command reproduces the complete characterization and its negative controls.
  - Fresh CTO, Security and Quality reviewers return TARGET_VERDICT PASS for the same exact candidate, manifest and formal Evidence.
  - Only after Task Gate may the reviewed tree be integrated locally; integrated tree equals reviewed tree and one clean canonical full make verify passes.

required_evidence:
  - exact Goal, route packet, Contract, authority and accepted-input identities
  - Quality freeze receipt and manifest identities
  - candidate commit, tree, diff identity and per-file manifest
  - Run A and independent Run B raw per-case decisions, metrics, negative controls and stable projections
  - diagnostic and hardened confusion matrices with exact numerator and denominator pairs
  - zero hardened false accepts, false negatives and unresolved cases
  - fresh CTO, Security and Quality exact-candidate target verdicts
  - reviewed/integrated tree equality and canonical make verify result

rollback:
  run_level: Remove only create-receipted task-owned disposable roots after device, inode, marker and containment verification.
  candidate_level: Preserve Evidence, do not integrate a NON_PASS candidate, and remove only the verified-clean task worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence; never reset or clean.

stop_conditions:
  - Any accepted-input path, byte length or SHA-256 drifts.
  - Contract admission needs a second correction or a second start-review round.
  - Quality freeze is absent, inconsistent, contaminated or not finished before Worker mutation.
  - Worker does not start within one engineering hour after Contract review entry.
  - No runnable falsifiable targeted command and result exists within four engineering hours.
  - Evaluator under test reads or derives a verdict from oracle, expected-label, reviewer or declared-success authority.
  - Any mandatory controlled-invalid case is accepted or any hardened false positive, false negative or unresolved case exists.
  - Denominator, exclusion, invalid-run or reason-code accounting is post-hoc, incomplete or irreconcilable.
  - Evidence, canonical source or a pre-existing object is overwritten, followed, escaped, renamed, deleted or damaged.
  - Candidate mutates after freeze, manifest omits an exact candidate or Quality identity, Run A or Run B is NON_PASS, or stable projections differ.
  - Any fresh candidate Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical full make verify is NONPASS.
  - Network, Provider, Secret, remote, production, public, P2 or P3 permission is required.

forbidden_actions:
