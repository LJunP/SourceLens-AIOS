implementation_requirements:
  - consume real accepted canonical scanner JSON without modifying scanner semantics
  - derive repository-root-independent canonical file and symbol identities
  - bind symbols and relations to exact file identity and source spans
  - classify every relation endpoint as resolved_internal, external or unresolved
  - deterministically order nodes, edges and serialized output
  - produce byte-identical output from two distinct canonical repository roots
  - produce byte-identical exact replay from frozen admitted scanner bytes
  - use no new dependency and execute Cargo verification with --locked --offline
  - fail before candidate freeze if the offline dependency cache is incomplete
  - verify every manifest-declared path for containment, type, non-symlink, length and SHA-256 before reading it
  - derive scanner provenance, graph counts, negative verdicts, false accepts and external effects from raw receipts and raw bytes
  - never accept Worker-authored PASS, count, provenance or effect summaries as independent proof

mandatory_positive_cases:
  - real accepted scanner invocation on Java fixture root A
  - real accepted scanner invocation on physically distinct Java fixture root B
  - root-independent byte-identical graph projection
  - byte-identical exact replay
  - resolved cross-file Java call
  - external Java endpoint classification
  - unresolved Java endpoint classification

mandatory_negative_cases:
  - unimported cross-package same-name Java symbol must not cross-bind
  - distinct raw scanner-output mutation must be rejected
  - incorrect graph summary count must be rejected
  - missing raw scanner receipt must be rejected
  - extra raw Evidence object must be rejected
  - duplicate or reordered identity record must be rejected
  - path escape and wrong-root substitution must be rejected before read
  - symlink and non-regular input must be rejected before read
  - byte-length and SHA-256 drift must be rejected
  - stale and cross-candidate provenance must be rejected
  - ambiguous, external and unresolved endpoint category drift must be rejected
  - incorrect zero-false-accept summary must be rejected
  - incorrect external-effect summary must be rejected

acceptance_criteria:
  - all mandatory positive and negative cases execute from fresh owned disposable roots
  - at least two real accepted scanner invocations are proven by raw command receipts
  - two-root projection and exact replay are byte-identical
  - all graph identities are repository-root-independent and source-span-bound
  - independent verifier reads no unvalidated manifest-declared path
  - independent verifier re-derives all target counts, verdicts, provenance and effects
  - targeted false accepts equal 0
  - network, Provider, Secret, remote, production and public effects equal 0
  - no rejected P2 engineering asset is read, restored, copied, compared or reused
  - one exact candidate is frozen only after the full matrix passes
  - fresh CTO, Security and Quality TARGET_VERDICT values all equal PASS

required_evidence:
  - exact source manifest and tracked binary diff identity
  - locked offline Cargo command receipt and toolchain identity
  - raw accepted-scanner command, stdout and stderr receipts for both roots
  - admitted scanner-input manifests
  - graph outputs and stable-projection comparison receipt
  - exact replay output and byte-equality receipt
  - per-case raw negative Evidence and independently derived verdict ledger
  - independent verifier package and receipt
  - closed Evidence inventory with path, type, byte length and SHA-256
  - fresh CTO, Security and Quality Reviews of the same exact candidate

rollback:
  strategy: disposable_roots_plus_non_destructive_git_revert_after_integration_only
  source_mutation_before_integration: task_worktree_only
  canonical_reset_or_clean_allowed: false

stop_conditions:
  - same normalized root cause repeats in adjacent allowed implementation iterations
  - implementation iteration or repair budget is exhausted
  - offline verification requires network or dependency download
  - any rejected P2 engineering asset would need to be read or reused
  - any scope, Phase, permission or external-effect expansion is required
  - Evidence is overwritten, deleted, cross-bound or cannot be independently reconstructed
  - any fresh final Reviewer returns TARGET_VERDICT NON_PASS
  - reviewed and integrated trees differ
  - canonical make verify returns NONPASS

forbidden_actions:
  - modify accepted scanner semantics
  - read or reuse rejected P2 engineering assets
  - network, Provider, Secret, remote, production or public effect
  - dependency download or non-offline Cargo verification
  - P3 entry
  - push, PR, release or remote mutation
  - second candidate, second final review cycle or post-freeze correction
  - successor, replacement, normalization, closure, feasibility or remediation chain
  - use documentation, hashes, Reviews or governance synchronization as P2 capability credit

