architecture_constraints:
  - Implement only from accepted canonical specifications and accepted P1 assets.
  - Do not inspect, compare or reuse P1-165 or P1-168 rejected engineering assets.
  - Inputs are regular, non-symlink, single-link files bound by normalized absolute path, type, mode, byte length and SHA-256.
  - Every run receives a new caller-selected owned parent and unique execution root; no historical sibling or fixed basename may influence behavior.
  - Admission, staging, lock and final paths are contained under the exact owned execution root.
  - Finalization uses create-once staging followed by atomic rename and rejects an existing destination.
  - Closed inventories are ordered, recursively hash-bound and reject missing, extra, mutation, reorder, symlink, hardlink and tamper cases.
  - Cleanup may remove only objects created and identity-owned by the current execution.
  - Wrapper and independent evaluator consume the same frozen raw Evidence bytes and do not trust Worker PASS fields.
