external_effects:
  network: false
  provider: false
  secret: false
  remote: false
  production: false
  public: false

required_semantics:
  profiles:
    B0: issue plus exact bounded issue-only context; no tools, repository source, graph, memory or iterative execution
    B1: finite list/read/lexical selection only; no graph, SourceLens scan context or answer-bearing material
    B2: exact accepted P0 repository_analysis.scan context only, with exact child invocation identity
  answer_separation:
    - formal Worker process has no readable path to reference-solution.patch
    - formal Worker process has no readable path to answer-bearing P1-129 finite programs
    - admission is allowlist-derived and checked before process execution
    - negative controls prove full and partial answer artifacts are rejected
  evidence_transactions:
    - every created object is recorded at creation with relative path, type, fd, dev, inode and creation nonce
    - finalization and cleanup compare the exact ledger identity before mutation
    - unowned, substituted, hardlinked, symlinked, cross-device, missing, extra and reordered objects fail closed
    - no path-based chmod or cleanup operation may follow a substituted path
    - critical abort atomically closes accounting, Evidence inventory and all 36 denominator slots
  request_limits:
    - the serialized request is conservatively proven below 8192 input tokens before any effect
    - requested output is at most 2048 tokens before any effect
  observer_binding:
    - observer evidence binds cell, request receipt SHA-256, worker PID, socket tuple, effect slot and unique nonce
    - independent evaluation rejects replay, duplication, cross-cell binding and process drift
  parsing:
    - duplicate JSON keys are rejected before semantic parsing
    - all externally consumed JSON objects use closed keysets where declared
  effects:
    - authorized observed effects are distinct from unauthorized effects
    - Task 1 has no network, Provider or Secret effects
  evaluation:
    - independent evaluator reconstructs exclusively from raw Evidence
    - evaluator never trusts Worker verdict, success, policy or effect summary fields

acceptance_criteria:
  - B0, B1 and B2 produce observably distinct, exact profile-bound inputs across a complete 36-cell synthetic matrix.
  - Every synthetic cell traverses the accepted finite Patch IR compiler, disposable repository apply, P1-101 trace/replay, oracle/tests and rollback path.
  - B2 produces twelve exact accepted P0 repository_analysis.scan child invocations; B0 and B1 produce none.
  - Formal Worker read roots exclude all reference solutions and answer-bearing programs, and the negative matrix proves both full and partial answer leakage fail closed.
  - Object-ledger, TOCTOU, symlink, hardlink, cross-device, mutation, missing, extra, reorder and cleanup ownership cases have zero false accepts.
  - Duplicate-key, cap-boundary, observer replay/cross-binding, critical-abort and effect-truthfulness cases have zero false accepts.
  - The same kernel passes in multiple fresh owned parent topologies, including a /private/tmp canonical-like root, and leaves no undeclared staging or lock residue.
  - Provider requests, Secret reads and all six external effects are zero.
  - One exact candidate is frozen and fresh CTO, Security and Quality TARGET_VERDICT values are all PASS on the same bytes.
  - Reviewed tree equals integrated tree and the single canonical make verify invocation passes.

required_evidence:
  - exact source manifest and candidate tree identity
  - 36-cell synthetic plan and per-cell raw receipts
  - profile-input and answer-separation receipts
  - object creation ledger and atomic finalization receipts
  - negative-matrix raw receipts and aggregate with false_accepts=0
  - multi-parent topology receipts and residue inventory
  - independent evaluator reconstruction receipt
  - fresh CTO, Security and Quality reviews of the same exact candidate
  - integration receipt and one canonical make verify receipt

stop_conditions:
  - adjacent implementation iterations produce the same normalized root cause
  - four total implementation iterations are exhausted
  - a required change leaves the allowlisted paths or P1 boundary
  - any Provider request, Secret read, network, remote, production or public effect occurs
  - the sole candidate receives any final Reviewer TARGET_VERDICT other than PASS
  - reviewed and integrated trees differ
  - canonical make verify is NONPASS
  - Evidence is overwritten, deleted or cannot be independently reconstructed

forbidden_actions:
  - read, restore, copy, compare or reuse P1-176 source, fixtures, tests, formal Evidence or implementation
  - create a successor, replacement, correction, normalization, closure, feasibility or remediation chain
  - modify authority, parser or validator semantics
  - change Long-term Goal, P1 Objective, P1 Exit Gate or P2 HOLD
  - read a Secret or call a Provider
  - modify ZCode, Codex Tools, LaunchAgent, proxy, port or user software
  - push or modify a remote

claim_boundary: >-
  Accepted cooperative-local provider-neutral experiment-kernel conformance only.
  No Provider result, model performance, reproducible baseline report, P1 completion,
  P2 entry, production, public, remote, hostile-principal or strong-isolation claim.
