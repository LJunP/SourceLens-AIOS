architecture_constraints:
  - Introduce a versioned SL-PATCH-IR/2 closed schema while preserving accepted P1-055 v1 semantics unchanged.
  - Patch Artifacts contain real finite operations and may not reduce to program selectors, run ids, expected outputs or PASS labels.
  - The trusted compiler accepts only the closed IR schema and emits a deterministic, bounded application plan.
  - Application occurs only in a unique owned disposable repository copy; the canonical repository is read-only to the execution spine.
  - Every execution binds exact response, IR, compiler, application, accepted P1-101 trace, oracle, tests and rollback identities.
  - The independent evaluator reads frozen raw Evidence and never trusts Worker-generated success or cell-result claims.
  - The closed representative set contains all six accepted P1 task cases and a fixed 36-cell denominator projection.
  - INVALID, EXCLUDED and FAILED results remain in the denominator; a negative or zero result remains a valid research outcome.
  - Raw preflight Evidence uses a closed inventory and is retained outside the repository Evidence root.
