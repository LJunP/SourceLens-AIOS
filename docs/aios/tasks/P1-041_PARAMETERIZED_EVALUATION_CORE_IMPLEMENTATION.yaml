title: Parameterized Evaluation Core Implementation

objective: >-
  Implement one clean-room, local, parameterized Evaluation Core that consumes
  the accepted representative Task Dataset through a frozen evaluation plan,
  emits observable per-run evidence, deterministically replays the same plan,
  and mechanically derives VTSR numerator, denominator, failure,
  infrastructure-invalid, retry, repetition, exclusion and reason-code counts.
  This Task validates evaluation mechanics only and does not execute or claim
  B0, B1, B2, Agent, P1 Exit, P2, P3 or production capability.

why_now:
  - The Founder-approved P1 project rebaseline requires Parameterized Evaluation Core as Slice 1 before baseline adapters or experiments.
  - AIOS-P1-001 has accepted single-fixture harness mechanics and AIOS-P1-035 has an accepted versioned representative Task Dataset, but no accepted parameterized runner, VTSR counter or reusable observable trace exists.
  - The Founder-approved delivery simplification requires a minimal immutable Task envelope and moves detailed schemas, fixtures, lifecycle and verdict routing into a post-activation Quality freeze instead of another Contract version chain.

