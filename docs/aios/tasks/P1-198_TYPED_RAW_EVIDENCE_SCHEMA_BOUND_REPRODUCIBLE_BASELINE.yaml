acceptance_criteria:
  - All authoritative raw Evidence object types have executable closed-schema positive and negative tests.
  - Duplicate-key, extra-field with rebuilt manifest, missing, mutation, reorder, cross-binding, path escape, symlink, hardlink and cleanup attacks fail closed on real filesystem fixtures.
  - Accepted P1-129 B0/B1/B2, P1-149 execution spine and P1-101 trace/replay participate in all 36 synthetic cells.
  - Independent reconstruction runs twice from frozen raw Evidence and produces exact byte-equal reports without reading a generated report.
  - At least three fresh owned parent topologies pass and leave no undeclared staging, lock or fixture residue.
  - One preformal snapshot receives same-cycle fresh CTO, Security and Quality TARGET_VERDICT PASS before any Secret read or Provider request.
  - One strict loopback diagnostic completion passes, followed immediately by exactly one 36-cell formal matrix with no retry, replacement or rerun.
  - Every formal cell remains in the denominator and stores typed, identity-bound raw Evidence; negative or zero VTSR remains an admissible research result.
  - The exact report is independently rebuilt and verified from frozen raw Evidence, with false accepts and unauthorized effects equal to zero.
  - One candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same exact source and Evidence bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Goal, Founder packet, structured Decision, activation parent, Contract, authority, branch, worktree and Evidence-root identities.
  - Executable schemas, canonical encoder, duplicate-key detector, typed relation admission and closed-inventory implementation.
  - Positive and real-filesystem negative matrix receipts for every authoritative object type and binding.
  - Accepted P1-035, P1-101, P1-129 and P1-149 participation receipts for the complete synthetic 36-cell rehearsal.
  - Two independent byte-equal report reconstructions and three canonical-equivalent topology receipts with cleanup proof.
  - Same-cycle fresh CTO, Security and Quality preformal reviews of one exact snapshot.
  - Diagnostic and formal request/response, reservation, usage, observer, patch, oracle, test, trace, replay and rollback raw Evidence.
  - Exact report, manifest, reproduction command and independent verifier receipt.
  - Candidate commit, tree, exact diff/hash manifest, recoverable Evidence tag and three fresh final reviews.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify receipt.
rollback:
  strategy: OWNED_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical, Goal, Founder packet, structured Decision, accepted input, Contract or authority identity drifts.
  - Any P1-196 or other rejected engineering source, candidate, fixture, matrix, evaluator, test or report is read or reused.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus eight same-Task repairs or three preformal review cycles are exhausted.
  - Any preformal review cycle lacks same-cycle CTO, Security and Quality TARGET_VERDICT PASS.
  - A Secret is read or Provider request occurs before the complete preformal Gate passes.
  - The diagnostic, unique 36-cell formal matrix, final review, tree equality or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, a non-loopback, remote, production or public effect occurs, or the Phase/Exit Gate boundary changes.
forbidden_actions:
  - Read or reuse rejected Task engineering source, candidate, fixture, matrix, evaluator, test, report or formal Evidence.
  - Build a generic authority, parser, validator or governance pretask.
  - Trust a manifest or Worker-authored success field as semantic authority.
  - Read a Secret or call the Provider before same-cycle fresh preformal reviews all PASS.
  - Use automatic retry, a second formal matrix, a fallback endpoint or model substitution.
  - Enter P2 or P3, push or modify a remote, or create remote, production or public effects.
claim_boundary: >-
  Cooperative-local typed closed raw-Evidence reproducible research Artifact
  only. No rejected-asset reuse, hostile-principal isolation, direct OpenAI
  provenance, P2/P3 entry, remote, production, public or production-readiness
  claim.
