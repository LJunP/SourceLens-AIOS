acceptance_criteria:
  - The pilot passes all four frozen checks before the full matrix runs.
  - Accepted scanner invocation and executable identity are proven from raw process Evidence rather than labels or substring checks.
  - Every in-scope Java semantic graph edge has exactly one matching raw compiler observation and every observation has exactly one matching graph edge.
  - Fabricated extra, missing, duplicate, wrong receiver, wrong overload, wrong owner and ambiguous or unresolved misclassification cases reject.
  - Every positive and negative raw transaction is frozen, self-contained, portable and independently replayed from frozen bytes.
  - External effects, Provider and Secret zero values are reconstructed from raw observations with zero false accepts.
  - Two physical repository roots produce byte-exact deterministic graph projection and replay.
  - Focused verification and Task-worktree make verify pass before the single candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and authority identities.
  - Accepted scanner build and executable identity plus raw argv, environment, process, stdout, stderr and exit receipts.
  - Per-edge compiler-attributed raw observations and exact graph mappings.
  - Closed forward and reverse edge-oracle receipts for both physical roots.
  - Portable raw positive and negative transaction packages with independent replay receipts.
  - Raw socket observation and filesystem write inventories with independently reconstructed zero-effect aggregate.
  - Pilot receipt, full matrix receipt, deterministic projection and replay identities.
  - Exact candidate commit, tree, diff manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and frozen Evidence.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
