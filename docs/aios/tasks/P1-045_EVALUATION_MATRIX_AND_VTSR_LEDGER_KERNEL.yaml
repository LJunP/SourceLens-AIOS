title: Evaluation Matrix and VTSR Ledger Kernel

objective: >-
  Build one cooperative-local, adapter-neutral counting kernel that freezes a
  closed synthetic conformance Evaluation Matrix keyed to the six accepted
  P1-035 visible synthetic TaskSpecs, consumes explicitly labeled Quality-owned
  synthetic outcome fixtures, independently recomputes Evaluation Protocol v1.1
  VTSR counting expectations from retained bytes, and reproduces the same
  normalized conformance result in a fresh process. No fixture is a real
  scheduled baseline run and no output is an empirical VTSR measurement.

why_now:
  - P1-044 is terminal with zero accepted capability and its source, Quality assets and Evidence are not inputs to this Task.
  - A frozen run population and normative counting validator are required before any baseline report can be accepted.
  - This increment directly prevents denominator gaming, post-hoc exclusion and false-success promotion without executing a patch, baseline system or Agent.

