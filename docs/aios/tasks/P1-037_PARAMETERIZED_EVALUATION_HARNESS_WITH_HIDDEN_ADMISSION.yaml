    - H07_INCLUDED_IN_VTSR_TRUE_POLICY_BOUNDARY_MISMATCH
    - R01_REPLAY_PROJECTION_DRIFT_REPLAY_MISMATCH
  semantic_rule: >-
    Each case changes exactly one declared semantic field. Its frozen recipe
    deterministically reseals only the changed artifact's derived byte_length
    and sha256 in the enclosing fixture manifest so admission succeeds and the
    intended semantic oracle is reached. The derived reseal is not a second
    semantic mutation.
  identity_cases_without_reseal:
    - V11_INPUT_BYTE_DRIFT_ARTIFACT_IDENTITY_MISMATCH
  path_population_and_link_cases_without_reseal:
    - V09_MISSING_SEMANTIC_INPUT_ARTIFACT_POPULATION_MISMATCH
    - V10_EXTRA_SEMANTIC_INPUT_ARTIFACT_POPULATION_MISMATCH
    - V12_PARENT_TRAVERSAL_PATH_LEXICAL_VIOLATION
