acceptance_criteria:
  - The selector and lexical baseline run only on accepted canonical inputs and are reproducible offline.
  - Graph-conditioned selection uses measured graph relations rather than labels or hard-coded validation answers.
  - The frozen comparison reports the predefined recall-at-10 metric, byte budget, latency, uncertainty and complete failure taxonomy.
  - Candidate and replay projections are byte-exact deterministic with zero false accepts and zero external effects.
  - Independent evaluation reconstructs results from frozen raw run Evidence and does not trust Worker PASS fields.
required_evidence:
  - Exact accepted input, dataset, scanner, source snapshot and configuration identities.
  - Raw lexical-baseline and graph-conditioned run outputs with deterministic replay.
  - Closed input and output inventories plus independent metric reconstruction.
  - Negative matrix for contamination, mutation, missing, duplicate, reorder and graph-binding drift.
  - One exact candidate and risk-proportional CTO, Security and Quality reviews.
rollback: >-
  Remove only the owned disposable Task worktree and generated Task Evidence;
  after canonical integration use non-destructive git revert if rollback is required.
stop_conditions:
  - The Phase capacity, objective, permission boundary or accepted input identity changes.
  - Any rejected P2 engineering lineage is read, compared, copied or reused.
  - Any network, Provider, Secret, remote, production or public effect occurs.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - The implementation or candidate budget is exhausted.
forbidden_actions:
  - Read or reuse rejected P2 engineering source, candidate, fixture, matrix, evaluator, test or implementation.
  - Create a Founder packet or governance predecessor for this ordinary Task.
  - Read validation issue or oracle bytes before sealed independent evaluation.
  - Use Git history, accepted-change content, a model, embedding, network, Provider or Secret as selector input.
  - Enter P3, push a remote, or make production or public claims.
claim_boundary: >-
  One cooperative-local offline repository-context value vertical slice only;
  no P2 Phase completion, production-readiness, UI, model-quality, remote or
  public capability claim follows from this Task alone.
