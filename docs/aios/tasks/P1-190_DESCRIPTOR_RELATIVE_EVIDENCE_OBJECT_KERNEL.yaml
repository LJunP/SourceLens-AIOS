acceptance_criteria:
  - Trusted owned-root and final Evidence object descriptors remain open through verification and consumption.
  - Receipt paths and absolute paths are metadata only and never regain filesystem read authority after verification.
  - Same-byte new-inode replacement and intermediate-directory replacement cannot redirect a verified read.
  - Final and intermediate symlinks, external hardlinks, path escape, missing, extra, reorder, mutation and identity drift reject.
  - Concurrent churn and cross-transaction substitution either preserve the exact held object identity or return a stable fail-closed reason.
  - Four fresh owned topologies, including /private/tmp, run the same production boundary and leave no undeclared staging, lock or fixture residue.
  - Independent reconstruction uses raw inputs and observed outputs and does not trust Worker PASS, count, equality or success fields.
  - Focused syntax, native build, unit, adversarial and topology verification all pass before the only candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and phase-delegated authority identities.
  - Native build and toolchain identity, source inventory and executable identity.
  - Raw positive and adversarial production-boundary case receipts with pre-read and post-read object identities.
  - Held-root and held-object descriptor lifecycle, topology and ownership cleanup receipts.
  - Independent reconstruction output with exact closed inventory and zero false accepts.
  - Exact candidate commit, tree, diff and hash manifest plus recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify receipt.
