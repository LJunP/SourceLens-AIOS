objective: >-
  Curate, version and freeze p1-pilot-task-dataset-v0.1 as a small mixed-source
  software-engineering task set. The Task must bind provenance, rights status,
  immutable source identity, reproducible environment materialization, issue-specific
  verification, development/validation/hidden separation, lineage and contamination
  analysis, operational hidden-set custody, deterministic validation, rebuild evidence
  and rollback evidence. It must produce exactly eight curation-eligible real tasks
  split 4/2/2.
  It does not run a model or any B0/B1/B2/A0 baseline and does not establish a
  representative benchmark, VTSR, P1 exit or Agent capability.

why_now:
  - AIOS-P1-001 passed Founder Gate and proved only the deterministic visible synthetic harness path.
  - AIOS-P1-002 is terminally stopped and cannot be resumed, retried or used as an accepted B0 adapter.
  - P1 requires a versioned task set and implementation-hidden evaluation boundary before comparable baseline runs are scientifically defensible.
  - Current canonical assets contain only one visible synthetic conformance fixture and one 22-case regression corpus whose benchmarkClaim remains false.
  - Task curation is the smallest next P1 research asset that advances B0/B1/B2 comparability without entering P2 Repository Intelligence or P3 Runtime/Trust work.

research_hypothesis:
  statement: >-
    A bounded mixed-source pilot can produce exactly eight real, reconstructable and
    mechanically validated software-engineering tasks with explicit provenance,
    rights classification, 4/2/2 split isolation, issue-specific oracles and
    operational hidden custody within the declared budget, without modifying accepted
    schemas or running any model baseline.
  falsifier: >-
    Eight eligible tasks cannot be obtained within budget; any accepted source,
    license, issue, patch, oracle, environment, split or hidden-custody identity cannot
    be made reproducible and hash-bound; hidden bytes are exposed to a prohibited role;
    accepted schemas must change; or completion requires P2/P3 capability.

