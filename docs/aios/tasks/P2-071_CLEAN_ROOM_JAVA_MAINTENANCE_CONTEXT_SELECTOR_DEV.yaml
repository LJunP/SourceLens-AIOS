acceptance_criteria:
- The exact accepted P2-069 baseline manifest and every opened child artifact are rehashed before use; the source pack, split, query, corpus, top-k 10 and 131072-byte UTF-8 budget remain unchanged.
- The candidate contains a non-empty testable product-source diff and the new deterministic selector is invoked by the real Code QA product path rather than existing only in an evaluation adapter.
- The product selector operates as an independently implemented maintenance-intent reranker over the B1-selected DEV membership; every task preserves the exact B1 selected file membership before ordering, so dataset and recall opportunity cannot be changed by the candidate.
- On all eight frozen DEV tasks, macro recall is at least 0.8958333333333334, macro precision is at least 0.15595238095238093, macro reciprocal rank is strictly greater than 0.8229166666666666, and no task has lower recall than its accepted B1 result.
- Product unit tests, focused integration tests and the relevant offline backend test suite pass under JDK 17; two independent clean DEV replays of the exact candidate are byte-stable.
- HELD source leaves, PR-file payloads and build results are not opened or scored; the four HELD identities remain custody-only and formal HELD execution count is zero.
- No network, Provider, Secret, remote, production, public, P3 or canonical product effect occurs before independent CTO, Security and Quality/Evaluation acceptance of the exact candidate and Evidence inventory.
required_evidence:
- Create-once baseline installation inventory binding every copied accepted P2-069 leaf by relative path, byte length and SHA-256, plus a complete DEV read-set and explicit zero HELD intersection proof.
- Exact product candidate commit/tree, non-empty changed-file inventory, product-path invocation proof and rollback instructions.
- JDK 17 compiler/runtime identity, exact argv/cwd/closed environment, sandbox-exec deny-network profile and observed process receipts for product tests and DEV evaluation.
- Two clean DEV replay transactions with per-task selected membership, final order, selected bytes, recall, precision, reciprocal rank, macro comparison against accepted B1 and byte-exact replay comparison.
- Real-filesystem negative tests for baseline drift, traversal, symlink input, HELD request, duplicate task ID, output escape and output overwrite.
- One cycle-1 frozen P0/P1 finding set and, if repair is used, one cycle-2 closure-only CTO, Security and Quality/Evaluation review set for the exact final candidate.
rollback: >-
  Do not integrate a NON_PASS candidate; preserve its exact terminal Evidence and short-lived
  branch identity, then use supported Git worktree lifecycle only after terminal accounting.
  Leave canonical main, the accepted P2-069 baseline, P2-070 terminal accounting, the locked
  formal HELD slot, P2, P3 HOLD and the Long-term Goal unchanged.
stop_conditions:
- Stop before Worker execution if the accepted P2-069 baseline manifest or any required child identity drifts, or if the stable benchmark source root is unavailable or symlinked.
- Stop if any P2-070 rejected branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused as implementation input.
- Stop if a HELD source leaf, PR-file payload or build result is opened, or if dataset, split, oracle, metric, threshold, top-k or byte budget is changed.
- Stop if any network, Provider, Secret, remote, production or public effect is requested or observed.
- Stop if any write escapes the Task branch allowlist or exact create-once Task Evidence root.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse the P2-070 rejected engineering lineage; P2-070 may appear only as immutable terminal accounting identity.
- Modify the accepted P2-069 benchmark foundation, source-pack bytes, dataset split, oracle, metric, threshold, schedule or HELD custody.
- Tune on HELD, execute formal HELD, rerun-to-pass, replace a failed Task or create successor, remediation, normalization or closure chains.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete historical terminal Evidence, modify Codex control-plane state, enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for one exact
  clean-room Java-maintenance context selector on the frozen eight-task DEV split. A PASS
  raises delivery progress to 70% and unlocks only the existing formal HELD evaluation slot;
  it does not establish formal HELD value, satisfy the P2 Exit Gate, authorize P3, claim
  production readiness or complete the Long-term Goal.
