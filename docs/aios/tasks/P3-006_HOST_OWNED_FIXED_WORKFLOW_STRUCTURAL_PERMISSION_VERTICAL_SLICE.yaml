objective: >-
  Replace the AgentRuntime-to-effectful ToolExecutionService path with the
  smallest real host-owned five-state workflow vertical slice: the Agent may
  supply only one strict state-specific effect-free typed payload, while fixed
  host handlers own transition order, authority, inputs and any later effect;
  bind state advancement to the accepted P3-001 checkpoint chain and fail
  closed before handler invocation on every structural permission violation.

why_now: >-
  P3-001 has independently accepted durable checkpoint and resume. The next
  frozen P3 value milestone is structural permission for the Founder-amended
  host-owned fixed-state architecture. The current AgentRuntime still forwards
  model-authored tool calls directly into ToolExecutionService, so the product
  path does not yet meet the new zero-authority Agent boundary.

state_graph:
  - INSPECT
  - AGENT_EFFECT_FREE_PAYLOAD
  - APPLY_IN_DISPOSABLE_WORKSPACE
  - DECLARED_TEST
  - RECORD_RESULT

structural_permission_invariants:
  agent_runtime_output: CURRENT_STATE_TYPED_EFFECT_FREE_DTO_ONLY
  agent_forbidden_fields:
    - tool_name
    - verb
    - argv
    - executable
    - read_root
    - write_root
    - network_policy
    - timeout
    - next_state
    - step_order
    - additional_step
  fail_before_handler_invocation:
    - UNKNOWN_TYPE
    - RAW_MAP
    - EXTRA_FIELD
    - WRONG_STATE
    - PATH_BEARING_PAYLOAD
    - OUT_OF_ORDER_TRANSITION
    - REPLAY
  handler_selection: CLOSED_ENUM_SWITCH_ONE_FIXED_PRODUCT_HANDLER_PER_STATE
  transition_selection: HOST_OWNED_FIXED_ORDER_ONLY
  checkpoint_binding: ACCEPTED_P3_001_EXECUTION_CHECKPOINT_CHAIN
  legacy_agent_runtime_effect_path: UNREACHABLE

scope:
  allowed_paths:
    - backend-spring/src/main/java/com/sourcelens/module/agent
    - backend-spring/src/main/java/com/sourcelens/module/execution
    - backend-spring/src/test/java/com/sourcelens
    - backend-spring/src/test/resources
  worker_write_paths:
