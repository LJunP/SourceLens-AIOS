finite_ir_boundary:
  schema: SL-PATCH-IR/1
  legal_program_population: 4
  legal_values:
    - [ARG0, ARG0]
    - [ARG0, ARG1]
    - [ARG1, ARG0]
    - [ARG1, ARG1]
  admission: EXACT_RAW_BUFFER_MEMBERSHIP_BEFORE_PARSE_WRITE_OR_CHILD_START
  output_population: THREE_FROZEN_COMPLETE_POSTIMAGES_PLUS_ONE_IDENTITY_NO_EFFECT_REJECTION
  compiler_kind: CLOSED_TABLE_LOOKUP_NO_TEXT_GENERATION
  only_success_program: [ARG1, ARG0]
  external_effects: false

