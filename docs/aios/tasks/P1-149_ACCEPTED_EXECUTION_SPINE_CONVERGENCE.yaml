acceptance_criteria:
  - SL-PATCH-IR/2 has a closed, versioned, data-driven schema with strict path, operation, type and size bounds.
  - Accepted P1-055 v1 conformance behavior remains unchanged and passes compatibility tests.
  - All six representative tasks compile real finite operations without run-specific PASS hardcoding.
  - Each representative execution applies only to a unique owned disposable repository and runs an independent oracle and tests.
  - Exact P1-101 trace and replay bind response, IR, compiler, apply, oracle, tests and rollback.
  - Rollback restores exact pre-application owned-copy identity for every mutating execution.
  - The evaluator reconstructs the fixed 36-cell denominator and result taxonomy only from frozen raw Evidence.
  - Tamper, missing, reorder, duplicate, selector-only, path escape, symlink, identity drift, unowned mutation and false-success cases reject.
  - False accepts and all six external effects equal zero.
  - Focused verification and Task-worktree make verify pass before one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and authority identities.
  - Closed IR schema, compiler plan, owned-copy application, oracle, tests and rollback receipts.
  - Exact P1-101 composition and replay receipts for all six representative tasks.
  - Independent evaluator reconstruction and closed 36-cell projection.
  - Complete negative matrix, raw preflight closed inventory and zero-effect aggregate.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: OWNED_DISPOSABLE_COPY_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
