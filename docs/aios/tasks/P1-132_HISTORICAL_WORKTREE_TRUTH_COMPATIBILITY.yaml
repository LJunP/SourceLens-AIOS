architecture_constraints:
  - The current validator remains the single Task and route accounting semantic core.
  - Historical worktree identities are data in Truth and are not hardcoded into validator code.
  - Historical worktrees remain registered, read-only, terminal, out of scope and unavailable as source or execution authority.
  - An undeclared extra worktree remains a stable authority NON_PASS.
  - Only one active Task branch, worktree and candidate may exist.
  - Existing validator code must not change because current semantics already satisfy the target.
  - The authority test may change only to require an empty Founder profile set for offline packets while retaining exact Task/profile equality for profile-bearing packets.
acceptance_criteria:
  - The Founder packet, Goal, canonical parent, Contract and authority identities are exact.
  - Current-route inherited_worktree_inventory exactly equals every registered noncanonical terminal worktree other than the declared active P1-132 worktree.
  - Every inherited record binds absolute path, full HEAD, branch and INHERITED_TERMINAL_OUT_OF_SCOPE_NOT_CURRENT status.
  - Canonical main plus inherited inventory plus the declared P1-132 worktree passes the main authority validator.
  - The P1 safety entry calls the same authority core and passes with identical worktree semantics.
  - The authority test suite proves an undeclared extra worktree remains NON_PASS.
  - Validator source bytes remain unchanged.
  - The authority test accepts an empty Founder profile set only for an offline packet and retains exact ordered Task/profile equality for every profile-bearing packet.
  - No historical worktree content is read, modified, deleted, staged or reused.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS over the same bytes.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, Goal, activation-parent, Contract and authority identities.
  - Git administrative worktree inventory comparison with canonical Truth.
  - Main authority, P1 safety and complete authority-test outputs.
  - Diff proving validator and test source bytes are unchanged.
  - Candidate commit, tree, manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same exact candidate and Evidence.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
    - historical worktree deletion
stop_conditions:
  - Canonical start, Goal, Founder packet or historical worktree administrative identity drifts.
  - Existing data-driven semantics prove insufficient and any implementation attempt returns NON_PASS.
  - Any historical worktree content must be read, modified, deleted or reused.
  - An undeclared extra worktree can pass or more than one active Task resource is allowed.
  - A Secret, Provider request, network connection or other external effect occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
claim_boundary: >-
  Current-route binding and verification of existing cooperative-local,
  data-driven terminal historical worktree semantics only. No new P1
  capability, validator security claim, historical asset acceptance, P2/P3
  entry, external effect, remote, production or public claim.
