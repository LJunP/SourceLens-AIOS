objective: >-
  First establish hermetic forked-Surefire and JUnit temporary-file confinement
  inside the exact Task worktree, then build the smallest persistent task-bound
  capability ledger that filters production AgentRuntime tool exposure and
  rejects unauthorized tool execution before any tool body runs.
why_now: >-
  P3-001 accepted durable state and checkpoint resume. P3-003 terminated before
  product write because the forked test JVM ignored the intended Task-local
  temporary root. The Founder authorized one final capability-milestone Task,
  without increasing the P3 Phase envelope, with Stage A required to close that
  exact hermetic preactivation condition before Stage B may write product source.
ordered_stages:
  stage_a:
    name: HERMETIC_SUREFIRE_JUNIT_TEMP_ROOT_PREACTIVATION
    status: REQUIRED_BEFORE_PRODUCT_WRITE
    allowed_paths:
      - backend-spring/pom.xml
      - backend-spring/src/test/resources/junit-platform.properties
    selected_minimal_path:
      - backend-spring/pom.xml
    product_source_write_allowed: false
    required_execution:
      test: AgentSandboxToolTest
      runtime: JDK_17
      maven_mode: OFFLINE
      os_sandbox: MACOS_SANDBOX_EXEC_DENY_NETWORK_AND_DENY_WRITES_OUTSIDE_EXACT_TASK_WORKTREE
      forked_jvm_java_io_tmpdir: EXACT_TASK_WORKTREE_CHILD
      junit_temp_root: EXACT_TASK_WORKTREE_CHILD
    acceptance:
      - The exact legacy AgentSandboxToolTest reports 10 tests, 0 failures, 0 errors and 0 skipped under the bound sandbox.
      - The Surefire fork command and runtime properties bind java.io.tmpdir to the exact Task-local root before the forked JVM starts.
      - Every observed JUnit temporary path is within the exact Task worktree and is absent after the test completes.
      - Maven, JDK 17, sandbox-exec, profile, argv, cwd, closed environment, stdout, stderr, XML and write inventory are hash-bound in create-once Evidence.
      - No network or write outside the exact Task worktree or Evidence root occurs.
    non_pass_effect: TERMINAL_BEFORE_PRODUCT_SOURCE_WRITE
  stage_b:
    name: PERSISTED_CAPABILITY_LEDGER_PRODUCT_IMPLEMENTATION
    entry_requirement: STAGE_A_ACCEPTED
    allowed_paths:
      - backend-spring/src/main/java/com/sourcelens/module/agent
      - backend-spring/src/main/resources/db/migration
      - backend-spring/src/test/java/com/sourcelens
    product_source_required: true
    objective: >-
      Persist exactly one default READ_ONLY tool capability grant with each
      Agent Task, bind it to exact project, conversation, policy and tool
      identities, filter production AgentRuntime prompt exposure from that
      grant, and reload it before every tool execution decision.
architecture:
  grant_record: >-
    A durable immutable issuance record bound to one Agent Task, project,
    conversation, policy identity, normalized exact tool allowlist, permission
    ceiling and ACTIVE or REVOKED status.
  issuance: >-
    Agent Task creation and default READ_ONLY grant creation are atomic;
    duplicate or conflicting issuance fails closed.
  runtime_exposure: >-
    AgentRuntime loads the exact ACTIVE grant for the task-bound subject and
    exposes only exact normalized allowed tool descriptions and schemas.
  execution_admission: >-
    Tool execution reloads the durable grant and rejects missing, revoked,
    unlisted, aliased, elevated, malformed or subject-drifted requests before
    AgentTool.execute is invoked.
  audit: >-
    Known-tool allow and deny decisions persist task id, grant id, decision and
    stable reason code without storing secrets.
