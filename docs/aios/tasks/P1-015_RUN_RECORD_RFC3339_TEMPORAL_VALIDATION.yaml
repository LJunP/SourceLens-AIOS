  provider_calls: 0

acceptance_criteria:
  - Quality freezes exactly eight inputs and exact expected typed outputs before Worker implementation.
  - Q01 through Q05 PASS with exact normalized timestamps and duration_ns.
  - Q06 and Q07 fail with INVALID_RFC3339 and Q08 fails with ENDED_BEFORE_STARTED.
  - Two fresh copies of Q02 produce byte-identical stdout.
  - The eight-case oracle agreement is 8/8, false accepts and replay mismatches are zero.
  - P1-001 and P1-011 regression gates remain PASS.
  - Candidate targeted gates, fresh-clone targeted rebuild and rollback PASS.
  - Master Gate performs mechanical Truth/code-map synchronization and final canonical make verify.
  - Exact candidate receives PASS from CTO, Security and Quality reviewers.

failure_criteria:
  - Any of the eight frozen outcomes differs from the oracle.
  - Equivalent Q02 copies produce different output.
  - A timestamp is evaluated with floating-point arithmetic or platform locale parsing.
  - Implementation requires network, Provider, Secret, remote, production or public effects.

stop_conditions:
  - Any write occurs outside exact role-owned Task paths or external Evidence root.
  - Any immutable authority, accepted artifact or historical Evidence changes.
  - A Founder-reserved decision or deferred P2/P3 capability becomes necessary.
  - The same root cause remains after two implementation iterations without new Evidence.
  - Any final independent review is non-PASS after the implementation budget is exhausted.

forbidden_actions:
