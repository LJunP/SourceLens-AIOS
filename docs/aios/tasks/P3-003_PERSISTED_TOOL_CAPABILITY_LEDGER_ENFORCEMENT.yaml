    - accepted P3-001 durable checkpoint milestone
    - current canonical Agent task, conversation, runtime and tool source
stop_conditions:
  - Preactivation temp-root confinement is not mechanically PASS before product write.
  - Write escapes the exact Task worktree or create-once Evidence root.
  - A denied invocation can reach AgentTool.execute.
  - Any external capability becomes necessary.
  - Candidate or repair budget is exhausted.
