task_objective: >-
  Implement and independently verify the smallest isolated evaluation-harness
  slice that loads one immutable TaskSpec, materializes one reproducible
  EnvironmentSnapshot, executes a deterministic B0 contract-conformance adapter
  and a read-only B2 current-SourceLens compatibility adapter against the same
  development fixture and budget policy, retains schema-valid observable run
  evidence, invokes one frozen deterministic evaluator, and reproduces normalized
  verdict and artifact identity from a fresh replay. The task must not modify
  inherited business behavior or claim capability improvement.

research_hypothesis:
  statement: >-
    Given the frozen project-owned Java fixture, network-disabled hash-bound
    environment, shared TaskSpec, two frozen configurations and deterministic
    evaluator, the minimum harness can produce complete schema-valid primary and
    replay records for B0 and B2, with 2/2 reproducible conformance, identical
    normalized evaluator verdicts, complete evidence, and zero forbidden action.
  falsifier: >-
    The hypothesis is false for this task if either adapter cannot conform without
    adapter-specific TaskSpec or evaluator changes; source, environment or
    artifact identity cannot be reproduced; any required observable evidence is
    missing; a normalized replay or evaluator verdict differs; an unsafe action
    occurs; or success requires scope, budget, oracle or product expansion.
  capability_claim_boundary: >-
    Passing proves only minimum harness contract conformance and replayability on
    one visible development fixture. It does not establish Verified Task Success
    Rate, model or SourceLens superiority, hidden-set validity, general software
    engineering capability, production readiness, or P1 completion.

why_now:
  - P0 established a reproducible and rollback-capable technical baseline.
  - Founder has authorized P1 Agent Evaluation and Research Foundation.
  - Later Repository Intelligence or Agent claims would be incomparable without a common task, environment, trace, evaluator and baseline path.
  - The smallest falsifiable P1 step is one development fixture and two conformance configurations, not a broader Agent or product runtime.

