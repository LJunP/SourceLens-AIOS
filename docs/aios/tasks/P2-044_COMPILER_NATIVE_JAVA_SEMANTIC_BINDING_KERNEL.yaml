architecture_constraints:
  - Admit every semantic input by relative path, type, non-symlink, nlink=1, byte length and SHA-256 before parsing.
  - Use JavacTask.parse/analyze, Trees.getElement/getTypeMirror, Elements.getBinaryName and Types.directSupertypes as semantic authority.
  - Bind every query to an exact source span and emit locale-independent compiler diagnostic codes.
  - Verify successful resolution independently using exact javac and classfile/javap raw Evidence, not exit status alone.
  - Bind exact child argv, minimal environment, tool identity, stdout, stderr, exit status, source-root physical identity and closed outputs.
  - Run the same case set in two physically independent roots and require byte-exact stable projection and replay.
  - Derive external-effect counts from closed raw observations and do not trust self-reported zero constants.
  - Do not implement handwritten JLS precedence as the semantic authority.
  - Do not build the graph or benchmark before this Task Gate passes.
quality_freeze:
  positive_matrix:
    - explicit import resolution
    - same-package resolution
    - wildcard import resolution
    - qualified reference resolution
    - nested lexical type resolution
    - nearest inherited member type hiding
    - successful compiler-attributed binary identity with matching classfile/javap Evidence
    - byte-exact stable projection across two physical repository roots
  negative_matrix:
    - java.lang versus wildcard ambiguity
    - unresolved symbol diagnostic
    - semantic input symlink
    - semantic input hardlink and nlink drift
    - consumer input hardlink
    - tool path, type, byte-length or SHA-256 drift
    - unbounded child environment
    - input missing, mutation, duplicate, reorder and cross-case binding
    - source path substitution and physical-root alias
    - stale or tampered compiler, classfile, javap or effect receipt
    - forged zero external-effect summary without closed raw observations
  required_counts:
    repository_roots: 2
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - Compiler-native attribution produces correct exact identities for every positive case.
  - Ambiguous and unresolved cases fail closed with exact locale-independent diagnostic codes.
  - Independent javac plus classfile/javap Evidence agrees with every successful resolved identity.
  - Product and consumer reject symlink, hardlink, identity drift and unbounded environment cases.
  - Stable projection and replay are byte-exact across two physical roots.
  - False accepts, Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
