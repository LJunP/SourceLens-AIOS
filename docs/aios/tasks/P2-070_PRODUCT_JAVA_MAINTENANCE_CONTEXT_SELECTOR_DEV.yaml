acceptance_criteria:
- The exact accepted P2-069 B1 result and its frozen DEV task cards, corpus identities, query, top-k 10 and 131072-byte UTF-8 budget are hash-bound before any A0 execution.
- The candidate contains a nonempty product-source selector change wired into the real Code QA product path and focused product tests pass offline.
- A0 uses only the same eight frozen DEV tasks, queries, production-Java corpus leaves, ground-truth paths, top-k and byte budget as accepted B1; no HELD source, task card, oracle or result is opened.
- A0 macro recall is strictly greater than accepted B1 macro recall 0.8958333333333333, macro precision is at least 0.15595238095238095, macro reciprocal rank is at least 0.8229166666666666, and no DEV task recall is lower than its accepted B1 value.
- Two clean A0 DEV replays are byte-exact and independently recomputable from the frozen product candidate, accepted baseline inputs and closed read-set Evidence.
- Product source, tests and evaluation outputs remain inside the Task allowlist; execution remains offline with sandbox-exec deny-network and zero external effects.
- CTO, Security and Quality/Evaluation independently accept the exact candidate and Evidence inventory before the Task Gate is accepted.
required_evidence:
- Create-once accepted-baseline installation and exact binding of P2-069 B1 results, DEV task cards, benchmark manifest, read-set identity and non-overlap proof.
- Exact product candidate commit/tree, nonempty product-source diff, changed-file inventory and proof that the selector is wired into the real Code QA path.
- Focused product unit tests, controller regression tests and exact offline build invocation with environment and sandbox identity.
- Two independent clean DEV replay transactions containing full per-file scores, selections, byte counts, per-task metrics and macro metrics.
- Independent comparison against accepted B1 with strict-improvement, lower-bound and per-task no-regression checks.
- Negative tests for HELD request, baseline drift, corpus drift, symlink input, out-of-root paths, output overwrite, nondeterministic ties and byte-budget overflow.
- Rollback instructions, canonical verification and three final review records.
rollback: >-
  Do not integrate a rejected candidate; preserve its exact candidate and Evidence
  inventory, retire only the short-lived Task resources through supported lifecycle,
  and leave canonical main, P2-069 accepted baseline, P2-068 terminal accounting,
  P2, P3 HOLD and the Long-term Goal unchanged.
stop_conditions:
- Stop before product execution if P2-069 accepted baseline identity, frozen DEV inputs, query, corpus, oracle, top-k or byte budget drifts.
- Stop if any HELD task card, source leaf, PR payload, build result, oracle or result is requested or opened.
- Stop if any P2-068 rejected branch, worktree, code, benchmark implementation or engineering Evidence is read, compared, copied or reused.
- Stop if any network, Provider, Secret, remote, production or public effect is requested or observed.
- Stop if any write escapes the exact Task allowlist or create-once Task Evidence root.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse P2-068 rejected engineering lineage.
- Modify the accepted benchmark, DEV or HELD split, query, corpus, ground truth, metric, threshold, schedule, top-k, byte budget or P2-069 baseline.
- Read or execute HELD, tune on HELD, rerun-to-pass, replace a failed Task or create successor, remediation, normalization or closure chains.
- Execute Maven, Gradle, JVM tests or any build subprocess with network enabled; all builds must use exact offline settings and sandbox-exec deny-network.
- Use network, credentials, uploads, Git fetch/clone/push, Provider, remote, production or public release.
- Delete accepted or terminal Evidence, modify Codex control-plane state, enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for one exact
  product candidate on frozen DEV. It does not claim formal HELD performance, the P2
  Exit Gate, P3 eligibility, production readiness or Long-term Goal completion.
