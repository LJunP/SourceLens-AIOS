architecture_constraints:
  - Implement a product-code JavaParser declaration index and resolver under the new graph package.
  - Do not modify accepted JavaAstParser or backend pom bytes.
  - Do not build a complete Java compiler, generic classpath platform, authority system or Evidence platform.
  - Keep the kernel deterministic and independent from repository-root absolute paths.
  - Keep Evidence tooling task-local and independently consumable.
quality_freeze:
  positive_matrix:
    - Nested lexical target Outer.B extends A resolves INTERNAL to p.Outer$A.
    - Explicit import p.Outer.A resolves to the admitted nested declaration p.Outer$A.
    - Exact attested explicit external import resolves EXTERNAL.
    - One attested wildcard match resolves EXTERNAL.
    - Two attested wildcard matches resolve AMBIGUOUS.
    - An unattested wildcard target resolves UNRESOLVED.
    - Lexical member types take precedence over imports.
    - Explicit single-type imports take precedence over same-package and wildcard scopes.
    - Same-package admitted declarations resolve INTERNAL.
    - Qualified nested, generic, interface, record, enum and local declarations retain exact identities and spans.
    - Comments and strings containing Java-like syntax create no facts.
    - Three physically distinct repository roots produce byte-exact projections and replay.
    - Accepted default P1 Java scanner regression remains PASS with byte-identical frozen sources.
  negative_matrix:
    - external inventory path drift
    - external inventory byte-length drift
    - external inventory SHA-256 drift
    - external inventory symlink
    - external inventory extra field
    - external inventory missing field
    - duplicate external binary identity
    - duplicate admitted source declaration
    - source path escape
    - source symlink
    - source missing
    - source mutation after admission
    - repository-root identity leakage
    - nested lexical target invented as package-level identity
    - nested explicit import misclassified external
    - unknown single wildcard target invented external
    - conflicting wildcard imports accepted as one target
    - comment or string pseudo-declaration accepted
    - projection reorder accepted
    - replay mutation accepted
    - nonzero external-effect observation accepted
  required_counts:
    physical_repository_roots: 3
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - All parser-native positive cases match the frozen source and binary identities, owner chains, spans and classifications.
  - All negative cases reject or produce the exact fail-closed classification with zero false accepts.
  - Default P1 Java scanner source and pom identities remain byte-exact and its targeted regression passes offline.
  - Three physical roots produce byte-exact deterministic projection and replay.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Source manifest and external symbol inventory identities.
  - Raw parser facts, declaration index, relation resolution and deterministic projections for all cases.
  - Independent consumer receipt that re-derives identities, classifications, counts and external-effect conclusions.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality Reviews of the same candidate and Evidence bytes.
rollback:
