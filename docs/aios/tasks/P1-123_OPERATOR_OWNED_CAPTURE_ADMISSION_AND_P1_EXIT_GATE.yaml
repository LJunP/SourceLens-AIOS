g0_pre_effect_gate:
  - Goal, packet, canonical source, Contract, authority and accepted-input identities are exact.
  - P2 preregistration is frozen before any result is visible.
  - Thirty-six formal cells and no more than three distinct diagnostics are frozen.
  - Every Provider-bound byte is derived only from the exact 16-artifact disclosure set.
  - Six-task parameterized B0/B1/B2 composition is executable without rejected engineering bytes.
  - The external launcher source and executable identity, owner, mode, type and output protocol are frozen.
  - Capture output root is absent and its Task-owned parent has passed path, type and link checks.
  - Complete negative matrix passes with zero false accepts and zero non-owned mutation.
  - Current authority/safety checks and projected full make verify pass.
  - Secret reads, Provider requests and network connections remain zero.
  - One independent Security review of the frozen G0 bytes returns PASS.
quality_freeze:
  formal_matrix:
    tasks: 6
    configurations:
      - B0
      - B1
      - B2
    repetitions:
      - A
      - B
    scheduled_runs: 36
    denominator_rule: ALL_SCHEDULED_FORMAL_RUNS
    rerun_or_replacement_allowed: false
  diagnostics:
    maximum_distinct_requests: 3
    first_strict_pass_activates_formal_matrix: true
    repeated_adjacent_normalized_root_cause_stops: true
    included_in_formal_denominator: false
  baseline_semantics:
    B0: issue and bounded shared prompt context only, without source or tools
    B1: issue plus finite reads of exact allowlisted source bytes, without free shell
    B2: issue plus exact accepted scanner-selected allowlisted source bytes
  metrics:
    primary: VERIFIED_TASK_SUCCESS_RATE
    guardrails:
      - false-success rate
      - unsafe-action rate
      - evidence completeness
      - replay and rollback rate
      - cost per verified success
      - latency
      - human interventions
      - invalid and failed run distribution
  negative_matrix:
    - missing, extra, duplicate, reordered or hash-drifted request cells
    - preregistration changed after result visibility
    - B0 source or tool-context disclosure
    - B1 or B2 non-allowlisted disclosure
    - launcher source, executable, owner, mode, type or hash drift
    - Secret or credential-shaped data in a persistent sink
    - pre-existing, symlinked, hardlinked, overwritten or extra bundle artifacts
    - non-loopback, DNS, proxy, redirect, fallback, model substitution or retry
    - request, token or monetary cap overflow
    - response/request mismatch, missing terminal record or inconsistent usage
    - formal failure removal, replacement, rerun or post-hoc exclusion
    - B1 free shell, forbidden tool or undeclared execution
    - B2 missing exact scanner child
    - local P1-101 trace rewritten as Provider-effect trace
    - missing RunRecord, trace, replay, rollback or Evidence field
    - denominator reduction, post-hoc invalidation or false-success promotion
    - Provider output execution or non-owned mutation
acceptance_criteria:
  - G0 passes before any Secret or Provider effect.
  - The Founder/operator performs one no-echo TTY Secret-entry session and the exact launcher emits one closed non-Secret capture bundle.
  - The diagnostic state machine either stops honestly or activates exactly 36 formal calls after the first strict completion.
  - Every scheduled formal result is retained and independently classified without rerun or replacement.
  - Six-task B0/B1/B2 A/B composition is complete and B2 binds real accepted scanner children.
  - False accepts, non-owned mutations and unauthorized external effects equal zero.
  - RunRecords, traces, stable projections, replay and rollback are exact and independently recomputable.
  - The baseline report contains the full VTSR numerator, denominator, invalid, failure and reason-code distribution plus uncertainty, cost and limitations.
  - The P2 preregistration was frozen before results and contains a falsifiable hypothesis and stop condition.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed and integrated trees are exact equal and one canonical full make verify passes.
required_evidence:
  - Exact Founder packet, Goal, activation parent, Contract and authority identities.
  - Frozen disclosure manifest, preregistration, 36-cell plan, request pack and diagnostic state machine.
  - Exact external launcher source/executable identity and G0 Security review.
  - Raw diagnostic and 36 formal terminal records plus create-once bundle manifest.
  - Per-run RunRecord, trace, stable projection, replay, rollback and evaluator receipt.
  - Independent aggregate, baseline report and offline reproduction command.
  - Exact candidate commit/tree/diff/hash manifest and recoverable Evidence tag.
  - Fresh final CTO, Security and Quality reviews on the same candidate and Evidence.
  - Reviewed/integrated tree equality and one canonical full make verify receipt.
rollback:
  strategy: >-
    Disposable fixture cleanup, immutable capture-bundle preservation and
    non-destructive git revert after canonical integration.
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
    - Evidence overwrite or deletion
stop_conditions:
  - Starting Goal, packet, canonical identity or clean state drifts.
  - A rejected engineering asset must be read, compared, restored or reused.
  - The exact synthetic disclosure set is insufficient.
  - G0 remains NON_PASS after the one allowed pre-freeze repair.
  - Frozen G0 Security review is NON_PASS.
  - Launcher, request plan, disclosure set or preregistration drifts.
  - No strict diagnostic completion occurs within the predeclared limit.
  - The same normalized infrastructure root cause occurs twice consecutively.
  - Secret reaches a forbidden sink or memory-only handling cannot be maintained.
  - A non-loopback, proxy, DNS, redirect, fallback, retry, extra request, cap overrun or permission expansion occurs.
  - Evidence is overwritten, deleted or silently replaced.
  - Request/response identity or the 36-cell population cannot be closed.
  - A formal result is omitted, replaced, rerun or removed from the denominator.
  - B2 lacks the exact accepted scanner child.
  - Provider output executes or escapes quarantine.
  - Implementation iterations are exhausted.
  - Any fresh final Reviewer returns NON_PASS.
  - Reviewed and integrated trees differ.
  - Canonical full make verify is NONPASS.
  - Completion requires P2 entry, remote, production, public, general source egress or a P1 Exit Gate change.
