architecture_constraints:
  - Use JavacTask, Trees, TreePathScanner, Element and TypeMirror as edge-truth authorities.
  - Bind each method call to caller, receiver type, resolved ExecutableElement, declaring owner, parameter types, return type and stable descriptor.
  - Bind field references and extends or implements edges to attributed compiler symbols.
  - Distinguish inherited, interface dispatch, overloaded, external JDK, unresolved and compiler-rejected cases truthfully.
  - Do not use regular expressions, unqualified-name matching, fixture labels or worker self-report as edge truth.
  - Attach documentation references only from directly adjacent source spans proven by compiler source positions.
  - Preserve repository-root-independent semantic bytes while retaining root-specific provenance outside the semantic projection.
  - Run the exact same positive corpus from two physically distinct repository roots.
  - Retain complete raw positive and negative transactions sufficient for independent rebuild and replay.
  - Keep Provider, Secret and all six external effects at zero.
