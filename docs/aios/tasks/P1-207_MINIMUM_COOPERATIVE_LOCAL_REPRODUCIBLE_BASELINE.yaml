preformal_requirements:
  - Run a complete synthetic 36-cell rehearsal through the production-equivalent request, response, accepted-adapter, execution-spine, oracle and report-rebuild interfaces.
  - Bind every request and response by cell, profile, repetition, exact byte length and SHA-256 without relying on directory order or Worker success fields.
  - Rebuild the report from a frozen closed manifest and raw Evidence only; the generated report must not be an input to its own reconstruction or verification.
  - Execute numeric, usage, missing, null, duplicate-key, mutation, cross-binding, request/response identity, closed-inventory and report-count negative cases with zero false accepts.
  - Prove zero Secret reads, zero Provider requests and zero network effects before the preformal Gate.
  - Prove accepted P1-129 adapter participation and P1-149/P1-101 execution-spine/trace/replay participation for all 36 synthetic cells.
  - Use direct no-echo input in the transport process; no Bash here-string, environment, argv or disk-backed plaintext transfer is permitted.
  - Independently review the exact preformal source and Evidence with CTO, Security and Quality TARGET_VERDICT PASS before opening the formal effect Gate.
formal_requirements:
  - One strict diagnostic local-gateway request must PASS before the 36 formal cells begin.
  - Execute exactly 36 formal Provider requests once, with automatic retries equal to zero and every scheduled cell retained in the denominator.
  - Persist request bytes before effect and response bytes immediately after receipt, excluding the Secret and Authorization header or hash.
  - Bind the exact peer address and port to 127.0.0.1:8787 and reject redirects, proxies, DNS and every observed non-loopback connection.
  - Preserve negative, neutral and zero-VTSR outcomes as valid research results when the artifact is complete and truthful.
  - Independently reconstruct and verify the final report from frozen raw Evidence, then freeze one exact final candidate for proportional CTO, Security and Quality Task Gate review.
acceptance_criteria:
  - All preformal requirements PASS on one exact candidate with zero false accepts and no external effects.
  - Fresh independent CTO, Security and Quality preformal TARGET_VERDICT are all PASS.
  - The unique diagnostic and formal matrix obey the exact Founder profile without Secret persistence, Evidence overwrite or non-loopback effects.
  - The raw-Evidence-only report rebuild and independent verifier return PASS while preserving the truthful 36-cell taxonomy and VTSR.
  - Fresh final Task Gate reviewers accept the same exact source and formal Evidence.
  - Reviewed tree equals integrated tree and one canonical make verify returns PASS.
required_evidence:
  - exact preformal source manifest
  - synthetic 36-cell Worker receipt
  - accepted-input participation receipts
  - closed raw Evidence manifest
  - independent raw-Evidence-only rebuild receipt
  - negative matrix receipt with zero false accepts
  - CTO Security and Quality preformal reviews
  - request and response receipts for one diagnostic plus 36 formal cells
  - reproducible baseline report and independent verification receipt
  - exact final candidate manifest and final reviews
  - canonical integration and make-verify receipt
stop_conditions:
  - Any independent preformal Reviewer returns TARGET_VERDICT NON_PASS.
  - Adjacent implementation attempts reproduce the same normalized root cause.
  - The same-Task repair budget, engineering-hour budget or calendar budget is exhausted.
  - The formal matrix starts before the complete preformal Gate PASS.
  - The formal matrix returns NON_PASS or would require a rerun, replacement or omission of a scheduled cell.
  - A Secret is persisted or appears in repository, Evidence, log, trace, prompt, review or Vault.
  - Evidence is overwritten or deleted, or a non-loopback, remote, production or public effect occurs.
  - A final Reviewer returns NON_PASS, reviewed and integrated trees differ, or canonical make verify returns NONPASS.
  - The P1 Objective, Exit Gate, Phase boundary, scope, budget or permissions change.
forbidden_actions:
  - Read, restore, compare or reuse P1-205 or any other rejected engineering asset.
  - Build a new authority, parser, validator, security platform, Trust Runtime or strong-isolation subsystem.
  - Treat documentation, Review, hash, manifest or governance synchronization as P1 capability progress.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain.
  - Enter P2 or P3, push or modify a remote, or produce remote, production or public effects.
  - Rerun, replace, omit or cosmetically improve any formal matrix cell.
rollback: >-
  Before formal execution, discard only Task-owned unaccepted work and preserve
  review Evidence. After formal execution, preserve the complete formal Evidence
  root. If a reviewed candidate was integrated and canonical verification later
  fails, use a non-destructive git revert; never reset or clean.
