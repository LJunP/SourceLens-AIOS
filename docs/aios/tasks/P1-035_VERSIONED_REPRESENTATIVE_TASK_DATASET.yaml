    - deterministic double Git materialization with exact commit/tree equality
    - base revision clean-state verification
    - required-command typed base-failure sanity check that rejects syntax, setup, missing-module, timeout and signal failures
    - reference-solution patch apply plus issue-specific and regression command PASS
    - the exact 12-case atomic mutation matrix frozen by this Contract

