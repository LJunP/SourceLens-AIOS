preregistration_minimum_contract:
  experiment_id: P2-CTX-EXP-001-BOUNDED-CONTEXT-VTSR
  owner_phase: P2
  preregistered_in_phase: P1
  lifecycle: PREREGISTERED_NOT_EXECUTED
  research_question: >-
    On the accepted six-task visible synthetic P1-035 set, does one bounded
    repository-context configuration improve independently verified task
    success over issue-only context when every other run input is held equal?
  hypothesis:
    null: Candidate verified successes minus baseline verified successes across 18 eligible runs is less than 2.
    alternative: Candidate verified successes minus baseline verified successes across 18 eligible runs is at least 2.
    falsifiable: true
  configurations:
    baseline:
      id: CTX-BASELINE-ISSUE-ONLY-V1
      context_identity_ref: accepted_inputs.baseline_context
    candidate:
      id: CTX-CANDIDATE-BOUNDED-REPOSITORY-CONTEXT-V1
      ranked_repository_files_maximum: 4
      selected_context_bytes_maximum: 8192
      allowed_source_kind: repository regular files at the frozen base revision
      forbidden_context_kinds:
        - tests
        - reference-solution patches
        - expected-base-failure oracles
        - evaluator or review artifacts
        - secrets
        - network-fetched content
    held_equal_before_run:
      - exact model and Provider identity
      - exact Agent/runtime implementation
      - TaskSpec and frozen base revision
      - environment snapshot
      - tool policy and budgets
      - evaluator and oracle
      - repetition schedule and seeds when supported
    future_binding_status: NOT_AUTHORIZED_IN_P1
    future_binding_rule: >-
      Exact future model, Provider, runtime, candidate implementation commit/tree
      and environment identities do not exist in this Task. A future immutable
      P2 execution matrix must bind them equally for both arms before the first
      run. The only accepted unbound sentinel is NOT_AUTHORIZED_IN_P1, and no run
      or result is admissible while that sentinel remains.
  sample:
    task_population: 6
    configurations: 2
    repetitions_per_task_configuration: 3
    scheduled_runs_per_configuration: 18
    total_scheduled_runs: 36
    pairing: same task and repetition ordinal across both configurations
    order: deterministic counterbalanced order frozen before outputs
  primary_metric:
    id: VTSR
    definition: independently verified successful runs divided by eligible scheduled runs
    decision_unit: integer successful-run count out of 18 per configuration
    success_delta_required: 2
    equivalent_minimum_absolute_delta: 0.1111111111111111
  task_success_rule: at least 2 independently verified successful runs out of 3 scheduled repetitions
  secondary_metrics:
    - relevant-source recall at 4 against a Quality-frozen visible oracle
    - relevant-source precision at 4 against the same oracle
    - selected context bytes
    - token count, cost and end-to-end latency
    - false-success count
    - policy-violation count
    - invalid-run count and reason-code distribution
  exclusions:
    infrastructure_reason_codes:
      - SHARED_HARNESS_UNAVAILABLE
      - SHARED_ENVIRONMENT_MATERIALIZATION_FAILURE
    reruns_per_infrastructure_invalid_run: 1
    rule: >-
      Infrastructure-invalid runs remain in raw results and are rerun once under
      the same configuration. System-attributable timeout, budget exhaustion,
      crash, missing Evidence, policy violation or ordinary setup failure counts
      as failure. No post-output exclusion may improve VTSR.
  stop_continue_decision:
    precedence: STOP_OVERRIDES_CONTINUE
    stop_action: STOP_CONTEXT_STRATEGY_V1_AND_RETAIN_NEGATIVE_RESEARCH_ARTIFACT
    stop_when_any:
      - candidate successful-run count minus baseline successful-run count is less than 2
      - candidate loses task-level success on any task that baseline passes
      - false-success count is greater than 0
      - policy-violation count is greater than 0
      - forbidden context selection count is greater than 0
      - selected context exceeds four files or 8192 bytes in any run
      - a required future identity is unbound when a run starts
      - more than two infrastructure-invalid runs remain after the one allowed same-configuration rerun
    continue_action: CONTINUE_ONLY_TO_A_FRESH_BOUNDED_P2_REPLICATION_DECISION
    continue_when_all:
      - candidate successful-run count minus baseline successful-run count is at least 2
      - candidate loses task-level success on zero baseline-passing tasks
      - false-success, policy-violation and forbidden-context counts are all zero
      - every run respects context, task, tool and Evidence budgets
      - all identities were frozen before the first run
  claim_boundary: >-
    PREDECLARED_VISIBLE_SYNTHETIC_SIX_TASK_CONTEXT_COMPARISON_ONLY_NO_P2_ENTRY
    _NO_CONTEXT_ENGINE_IMPLEMENTATION_NO_RUN_NO_PROVIDER_NO_MODEL_NO_BENCHMARK
    _NO_AGENT_CAPABILITY_NO_P1_EXIT_NO_PRODUCTION_OR_GENERALIZATION_CLAIM

quality_freeze_requirements:
  required_files:
    - evaluation-harness/fixtures/context-engine-preregistration-v1/preregistration.schema.json
    - evaluation-harness/fixtures/context-engine-preregistration-v1/experiment-preregistration.json
    - evaluation-harness/fixtures/context-engine-preregistration-v1/relevance-oracle.json
    - evaluation-harness/fixtures/context-engine-preregistration-v1/quality-card.json
    - evaluation-harness/fixtures/context-engine-preregistration-v1/quality-oracle.mjs
    - evaluation-harness/fixtures/context-engine-preregistration-v1/candidate-manifest.schema.json
  parser_security:
    duplicate_json_members: REJECT_BEFORE_JSON_PARSE_OR_SCHEMA_VALIDATION
    duplicate_reason_code: DUPLICATE_JSON_MEMBER
    applies_to:
      - preregistration
      - schema
      - relevance oracle
      - quality card
      - candidate manifest
    rule: >-
      Every security-relevant JSON byte stream must pass a raw-byte duplicate
      object-member detector before JSON.parse, schema validation or semantic
      use. Last-value-wins and first-value-wins parsing are forbidden.
  requirements:
    - closed schemas reject unknown and missing fields at every object boundary
    - exact accepted input paths, SHA-256 values and byte lengths are bound
    - all six task IDs appear exactly once in dataset order
    - only the exact NOT_AUTHORIZED_IN_P1 sentinel is accepted before future binding
    - hypothesis, VTSR, counts, exclusions and stop/continue rules are machine-checkable
    - STOP_OVERRIDES_CONTINUE cannot be bypassed
    - no external effect or P2 execution authority appears
  negative_matrix_minimum_categories:
    - duplicate JSON object member before parse
    - unknown or missing field
    - missing or non-falsifiable hypothesis
    - missing stop condition or stop precedence
    - VTSR, denominator or success-delta drift
    - task omitted, duplicated, reordered or substituted
    - accepted input path, SHA-256 or byte-length drift
    - sample or repetition drift
    - post-output exclusion or system-failure reclassification
    - held-equal policy removed or future identity falsely bound
    - context budget widened or forbidden content allowed
    - external effect or claim boundary widened
    - symlink, repository-path escape or unowned extra artifact

worker_requirements:
  required_files:
    - evaluation-harness/validators/context-engine-preregistration-v1/validate.mjs
    - evaluation-harness/validators/context-engine-preregistration-v1/self-test.mjs
  validator_cli:
    argv: node validate.mjs --repository-root ABSOLUTE_REPOSITORY --artifact-root ABSOLUTE_ARTIFACT_ROOT
    pass_exit_status: 0
    nonpass_exit_status: 2
    pass_stdout: P1_CONTEXT_ENGINE_PREREGISTRATION_OK experiment=P2-CTX-EXP-001-BOUNDED-CONTEXT-VTSR tasks=6 runs=36
    stderr_policy: empty on PASS
  implementation:
    - Node.js standard library only; no package install or network
    - reject duplicate JSON object members from raw bytes before JSON.parse or schema use
    - secure regular-file reads with symlink and path-containment rejection
    - closed artifact population and exact canonical input identity checks
    - semantic checks independent from schema-shape checks
    - isolated uniquely owned temporary fixtures; clean only owned paths
    - every Quality mutation rejected with its reason code
    - false accepts zero and unresolved cases zero

candidate_manifest_contract:
  schema_owner: P1-059 Quality Asset Owner
  parser_rule: reject duplicate JSON object members before parse or schema validation
  exact_top_level_fields:
    - schema_version
    - record_type
    - task_id
    - activation_parent_commit
    - activation_parent_tree
    - candidate_commit
    - candidate_tree
    - files
  exact_file_fields: [path, sha256, byte_length, file_type]
  population: every repository file changed from activation parent to candidate, exactly once, lexicographically sorted
  freeze_preflight: >-
    Before candidate commit, Integration generates a full provisional manifest
    with valid dummy 40-hex identities from the staged tree, runs raw duplicate
    detection, schema validation and byte checks. After the single candidate
    commit, Integration creates the final manifest in memory, repeats every
    check before exclusive create-once storage, then direct-hashes stored bytes.
    Failure is terminal; no manifest correction, corrected candidate or rereview.

execution_order:
  - Direct-hash and parse this corrected Contract once; reject before review on mismatch.
  - Fresh CTO, Security and Quality review the same corrected bytes; prior reviews are not reused.
  - Unanimous Contract PASS is required before one branch/worktree/authority activation.
  - Quality freezes exact files and oracle before Worker starts.
  - Worker writes only validator files; Integration writes only integration files.
  - Use at most one same-Task repair before the one-way candidate freeze.
  - Provisional manifest preflight precedes the single candidate commit.
  - Run targeted validation, independent replay and one fresh final review round.
  - Integrate only unanimous candidate PASS; only then run canonical full make verify and synchronize Truth.

acceptance_criteria:
  - Exact corrected Contract and active authority identities validate.
  - Quality bytes remain exact after their pre-Worker commit.
  - Positive artifact passes independent Quality oracle and Worker validator.
  - Every frozen negative is rejected by both with zero false accepts and unresolved cases.
  - Duplicate members are rejected before any JSON semantic use.
  - Two isolated targeted runs produce exact-equal stable semantic receipts.
  - Candidate manifest schema and candidate diff byte identities match exactly.
  - Fresh CTO, Security and Quality candidate TARGET_VERDICT values all PASS.
  - Integrated tree equals reviewed tree and canonical full make verify passes.
  - Only P1 Exit Gate item 8 may become COMPLETE; no other capability changes automatically.

stop_conditions:
  - identity, Goal, authority, clean-state or accepted-input drift
  - any forbidden failed-task engineering asset read or reuse
  - corrected Contract reviewer NON_PASS
  - need for second Contract correction, second implementation repair, second candidate or rereview
  - Quality byte drift or candidate manifest preflight/final NON_PASS
  - any final reviewer TARGET_VERDICT NON_PASS
  - reviewed/integrated tree mismatch or canonical full make verify NONPASS
  - any external effect, P2 implementation/run or scope expansion

terminal_rule: >-
  Preserve one truthful terminal receipt and one canonical Truth sync, consume
  Task slot 3, prohibit retry/reuse of P1-059 engineering bytes and select a
  different remaining P1 Exit output unless the route itself must stop. Do not
  request routine Founder approval.

