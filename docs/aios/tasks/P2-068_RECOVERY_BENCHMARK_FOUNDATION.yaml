acceptance_criteria:
  - The exact accepted source-pack manifest, inventory and seal are rehashed through the configured root, with 6 repositories, 12 tasks, exactly 2 tasks per repository, 8 DEV tasks and 4 HELD tasks.
  - Every task binds Apache-2.0 license evidence, repository and pull-request provenance, exact base and fix commit/tree/archive identities, one executable selector, and the accepted one-shot base-FAIL/fix-PASS admission result.
  - DEV exposes only its eight task specifications and reference patches; HELD task selectors, queries, gold units, patches and outcomes are excluded from Worker inputs and remain in stable Quality custody.
  - The benchmark compiler deterministically derives maintenance queries, production-Java gold paths and reference patches from accepted source bytes without reading any rejected P2 lineage.
  - B1_SIMPLE_LEXICAL_BM25_FILE_V1 indexes only regular src/main/java files from each base archive, uses the frozen query/tokenizer/ranking/top-k contract, and has no SourceLens graph, ranker, memory, product service or held-outcome access.
  - Two fresh DEV materializations produce byte-identical benchmark manifests, reference patches, ranked outputs, per-task metrics and aggregate semantic projection.
  - The independent evaluator rejects identity drift, split leakage, archive/path escape, symlink or non-regular input, duplicate task/repository cardinality, metric drift, rank tie nondeterminism, result omission, result substitution and false progress credit.
  - Fresh CTO, Security and Quality and Evaluation reviews all PASS the same exact foundation candidate before P2_RECOVERY_BASELINE_ACCEPTED receives 25 percent delivery credit or Slot 2 becomes eligible.
required_evidence:
  - Exact accepted source-pack, source-admission decision and Slot 1 activation identities.
  - Exact public DEV projection and separate HELD custody commitment with closed inventories and no Worker-held content.
  - Exact deterministic source archive materialization and reference-patch inventory for both replay roots.
  - Exact B1 implementation identity, two-root DEV run outputs, per-task Recall@8, Precision@8 and MRR@8, and aggregate result.
  - Exact independent evaluator result with negative matrix, zero false accepts and stable semantic projection equality.
  - Exact candidate source inventory proving zero backend-spring, analyzer-rust and web-console product-source changes.
  - Exact fresh CTO, Security and Quality and Evaluation reviews bound to the same candidate and Evidence identities.
rollback: >-
  Stop only Task-owned local processes, preserve create-once Evidence and any exact
  allowed-path diff, and do not delete the accepted source pack. Before integration,
  remove the Task worktree and branch only if clean and only after terminal Evidence
  is bound. Task NON_PASS ends only Slot 1 Task execution; P2, the project and the
  long-term Goal remain ACTIVE, P3 remains HOLD, and no rejected lineage becomes reusable.
stop_conditions:
  - Any network, Provider, Secret, remote, production, public, non-loopback or external write effect.
  - Any product-source change under backend-spring, analyzer-rust or web-console.
  - Any read, comparison, copy, restoration or reuse of rejected or historical P2 engineering lineage.
  - Any HELD selector, query, gold unit, patch, outcome or custody locator entering Worker inputs, logs or public DEV artifacts.
  - Any source-pack, split, query, gold, patch, metric, tokenizer, ranker, top-k or schedule drift after candidate freeze.
  - Any retry or rerun after formal foundation dispatch, or any denominator exclusion or task replacement.
  - Any exhaustion of two implementation iterations, two candidates, one same-Task repair, two review cycles, 32 engineering hours or 8 calendar days.
forbidden_actions:
  - Modify product source, canonical main directly from Worker, another Task worktree, another Task Evidence root, Vault, Codex private control plane, remote, production or public state.
  - Execute Maven, Gradle, JVM or another build subprocess with network capability; source admission build results are consumed only as immutable Evidence.
  - Give the Worker the complete accepted source-pack manifest when a DEV-only projection is sufficient.
  - Use HELD results to tune the benchmark, lexical baseline, metric, query construction, ranking or acceptance threshold.
  - Claim P2 Exit acceptance, P3 eligibility, production readiness, general Java intelligence, project completion or long-term Goal completion from this Task alone.
claim_boundary: >-
  A complete PASS may establish only P2_RECOVERY_BASELINE_ACCEPTED for the exact
  accepted six-repository, twelve-task source pack and the frozen simple lexical
  baseline. It does not change product capability, accept the P2 Exit Gate, authorize
  Slot 2 without independent Task Gate acceptance, enter P3, prove production or
  general Java intelligence, complete the project, or close the long-term Goal.
