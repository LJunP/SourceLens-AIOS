architecture_constraints:
  - Invoke the real accepted repository scanner; do not reconstruct graph facts from Quality expectations.
  - Every internal node identity binds repository-relative path, symbol kind, exact source span and source content digest.
  - Resolve an internal relation endpoint only by an exact stable identity or an exact language-qualified symbol mapping.
  - Never admit substring, suffix, short-name or fuzzy endpoint matches.
  - Retain a true unresolved reference as EXTERNAL_UNRESOLVED rather than inventing an internal edge.
  - The graph and stable projection use a closed deterministic inventory and canonical ordering.
  - Replay reconstructs from frozen source and scanner receipts; rollback is a physical disposable-root check.
quality_freeze_requirements:
  - Quality freezes private Java, TypeScript and Rust fixtures and expected answers before Worker source mutation.
  - The Worker receives only an answer-free public command contract and repository roots.
  - Positive evaluation covers real import, call and type relations in all three languages.
  - Negative evaluation covers missing, duplicate, dangling, reorder, mutation, path escape, symlink and oracle leakage.
acceptance_criteria:
  - The public candidate command accepts no fixture or expected-answer input.
  - Java, TypeScript and Rust fixtures are scanned by the real accepted scanner.
  - All accepted graph nodes and edges are derivable from retained scanner output.
  - Internal endpoint admission is exact and unresolved true references are explicitly EXTERNAL_UNRESOLVED.
  - Closed inventory, stable projection, fresh replay and physical rollback all pass.
  - Every frozen negative rejects with its expected stable reason category.
  - False accepts and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed tree equals the integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, Goal, Contract, authority and activation parent identities.
  - Quality freeze timestamp and hash-bound public contract plus private oracle identities.
  - Raw scanner output, graph output, stable projection, replay and rollback for Java, TypeScript and Rust.
  - Raw independent negative matrix and aggregate false-accept and external-effect counts.
  - Exact candidate commit, tree, manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same exact candidate and Evidence.
rollback:
  strategy: DISPOSABLE_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical identity, Goal, exact Founder packet or accepted scanner identity drifts.
  - Any rejected P2-003 engineering asset is required.
  - A required write exceeds this Contract or any external effect is required.
  - The one same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated tree comparison or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the P2 Phase boundary changes.
claim_boundary: >-
  Cooperative-local offline scanner-derived repository symbol and dependency
  graph authority for the frozen Java, TypeScript and Rust evaluation only. No
  broad ecosystem, retrieval superiority, Agent, P3, remote, production,
  public or hostile-principal claim.
