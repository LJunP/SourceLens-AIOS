title: Clean-room Offline B0 Finite IR Adapter Conformance

objective: >-
  Build and falsify one clean-room provider-neutral offline response adapter for
  the accepted REP-001 control. It must admit one exact frozen request and only
  four exact frozen offline response envelopes, map each envelope to exactly one
  of the four P1-055 accepted legal IR byte programs, and pass that exact Buffer
  directly to the accepted finite trusted compiler. All other bytes reject
  before compiler invocation, mutation or child start. The Task must complete
  actual Run A, independent fresh Run B, stable-projection exact equality, zero
  false accepts and exact no-source-mutation rollback against one candidate.

why_now:
  - P1-055 is Founder-exception accepted, canonically integrated and full make verify passed; the route's Task 2 entry condition is satisfied.
  - P1 still lacks a runnable offline B0 compatibility path that composes a bounded response with the accepted finite compiler without Provider access.
  - Exact whole-envelope membership plus closed-table extraction is the smallest executable test of adapter composition and avoids free-form generation, network, sandbox or future-phase runtime work.

