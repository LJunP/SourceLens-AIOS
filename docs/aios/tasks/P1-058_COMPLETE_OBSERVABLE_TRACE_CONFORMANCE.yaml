  - REDACTION_WITH_ARTIFACT_INTEGRITY_METADATA

required_trace_semantics:
  - Every coverage requirement appears exactly once in the coverage ledger.
  - Every required field is either OBSERVED with exact source provenance or NOT_APPLICABLE_WITH_REASON using a predeclared reason code.
  - Empty arrays and zero counts for retries, errors, checkpoints, resumes or human interventions are explicit and cannot be inferred from omission.
  - Provider-free deterministic execution records Agent, model, prompt, token and cost as frozen NOT_APPLICABLE_WITH_REASON states rather than fabricated identities, zero-valued observations or omissions.
  - Decision rationale is NOT_APPLICABLE_WITH_REASON because accepted P1-048 Evidence has no runtime rationale field; no free-text rationale or hidden chain-of-thought may be invented.
  - The frozen Task Card plan is observed, plan revisions are explicitly not applicable, and missing fields never authorize a not-applicable state.
  - Tool actions bind request argv, source inputs, stdout and stderr byte identities, exit status, signal and duration; predeclared policy is distinguished from unavailable runtime policy decisions.
  - File mutations bind base identity, changed paths, patch identity and rollback result.
  - Raw physical path, inode, PID, wall-clock time and duration remain in raw trace only; stable projection records their presence and accounting but excludes their values.

minimum_negative_controls:
  - missing coverage requirement
  - duplicate or reordered coverage requirement
  - omitted field represented as implicit success
  - forged NOT_APPLICABLE on an observed command or test field
  - source result, manifest or stable-projection identity drift
  - command exit, signal, stdout or stderr identity tamper
  - changed-path or patch-identity tamper
  - missing zero-count retry, error, checkpoint, resume or human-intervention ledger
  - hidden chain-of-thought or private-reasoning field injection
  - raw physical value leaked into stable semantic projection
  - Run A and Run B stable semantic projection mismatch
  - post-hoc action deletion, duplication or exclusion
  - free-path input, path escape, symlink, hardlink or unmanifested leaf admission
  - missing manifest leaf, extra command reference or source-object replacement during read

minimum_outputs:
  - Quality-owned frozen source cases, coverage map, expected verdicts and reference oracle
  - Worker-owned trace builder, validator and characterization runner
  - one raw complete observable trace per accepted P1-048 source run
  - one stable semantic projection per source run with exact byte equality
  - per-requirement coverage verdict, state, source pointer and reason code
  - negative-control results with zero false accepts and zero unresolved cases
  - one reproducible no-network targeted verification command
  - one create-once Trace A from the accepted Run A source and one independent create-once Trace B from the accepted Run B source

