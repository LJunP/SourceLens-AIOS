objective: >-
  Implement one clean-room integrated vertical slice in which a common,
  parameterized local Evaluation Harness executes two Quality-frozen visible
  projections of accepted P1-035 representative Tasks, an independent
  evaluator determines their outcomes in fresh materializations, and a minimal
  fail-closed admission adapter accepts only an opaque public-synthetic hidden
  handoff without reading, materializing, scheduling or evaluating hidden Task
  content. The Task must close HIDDEN_SET_PROTOCOL and
  PARAMETERIZED_EVALUATION_HARNESS atomically or close neither.

why_now:
  - P1-035 accepted the versioned representative visible Task Dataset required by the P1 Exit Gate.
  - P1-001 is intentionally bound to one visible synthetic conformance fixture and does not prove a parameterized multi-Task harness.
  - The Founder permanently terminated the standalone P1-036 route and relocated the minimum hidden-admission boundary into this integrated vertical slice.
  - VTSR counting cannot be implemented responsibly before repeatable parameterized execution and fail-closed hidden admission mechanics exist.

