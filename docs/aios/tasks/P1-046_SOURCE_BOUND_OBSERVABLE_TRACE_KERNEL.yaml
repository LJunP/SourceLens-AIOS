acceptance_criteria:
  - Quality freezes one executable evaluation plan before Worker implementation; frozen Quality bytes remain unchanged and role identities are Evidence-bound.
  - Formal execution preflight binds the exact candidate commit/tree, clean state and closed executed-source manifest before any control action or verdict.
  - The accepted dataset, TaskSpec, reference patch, base commit/tree and materialized source population match exact frozen identities in both fresh materializations.
  - Target runtime declarations remain separate from actual execution-tool observations; any path, realpath, binary, version or architecture drift fails closed.
  - The base issue test produces the frozen expected failure, base regression passes, accepted reference patch is the only source mutation, and patched issue plus regression tests pass.
  - Every required observable Trace category is present or explicitly not applicable; the closed hash chain and Trace root reject missing, duplicate, reordered, substituted or post-hoc-excluded events.
  - Worker output cannot supply or overwrite the independent evaluator verdict; evaluator input is raw retained source, environment, tool, event, patch, test and rollback bytes.
  - Negative controls cover source or accepted-input drift, dirty state, path or symlink escape, tool identity drift, forbidden environment, patch or changed-path drift, Trace omission/reorder/tamper, Worker verdict injection, output collision and rollback drift with zero false accepts.
  - A second fresh materialization produces the same normalized semantic projection without concealing source, tool, patch, output, verdict or rollback identity; physical path and wall-clock observations remain retained outside the projection.
  - Rollback restores exact base commit/tree, accepted source bytes and clean state; cleanup touches only uniquely owned Task scratch after realpath/dev/ino revalidation.
  - P1-001, P1-011 and P1-035 targeted regressions, Task-targeted tests, rebuild/replay, full canonical make verify and fresh CTO, Security and Quality reviews all PASS for the one exact candidate.

required_evidence:
  - exact Goal, Phase, Task Contract, authority, activation parent and selected accepted-input identities
  - Quality freeze receipt, ownership map, Trace schema, action plan, evaluator and negative-vector manifest
  - frozen candidate commit/tree/full diff and pre-evaluation closed executed-source manifest
  - both materialization identities, P1-011 Environment Snapshots and observed execution-tool identities
  - raw hash-chained Trace events, Trace root, command receipts, stdout/stderr hashes, patch/diff and test results
  - independent create-once evaluator verdict and negative-control results
  - normalized replay comparison, exact rollback receipt and protected-artifact proof
  - complete create-once Evidence manifest with SHA-256, byte lengths, modes, hardlink counts and exact path population
  - three fresh independent final reviews over the same exact candidate and Evidence bytes

rollback:
  task_workspace: Remove only a clean Task worktree through non-forced git worktree removal after Evidence preservation; retain branch, candidate and Evidence tag.
  disposable_repositories: Restore or remove only exact Task-owned paths after realpath/dev/ino ownership and base-state proof.
  candidate_integration: Use local non-destructive git revert if a post-integration regression appears; never reset or clean.
  evidence: Never delete, overwrite or rewrite retained Evidence, Review or terminal bytes.

stop_conditions:
  - Goal, Phase, canonical parent, accepted input, schema, TaskSpec, source, environment, tool or candidate identity drift.
  - Task or remaining Phase hour, calendar, Task-count, implementation-iteration, repair or candidate budget exceeded.
  - Any need for network, Provider, Secret, remote, production, public, dependency download, irreversible or beyond-envelope permission.
  - Any need to modify accepted P1-001, P1-011, P1-035, selected dataset bytes, accepted schemas or Evaluation Protocol bytes.
  - Quality/Worker write-surface contamination, Worker-controlled verdict, Evidence overwrite/damage, unprovable ownership, cleanup or rollback.
  - Source/tool/patch identity, Trace completeness or fresh-materialization replay cannot close within the one same-Task bounded repair.
  - A candidate-added or worsened high-severity safety, data-integrity or source-identity finding cannot close within the one same-Task bounded repair.
  - Any required change to mission, ICP, year-one outcome, P1 Objective, P1 Exit Gate or Phase route.
  - The accepted P1-001, P1-011 and P1-035 assets cannot compose this source-bound Trace without changing their frozen bytes, which exhausts the current route hypothesis.

forbidden_actions:
  - Read, restore, diff, checkout, cherry-pick or semantically reuse P1-043, P1-044 or P1-045 rejected Task body, engineering source/tree/candidate, Quality, oracle, fixture, nonce, Evidence, Review or implementation lineage.
  - Modify accepted P1-001, P1-011, P1-035, selected dataset, accepted schemas, Evaluation Protocol or Baseline Adapter Contract bytes.
  - Modify repository files outside allowlisted_paths or write external files outside the exact Task external Evidence root.
  - Claim a complete Patch Evidence Package, empirical VTSR, baseline, adapter, model, Agent, hidden-set, benchmark, P1 Exit, P2, P3, production or hostile-principal capability.
  - Execute B0, B1, B2 or A0; invoke a model; build an Agent Shell, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime.
  - Execute arbitrary shell, honor executable overrides, inherit the host environment, follow symlink aliases, accept multiply linked executable/input/Evidence files or trust exit zero without exact artifacts.
  - Let Worker author or modify Quality schema, plan, oracle, evaluator, fixture or verdict bytes.
  - Delete, overwrite, rename or rewrite historical or current Evidence, Review, terminal record, NON_PASS or parent-directory artifact.
  - Create a successor, replacement, normalization, closure, feasibility or remediation chain, a second candidate or more than one bounded same-Task repair.

