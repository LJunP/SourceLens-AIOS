stop_conditions:
  - The task changes mission, ICP, year-one outcome or phase route.
  - The task expands into broad UI redesign, legacy-body rewriting or P1 implementation.
  - A current fact cannot be supported by a canonical file or reproducible command.
forbidden_actions:
  - deleting, moving or bulk-rewriting historical assets
  - treating a header as technical prevention of retrieval
  - enabling any blocked execution or egress permission
  - declaring P0 complete or P1 authorized

status: accepted
