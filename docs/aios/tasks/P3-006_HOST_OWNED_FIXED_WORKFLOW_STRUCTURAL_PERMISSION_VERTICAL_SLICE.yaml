budget:
  engineering_tasks: 1
  engineering_hours: 32
  calendar_days: 8
  candidate_generations: 2
  same_task_repairs: 1
  review_cycles: 2
  active_candidates: 1

acceptance:
  required:
    - AgentRuntime has no executable path from model-authored tool calls to ToolExecutionService or ToolRegistry; a model tool call fails closed before any tool body, filesystem, process or network effect.
    - The production workflow exposes exactly INSPECT, AGENT_EFFECT_FREE_PAYLOAD, APPLY_IN_DISPOSABLE_WORKSPACE, DECLARED_TEST and RECORD_RESULT in that order and dispatches through a closed enum switch to one fixed product handler per state, with no generic registry, interpreter, broker, dynamic grant or Agent-authored next state.
    - The Agent boundary accepts only the exact typed payload for AGENT_EFFECT_FREE_PAYLOAD; unknown type, raw map, extra field, wrong state, path-bearing content, out-of-order transition and replay each fail before any handler invocation.
    - Workflow identity, fixed step inputs and each accepted transition are bound to the accepted ExecutionCheckpointService chain; resume derives the sole next executable state from persisted checkpoint rows and never repeats an accepted handler.
    - Fixed handler authority inputs are host-owned and cannot be populated or overridden by an Agent payload, including executable, argv, roots, environment, network policy, timeout, order and transition.
    - Focused unit tests and a fresh Task-local H2 integration test prove the positive five-state path, checkpoint resume, and the complete fail-before-handler negative matrix.
    - Exact source-to-class identities, JDK identity, Maven argv, cwd, closed environment, Surefire XML/stdout, changed-file inventory and zero external effects are bound in create-once Task Evidence.
    - Independent CTO, Security and Quality/Evaluation reviewers all return TARGET_VERDICT PASS on the same exact candidate and Evidence manifest.
  task_gate: INDEPENDENT_REVIEW_AND_TEST_EVIDENCE_PASS

required_evidence:
  - PHASE_DELEGATED_TASK_AUTHORITY
  - FROZEN_QUALITY_TASK_CARD
  - WORKER_REPORT
  - EXACT_CHANGED_FILE_AND_SOURCE_TO_CLASS_INVENTORY
  - FOCUSED_UNIT_AND_H2_INTEGRATION_TEST_TRANSACTIONS
  - LEGACY_AGENT_RUNTIME_EFFECT_PATH_UNREACHABLE_PROOF
  - STRUCTURAL_PERMISSION_NEGATIVE_MATRIX
  - CHECKPOINT_RESUME_REPLAY_PROOF
  - CLOSED_ENVIRONMENT_AND_ZERO_EXTERNAL_EFFECT_RECEIPT
  - CANDIDATE_MANIFEST
  - INDEPENDENT_CTO_SECURITY_QUALITY_REVIEWS

non_goals:
  - Implement disposable-workspace process spawning or crash recovery; those belong to slot 2.
  - Claim complete observable trace, isolation acceptance, strict P3 Exit, P4 entry or production readiness.
  - Build a whole-task compiler, sealed action program, generic interpreter, action broker, reusable action envelope, mutable capability ledger or dynamic grant/revoke system.
  - Add network, Provider, Secret, remote, production, public release or existing-database effects.

lineage:
  allowed_inputs:
