acceptance_criteria:
- The exact accepted P2-069 B1 lexical seed ranking is independently reconstructed from accepted inputs and matches every per-file score, rank, selected path, selected byte count and task metric before any graph-fusion candidate executes.
- The production-owned selector constructs only deterministic static Java package, declared type, declared member, import and source-reference edges from the candidate corpus and expands at most one structural hop.
- No more than two parameter sets are declared before candidate execution; every weight, threshold and tie rule is identical across all eight DEV tasks, with no task-specific oracle branch or result-driven tuning.
- Ranking uses normalized-path-first deterministic ties, top-k 10 and a 131072-byte UTF-8 selection budget on the same DEV query and corpus universe as accepted B1.
- One exact candidate simultaneously has macro precision greater than 0.15595238095238093, macro recall greater than 0.8958333333333334 and macro MRR greater than 0.8229166666666666, with zero per-task recall regression against accepted B1.
- The canonical CodeQaRetrievalService and the evaluator both invoke the same production-owned selector API; product tests and two byte-exact DEV replays pass on the same candidate.
- HELD source reads and executions remain zero, writes stay inside the exact Task worktree or create-once Evidence root, and all external effects remain false.
- CTO, Security and Quality/Evaluation independently accept the exact candidate and closed Evidence manifest before the Task Gate is accepted.
required_evidence:
- Create-once preactivation architecture freeze with the two exact candidate parameter sets, graph edge schema, tie rule, top-k and byte budget.
- Exact accepted P2-069 source-pack, benchmark-manifest, DEV-task-card, B1-result and DEV/HELD non-overlap leaf identities plus a complete pre/post read inventory.
- Exact B1 seed parity receipt covering all eight DEV tasks, full ranking rows, selected paths, bytes and metrics.
- Exact authority-bound worktree and Evidence roots, sandbox-exec profile and identity, closed environment, fresh compiler/Surefire/replay roots, source-to-class inventory, stdout, stderr and exit records.
- Product API static call binding, runtime invocation trace, product unit-test XML/stdout and negative tests for root escape, symlink input, overwrite, HELD request, task-specific branching, post-result mutation and non-deterministic ties.
- Two create-once DEV replay transactions for the exact candidate with full per-file scores, graph contributions, selections, metrics and byte-exact comparison.
- Exact candidate commit/tree, changed-file inventory, clean status, rollback instructions and three independent final review records.
rollback: >-
  Do not integrate a NON_PASS candidate; preserve the exact candidate and create-once
  Evidence inventory, close only P2-076 terminal accounting through supported Git
  lifecycle, and leave canonical main, accepted P2-069 artifacts, P2-070 through
  P2-075 terminal facts, formal HELD lock, P3 HOLD and the Long-term Goal unchanged.
stop_conditions:
- Stop before product-source write if exact B1 seed parity, accepted artifact identities, authority roots, OS write confinement or closed execution inputs do not validate.
- Stop immediately if any P2-070, P2-071, P2-072, P2-073, P2-074 or P2-075 rejected branch, worktree, code, evaluator implementation or engineering Evidence is read, compared, copied or reused.
- Stop immediately if a HELD source leaf or HELD task is opened, scored or executed.
- Stop if any parameter is chosen after observing candidate metrics, any task-specific oracle branch exists, or more than two parameter sets are attempted.
- Stop if any network, Provider, Secret, remote, production or public effect is requested or observed, or any write escapes the Task worktree or Evidence root.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse rejected P2-070 through P2-075 engineering lineage.
- Modify accepted P2-069 source-pack bytes, DEV/HELD split, oracle, metric, thresholds, top-k, byte budget, schedule or HELD custody.
- Add task-ID, repository-name, expected-path or ground-truth-specific ranking branches; tune weights after observing candidate results; or rerun-to-pass.
- Let Maven, Gradle, Java, Node or another build/evaluation subprocess access network; all real execution remains sandbox-exec deny-network.
- Use credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete prior terminal Evidence, modify Codex control-plane state, enter P3, close the P2 Exit Gate or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_PRODUCT_SELECTOR_DEV_ACCEPTED for one exact
  clean-room B1-anchored graph-fusion product candidate after independent Task Gate
  acceptance. It cannot claim formal HELD performance, P2 Exit acceptance, P3 entry,
  production readiness, public capability or Long-term Goal completion.
