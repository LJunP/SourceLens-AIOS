  same_task_repairs: 1
  review_cycles: 2
acceptance:
  required:
    - Creating an Agent Task atomically creates exactly one immutable default READ_ONLY grant bound to its exact project and conversation; duplicate or conflicting grant creation fails closed.
    - The production AgentRuntime loads the exact ACTIVE grant for the bound Agent Task; unbound conversations, missing grants, revoked grants, policy drift and subject drift expose no tools.
    - Prompt descriptions and function schemas contain only exact normalized tools in the durable grant.
    - Tool execution reloads the durable grant and rejects unlisted tools, permission elevation, global disable, case or prefix aliases, malformed policy and subject drift before AgentTool.execute.
    - Known-tool allow and deny decisions persist Agent Task id, grant id, decision and stable reason code.
    - Focused unit and fresh H2 migration tests cover atomic issuance, exact load, revocation, all deny paths, prompt filtering, audit persistence and proof that denied tool bodies are never invoked.
    - All compiler, Surefire and fixture writes remain inside the exact Task worktree or Evidence root and network remains denied by sandbox-exec.
    - No network, Provider, Secret, remote, production or public effect occurs.
  task_gate: INDEPENDENT_REVIEW_AND_TEST_EVIDENCE_PASS
claim_boundary: >-
  Cooperative local durable capability-ledger enforcement. No cryptographic
  attestation, hostile in-process caller resistance, OS isolation or P3 Exit
  claim is made by this Task.
non_goals:
  - Read, compare, copy or reuse P3-002 candidate code, tests or engineering Evidence
  - OS process or filesystem isolation
  - Complete observable execution trace acceptance
  - Mutating capability issuance, Provider access or open shell
  - P3 Exit Gate or P4 entry
