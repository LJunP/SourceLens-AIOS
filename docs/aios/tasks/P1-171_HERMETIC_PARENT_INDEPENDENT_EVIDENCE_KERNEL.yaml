acceptance_criteria:
  - Multiple caller-selected fresh parent topologies, including an owned /private/tmp topology, produce the same stable semantic projection.
  - No run reads or depends on any historical Evidence sibling, fixed temporary basename or old staging path.
  - All declared input identities are verified before admission and every undeclared input is rejected.
  - Create-once, atomic rename, destination existence, closed inventory and cleanup ownership are executable and fail closed.
  - Missing, extra, mutation, reorder, symlink, hardlink, path escape, staging, lock, final and cleanup tamper cases all reject.
  - Every positive and negative run proves no residual lock or undeclared staging path remains.
  - Wrapper and independent evaluator independently reconstruct the same verdict and stable projection from the same exact frozen raw Evidence.
  - Provider requests, Secret reads, false accepts and all six external effects equal zero.
  - Focused verification and Task-worktree make verify pass before the one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and the sole canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and authority identities.
  - Quality Freeze with closed positive and negative case sets.
  - Raw per-topology input, staging, finalization, inventory and cleanup receipts.
  - Wrapper and independent evaluator receipts bound to the same exact Evidence manifest.
  - Zero residual lock/staging inventory and zero external-effect aggregate.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
