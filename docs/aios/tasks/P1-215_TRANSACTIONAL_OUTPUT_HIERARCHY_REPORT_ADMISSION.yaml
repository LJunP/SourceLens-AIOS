  P2 execution or product readiness.
rollback: >-
  Before candidate freeze, discard only Task-owned disposable fixtures and revert
  Task-owned source changes within the Task worktree. After reviewed integration,
  any canonical verification failure uses non-destructive git revert; reset and clean
