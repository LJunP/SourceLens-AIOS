objective: >-
  Add an explicitly versioned, opt-in typed Java relation producer to the
  canonical accepted scanner while preserving the default P1 scan-result v2
  bytes and semantics. The producer must emit truthful, deterministic source,
  target, span, category, resolution and duplicate/conflict evidence for later
  externally attested graph construction.
why_now: >-
  Canonical scanner relations currently lack enough semantic information to
  distinguish internal, external, unresolved, ambiguous and duplicate targets.
  Building the P2 graph consumer first would force it to infer facts the
  producer did not record. Producer-first versioning closes that actual
  engineering gap without reusing any rejected P2 implementation.
