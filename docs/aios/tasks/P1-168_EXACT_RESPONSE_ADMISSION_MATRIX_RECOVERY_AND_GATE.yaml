  - Read, restore, compare or reuse any rejected asset outside the exact P1-165 receipt, manifest and snapshot archive.
  - Materialize an unmanifested archive entry, AppleDouble sidecar, PAX metadata object, xattr or ACL.
  - Modify accepted P1-035, P1-101, P1-129 or P1-149 semantics.
  - Read a Secret, call a Provider, connect to a non-owned network peer or mutate user software.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation Task.
  - Enter P1-169 before the full P1-168 Task Gate.
  - Enter P2 or P3, push or modify a remote, production or public system.
