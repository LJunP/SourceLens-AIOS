architecture_constraints:
  - The request-contract adapter is data-driven and freezes at most two distinct predeclared shapes.
  - The first strict HTTP 2xx diagnostic locks the complete request shape and stops further diagnostics.
  - Every formal response enters the accepted canonical P1-149 execution spine.
  - Formal B0, B1 and B2 each contain exactly twelve cells and close one denominator of 36.
  - Transport completion never counts as verified success without the independent evaluator.
  - Evidence is create-once, closed-inventory and preserves all invalid, excluded, failed and successful cells.
pre_secret_offline_preflight:
  - Current authority and P1 safety entrypoints pass.
  - Accepted P1-149 and all accepted dependencies are identity-bound.
  - Both diagnostic request shapes are frozen before any Secret read.
  - Synthetic loopback covers serialization, response parsing, HTTP 400, 401/403, usage, observer and cross-binding.
  - All 36 cells traverse the accepted P1-149 spine with synthetic no-Provider responses.
  - False accepts, Secret reads, Provider requests and unauthorized effects equal zero.
formal_execution:
  diagnostic_provider_requests_max: 2
  formal_provider_requests_exact: 36
  total_provider_requests_max: 38
  automatic_retries_max: 0
  secret_read_sessions_max: 1
acceptance_criteria:
  - Complete offline preflight passes before Secret input or Provider effect.
  - One of at most two distinct diagnostics returns a strict HTTP 2xx completion and locks the request contract.
  - Exactly 36 formal cells execute once with zero automatic retries.
  - The independent evaluator closes the denominator and reconstructs the report only from frozen raw Evidence.
  - False accepts, Secret persistence, non-loopback connections and unauthorized effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, Contract, authority and activation identities.
  - Frozen two-shape maximum request-contract declaration and complete offline preflight.
  - Diagnostic and 36 formal create-once request/response bindings.
  - Complete accepted P1-149 execution spines and independent report reconstruction.
  - Candidate manifest, three fresh reviews, tree equality and canonical verify receipt.
rollback:
  strategy: OWNED_DISPOSABLE_REPOSITORY_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
stop_conditions:
  - Identity or accepted-input drift.
  - Any forbidden P1-150 engineering asset is read or reused.
  - Adjacent implementation iterations repeat the same normalized root cause.
  - Implementation, engineering-hour or calendar budget is exhausted.
  - Offline preflight is incomplete before Secret or Provider use.
  - Both diagnostics lack strict HTTP 2xx completion.
  - The formal matrix, final review, tree equality or canonical make verify is NON_PASS.
  - Secret leakage, non-loopback, remote, production, public or Evidence overwrite occurs.
forbidden_actions:
  - Modify authority validator, parser, Long-term Goal, P1 Objective or Exit Gate.
  - Reuse P1-150 rejected implementation assets.
  - Rerun, replace or beautify the formal matrix.
  - Persist Secret or Authorization header bytes or hashes.
  - Enter P2/P3 or push/modify a remote.
claim_boundary: >-
  Cooperative-local exact-loopback request-contract negotiation and request-bound
  baseline research using accepted canonical P1-149 only. No model superiority,
  P1 Exit, P2/P3 entry, remote, production, public, hostile-principal,
  strong-isolation or production-readiness claim.
