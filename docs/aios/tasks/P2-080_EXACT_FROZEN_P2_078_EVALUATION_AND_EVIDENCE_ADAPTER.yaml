acceptance_criteria:
  - The adapter is split-neutral and accepts explicit task-card and oracle inputs; no DEV or HELD cardinality, path, task ID, split label, source byte or oracle byte is embedded in product or adapter logic.
  - Before any DEV compatibility replay, synthetic eight-card DEV-shaped and four-card HELD-shaped schema fixtures pass using generated non-benchmark bytes and prove identical adapter behavior without opening any HELD source or oracle.
  - Exact historical blobs 838fb82bec44fccd9d3eec1d732d0358c5060633 and 43ac4a9a1a30dc8b1441acccc9e0f79f3d3b20d6 are independently verified against their authorized byte lengths and SHA-256 identities and installed only as create-once stable Evidence inputs.
  - A new relative-path 166-entry manifest binds every exact P2-078 raw Evidence leaf; all entries verify, the two formerly drifting logical paths resolve through the exact historical blobs, and the old raw manifest remains disclosed as NON_PASS rather than rewritten.
  - After the adapter, synthetic schema proof and new manifest are frozen, exactly one non-selective DEV compatibility replay byte-exactly reproduces the recorded P2-078 DEV task results and aggregate metrics; any mismatch is terminal NON_PASS with zero HELD reads.
  - No adapter byte, evaluator rule, Evidence mapping, manifest, parameter or schedule changes after the first observed DEV compatibility result.
  - CTO, Security and Quality/Evaluation independently accept the exact adapter candidate, stable Evidence pack, synthetic schema proof, one DEV replay and zero-HELD proof before the Master accepts P2_RECOVERY_EVALUATION_AND_EVIDENCE_ADAPTER_ACCEPTED.
required_evidence:
  - Create-once P2-080 authority and Contract lifecycle bindings with exact canonical parent, branch, worktree, Evidence root, nonce, roles, write allowlist and zero external-effect envelope.
  - Exact P2-079 terminal and preactivation receipts, exact frozen P2-078 commit/tree and 166-entry raw-manifest identity, and exact P2-069 accepted source-pack and split identities.
  - Exact historical Git blob byte-length and SHA-256 verification receipts plus create-once installed stable Evidence copies addressed only by Artifact ID and relative path.
  - Split-neutral adapter source, synthetic DEV-shaped and HELD-shaped schema fixtures containing no benchmark source or oracle bytes, exact invocation transactions and negative tests for implicit split/cardinality/path assumptions.
  - New 166-entry relative-path manifest, complete verification transaction, explicit two-entry historical rebinding proof and explicit old-manifest NON_PASS preservation.
  - Exactly one DEV compatibility replay transaction binding frozen adapter bytes, explicit DEV cards, candidate/runtime identities, argv, cwd, closed environment, stdout, stderr, exit, complete read/write inventories and byte-exact comparison to recorded P2-078 DEV outputs.
  - Independent CTO, Security and Quality/Evaluation verdicts over the same exact candidate and complete Evidence plus Master acceptance or terminal NON_PASS receipt.
rollback: >-
  On any adapter, synthetic schema, historical blob, manifest, DEV compatibility or
  independent-review NON_PASS, integrate nothing, preserve exact terminal Evidence,
  consume P2_RECOVERY_CAPACITY_SLOT_V11_1, keep the formal HELD slot locked, P2
  delivery at 25%, strict progress at 0%, P2 and the Long-term Goal active, P3 HOLD,
  and create no Product DEV, adapter successor, repair chain or formal HELD Task.
stop_conditions:
  - Stop before DEV if either historical blob identity, candidate identity, accepted P2-069 identity, synthetic schema proof, 166-entry relative manifest or zero-HELD proof does not PASS exactly.
  - Stop before HELD on any DEV compatibility mismatch, replay failure, identity drift, incomplete transaction, post-result adapter mutation, reviewer blocker or Task Gate NON_PASS.
  - Stop if any product source, P2-078 candidate, dataset, split, oracle, metric, threshold, ranking, parameter, recorded DEV result or accepted B1 byte would need mutation or retuning.
  - Stop if any HELD source or oracle byte, P2-070 through P2-077 rejected engineering lineage, or non-manifest-bound P2-078 byte is requested or observed.
  - Stop if network, Provider, Secret, remote, production, public release, deletion, existing database modification, P3 entry or Long-term Goal termination is requested or observed.
forbidden_actions:
  - Retroactively PASS P2-078 or P2-079; create or mutate Product DEV; reuse P2-070 through P2-077 rejected engineering; or alter exact P2-078 product, evaluator, result or parameter bytes.
  - Read HELD source or oracle, dispatch formal HELD, infer HELD content from synthetic fixtures, embed fixed DEV or HELD card counts into adapter behavior, or make split-selective adapter decisions.
  - Run DEV before adapter and manifest freeze, run DEV more than once, change any adapter or Evidence mapping after observing DEV, or rerun to pass.
  - Modify product, accepted benchmark source pack, dataset, split, oracle, metric, threshold, ranking, schedule, preregistration, accepted B1, historical terminal Evidence or old raw manifest.
  - Use network, Provider, Secret, remote, production, public release, deletion, existing database modification, P3 entry or Long-term Goal termination.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_EVALUATION_AND_EVIDENCE_ADAPTER_ACCEPTED
  for exact frozen P2-078 candidate e0c0f4d78b64b95b359746ab7c2fec4beed4311f
  after one byte-exact DEV compatibility replay and independent acceptance. It cannot
  retroactively PASS P2-078 or P2-079, accept Product Selector DEV, read or evaluate
  HELD, establish K1/K2 or P2 Exit, authorize P3, claim production readiness, close P2,
  or terminate the Long-term Goal.
