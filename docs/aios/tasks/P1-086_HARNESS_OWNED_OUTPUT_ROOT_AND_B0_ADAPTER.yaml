owned_output_root_contract:
  scope: COOPERATIVE_LOCAL_CURRENT_OFFLINE_ADAPTER_HARNESS_ONLY
  caller_selectable_arbitrary_output_path_allowed: false
  harness_internal_trusted_anchor_required: true
  pre_effect_validation:
    - trusted anchor exists as a real non-symlink directory
    - every existing anchor and parent component is lstat-checked and contains no symlink
    - anchor realpath exactly equals its normalized lexical path
    - selected parent exists and is a real non-symlink directory
    - proposed root is an immediate normalized child of the validated parent
    - proposed root is lexically and by existing-parent realpath contained in the trusted anchor
    - proposed root does not already exist as a file, directory, symlink or dangling symlink
    - no Task-owned directory or file has been created or written
  atomic_creation:
    primitive: exclusive unique directory creation under the validated parent
    root_mode: "0700"
    ownership_nonce_file_mode: "0600"
    post_create_binding:
      - exact normalized root path
      - root realpath
      - device
      - inode
      - mode
      - uid
      - ownership nonce
      - ownership marker device and inode
  write_boundary:
    - every relative artifact path must be normalized, non-empty and remain below the bound root
    - all existing parent components must remain real directories with the originally bound root identity
    - symlink, hardlink, special file, path replacement or containment drift fails closed
    - files are created exclusively and each created path identity is added to an ownership ledger
  cleanup_boundary:
    - revalidate exact root path, realpath, device, inode, mode, uid and ownership nonce
    - revalidate every owned file identity and reject any unowned or replaced entry
    - remove only paths recorded in the current run ownership ledger
    - remove the root only while its exact bound identity remains unchanged
    - identity drift or unexpected entry fails closed and leaves the path untouched

execution_and_evaluation:
  cross_contract_preflight:
    - TaskSpec schema and exact task identity
    - EnvironmentSnapshot schema and TaskSpec reference equality
    - SystemConfiguration schema, adapter B0, enabled_tools empty and loop_limit one
    - RunRecord schema and exact task/environment/configuration/repetition bindings
  positive_runs:
    count: 2
    fresh_output_root_per_run: true
    distinct_repetition_id: true
    independent_second_actor: true
  stable_projection:
    exact_byte_equality_required: true
    raw_invocation_identity_differences_retained: true
  rollback:
    source_not_materialized_or_mutated: true
    output_cleanup_subject_to_owned_identity_revalidation: true

mandatory_negative_matrix:
  isolated_fixture_per_case: true
  cases:
    - direct_symlink
    - ancestor_symlink
    - dangling_symlink
    - preexisting_directory
    - preexisting_file
    - missing_parent
    - replaced_parent
    - lexical_escape
    - realpath_escape
    - root_type_drift
    - root_device_drift
    - root_inode_drift
    - root_mode_drift
    - ownership_nonce_drift
    - identity_replacement_before_cleanup
  global_assertions:
    - every case returns its predeclared reason code
    - cases rejected at preflight create no Task-owned directory or file
    - no rejected case leaves a non-owned residual fixture
    - no case produces an adapter success field or evaluator verdict from the adapter
    - false accepts equal zero

acceptance_criteria:
  - All accepted input identities and all four schema contracts pass exact cross-contract preflight.
  - The public adapter implements the exact run(TaskSpec, EnvironmentSnapshot, SystemConfiguration, repetition_id) to RunRecord interface with B0 enabled_tools empty and loop_limit one.
  - The adapter consumes only the Quality-frozen prerecorded response, launches no Provider, network, shell or child process, and emits no success or evaluator verdict.
  - The harness creates a unique owned output root without caller-selected arbitrary paths and performs all required anchor, parent, type, containment, symlink and existing-path checks before the first Task-owned mkdir or write.
  - Every created root is bound to exact path, realpath, device, inode, mode, uid and ownership nonce identities; cleanup removes only exact paths owned by the current run after identity revalidation.
  - Two fresh positive runs independently evaluate PASS, retain declared raw invocation differences and have byte-identical stable projections.
  - Source remains unmaterialized and unchanged, rollback and owned cleanup are exact, and no non-owned residual fixture remains.
  - Every mandatory isolated negative case returns the expected rejection before forbidden effect and the matrix reports zero false accepts.
  - Targeted verification and the exact formal Task suite PASS on the frozen candidate with six external effects false.
  - Fresh CTO, Security and Quality final reviewers return TARGET_VERDICT PASS for the same exact candidate bytes.
  - The reviewed tree is integrated exactly to local canonical main and the one allowed canonical make verify invocation PASSes.

required_evidence:
  - Quality freeze manifest binding every frozen evaluator and fixture byte
  - exact Task Contract and external Task authority identities
  - targeted verification receipt
  - two raw fresh positive run bundles
  - independent evaluator outputs and exact stable projections
  - isolated negative-matrix receipt with expected reason codes and false_accepts=0
  - mkdir/write pre-effect counters and zero non-owned residual inventory
  - source identity and source-unchanged rollback receipt
  - owned-root create, write and cleanup identity ledger
  - exact candidate commit, tree and diff/hash manifest
  - fresh CTO, Security and Quality final review records
  - reviewed-tree equality and canonical integration receipt
  - one canonical make verify receipt

