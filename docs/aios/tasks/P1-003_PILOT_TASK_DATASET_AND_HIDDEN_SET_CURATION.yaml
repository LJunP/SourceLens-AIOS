  dataset_id: SourceLens-AIOS-P1-PILOT-TASK-DATASET
  dataset_version: p1-pilot-task-dataset-v0.1
  intended_use: CONTROLLED_P1_DATASET_CURATION_CANDIDATE
  publication_status: INTERNAL_NOT_AUTHORIZED_FOR_PUBLIC_RELEASE
  exact_curation_eligible_task_count: 8
  split_counts:
