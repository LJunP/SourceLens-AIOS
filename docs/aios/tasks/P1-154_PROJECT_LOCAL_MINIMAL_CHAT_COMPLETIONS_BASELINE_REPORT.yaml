architecture_constraints:
  - All implementation is project-local and does not change ZCode, Codex Tools, launch agents or user software configuration.
  - Every formal Provider response enters the accepted canonical P1-149 execution spine.
  - B0, B1 and B2 each contain exactly twelve formal cells and close one denominator of 36.
  - Every cell binds request, response, Patch IR, accepted compiler, apply, P1-101 trace, oracle, tests, rollback and independent evaluator evidence.
  - Transport completion never counts as verified success without the independent evaluator.
  - Formal Evidence is create-once, closed-inventory and preserves invalid, excluded, failed and successful cells.
pre_secret_offline_preflight:
  - Current authority and P1 safety entrypoints pass.
  - Accepted P1-149, P1-129 and P1-101 identities are verified from canonical accepted bytes.
  - The minimal request field set and bounded Chat Completions output-token field are frozen.
  - Synthetic loopback covers serialization, parsing, HTTP 2xx, 400, 401, 403, usage, observer, create-once and cross-binding.
  - All 36 synthetic cells traverse the accepted P1-149 execution spine.
  - Independent report rebuild and verifier tests pass from raw frozen Evidence without reading a prebuilt report as input.
  - False accepts, Secret reads, Provider requests and unauthorized effects equal zero.
