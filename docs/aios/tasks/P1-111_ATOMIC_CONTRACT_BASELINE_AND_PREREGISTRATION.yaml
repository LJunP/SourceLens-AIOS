acceptance_criteria:
  - The exact eight-file packet disclosure matches canonical P1-035 bytes and is bound identically by packet, Truth, Contract and authority.
  - Six versioned TaskSpecs, six immutable EnvironmentSnapshots and eighteen Task/System combinations pass all accepted contracts without Task-ID special cases.
  - One complete offline preflight passes with zero Secret reads and zero Provider requests.
  - Exactly 36 scheduled runs and 18 A/B pairs produce terminal records without selective retry or discarded failure.
  - False accepts, undeclared executions, non-owned mutations and forbidden external effects all equal zero.
  - Metrics, accounting, failure taxonomy, stable projections, replay and rollback are independently recomputable from raw retained Evidence.
  - One offline P2 context-engine preregistration is frozen without executing P2.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same source and Evidence bytes.
  - The reviewed tree equals the integrated tree and exactly one canonical make verify passes.
required_evidence:
  - Exact Founder packet, Contract, authority, Goal and activation-parent identities.
  - Activation-time inherited-process inventory with exact PID, command, CPU and socket observations.
  - Exact disclosure manifest, versioned TaskSpecs, six snapshots, eighteen configurations and frozen schedule.
  - Offline preflight receipt and complete negative matrix.
  - Raw 36-run request, response, ordered trace, outcome, projection, replay and rollback records.
  - Independent recomputation report and offline preregistration.
  - Exact candidate commit, tree, diff/hash manifest, Evidence tag and three fresh reviews.
rollback:
  strategy: OWNED_DISPOSABLE_ROOT_REMOVAL_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Goal, accepted input, Founder packet, disclosure, profile, Contract, authority or activation-parent identity drifts.
  - Offline preflight returns NON_PASS or any Secret read or Provider request occurs before it passes.
  - A rejected engineering lineage, path outside this Contract or permission beyond the exact Founder profile is required.
  - Any inherited P1-109 process PID, command, CPU, socket or side-effect identity drifts.
  - A safety, Evidence, non-owned mutation, Secret sink, transport or forbidden external-effect failure occurs.
  - The same-Task repair is exhausted, the same normalized root cause repeats, or any post-provider code or prompt change is required.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the P1 Phase boundary changes beyond the packet's two exact write roots.
claim_boundary: >-
  Cooperative-local exact synthetic-disclosure contract convergence,
