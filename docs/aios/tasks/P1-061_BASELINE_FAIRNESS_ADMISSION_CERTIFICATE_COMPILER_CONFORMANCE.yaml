finite_admission_contract:
  input_population: exactly one TaskSpec, one EnvironmentSnapshot, one evaluator identity, one repetition policy and exactly one cell each for B0, B1 and B2
  output_population: exactly one canonical certificate with verdict, reason_codes, common_bindings, treatment_differences, cell_identities and claim_boundary
  recursive_closed_shapes_required: true
  raw_duplicate_json_members_rejected_before_semantic_parse: true
  accepted_schemas_must_validate:
    - the complete TaskSpec instance
    - the complete EnvironmentSnapshot instance
    - each complete B0, B1 and B2 SystemConfiguration instance
  canonical_json: UTF8_SORTED_KEYS_NO_INSIGNIFICANT_WHITESPACE_EXACTLY_ONE_TRAILING_LF
  common_bindings:
    - task_id and dataset version
    - repository identity, base commit and tree
    - TaskSpec environment_snapshot_ref equals EnvironmentSnapshot snapshot_id
    - evaluator identity and version
    - repetition population
    - wall-clock, token, cost and shared verification budgets are exact-equal across all cells
    - every cell model_ref exact-equals EnvironmentSnapshot model.model_ref
    - every cell prompt_ref exact-equals EnvironmentSnapshot prompt_version
    - every cell policy_ref exact-equals EnvironmentSnapshot policy_version
    - every cell response_format_ref exact-equals TaskSpec baseline_context.response_format_ref
    - TaskSpec and EnvironmentSnapshot network policy and allowed-host population are exact-equal
    - TaskSpec baseline-context and response-format references resolve inside the declared repository root and their bytes match the declared SHA-256
    - every enabled tool is present in both TaskSpec allowed_tools and EnvironmentSnapshot tools
  finite_permitted_treatment_fields:
    - adapter_id
    - adapter_version
    - loop_limit
    - enabled_tools
    - feature_flags explicitly enumerated by key in treatment_differences
    - B2 snapshot_attestation_ref and snapshot_attestation_sha256
  forbidden_treatment_fields:
    - task, source, environment, evaluator or repetition identity
    - wall-clock, token, cost or verification budget
    - model_ref, prompt_ref, policy_ref or response_format_ref
    - network policy or allowed hosts
  required_treatment_checks:
    B0: loop limit exactly 1 and no tools, graph, memory, multi-Agent, repository read/search or execution feedback
    B1: fixed loop greater than 1; enabled_tools is non-empty and is a declared subset of TaskSpec and EnvironmentSnapshot; no SourceLens graph, ranker, learned memory or multi-Agent
    B2: one exact snapshot attestation regular file is safely read and hash-bound; its closed record has PASS status and binds snapshot id, repository identity, source commit/tree and exact capability-inventory hash; every B2 tool is present in that bound inventory and inherited missing evidence is never synthesized
  b2_attestation_closed_keys:
    - schema_version
    - record_type
    - status
    - snapshot_id
    - repository_identity
    - source_commit
    - source_tree
    - capability_inventory
    - capability_inventory_sha256
    - claim_boundary
  globally_forbidden:
    - hidden task, expected patch or evaluator-internal reference
    - network host or Secret value
    - undeclared fairness exception
    - duplicate or missing adapter cell
    - unknown top-level or nested member
  certificate_execution_status: NOT_EXECUTED_CONFORMANCE_ONLY

