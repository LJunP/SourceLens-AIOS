architecture_constraints:
  - Implement from canonical accepted assets without reading P1-112 rejected engineering.
  - Validate exact archive and member identities before execution.
  - Never perform general archive extraction into a filesystem tree.
  - Materialize create-once under one identity-bound owned root.
  - Execute the scanner only through an outer operating-system network-deny policy.
  - Retain the outer command ledger and raw stdout/stderr rather than self-attesting external effects.
  - Preserve every positive and negative raw Evidence artifact create-once.
  - Do not execute Cargo build in Task 1 or the downstream B2 route.
  - Route-profile compatibility must remain packet-driven, Task-specific and bounded by the same global caps.
acceptance_criteria:
  - Exact packet, Goal, canonical parent, Contract, authority, archive and member identities pass before execution.
  - The exact outer sandbox executable and profile are identity-bound and deny all network operations.
  - A socket negative control is denied by the OS policy before a successful connection.
  - Two real repository_analysis.scan runs succeed through the outer no-network boundary with exact stable projection.
  - Raw stdout, stderr, command ledger, identities, enforcement receipt and rollback receipt are retained for each positive run.
  - Every declared negative is independently materialized and retains its raw result and stable reason code.
  - Archive/member digest, length, type, links, traversal, duplicate, architecture, dependency, executable drift, non-owned output, ownership drift, rollback and external-effect request negatives reject.
  - Evidence inventory proves every declared artifact present, regular, non-symlink and hash-bound.
  - No Cargo build, successful network connection, Provider request, Secret read or non-owned mutation occurs.
  - Current authority remains strict for legacy packets and accepts Task 2 profile only when exact packet, Truth, Contract and authority agree.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes and Evidence.
  - Reviewed candidate tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact preflight identities and sandbox-exec no-network primitive receipt.
  - Per-positive raw stdout, stderr, command ledger, identities, enforcement and rollback receipts.
  - Independently materialized raw negative fixtures and result receipts.
  - Exact stable replay projection.
  - Complete create-once Evidence inventory and hash manifest.
  - Authority compatibility golden and mismatch results.
  - Candidate commit, tree, exact path/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence.
  - Reviewed/integrated tree equality and one canonical make verify receipt.
rollback:
  strategy: IDENTITY_BOUND_OWNED_ROOT_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical, Goal, packet, accepted archive or exact member identity drifts.
  - P1-112 or another rejected engineering lineage is required.
  - Independent operating-system no-network enforcement is unavailable.
  - The exact scanner cannot execute a real scan through the outer boundary without Cargo build.
  - A required write exceeds this Contract or a permission must expand.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, an unauthorized external effect occurs, or the Phase boundary changes.
forbidden_actions:
  - Read, restore, compare or reuse P1-112 rejected engineering assets.
  - Execute Cargo build for the scanner path.
  - Persist or log any Secret.
  - Send a Provider request in Task 1.
  - Create a successful network connection in Task 1.
  - Push, modify remote, enter P2/P3, or create production/public effects.
  - Create a second candidate, correction, successor, replacement or rereview cycle.
claim_boundary: >-
  Clean-room exact accepted-scanner admission, operating-system-enforced local
  no-network execution, complete raw Evidence, stable replay and identity-bound
  rollback only; no empirical baseline, model performance, P1 exit, P2/P3
  entry, remote, production, public, hostile-principal or general strong-
  isolation claim.
