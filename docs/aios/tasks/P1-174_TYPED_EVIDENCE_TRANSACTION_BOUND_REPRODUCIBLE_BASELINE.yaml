acceptance_criteria:
  - Authority and P1 safety entrypoints pass before any implementation source write.
  - Distinct Founder route start, route activation commit, Task activation parent and candidate immediate parent identities are proven without label substitution.
  - Every cleanup action is authorized by an exact current-execution object ledger entry and refuses all unknown or drifted objects without deleting them.
  - Independent outcome reconstruction does not consume any Worker-authored verdict, expected result or false-accept field.
  - Multiple owned parent topologies, including /private/tmp, produce the same stable semantic projection and leave no undeclared transient object.
  - The full synthetic 36-cell rehearsal exercises accepted P1-129, P1-149 and P1-101 paths with zero Provider requests and Secret reads.
  - All pre-formal negative cases reject with zero false accepts and the internal adversarial architecture inspection is closed within this Task.
  - One strict diagnostic and one 36-cell formal matrix stay within all request, token, response-byte and monetary ceilings with zero automatic retries.
  - Every formal cell is retained in the denominator and the report is independently rebuilt from frozen raw Evidence without reading a Worker report.
  - Focused verification and Task-worktree make verify pass before the one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and the sole canonical make verify passes.
required_evidence:
  - Exact Founder packet, structured Decision, Goal, route start, activation, Contract and authority identities.
  - Typed transaction state records and object-level append-only creation/cleanup ledgers.
  - Raw per-topology stdout, stderr, exit status, filesystem snapshots, observer records and finalization receipts.
  - Frozen case taxonomy and independent-oracle receipt proving prohibited Worker fields were not inputs.
  - Synthetic 36-cell accepted-asset participation and replay receipts.
  - Closed pre-formal negative matrix and adversarial architecture inspection receipt.
  - Formal request/response, adapter, spine, trace, patch, oracle/test, rollback and observer identities for all 36 cells.
  - Raw-Evidence-only report reconstruction, closed inventory and independent verification receipt.
  - Exact candidate commit, parent, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
