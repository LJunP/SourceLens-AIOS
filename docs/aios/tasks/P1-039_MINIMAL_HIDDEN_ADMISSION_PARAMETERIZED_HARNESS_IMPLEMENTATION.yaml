acceptance_criteria:
  - One final exact Contract receives CTO, Security and Quality exact PASS before Task activation.
  - Quality assets are frozen in one Quality commit before Worker implementation, and their bytes remain unchanged through candidate freeze.
  - The admission adapter admits exactly H01 and H02 from the exact hash-bound public-synthetic allowlist and rejects unknown, drifted, escaped and symlinked inputs with their frozen typed outcomes.
  - The parameterized harness actually calls the admission adapter and consumes both admitted descriptors through the same implementation and output schema.
  - O01-O04 each produce the exact frozen output-custody verdict, reason code and exit status without modifying a forbidden or undeclared path.
  - All 16 atomic cases match their single frozen outcome; five fresh P01 replays are byte-equal after excluding only predeclared run-instance fields.
  - The controlled result mutation is rejected and cannot be promoted to success.
  - Actual argv, cwd, start/end, exit status, stdout/stderr hashes, artifact hashes and filesystem observations are retained in Evidence.
  - P1-001 regression, P1-035 regression, the P1-039 verification target and make verify all PASS without changing accepted inputs.
  - Fresh-clone rebuild reproduces the candidate checks, and rollback verification proves the pre-Task parent is recoverable without rewriting history.
  - CTO, Security and Quality final independent reviews of the exact frozen candidate and Evidence are PASS.
  - The Task Gate accepts both HIDDEN_SET_PROTOCOL and PARAMETERIZED_EVALUATION_HARNESS atomically; no partial capability status is permitted.
  - No real or historical hidden material, failed engineering asset, network, Provider, Secret, remote, production or public capability is used.

failure_criteria:
  - Any final Contract reviewer is non-PASS.
  - The Worker directly accepts an arbitrary TaskSpec path or bypasses the frozen admission interface.
  - A Quality-owned byte changes after the Quality freeze or a Worker/Integration write crosses ownership boundaries.
  - Any admitted slot, request, output target, result or replay identity is ambiguous, mutable or not hash-bound.
  - Any of the 16 cases has multiple reachable reason codes, an aggregate oracle, a mismatched exit status or cannot reach its frozen outcome.
  - A forbidden path is read as a semantic input, a forbidden path is written, or a forbidden external effect occurs.
  - Evidence, replay, fresh-clone rebuild, rollback, regression, make verify or any final independent review is non-PASS.
  - Completion requires a real hidden set, baseline execution, Agent Runtime, Supervisor, Root Custody, Strong Isolation or P3 Trust Runtime.

stop_conditions:
  - The final exact Contract receives any CTO, Security or Quality non-PASS; stop P1 with no fifth route.
  - Goal, Founder route, Contract, accepted dependency, preparation parent, activation parent or runtime identity drifts.
  - A real architecture root prevents the integrated capability from producing runnable engineering output.
  - A write occurs outside exact role-owned paths, Quality freeze is contaminated, or forbidden material/effects are accessed.
  - The objective, paths, budget, permissions, roles, metrics or claim boundary require expansion.
  - Two implementation iterations fail for the same root cause without new engineering Evidence.
  - The 16-hour or 3-day budget is exhausted.
  - Evidence, replay, rebuild, rollback or any final independent review is non-PASS.

forbidden_actions:
  - network
  - provider
  - secret
  - remote
  - production
  - public effect
  - package installation or dependency download
  - reading, enumerating, restoring or creating real or historical hidden material
  - reading or reusing failed Task code, fixture, candidate, partial implementation, nonce or unaccepted engineering asset
  - using historical governance metadata as a semantic Task input
  - modifying historical Contract, Evidence, Review or Terminal Record
  - modifying accepted P1-001 or P1-035 artifacts
  - direct TaskSpec CLI admission that bypasses the frozen admission interface
  - executing B0, B1, B2 or A0
  - generating benchmark, VTSR, Agent ability, P1 completion, P2, P3, secrecy, representativeness, production or hostile-principal claims
  - entering P2 or P3
  - PRE, MCF, Carrier, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime work
  - retry, resume, successor, replacement, correction chain or fifth implementation route
  - automatic next Task before this Task Gate is complete

evidence:
  required:
    - final exact Contract identity and three final Contract reviews
    - phase-delegated authorization and activation parent commit/tree
    - role handoff, ownership map, Quality freeze commit/tree and Quality Freeze Receipt
    - accepted input and runtime identities
    - frozen admission manifest, schemas, case matrix, recipes, oracle, evaluator and expected results
    - actual command ledger with argv, cwd, start/end, exit status, signal and timeout state
    - 16-case result matrix and O01-O04 effect observations
    - five-replay normalized-byte comparison
    - controlled-failure result and non-promotion proof
    - source diff, candidate commit/tree and exact artifact index
    - P1-001 regression, P1-035 regression, P1-039 self-test and make verify results
    - canonical and historical forbidden-path non-write observations
    - fresh-clone rebuild and rollback results
    - closed Evidence Manifest with path, SHA-256 and byte length for every artifact
    - CTO, Security and Quality final independent reviews
    - delegated Task Gate receipt and atomic capability status projection

rollback:
  pre_gate: >-
    Preserve external Evidence, then remove the unmerged Task worktree and Task
    branch. Canonical main remains at the activation commit and no implementation
    candidate is integrated.
  post_gate: >-
    Preserve accepted Evidence and candidate Git objects; reverse a local main
