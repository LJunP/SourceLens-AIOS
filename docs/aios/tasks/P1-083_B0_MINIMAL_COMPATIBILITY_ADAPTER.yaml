acceptance_criteria:
  - The exact common interface is run(TaskSpec, EnvironmentSnapshot, SystemConfiguration, repetition_id) -> RunRecord.
  - TaskSpec, EnvironmentSnapshot, SystemConfiguration and RunRecord pass their accepted schemas before any run is admitted.
  - Cross-contract preflight rejects environment, repository, commit, tree, model, prompt, policy, response-format, context, network or secret-policy drift.
  - B0 has enabled_tools=[] and loop_limit=1 and cannot access repository tools, execution feedback, graph, ranker, memory, extra Agents or hidden evaluator data.
  - The adapter uses one Quality-frozen prerecorded response and records live_model_invoked=false, provider_invoked=false and model_performance_sample=false.
  - The adapter never spawns a child, executes a patch, performs network access or allows result bytes to select argv, cwd, environment, module or path.
  - Every observable adapter action binds to one run_id and trace; the RunRecord does not contain a success or evaluator verdict.
  - An independent evaluator consumes the RunRecord and frozen inputs, then emits its own verdict.
  - Two fresh deterministic invocations have an exact predeclared stable projection and retain any declared raw differences.
  - The table-driven negative matrix has zero false accepts and proves rejected inputs do not create a scheduled RunRecord or external effect.
  - Source bytes, canonical repository state and pre-existing canaries remain unchanged; cleanup is limited to Task-owned temporary paths.
  - Existing accepted P1-035 and P1-066 regression verifiers remain PASS.
  - Fresh CTO, Security and Quality TARGET_VERDICTs all PASS the same exact candidate; reviewed and integrated trees are equal; one canonical make verify passes.
  - Task 1 accepts only the B0 component, keeps strict P1 completion at 4/8 (50%), and makes Task 2 eligible without claiming the B0/B1/B2 Exit Gate item.

required_evidence:
  - Quality freeze manifest binding exact fixtures, evaluator, stable projection and negative catalog
  - Four-schema and cross-contract preflight receipt
  - Positive RunRecords, observable traces and independent evaluator receipts
  - Deterministic replay comparison and source-unchanged receipt
  - Negative matrix receipt with expected and observed reason codes and false_accepts=0
  - Exact candidate manifest and diff hash
  - Fresh CTO, Security and Quality reviews over the same candidate bytes
  - Reviewed-tree/integrated-tree equality and canonical make verify receipt

rollback:
