acceptance_criteria:
  - All accepted input, schema, canonical parent, dataset, TaskSpec, source, Environment Snapshot document and SystemConfiguration identities match exactly before any case is evaluated.
  - Quality freezes one closed synthetic conformance matrix covering all six accepted P1-035 visible synthetic task identities, a declared repetition population and explicitly non-empirical outcome fixtures; no fixture or aggregate is presented as an actual scheduled baseline run or measured VTSR.
  - The create-once raw conformance ledger preserves every frozen attempt fixture, failure, retry, invalid and reason code without Worker-controlled deletion, overwrite or promotion; each attempt is linked through the exact attempt_and_denominator_model.
  - VTSR counting expectations exactly follow Evaluation Protocol v1.1, including failure classification, retry handling, one denominator contribution per matrix_entry_id, predeclared infrastructure-invalid replacement and prohibition of post-hoc denominator changes.
  - Missing or duplicate matrix entries or attempts, extra attempts, Task/config/environment/repetition drift, retry-as-new-run, invalid replacement identity, multiple non-invalid outcomes, failure-to-success promotion, illegal invalid reasons and post-output exclusions all fail closed.
  - Independent Quality recomputation reads raw matrix and synthetic outcome fixtures rather than trusting Worker aggregate output, shares no Worker aggregation or normalization implementation, and writes its verdict create-once in a separate Quality root.
  - Final Quality review is performed by a fresh physical Agent instance distinct from the Quality fixture author, evaluator author, Worker and owner; exact role identities are Evidence-bound.
  - Fresh-process replay starts only from retained serialized bytes, recomputes the same canonical semantic projection and rejects field, population, hash, extra-file, symlink and path drift without false PASS or false failure from JSON property ordering.
  - Formal Evidence binds exact Task/Contract/authority/candidate, accepted inputs, Quality freeze, matrix, raw ledger, aggregate, independent verdict, actual argv/cwd/runtime identity, stdout/stderr hashes, all artifact hashes and byte lengths, rebuild and rollback.
  - Output collision and any second write fail closed; original formal Evidence, authority and parent artifacts remain byte-identical; cleanup touches only exact Task-owned paths after realpath/dev/ino ownership revalidation.
  - P1-001, P1-011 and P1-035 regressions, Task-targeted tests, clean rebuild/replay, full canonical make verify and fresh CTO, Security and Quality reviews all PASS for the one exact candidate.

required_evidence:
  - exact Task Contract, phase-delegated authority and activation identities
  - Quality freeze receipt and ownership map
  - frozen six-task synthetic conformance Evaluation Matrix, attempt model and closed matrix-entry population manifest
  - create-once raw synthetic terminal-outcome fixture ledger and reason-code population
  - Worker VTSR counting-conformance expectation and disjoint independent Quality recomputation verdict
  - explicit proof that every fixture and aggregate is non-empirical and benchmark-ineligible
  - persisted fresh-process replay comparison
  - bounded negative-control results including denominator, promotion and identity mutations
  - complete Evidence manifest with SHA-256 and byte lengths
  - rebuild, protected-artifact and rollback receipts
  - frozen candidate commit/tree/full diff manifest and three fresh independent reviews

rollback:
  task_workspace: Restore or discard only Task-owned disposable paths after exact ownership and clean-state proof.
  candidate_integration: Use local non-destructive git revert if a post-integration regression appears; never reset or clean.
  evidence: Never delete, overwrite or rewrite retained Evidence, Review or terminal bytes.

stop_conditions:
  - Goal, Phase, canonical parent, accepted input, schema, TaskSpec, source, environment or configuration identity drift.
  - Task or remaining Phase hour, calendar, Task-count, implementation-iteration or candidate budget exceeded.
  - Any need for network, Provider, Secret, remote, production, public, irreversible or beyond-envelope permission.
  - Any need to modify accepted P1-001, P1-011, P1-035, accepted schema or Evaluation Protocol bytes.
  - Any need to execute or claim a patch, B0, B1, B2, A0, Agent, benchmark, P2 or P3 capability.
  - Worker contamination of Quality fixtures, evaluator, oracle or verdict; Evidence overwrite/damage; unprovable cleanup or rollback.
  - Fresh retained-byte replay is not semantically stable, or normative VTSR differs for the same exact inputs.
  - A candidate-added or worsened high-severity safety, data-integrity or source-identity root cannot close within the one same-Task bounded repair.
  - Any required change to mission, ICP, year-one outcome, P1 Objective, P1 Exit Gate or Phase route.

forbidden_actions:
  - Read, restore, diff, checkout, cherry-pick or semantically reuse any P1-043 or P1-044 rejected Task body, engineering source/tree/candidate, Quality asset, oracle, fixture, nonce, Evidence or Review body.
  - Modify accepted P1-001, P1-011, P1-035, any accepted schema, Evaluation Protocol or Baseline Adapter Contract bytes.
  - Modify repository files outside allowlisted_paths, write external files outside the exact write_scope.external_evidence root, or let Worker modify Quality-exclusive roots.
  - Invent or label any synthetic fixture as a completed empirical run, delete failed fixture attempts, change a frozen denominator, post-hoc exclude outcomes or convert invalid/failure to success.
  - Execute arbitrary shell, honor host executable override, inherit host environment or treat exit zero without exact result-artifact verification as PASS.
  - Modify, replace, delete, rename or traverse from this Task Evidence root to any parent-directory artifact.
  - Network, Provider, Secret, remote, production, public, dependency download, fetch, push, PR, remote merge, release or external message.
  - Execute B0, B1, B2 or A0, enter P2/P3, or build Agent Shell, model-initiated canonical write, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime.
  - Create a successor, replacement, normalization, closure, feasibility or remediation chain, a second candidate, or more than one bounded same-Task repair.
  - Delete, overwrite or rewrite historical Evidence, Review, terminal record or NON_PASS.

