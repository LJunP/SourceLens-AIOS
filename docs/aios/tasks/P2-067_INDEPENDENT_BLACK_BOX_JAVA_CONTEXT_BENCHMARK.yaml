  - Exact per-task scores, held aggregate metrics, paired sign test, paired bootstrap interval, invalid-run denominator and graph-edge-to-selected-unit causal reconstruction.
  - Exact fresh CTO, Security and Quality and Evaluation reviews bound to the one candidate, one formal transaction and immutable Evidence roots.
rollback: >-
  Before canonical integration, stop only exact Task-owned child PIDs, verify no listener,
  H2 lock, undeclared child or out-of-root write remains, preserve create-once Evidence,
  snapshot any dirty allowed-path delta, then remove only the exact clean Task worktree
  and branch. If an exact integration publishes but canonical verification fails, create
  a non-destructive revert of only that integration commit before removing the clean
  Task branch/worktree. Task NON_PASS terminates only P2-067; P2, the project and the
  long-term Goal remain ACTIVE.
stop_conditions:
  - Any read, comparison, copy, restoration or repair of P2-066, f94 or another rejected or historical Task lineage.
  - Any product source mutation, new endpoint or DTO, canonical source write by Worker, or write outside the exact role-owned allowlist.
  - Any Provider, Secret, remote, production, public, DNS, non-loopback bind or non-loopback connect effect; only exact task-owned 127.0.0.1 HTTP is locally permitted and is not an external network effect.
  - Any use of MockMvc, controller or service direct invocation, same-process pseudo-HTTP or application self-report as formal A0 black-box or provenance evidence.
  - Any candidate, dataset, oracle, environment, system, metric, gate or schedule drift after the first formal dispatch, including any DEV-result refreeze before HELD.
  - Any mismatch in paired source universe, question, slot or byte budget; any formal retry, rerun, task replacement, denominator exclusion or shared physical replay root.
  - Any A0 held loss, fewer than six held strict wins, Recall@8 delta below 0.15, Precision@8 delta below -0.05, forbidden unit, unproved graph contribution, invalid cell or missing raw evidence.
  - Any exhaustion of two implementation iterations, one same-Task repair, one candidate, 32 engineering hours or 8 calendar days.
forbidden_actions:
  - Read, compare, copy, restore, repair, execute or inspect P2-066/f94 rejected engineering lineage, Git objects, worktree, patch, Evidence or outputs.
  - Mutate backend product source, canonical main directly, another worktree, another Task Evidence root, Vault, Secret, remote, production or public state.
  - Give the Worker held task selectors, held oracle bytes, custody locators, nonce material or inherited conversation context.
  - Pass the Master-only phase_delegation_binding.source_terminal_event locator or the full unredacted Contract as a Worker implementation input; the Worker receives only the active authority projection, sealed public baseline and explicit current-code allowlist.
  - Trust response retrievalPlan, contextRole, evidenceReason, graph flags, Worker manifests, logs or summaries as sole proof of execution, provenance, success or zero external effect.
  - Call the graph-off canonical /qa arm B1 or claim a normative B1 victory when it still uses SourceLens ranker; B1 in this Contract is only the independent simple lexical executable.
  - Claim cross-repository or general Java intelligence, production readiness, P2 Exit acceptance, P3 entry, project completion or long-term Goal completion from this Task alone.
claim_boundary: >-
  This Task may establish only bounded single-repository current-SourceLens Java
  context-selection evidence comparing one frozen independent simple lexical baseline
  with the unchanged canonical /qa path. A complete PASS may propose candidate Evidence
  for the P2 CONTEXT_BENCHMARK_BEATS_SIMPLE_RETRIEVAL_BASELINES item, but does not by
  itself accept the P2 Exit Gate, authorize P3, prove general or cross-repository Java
  intelligence, change product capability, complete the project or close the long-term Goal.
