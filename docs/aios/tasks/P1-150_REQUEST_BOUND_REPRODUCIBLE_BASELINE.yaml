architecture_constraints:
  - The formal execution imports and invokes the accepted canonical P1-149 execution spine; it may not fork, bypass or self-report participation in that spine.
  - One closed 36-cell matrix is derived from the accepted six-Task readiness projection with B0, B1 and B2 represented exactly twelve times each.
  - Accepted P1-129 conformance adapters run only as isolated compatibility controls; reference programs, reference patches and expected outputs from those controls may not enter a Provider prompt, profile context or outcome decision.
  - Formal B0, B1 and B2 profile composers use only the frozen TaskSpec, source bytes and profile-permitted observed tool or scanner outputs; every exact prompt input is retained and independently checked for reference-answer leakage.
  - Accepted P1-035 shared/response-format.json remains an unchanged historical TaskSpec response contract and is not misrepresented as SL-PATCH-IR/2; the report discloses the P1-150 route-specific Patch Artifact encoding.
  - Formal Chat Completions assistant content must contain exactly one duplicate-key-free JSON SL-PATCH-IR/2 object; raw content, parsed value, canonical IR bytes and the resulting P1-149 normalized response are identity-bound.
  - Every Provider response is admitted as finite SL-PATCH-IR/2 and compiled by the accepted trusted compiler before any repository mutation.
  - Compiled operations apply only to a unique owned disposable repository copy; canonical source and all non-owned paths remain read-only.
  - Every cell has one outer binding across cell/profile, exact prompt, request, response, normalized response, attempted P1-149 stages and OS observation; completed stages bind their exact artifacts and unexecuted stages bind explicit absence.
  - The accepted P1-101 inner trace retains its accepted zero-external-effect semantics and P1_149_EXECUTION_SPINE identity; the outer P1-150 binding records profile and loopback Provider effects without relabeling or modifying the inner trace.
  - The independent evaluator reconstructs outcome and denominator from frozen raw Evidence and never trusts Worker-generated success, verdict or cell-result fields.
  - INVALID, EXCLUDED, FAILED and SUCCESS counts are mutually exclusive and close exactly over all 36 scheduled cells.
  - A negative conclusion or zero VTSR is a valid report when the engineering and Evidence Gate passes.
  - Formal Evidence uses a create-once root and closed inventory; no formal request, cell or failed result may be deleted, replaced or rerun.
  - The only authorized network is the exact loopback endpoint in the Founder-reserved profile; DNS, proxy, redirects, fallback, remote, production and public effects are forbidden.
pre_secret_offline_preflight:
  - Current authority and P1 safety entrypoints pass for the active exact Task.
  - Syntax and import checks pass for every new executable.
  - Exact accepted P1-035, P1-101, P1-129 and P1-149 identities are admitted.
  - All 36 cells complete a synthetic no-Provider execution through the real P1-149 spine.
  - Accepted P1-129 B0/B1/B2 controls pass in a separate Evidence namespace and their reference-answer bytes are proven absent from every synthetic formal profile input.
  - B0, B1 and B2 profile composers each complete representative synthetic executions; B2 retains an exact accepted P0 repository_analysis.scan child invocation.
  - Request/response receipts, IR admission, compiler, apply, trace, replay, oracle, tests, rollback, report rebuild and independent evaluator complete end to end.
  - Negative cases reject create-once violations, path escape, symlink, hardlink, missing, extra, reorder, duplicate, cross-binding, identity drift, self-reported-only participation, non-finite IR, false success, non-loopback, proxy, redirect and Secret persistence.
  - OS observation is calibrated against an owned held-open loopback connection and proves rejection of missing, forged and non-loopback observations.
  - False accepts, Secret reads, Provider requests and unauthorized external effects equal zero.
formal_execution:
  diagnostic_provider_requests_max: 1
  formal_provider_requests_exact: 36
  total_provider_requests_max: 37
  automatic_retries_max: 0
  secret_read_sessions_max: 1
  flow:
    - Persist a create-once request receipt before each Provider effect.
    - Persist raw response bytes, HTTP status, usage and a cross-bound response receipt before final transport or observer verdict.
    - Require one strict diagnostic completion before the unique 36-cell matrix.
    - Attempt to process every formal response through accepted P1-149; retain the complete spine when admitted and a bound terminal-stage failure plus explicit downstream-artifact absence receipt when rejected.
    - Preserve every scheduled cell in the denominator without replacement, retry or post-hoc beautification.
    - Rebuild the report without reading the original report and run an independent verifier over the frozen closed inventory.
acceptance_criteria:
  - Complete offline preflight passes before the sole Secret input session or any Provider request.
  - One strict diagnostic and exactly 36 formal request-bound Provider calls execute with zero automatic retries.
  - Every formal cell binds its exact non-reference-bearing B0/B1/B2 profile composition, while isolated accepted-adapter controls remain outside Provider prompt and outcome inputs.
  - Every admitted response produces finite real Patch operations, a deterministic compiler plan and a bounded owned-copy application attempt.
  - Every cell retains exact request, response, profile composition and observer Evidence; completed spines also retain patch, compiler, apply, trace, oracle, tests and rollback, while rejected spines retain an exact terminal-stage failure and explicit absence of all unexecuted downstream artifacts.
  - Independent evaluation alone determines the 36-cell result taxonomy and VTSR.
  - Report rebuild uses only frozen raw Evidence and never reads the original report.
  - The baseline report satisfies the Evaluation Protocol Research Artifact contract, including identities, reproduction command, raw and aggregate results, cost, uncertainty, failures, limitations and conclusion.
  - False accepts, Secret persistence, non-loopback connections and unauthorized external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, Contract, authority, activation parent and accepted P1-149 identities.
  - Complete offline preflight, synthetic 36-cell run and isolated negative-case raw Evidence.
  - One diagnostic and 36 request/response receipt pairs with exact cross-binding.
  - Isolated accepted-adapter compatibility controls, reference-leakage checks, exact formal profile compositions and all attempted P1-149 response-to-evaluator spines.
  - Closed formal Evidence inventory, report-independent rebuild and independent verifier result.
  - Exact candidate manifest, recoverable Evidence tag, three fresh final reviews, tree equality and canonical verify receipt.
rollback:
  strategy: OWNED_DISPOSABLE_REPOSITORY_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical parent, Goal, Founder decision, accepted-input or Contract identity drifts.
  - Any P1-147 rejected candidate source, diff, fixture, test, evaluator or formal Evidence is read or reused.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus four same-Task repairs, 32 engineering hours or 6 calendar days are exhausted.
  - Offline preflight is not complete before a Secret read or Provider request.
  - Diagnostic, formal execution or complete formal Evidence Gate is NON_PASS, or a formal cell/matrix rerun would be required.
  - Secret bytes enter repository, Evidence, logs, traces, prompts, reviews or Vault.
  - A non-loopback, remote, production or public effect occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
forbidden_actions:
  - Read or reuse P1-147 rejected candidate source, diff, fixture, test, evaluator or formal Evidence.
  - Modify accepted P1-101, P1-129 or P1-149 semantics.
  - Trust Provider or Worker self-reported success.
  - Persist the Secret or Authorization header, including a hash of either.
  - Use non-loopback network, DNS, proxy, redirects, fallback endpoint, remote, production or public effects.
  - Enter P2 or P3.
  - Push or modify a remote.
claim_boundary: >-
  Cooperative-local exact-loopback request-bound baseline research using the
  accepted canonical P1-149 execution spine only. No model superiority,
  generalization, P1 Exit, P2/P3 entry, remote, production, public,
  hostile-principal, strong-isolation or production-readiness claim.
