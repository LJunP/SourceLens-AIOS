g0_requirements:
  - Freeze P2 preregistration, hypotheses and stop conditions before any external effect.
  - Freeze six exact TaskSpecs, B0/B1/B2 configurations and 36 ordered formal cells.
  - Freeze request bodies and the synthetic disclosure allowlist.
  - Freeze denominator, VTSR, failure taxonomy and report schema.
  - Create an absent create-once capture root with a closed inventory.
  - Build one Founder/operator-owned no-echo /usr/bin/curl command.
  - Pass complete offline admission, reproduction and isolated negative fixtures.
  - Obtain fresh Security TARGET_VERDICT PASS over the exact spool, disclosure, command and offline boundary.
  - Before G0 PASS, Secret reads, Provider requests, network connections, false accepts and non-owned mutations remain zero.
formal_execution_requirements:
  - The first strict diagnostic PASS immediately starts the exact 36-cell formal denominator.
  - Every scheduled formal cell remains in the denominator; no deletion, substitution or cosmetic rerun is allowed.
  - Canonical AIOS reads only the non-Secret capture bundle.
  - Independently recompute RunRecord, trace, stable projection, replay, rollback, aggregate, VTSR and failure taxonomy.
  - B2 performs real exact accepted P0 repository_analysis.scan child execution.
  - Preserve actual stochastic differences and UNKNOWN metering when trustworthy usage or cost evidence is absent.
  - False accepts, non-owned mutations, non-loopback connections, retries, remote, production and public effects equal zero.
acceptance_criteria:
  - G0 complete offline preflight and fresh Security review pass before any operator external effect.
  - One operator launcher run stays within the exact endpoint, model, request, token and monetary ceilings.
  - One non-Secret capture bundle passes exact identity, closed-inventory and disclosure admission.
  - Exactly 36 formal cells enter the denominator.
  - Reproducible baseline report and P2 Context Engine preregistration are complete, falsifiable and bound to raw Evidence.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder packet, Goal, activation parent, Contract and authority identities.
  - Frozen G0 preregistration, hypotheses, stop conditions, six TaskSpecs, configurations, ordered cells and schemas.
  - Exact request/disclosure manifest, create-once spool inventory and fresh G0 Security review.
  - Safe request/response identities without Secret bytes.
  - All 36 raw formal outcomes, RunRecords, traces, projections, replay, rollback, aggregate, VTSR and failure taxonomy.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and canonical make verify result.
rollback:
