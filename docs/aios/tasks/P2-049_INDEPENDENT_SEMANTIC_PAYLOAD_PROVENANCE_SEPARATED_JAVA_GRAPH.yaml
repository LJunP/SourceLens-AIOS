architecture_constraints:
  - Reimplement from accepted canonical specifications and assets without accessing or reusing rejected P2 engineering bytes.
  - Keep the canonical semantic payload free of repository role, absolute path, device, inode, execution id, timestamp and runtime provenance.
  - Bind each semantic payload SHA-256 in a separate root-specific provenance envelope containing source-root realpath, device, inode, scanner and compiler identities and raw receipts.
  - Produce byte-identical semantic payloads from two physically independent repository roots while retaining their distinct provenance identities.
  - Admit the external transaction manifest by exact path, type, non-symlink, byte length and SHA-256 before parsing any semantic content.
  - Complete a regular-file-and-directory-only closed inventory before reading admitted raw source, javac, javap, process or observer receipts.
  - Make the independent consumer derive nodes, edges, source spans, endpoint classes and counts only from admitted raw source, javac and javap outputs and raw receipts.
  - The independent consumer must not import the Worker module, Worker case table, expected relations, expected endpoints, expected success fields or a Worker-authored oracle.
  - Preserve a raw input, exact mutation, consumer output and stable rejection reason for every negative case.
  - Keep false accepts and all six external effects at zero.
quality_freeze:
  positive_matrix:
    - explicit import compiler-native resolution
    - same-package compiler-native resolution
    - wildcard import compiler-native resolution
    - fully-qualified compiler-native resolution
    - nested lexical nearest-declaration resolution
    - inherited nested-type hiding resolution
    - deterministic node, edge, endpoint and source-span projection
    - two physical roots produce byte-identical semantic payloads
    - two physical roots retain distinct truthful provenance envelopes
    - independent consumer reconstructs the complete graph claim without Worker modules or expected answers
  negative_matrix:
    - external transaction manifest identity drift
    - closed inventory missing or extra entry
    - inventory reorder or duplicate
    - symlink or hardlink object
    - cross-transaction binding
    - argv tail mutation
    - source-root identity mutation
    - source-span mutation
    - graph node or edge mutation
    - Provider or Secret input injection
    - stale compiler or scanner identity
    - missing raw source or compiler receipt
    - Worker self-reported PASS without independent raw proof
  required_counts:
    physical_repository_roots: 2
    positive_semantic_cases_minimum: 6
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - The executable producer and independent consumer complete the full positive and negative matrix from fresh owned roots.
  - Every admitted object is bound by exact relative path, regular type, byte length and SHA-256 under one externally bound transaction manifest.
  - The canonical semantic payload excludes all root-specific provenance fields and is byte-identical across two physical roots.
  - Each provenance envelope separately binds the exact semantic payload and truthfully retains its different physical root and execution identity.
  - The independent consumer reconstructs nodes, relations, endpoints, spans and aggregate counts from admitted raw Evidence only.
  - Every declared negative case rejects with preserved raw proof and false accepts equal zero.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same candidate and Evidence bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Externally bound top-level transaction manifest and regular-only closed inventories.
  - Raw Java sources, javac and javap outputs, executable identities, argv, minimal environment and process receipts.
  - Two root-independent byte-exact semantic payloads and two root-specific provenance envelopes.
  - Independent consumer positive and negative receipts with zero false accepts and independently reconstructed external-effect counts.
  - Exact candidate commit, tree, tracked diff hash, manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
rollback:
  strategy: OWNED_DISPOSABLE_ROOT_CLEANUP_BEFORE_FREEZE_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
