objective: >-
  Build and independently accept one provider-neutral experiment kernel that preserves
  the real B0, B1 and B2 profile boundaries, prevents answer-bearing inputs from
  reaching the formal Worker, performs fail-closed Evidence transactions, and gives
  an independent evaluator enough raw Evidence to reconstruct every outcome without
  trusting Worker verdict fields.

why_now: >-
  Strict P1 is 6/8 (75%). P1-176 stopped without capability credit after late
  independent pre-formal reviews exposed profile, answer-separation, object-ownership,
  observer-binding, accounting-finalization and Evidence-truthfulness defects. A fully
  offline accepted kernel is the smallest falsifiable prerequisite to a safe one-shot
  baseline and directly advances the two remaining P1 Exit items without restoring
  the rejected P1-176 lineage.

