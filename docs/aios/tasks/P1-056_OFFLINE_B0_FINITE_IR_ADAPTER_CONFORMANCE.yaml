acceptance_criteria:
  - Quality freezes and self-validates the exact request, four response envelopes, response-to-IR mapping, malformed/tamper corpus, fixed interfaces, stable projection and rollback oracle before Worker mutation.
  - Adapter admission checks raw Buffer type, frozen maximum lengths, SHA-256 only as a non-authorizing index, and final exact Buffer equality against the one request and four responses before any decode, parse, compiler invocation, write or child start.
  - Every admitted response maps one-to-one to exactly one accepted P1-055 IR Buffer; adapter output length, SHA-256 and exact bytes equal the corresponding accepted program and no fifth output exists.
  - Adapter passes its exact output Buffer directly to the unmodified accepted P1-055 compileFiniteTypedPatchIr interface; four composed observations receive their frozen program/outcome identities, and only IR10 has the accepted success outcome.
  - Request or response identity, encoding, length, hash, schema, baseline marker or envelope drift rejects before compiler invocation; malformed JSON, free-form code, tool calls, streams, Provider fields, path/shell/import payloads, BOM, NUL, invalid UTF-8, duplicate/extra/missing/reordered fields and extra whitespace/LF all reject.
  - Deterministic negative closure covers every strict truncation, every one-byte prefix/suffix and every-position fixed-byte substitution of each success response; legal-to-legal equality is handled as the target legal envelope and all other bytes reject with zero false accepts.
  - Rejection Evidence proves compiler_call_attempts zero, mutation_attempts zero, child_start_attempts zero, canary unchanged and all external effects false.
  - Adapter TCB has only node:crypto and no filesystem, child-process, network, dynamic-execution or free-form parsing API; P1-055 accepted compiler bytes are not modified.
  - Targeted verification executes the exact four success responses, explicit negative corpus, deterministic negative closure, candidate-binding checks, evaluator-tamper checks and source-clean rollback checks.
  - One exact final candidate commit/tree/manifest is frozen after targeted verification; repair closes and Run A plus independent fresh Run B execute the same candidate and frozen inputs in distinct create-once Evidence roots.
  - Run B does not read Run A path, receipt, stable projection or verdict; both runs produce exact-byte-equal predeclared stable projections, zero false accepts, unchanged canonical/task source and exact clean rollback.
  - Fresh CTO, Security and Quality reviewers return TARGET_VERDICT PASS for the same exact candidate and Evidence; Reviewer NON_PASS terminates the Task without candidate correction.
  - Only after Task Gate may the reviewed tree be squash-integrated locally; integrated tree equals reviewed tree and one clean canonical full make verify passes.

required_evidence:
  - exact Contract, route packets, Goal, authority and Quality freeze identities
  - exact request/response/program mapping and negative corpus identities
  - candidate commit/tree, binary diff hash and per-file mode/length/SHA manifest
  - Run A and independent Run B raw commands, observations, negative results, stable projections and source-clean rollback receipts
  - deterministic negative-closure counts/digest and zero false accepts
  - adapter/compiler composition observations and static TCB checks
  - stable projection exact-byte comparison
  - fresh CTO, Security and Quality exact-candidate verdicts
  - reviewed/integrated tree equality and canonical make verify result

rollback:
  run_level: Adapter and compiler composition is in-memory only; verify exact candidate source commit/tree and clean status before and after, remove only create-once run Evidence objects proven owned by a failed pre-publication run, and never mutate canonical or accepted P1-055 bytes.
  candidate_level: Do not integrate a NON_PASS candidate; preserve raw Evidence and a recoverable evidence tag, then remove only a verified-clean task-owned worktree.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence; never reset or clean.

stop_conditions:
  - Quality freeze is incomplete, inconsistent, contaminated or not finished within 0.6 engineering hours after activation.
  - Worker implementation does not start within the first engineering hour or pre-Worker work exceeds 1.0 engineering hour.
  - Request, response or adapter output population ceases to be finite, exact and exhaustively auditable.
  - Any non-exact response is admitted, any output differs from the four accepted IR bytes, or any invalid input reaches compiler, mutation or child start.
  - Adapter requires JSON/free-text interpretation, arbitrary source, diff, AST, expression, path, command, argv, cwd, env, module, executable or broader TCB.
  - Accepted P1-055 source, Evidence, canary, canonical source or a pre-existing object is overwritten, damaged, followed, renamed, deleted or cleaned.
  - An external effect, escaped path, identity drift, Evidence overwrite or cleanup ambiguity occurs.
  - One pre-freeze bounded repair is consumed and targeted verification still does not pass.
  - Candidate is mutated after freeze, Run A or Run B is NONPASS, stable projections differ, false accepts are nonzero, or rollback is not exact.
  - Any fresh Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical full make verify is NONPASS.
  - Network, Provider, Secret, remote, production, public, dependency download, Docker, VM, root, Strong Isolation, P2 or P3 permission is required.

