acceptance_criteria:
  - Exactly eight CURATION_ELIGIBLE real tasks exist with development=4, validation=2 and hidden=2.
  - One or two SourceLens internal reconstructed tasks are development-only; six or seven accepted public tasks fill all remaining slots without changing the split.
  - At least five repository lineages, four external repository lineages, two language/build ecosystems and three bounded task categories are represented.
  - Every accepted TaskSpec and curation-only EnvironmentSnapshot validates against unchanged accepted schemas and the exact no-model sentinel; no baseline-ready snapshot is claimed.
  - Every source bundle fresh-reconstructs its exact base commit/tree to a clean state.
  - Every task has reproducible base-failure and reference-patch-success issue-specific verification plus required regression verification.
  - Repository, issue-lineage and patch-similarity overlap across splits is zero.
  - All 28 pairwise adjudications are NO_KNOWN_OVERLAP; issue-lineage and patch-similarity duplicates across all eight CURATION_ELIGIBLE tasks are zero.
  - Every copied source, Issue, patch, test, oracle and dependency artifact has ALLOWED or separated RESTRICTED internal-usage rights; UNKNOWN or PROHIBITED internal-use bytes are absent, and public redistribution remains independently bounded.
  - Public and Quality-private validators pass all positive checks and reject every declared single-failure negative vector.
  - The canonical candidate exposes only the hidden commitment and custody receipt, not hidden identity or content.
  - Worker and Integration handoffs contain no hidden task bytes or mapping, and bounded ledgers show no observed hidden-root access; no filesystem capability-denial claim is made.
  - Acquisition and dependency materialization freeze before all offline rebuild and base/fix verification.
  - Every eligible task has a closed Dependency Artifact Manifest and passes verification inside the declared fixed-digest disposable OCI boundary without designing a new carrier.
  - P1-001 accepted evaluator, fixtures, Evidence and schemas remain byte-identical and P1-001 verification passes.
  - Complete repository verification passes.
  - Fresh candidate rebuild, rollback verification and offsite restore verification pass.
  - CTO, Security and independent Quality reviews are PASS; Product review confirms the declared pilot mix without claiming representativeness.
  - No model, B0/B1/B2/A0, VTSR, performance measurement, P2/P3, remote, production or public-release action occurs; a later baseline freeze requires a new dataset version.

failure_criteria:
  - Fewer than eight candidates satisfy all eligibility conditions within budget.
  - Any accepted source, rights, Issue, patch, oracle, environment or split identity is unresolved or irreproducible.
  - Base failure or reference-patch success cannot be reproduced offline after freeze.
  - A complete dependency closure or fixed-digest disposable OCI verification environment cannot be frozen without executing unadmitted third-party code during acquisition.
  - Golden-patch byte equality is the sole success oracle.
  - Hidden content or mapping is exposed to a prohibited role or canonical path.
  - Split overlap or contamination is detected.
  - Completion requires modifying accepted schemas or P1-001 accepted artifacts.
  - Completion requires a network host, credential, permission, path, budget or claim expansion.
  - Any final EnvironmentSnapshot is represented as baseline-ready without a later exact model/configuration freeze and new dataset version.
  - Completion requires Repository Intelligence, Agent Runtime, Supervisor, Root Custody, strong isolation or other P2/P3 capability.

stop_conditions:
  - Any failure criterion becomes true.
  - The 32 engineering-hour or 7-calendar-day budget is exhausted.
  - Twenty-four candidates are screened without obtaining exactly eight CURATION_ELIGIBLE tasks.
  - A Secret, credential-helper value, authentication material or forbidden redirect is observed.
  - Network remains active after acquisition freeze or any offline verification attempts network access.
  - Source, Issue, patch, license, oracle, evaluator or hidden-custody contamination occurs.
  - Dependency artifact rights, digest, closure or offsite eligibility is UNKNOWN or internally prohibited.
  - The existing disposable OCI environment cannot enforce network=none, non-root, read-only root, exact task-local writes, no host credential mounts and teardown before verification freeze.
  - Any write occurs outside the exact owned paths or in inherited SourceLens, canonical main, historical Evidence or immutable inputs.
  - A required rebuild, rollback, offsite, P1-001 regression, full verification or independent review is non-PASS.
  - The same implementation defect remains after two in-Task correction passes without new evidence.
  - Scope, budget, permission, role, metric or claim expansion would be required.
  - An undeclared writer/path overlap or write outside the actor-by-phase map occurs.

rollback:
  implementation_rule: canonical main remains unchanged until separate Founder Gate authorization
  candidate_identity: exact parent, commit and tree must be frozen before review
  pre_cleanup_custody: >-
    Before any branch/worktree cleanup, create and fresh-clone verify a Git bundle
    containing the implementation parent and candidate. Preserve external visible and
    hidden custody plus all failure Evidence.
  pre_gate_stop: >-
    Stop without main advance. After verified bundle custody, remove the Task worktree
    and branch only if separately authorized by the terminal-state decision.
  main_advance: forbidden_without_separate_founder_gate
  history_rewrite: forbidden

offsite:
  required_before_founder_gate: true
  path_and_volume_identity: FOUNDER_MUST_BIND_IN_EXECUTION_AUTHORIZATION
  visible_and_hidden_packages_separate: true
  prohibited_content: UNKNOWN_OR_PROHIBITED_INTERNAL_USAGE_RIGHTS_BYTES
  private_restricted_content_rule: >-
    RESTRICTED internal-research bytes, including Founder-authorized SourceLens bytes,
    may enter only the private access-controlled package when the exact rights assertion
    and path list are bound. Public redistribution remains prohibited.
  verification:
    - SHA-256 identity
    - fresh source reconstruction
    - hidden commitment match by Quality custodian
    - Evidence manifest closure
    - rollback artifact availability
  claim_boundary: Integrity and recoverability only; not hostile-principal confidentiality.

independent_review:
  freeze_before_review: true
  reviewer_input: exact frozen candidate and immutable Evidence only
  required_reports:
    - CTO architecture and P1-boundary review
    - Security source-rights, network, custody and claim-boundary review
    - independent Quality dataset, split, oracle and negative-vector review
    - Product task-mix and software-engineering relevance review
  acceptance_rule: CTO, Security and independent Quality must each be exact PASS
  product_rule: Product must confirm the declared pilot mix is useful for later controlled baselines without claiming statistical representativeness
  non_pass_effect: STOP_AND_RETURN_TO_FOUNDER
  reviewer_pass_is_founder_gate: false

p1_p2_p3_boundary:
  p1_allowed:
    - Task discovery and bounded candidate screening
    - TaskSpec, EnvironmentSnapshot, source, rights, oracle and baseline-context materialization
    - split, deduplication, contamination analysis and operational hidden custody
    - dataset validator, rebuild, replay, Evidence and offsite custody
  p2_forbidden:
    - Repository Intelligence feature development
    - graph, symbol, ranker or context-selection algorithm improvement
    - B2 optimization or Repository Context Benchmark claims
  p3_forbidden:
    - Agent Runtime or Agent Shell
    - model-initiated writes
    - Supervisor or Root Custody
    - platform or OS identity
    - strong isolation or hostile-principal resistance
    - capability runtime, resume or checkpoint runtime
  environment_note: >-
    Reproducible task environment materialization and an image digest are P1 evaluation
    inputs. They do not authorize building a P3 Trust Runtime or execution carrier.

explicit_non_authorizations:
  - This Draft does not authorize data acquisition, network access or dependency download.
  - This Draft does not authorize branch, worktree, dataset root, hidden root or evidence root creation.
  - This Draft does not authorize modifying canonical Truth, validators, code map or Task files.
  - This Draft does not authorize running external source, tests, models, baselines or experiments.
  - This Draft does not authorize main advance, remote write, production effect or public release.
  - This Draft does not authorize AIOS-P1-002 recovery, B0/B1/B2/A0 execution, P2 or P3.
  - This Draft does not authorize a successor, replacement, normalization or correction chain.

completion_rule: >-
  Completion requires exact 4/2/2 pilot closure, immutable source and rights evidence,
  deterministic public and private validation, clean reconstruction, offline base/fix
  verification, hidden custody, rollback, offsite restore, P1-001 and full regression,
  independent PASS reviews and a separate Founder Gate. Completion authorizes neither
  baseline execution nor P1 exit. This Draft remains non-executable until the Founder
  accepts its exact SHA-256 and separately grants the bounded execution authorities.
