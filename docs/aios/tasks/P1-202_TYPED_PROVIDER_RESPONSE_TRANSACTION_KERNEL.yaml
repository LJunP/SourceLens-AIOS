architecture_constraints:
  - The production executor and every evaluator replay use one versioned typed transaction entrypoint.
  - The transaction reserves request ceilings before any effect and never converts an unknown or invalid response into zero accounting.
  - Only syntactically undecodable raw JSON receives JSON_INVALID with UNKNOWN usage; its full reservation remains charged.
  - Parsed usage missing, null, duplicate, contradictory, non-finite, non-integer, negative, total-mismatched or over-budget is a stable NON_PASS with full reservation retained.
  - Successful and failed HTTP responses use the same usage admission and reconciliation core.
  - The request contract freezes exact top-level and nested keysets, message role order, exact content identities, endpoint and model; response_format is forbidden.
  - The kernel is offline, deterministic and data-driven; it does not contain Task IDs, run IDs, expected answers or PASS selectors as generic rules.
  - Accepted P1-035, P1-101, P1-129 and P1-149 assets remain read-only and unchanged.
