acceptance_criteria:
  - Before Worker product mutation, fresh Quality freezes at least twelve unambiguous project-owned Java constructor-dependency tasks from the exact activation-parent product source, with eight public DEV tasks and four feature-domain-disjoint sealed validation tasks.
  - The oracle is derived only from exact source spans and independently compiled classfile constructor or field type facts; graph, retrieval, candidate and historical P2 outputs cannot select tasks, define relevance or tune queries.
  - All arms use the same exact production-Java source-unit universe, twelve-task denominator, maximum eight chunks and maximum 8192 UTF-8 rendered bytes; invalid tasks remain in the denominator with zero recall.
  - Controls are deterministic lexical token-overlap retrieval and the exact-parent Code QA retrieval path with embeddings null and graph disabled; their selection paths cannot load treatment or oracle logic.
  - The real POST /api/projects/{projectId}/qa path can add one same-scan project-owned dependency definition absent from both controls as citeable PRIMARY context with an auditable JAVA_DEPENDENCY_NEIGHBORHOOD_CONTEXT_V1 reason.
  - Product admission accepts only a unique exact anchored source class, one unique DEPENDS_ON edge and one unique target class and chunk; cross-scan, other relation types, external targets, duplicate rows, ambiguous symbols, invalid paths or spans and over-budget additions fail closed to exact no-graph behavior.
  - DEV treatment macro recall is at least 0.10 above the stronger control, with no task regression, zero forbidden context and zero false accepts, before the unique candidate is frozen.
  - One sealed validation on the unchanged unique candidate has macro recall at least 0.10 above the stronger control, at least three of four positive paired deltas, no negative paired delta and at least one relevant dependency definition recovered that both controls miss.
  - Full-sample treatment macro recall is at least 0.10 above the stronger control and macro precision is no more than 0.02 below it; two distinct physical roots produce byte-exact stable projections.
  - Targeted product tests, the existing twenty-two-case Code QA regression guardrail and independent negative matrix pass offline; fresh CTO, Security and Quality Reviews all PASS the same candidate before exact local integration and one canonical make verify.
required_evidence:
  - Quality-first receipt binding activation parent, clean product source manifest, Java toolchain, offline compile transaction, class inventory, raw constructor/type inventory, eligible dependency inventory, deterministic sample, oracle, public DEV projection, sealed validation identity, both controls, evaluator, budgets and negative controls.
  - Product unit and controller integration tests covering same-scan dependency uplift, exact no-graph fallback, retrieval-plan reason, citation semantics, path and scan containment, relation and symbol uniqueness, duplicate admission and UTF-8 byte and chunk limits.
  - Independent DEV and one-shot validation raw results reconstructing both controls and treatment from the same frozen inputs, complete denominator, paired metrics, false accepts, forbidden context, precision and two-root replay.
  - Exact candidate commit, tree, diff and allowlisted product source identities plus offline command, exit, stdout, stderr and cooperative-local zero-effect observations.
  - Fresh exact-candidate CTO, Security and Quality Review receipts and, only after all PASS, exact integration tree equality plus the single canonical make verify receipt.
rollback: >-
  Before integration all product changes remain on the unique P2-063 branch and
  worktree, with Quality and evaluation Evidence under the external Task root.
  A terminal NON_PASS preserves exact Evidence and a content-addressed diff before
  worktree removal. An integrated regression is rolled back by a non-destructive
  revert of the unique integration commit; no database migration is involved.
stop_conditions:
  - Quality-first freeze cannot derive at least twelve eligible unambiguous project-owned constructor-dependency tasks or cannot bind the source, toolchain, universe, controls, oracle, split, budget, denominator and evaluator before Worker mutation.
  - Any rejected P2 engineering source, candidate, evaluator, fixture, test or formal Evidence is read, restored, compared, copied or reused.
  - The implementation requires analyzer, parser, graph producer, file filter, database schema, migration, CodeQaRetrievalService, Web, Agent Runtime or P3 changes.
  - DEV fails its uplift, no-regression, false-accept, forbidden-context or deterministic-replay criteria within four total implementation iterations, or the same normalized root cause occurs twice.
  - Worker reads sealed validation before candidate freeze, or candidate, source universe, oracle, split, budget, denominator, controls or evaluator identity drifts.
  - One-shot validation misses any acceptance threshold, admits a false or forbidden context, needs post-validation repair or would require a second candidate.
  - Any external effect is nonzero or UNKNOWN, any final Reviewer returns TARGET_VERDICT NON_PASS, or exact integration tree equality or canonical make verify fails.
forbidden_actions:
  - Read, restore, compare, copy, execute or reuse any rejected P2 engineering lineage, including P2-062 source, candidate, evaluator, fixture, test or formal Evidence bytes.
  - Modify analyzer-rust, JavaAstParser, JavaFallbackAnalyzer, CodeChunkFileFilter, graph producer, database schema or migration, CodeQaRetrievalService, Web, Agent Runtime, generic validator, governance or Evidence-platform product code.
  - Read sealed validation issue or oracle bytes before candidate freeze, or select tasks and relevance from graph, retrieval, candidate or historical P2 outputs.
  - Tune the source universe, oracle, split, queries, budget, denominator, controls, threshold or evaluator after observing validation.
  - Access network, Provider, Secret, remote, production or public systems; push, fetch, create a PR, release, deploy or enter P3.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain for this Task.
