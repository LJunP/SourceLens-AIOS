    - backend-spring 22-case retrieval regression corpus
    - any candidate whose eligibility is not CURATION_ELIGIBLE
  diversity_floor:
    repository_lineages: 5
    external_repository_lineages: 4
    language_or_build_ecosystems: 2
    bounded_engineering_task_categories: 3

claim_boundary:
  proves_if_accepted:
    - p1-pilot-task-dataset-v0.1 contains exactly eight hash-bound curation-eligible pilot tasks
    - provenance, rights classification, source identity and environment materialization are recorded for those tasks
    - development, validation and implementation-hidden split mechanics pass declared overlap checks
    - operational hidden custody and deterministic dataset validation work under cooperative local role separation
    - the frozen pilot is eligible as input to a separately authorized baseline-configuration freeze and evaluation-preparation task
  does_not_prove:
    - statistical or domain representativeness
    - a public benchmark or SourceLens-Bench
    - P1 exit
    - B0, B1, B2 or A0 performance
    - Verified Task Success Rate or any denominator entry
    - software-engineering Agent capability or superiority
    - that public hidden tasks were absent from model training data
    - hostile-principal secrecy, OS-level isolation or P3 Trust Runtime security
    - production readiness or public redistribution authority
    - final baseline-ready EnvironmentSnapshots or a frozen live-model configuration
  required_terms:
    hidden_set_term: IMPLEMENTATION_HIDDEN
    overlap_term: NO_KNOWN_OVERLAP
    forbidden_terms:
      - MODEL_UNSEEN
      - UNCONTAMINATED
      - REPRESENTATIVE_BENCHMARK

