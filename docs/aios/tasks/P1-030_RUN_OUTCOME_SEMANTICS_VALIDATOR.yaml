  execution_retries: 0
  candidate_freezes: 1
  network_calls: 0
  provider_calls: 0

acceptance_criteria:
  - The final exact Contract receives CTO, Security and Quality PASS before activation.
  - Quality freezes 12 valid, 15 single-defect and 3 adjacent-precedence cases plus all independent goldens before Worker implementation.
  - V01-V12 equal exact goldens; N01-N15 and P01-P03 return only their complete frozen failure observations.
  - Both complete 30-case populations equal the frozen oracle and each other byte-for-byte.
  - Accepted RunRecord schema, generic validator, P1-001 fixtures/evaluator/oracle/Evidence and P1-011 artifacts remain byte-identical.
  - Targeted gate, P1-001 regression, P1-011 regression, make verify, fresh-clone targeted rebuild and rollback all PASS.
  - CTO, Security and Quality independently PASS the exact candidate and frozen Evidence.
  - Master Task Gate integrates locally, synchronizes Truth/code map and final make verify PASS.

failure_criteria:
  - A valid semantic record is rejected or differs from its frozen golden.
  - An invalid or precedence record is accepted or returns an unexpected reason.
  - The validator executes effects, reads arbitrary paths, changes accepted artifacts or claims independent success/counting.

stop_conditions:
  - The final contract review after at most one bounded repair is non-PASS.
  - Any write occurs outside exact role-owned Task paths or external Evidence paths.
  - Any accepted schema, generic validator, P1-001/P1-011 artifact or historical Evidence changes.
  - The same implementation root cause remains after two iterations without new Evidence.
  - Any final independent review is non-PASS after the single candidate freeze.
  - A Founder-reserved decision, external effect or P2/P3 capability becomes necessary.

forbidden_actions:
  - No network, provider, secret, remote, production or public effect.
  - No new timestamp ordering, duration, stricter RFC3339 semantics or temporal claim beyond the accepted generic schema validator's existing date-time format check; no command execution, command ledger, VTSR counting, baseline execution or independent success decision.
  - No arbitrary path, stdin, schema override, child process, clock, randomness or mutable global state in the validator.
  - No accepted schema, generic validator, P1-001/P1-011 artifact, historical Evidence or path outside allowed_paths modification.
  - No benchmark, VTSR, Agent-capability or P1-completion claim.
  - No platform identity, Supervisor, Root Custody, sandbox, Trust Runtime or P2/P3 capability.
  - No retry, successor, replacement or pre-execution governance chain.

evidence:
  required:
    - exact final Contract, phase authorization and final three contract reviews
    - Quality commits, freeze receipt, 30 record identities, mutation definitions and independent goldens
    - two complete actual 30-case populations and frozen-oracle comparisons
    - runtime, implementation and candidate identities
    - accepted-input non-drift and P1-001/P1-011 regression results
    - fresh-clone targeted rebuild and rollback
    - CTO/Security/Quality final reviews, Master Task Gate and final canonical make verify

rollback:
  strategy: Keep canonical main unchanged until Master Task Gate; preserve rejected Evidence before resource cleanup; accepted integration is a local fast-forward descendant.

delegated_authority:
  phase_local: true
  task_gate_owner: MASTER_CEO_AGENT
  founder_gate: RESERVED_DECISIONS_ONLY
  founder_reserved_decisions: []
  external_effects: {network: false, provider: false, secret: false, remote: false, production: false, public: false}

completion_rule: >-
  PASS proves only deterministic local RunRecord outcome semantics for the frozen
  visible matrix. It does not prove timestamp validity, command capture, VTSR
  counting, independent task success, baseline performance, Agent capability,
  P1 completion, hostile-principal resistance or production readiness.
