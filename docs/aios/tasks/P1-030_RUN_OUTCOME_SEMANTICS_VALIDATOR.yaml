schema_version: 1
record_type: sourcelens_aios_phase_delegated_task_contract
task_id: AIOS-P1-030_RUN_OUTCOME_SEMANTICS_VALIDATOR
phase: P1
title: RunRecord Outcome Semantics Validator
status: READY_FOR_PHASE_DELEGATED_EXECUTION
execution_authority: PHASE_DELEGATED
task_kind: EVALUATION_FOUNDATION_ENGINEERING
risk_level: medium

objective: >-
  Implement a pure deterministic validator that accepts one already-parsed
  RunRecord, validates the accepted schema, enforces the closed relationship
  between terminal_status, stop_reason_code, invalid infrastructure, policy
  violations and required failure taxonomy, and returns a hash-bound outcome
  projection. It does not validate timestamps, execute commands, count VTSR or
  decide independent success.

why_now:
  - Evaluation Protocol v1.1 requires every scheduled run, including failure, timeout, policy and infrastructure outcomes, to remain countable with explicit reason codes.
  - P1-001 records visible runs, but the accepted RunRecord schema does not by itself close every cross-field outcome relationship.
  - A pure outcome validator is an independent P1 primitive needed before baseline matrix counting and does not continue temporal, command-ledger or VTSR Tasks.

