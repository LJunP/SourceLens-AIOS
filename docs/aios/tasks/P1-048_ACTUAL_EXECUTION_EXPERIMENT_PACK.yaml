minimal_safety_invariants:
  - Canonical source is never a run materialization or patch target.
  - Each run uses a distinct newly created disposable materialization from the frozen base.
  - Each Evidence output leaf is atomic, create-once, task-owned, contained, regular and nlink one.
  - Pre-existing, symlinked, hardlinked, escaped or identity-drifted Evidence paths fail closed without cleanup of pre-existing objects.
  - Worker cannot create or modify the Task Card, oracle, expected result or independent verdict.
  - Run B ignores Run A verdict fields and directly reexecutes from frozen inputs.
  - Rollback must remove the added file and restore exact original source bytes, base tree and clean state.

acceptance_criteria:
  - Run A and Run B each start from exact base commit dd71c92a04693e60f1cb30d577107205411cbed3 and tree 78327e74c83aed97eddcc7485dcf985865c2b815 in distinct materializations.
  - Before patching, issue test exits 1 with REP006_DEDUPE_PRESERVES_ORDER and regression test exits 0.
  - The exact non-empty patch is applied and changed paths are exactly src/projects.mjs, src/users.mjs and src/unique.mjs.
  - Patched issue and regression tests both exit 0.
  - Every command retains argv, cwd, exit, signal, duration, and raw stdout and stderr bytes with lengths and SHA-256.
  - Inverse patch removes src/unique.mjs and restores exact base source bytes, tree and clean state.
  - Run A and Run B stable semantic projections match while physical path, inode, PID, time and duration remain retained but excluded from equality.
  - Quality-frozen negative controls reject pre-existing Evidence, symlink, hardlink or nlink drift, path escape, empty or no-op patch, patch-scope drift, missing required action and artifact identity tamper with zero false accepts.
  - Targeted verification, accepted P1-035 regression, fresh Run B and fresh CTO, Security and Quality exact-candidate reviews pass before candidate Task Gate.
  - After candidate Task Gate, the exact reviewed tree is integrated locally and one clean canonical full make verify passes before terminal Task PASS.

required_evidence:
  - exact Contract, Task Card, candidate and input identities
  - Run A raw artifacts, stable projection and rollback result
  - executable negative-control results
  - independent fresh Run B raw artifacts and A/B stable comparison
  - targeted verifier and accepted dataset regression results
  - fresh CTO, Security and Quality target verdicts
  - integration tree equality and canonical make verify result

rollback:
  run_level: Apply the inverse patch in the disposable materialization and verify exact frozen base identity and clean state.
  candidate_level: Do not integrate a NON_PASS candidate; preserve Evidence and remove only the verified task-owned clean worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence.

stop_conditions:
  - Worker has not started within 1 engineering hour after activation.
  - Actual Run A is not produced within 8 engineering hours.
  - Fresh independent Run B is not produced within 12 engineering hours.
  - Source, tool, Task Card, oracle or accepted-input identity drifts.
  - Worker contaminates Quality-owned or independent-review bytes.
  - A forbidden zero-action, tamper, path, symlink or hardlink case is accepted.
  - Rollback cannot restore exact base identity.
  - One bounded same-Task implementation repair is consumed and the exact candidate remains TARGET_NON_PASS.
  - Evidence is overwritten, damaged or escapes the allowed root.
  - Network, Provider, Secret, remote, production, public or another Founder-reserved permission is required.

forbidden_actions:
  - reading, restoring, retrying or reusing P1-047 rejected bytes or lineage
  - changing the P1 Exit Gate, Phase route, Founder policy or current authority validators
  - creating successor, replacement, normalization, closure, feasibility, remediation or Route V2 or V3
  - network, Provider, Secret, dependency download, remote, production or public effects
  - push, pull request, release or remote mutation
  - P2 or P3 entry, Agent Shell, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime work
  - claiming Agent, benchmark, P1 Exit, production or hostile-principal capability from this Task

