acceptance_criteria:
  - Protocol version, actor roles, lifecycle, allowed public metadata, forbidden hidden disclosures and claim boundary are closed and hash-bound.
  - The public enrollment receipt exposes only opaque public identity, version, schema identity, population/coverage summary, private-manifest commitment and custodian role; it contains no hidden task identity, path, repository, source, prompt, oracle, expected patch/result or per-task result.
  - An implementation role can consume only the public enrollment receipt and cannot request or receive private hidden bytes; the independent custodian role alone is designated for future private custody and execution.
  - Evaluation request binds exact public receipt, candidate, run, environment and evaluator identities and requests PUBLIC_AGGREGATE_ONLY access.
  - Aggregate response and execution attestation bind the exact request and expose only aggregate counts, aggregate metrics, reason-code distribution and attestation identity.
  - Package manifest population, path containment, regular-file type, byte length and SHA-256 are mechanically verified; unknown fields and symlinks fail closed.
  - The positive package passes twice with byte-identical typed output; the controlled failure and exact M01-M12 mutations produce their frozen reason code and exit status.
  - No real or historical hidden task identity/content is created, read, enumerated, copied or used by this Task.
  - Fresh-clone verification, P1-001 regression, P1-035 regression, rollback and make verify are PASS.
  - CTO, Security and Quality final independent reviews of the frozen exact candidate are PASS.

failure_criteria:
  - Any public schema or package can disclose a forbidden hidden field or allow an implementation role private access.
  - Request, response, attestation, candidate, environment, evaluator, population or protocol identities are ambiguous or mutable without rejection.
  - An unknown, missing, extra, escaped, symlinked or hash-drifted package artifact is accepted.
  - Deterministic replay differs or any exact mutation vector produces a different verdict, reason code or exit status.
  - The implementation needs real/historical hidden material, network, Provider, Secret, package installation, a new runtime or a P2/P3 capability.
  - Evidence, replay, rebuild, rollback or any final independent review is non-PASS.

stop_conditions:
  - A write occurs outside exact allowed paths or any forbidden external effect occurs.
  - Goal, Contract, parent commit/tree, accepted dependency or Quality freeze identity drifts.
  - Any real or historical hidden task identity, content, path, oracle or expected result becomes visible to Worker, Integration or Master during execution.
  - The objective requires a real hidden-set acquisition, strong isolation, Supervisor, Root Custody, P3 Trust Runtime or broader permission.
  - Two implementation iterations fail for the same root cause without new engineering evidence.
  - The 14-hour or 3-day budget is exceeded.
  - A real architecture root prevents runnable protocol validation.

evidence:
