architecture_constraints:
  - Invoke the accepted canonical adapter path for every formal cell; do not build a direct-evaluator bypass.
  - Bind captured Provider output as a separate stochastic result and never attribute it to the offline adapter execution.
  - Keep adapter-context execution provenance and captured-result provenance separate and exact.
  - Let the independent evaluator determine final success or failure.
  - B2 must perform a real exact accepted P0 repository_analysis.scan child invocation.
  - Replay reconstructs from frozen inputs and receipts; same-object self-comparison is prohibited.
  - Input and output roots must be physically disjoint and reject ancestor, descendant and symlink overlap.
  - Output Evidence inventory is predeclared and closed before production.
  - Independent operating-system observation, not result self-attestation, proves six external-effect classes zero.
