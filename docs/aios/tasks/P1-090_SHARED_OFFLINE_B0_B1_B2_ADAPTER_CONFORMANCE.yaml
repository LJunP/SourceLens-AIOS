    - directory
    - symlink
    - hardlink
    - other
  verifier_inventory: COMPLETE_PHYSICAL_RECURSIVE_LSTAT_INVENTORY
  final_manifest: SHA256_BINDS_EXACT_INVENTORY_AND_ALLOWLIST_EQUALITY
  cleanup: ONLY_EXACT_TASK_OWNED_IDENTITY_MATCHING_ARTIFACTS
  unexpected_or_nonowned_residual: NON_PASS
  no_hostile_principal_or_strong_isolation_claim: true

