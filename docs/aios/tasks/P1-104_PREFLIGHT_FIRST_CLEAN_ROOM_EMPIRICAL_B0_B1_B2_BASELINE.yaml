architecture_constraints:
  - Reuse accepted canonical adapters and P1-101 trace by invocation; do not fork or rewrite them.
  - Do not read P1-102 source, fixture, runner, candidate or partial engineering bytes.
  - Before Secret read or Provider request, freeze source inventory and pass the complete offline transaction preflight.
  - Distinguish original source mode from controlled materialized mode and bind validation to the latter.
  - Every disposable fixture has unique ownership, exact rollback and no non-owned cleanup.
  - B2 must retain a real accepted P0 repository_analysis.scan child invocation.
  - Stable projection includes only preregistered deterministic fields; stochastic differences remain visible.
  - No result-dependent metric, exclusion, sample, configuration or evaluator change is permitted.
preflight_gate:
  required_before_secret_or_provider:
    - Freeze exact source inventory before materialization.
    - Materialize every controlled regular file at the declared mode and freeze the materialized expected inventory.
    - Verify rollback against the materialized expected inventory and exact original source bytes.
    - Reject mode drift, byte drift, missing, reorder, unexpected output, non-owned path, symlink and cleanup-ownership violations.
    - Complete deterministic replay with stable reason codes.
    - Prove false accepts, undeclared execution and all six external effects equal zero.
  failure_semantics:
    - A preflight failure records Secret reads and Provider requests as zero.
    - The sole repair must be code-only and the full preflight reruns from a fresh root.
    - Repair exhaustion terminally stops the route.
formal_matrix:
  dataset_task_count: 6
  profiles:
    - B0
    - B1
    - B2
  repetitions_per_task_profile: 2
  scheduled_run_count: 36
  required_outputs:
    - exact input, SystemConfiguration, executable, trace, RunRecord and result identities
    - raw stochastic fields
    - deterministic stable projection
    - independent evaluator verdict
    - exact replay and rollback receipt
    - exact Provider call, token, latency and available cost accounting
    - aggregate VTSR, false-success, unsafe-action, Evidence-completeness and failure taxonomy
  negative_matrix:
    - source inventory mutation after freeze
    - materialized mode drift
    - result byte tamper
    - missing result
    - reordered event
    - unexpected output
    - non-owned path
    - symlink boundary
    - cleanup ownership violation
    - TaskSpec identity drift
    - Environment Snapshot identity drift
    - SystemConfiguration identity drift
    - executable identity drift
    - input identity drift
    - output identity drift
    - RunRecord identity drift
    - child invocation identity drift
    - undeclared child invocation
    - external-effect request
acceptance_criteria:
  - Complete offline preflight passes before any Secret read or Provider request.
  - All 36 preregistered B0/B1/B2 runs complete or retain truthful declared failure, timeout, invalid or exclusion outcomes.
  - Every B2 run records a real exact accepted P0 repository_analysis.scan child invocation.
  - Raw stochastic differences remain retained and deterministic stable projections replay exactly.
  - Independent evaluation uses the frozen task, metric, counting and exclusion rules.
  - Every negative case rejects with its expected stable reason code from a fresh one-time fixture.
  - False accepts, restricted source egress, target mutation, non-owned mutation, undeclared execution, retry and remote, production or public effects equal zero.
  - Exact calls, tokens and latency are reported; unavailable monetary metering remains UNKNOWN_GATEWAY_METERING_UNAVAILABLE.
  - The report states small-sample and provenance limits and makes no superiority, statistical-certainty or production claim.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact Founder packet, Contract, authority, Goal and activation parent identities.
  - Exact accepted input commit, tree, Contract and integration identities.
  - Preflight freeze, materialized inventory, full matrix and zero-Provider gate receipt.
  - Raw 36-run requests, responses, traces, RunRecords, stable projections, evaluator verdicts, replay and rollback receipts.
  - Complete negative matrix raw results and aggregate false-accept/external-effect counts.
  - Exact Provider call, token, latency and available cost accounting without Secret retention.
  - Reproducible baseline report and reproduction entry point.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: DISPOSABLE_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Accepted canonical input, Goal, Founder packet or activation identity drifts.
  - P1-102 or another rejected engineering asset is required.
  - Preflight permits Secret read or Provider use before complete PASS.
  - A required path exceeds this Contract or an unauthorized external effect is required.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, a Secret reaches a prohibited sink, or the Phase boundary changes.
claim_boundary: >-
  One accepted small-sample reproducible B0/B1/B2 empirical baseline over the
  accepted visible synthetic dataset and Founder-attested local gateway only;
  no model superiority, statistical certainty, independent OpenAI provenance,
  P1 exit, P2/P3 entry, production, public, remote, hostile-principal or
  strong-isolation claim.
