quality_freeze:
  order:
    - Freeze interface and result schemas with additionalProperties false and exact enums.
    - Freeze two public-synthetic admitted-slot descriptors and their exact accepted P1-035 TaskSpec identities.
    - Freeze the 16-case matrix, mutation recipes, expected verdicts, reason codes and exit statuses.
    - Freeze the deterministic evaluator, oracle, expected results, ownership map and Quality handoff.
    - Create one Quality Freeze Receipt before the first Worker write.
  receipt_rule: >-
    The receipt does not contain its own hash. It binds the exact Task Contract,
    activation parent, runtime, and every other Quality-owned artifact by path,
    type, byte length and SHA-256. Its authority is the exact tracked blob in the
    Quality freeze commit. After that commit, any Quality-owned byte drift stops
    the Task.
  worker_start_precondition: >-
    Quality Freeze Receipt, ownership map, case matrix, schemas, oracle,
    evaluator and expected results all verify from the Quality freeze commit,
    and the Worker path population is still empty.

admission_interface_contract:
  request_required_fields:
    - schema_version
    - request_id
    - admission_handle
    - expected_task_id
    - expected_task_sha256
    - expected_task_byte_length
    - output_path
  response_required_fields:
    - schema_version
    - request_id
    - admission_handle
    - verdict
    - reason_code
    - exit_status
    - admitted_task
  admitted_task_required_fields:
    - task_id
    - task_spec_path
    - task_spec_sha256
    - task_spec_byte_length
  response_nullability:
    PASS: admitted_task is the exact admitted descriptor
    FAIL: admitted_task is null
  deterministic_encoding: UTF8_JSON_SORTED_KEYS_LF_ONE_TRAILING_LF
  deny_by_default: true

parameterized_harness_contract:
  invocation: >-
    One CLI accepts only a frozen request path, the frozen admission manifest,
    the exact new output path and the external Evidence root. It invokes the
    admission adapter, consumes the returned descriptor, validates the accepted
    TaskSpec, and writes one deterministic normalized run result.
  minimum_parameters:
    - admission_handle
    - task_id
    - task_spec_sha256
    - environment_identity
    - system_configuration_identity
    - repetition_id
    - output_path
  required_output_claim_flags:
    public_synthetic: true
    real_hidden_set: false
    benchmark_claim: false
    agent_capability_claim: false
    included_in_vtsr_denominator: false
  direct_baseline_execution: forbidden
  direct_task_solving: forbidden

output_custody_contract:
  root: EXTERNAL_EXECUTION_EVIDENCE_ROOT_ONLY
  exact_allowed_output: runs/<case_id>/result.json
  create_once: true
  regular_file_only: true
  parent_components_symlink_forbidden: true
  undeclared_sibling_forbidden: true
  preexisting_target_forbidden: true
  all_sacrificial_material: execution/scratch/**

atomic_case_matrix:
  case_count: 16
  cases:
    - case_id: A01_ADMIT_H01
      precondition: frozen valid request for PUBLIC-SYNTHETIC-H01
      single_action: admit the exact declared handle and TaskSpec identity
      expected_verdict: PASS
      expected_reason_code: ADMISSION_ACCEPTED
      expected_exit_status: 0
    - case_id: A02_ADMIT_H02
      precondition: frozen valid request for PUBLIC-SYNTHETIC-H02
      single_action: admit the exact declared handle and TaskSpec identity
      expected_verdict: PASS
      expected_reason_code: ADMISSION_ACCEPTED
      expected_exit_status: 0
    - case_id: A03_UNKNOWN_HANDLE
      precondition: frozen valid request shape
      single_mutation: replace admission_handle with PUBLIC-SYNTHETIC-UNKNOWN
      expected_verdict: FAIL
      expected_reason_code: ADMISSION_HANDLE_NOT_ALLOWLISTED
      expected_exit_status: 20
    - case_id: A04_REQUEST_IDENTITY_DRIFT
      precondition: frozen valid H01 request
      single_mutation: replace expected_task_sha256 with 64 zero hexadecimal characters
      expected_verdict: FAIL
      expected_reason_code: REQUEST_TASK_IDENTITY_MISMATCH
      expected_exit_status: 20
    - case_id: A05_MANIFEST_IDENTITY_DRIFT
      precondition: frozen valid H01 request and sacrificial manifest copy
      single_mutation: replace H01 task_spec_sha256 with 64 zero hexadecimal characters
      expected_verdict: FAIL
      expected_reason_code: ADMISSION_MANIFEST_IDENTITY_MISMATCH
      expected_exit_status: 20
    - case_id: A06_SEMANTIC_PATH_ESCAPE
      precondition: frozen valid H01 request and sacrificial manifest copy
      single_mutation: replace H01 task_spec_path with ../outside.json
      expected_verdict: FAIL
      expected_reason_code: SEMANTIC_INPUT_PATH_FORBIDDEN
      expected_exit_status: 20
    - case_id: A07_SEMANTIC_SYMLINK
      precondition: sacrificial in-root path with the H01 bytes behind a symlink
      single_mutation: replace the regular admitted TaskSpec path with that symlink path
      expected_verdict: FAIL
      expected_reason_code: SEMANTIC_INPUT_SYMLINK_FORBIDDEN
      expected_exit_status: 20
    - case_id: P01_PARAMETERIZED_TWO_SLOT_RUN
      precondition: exact valid H01 and H02 requests
      single_action: run the same harness interface once for each handle with distinct run IDs
      expected_verdict: PASS
      expected_reason_code: PARAMETERIZED_RUNS_RECORDED
      expected_exit_status: 0
    - case_id: O01_EXACT_NEW_OUTPUT
      precondition: declared output parent exists and exact target is absent
      single_action: create the exact runs/O01_EXACT_NEW_OUTPUT/result.json regular file
      expected_verdict: PASS
      expected_reason_code: OUTPUT_CREATED
      expected_exit_status: 0
    - case_id: O02_UNDECLARED_SIBLING
      precondition: exact allowed output remains absent
      single_mutation: replace output_path with an undeclared sibling path
      expected_verdict: FAIL
      expected_reason_code: OUTPUT_PATH_NOT_ALLOWLISTED
      expected_exit_status: 21
    - case_id: O03_OUTPUT_SYMLINK
      precondition: exact allowed output path is a sacrificial symlink and its target is unchanged
      single_action: request creation at the symlink path
      expected_verdict: FAIL
      expected_reason_code: OUTPUT_SYMLINK_FORBIDDEN
      expected_exit_status: 21
    - case_id: O04_OUTPUT_CREATE_ONCE
      precondition: exact allowed output path is a preexisting regular sacrificial file
      single_action: request creation at the existing regular path
      expected_verdict: FAIL
      expected_reason_code: OUTPUT_CREATE_ONCE_VIOLATION
      expected_exit_status: 21
    - case_id: C01_CONTROLLED_RESULT_FAILURE
      precondition: admitted H01 descriptor and sacrificial result copy
      single_mutation: replace normalized task_id in the result with UNDECLARED-TASK
      expected_verdict: FAIL
      expected_reason_code: RESULT_TASK_IDENTITY_MISMATCH
      expected_exit_status: 1
    - case_id: R01_FIVE_REPLAY_EQUALITY
      precondition: frozen valid P01 inputs
      single_action: execute five fresh P01 replays in distinct create-once output roots
      expected_verdict: PASS
      expected_reason_code: FIVE_OF_FIVE_REPLAYS_EQUAL
      expected_exit_status: 0
    - case_id: G01_P1_001_REGRESSION
      precondition: accepted P1-001 bytes and frozen runtime identity
      single_action: execute scripts/verify-p1-harness.sh without changing accepted artifacts
      expected_verdict: PASS
      expected_reason_code: P1_001_REGRESSION_PASS
      expected_exit_status: 0
    - case_id: G02_P1_035_REGRESSION
      precondition: accepted P1-035 bytes and frozen runtime identity
      single_action: execute scripts/verify-p1-task-dataset.sh without changing accepted artifacts
      expected_verdict: PASS
      expected_reason_code: P1_035_REGRESSION_PASS
      expected_exit_status: 0
  singleton_failure_rule: >-
    Every case has one frozen precondition and one action or mutation. A case
    passes only when its exact verdict, one reason code and exit status match;
    aggregate OR outcomes and implementation-selected reasons are forbidden.
  precedence:
    - PATH_TYPE_CONTAINMENT_AND_SYMLINK
    - FROZEN_ARTIFACT_IDENTITY
    - CLOSED_SCHEMA
    - ADMISSION_ALLOWLIST_AND_REQUEST_IDENTITY
    - OUTPUT_CUSTODY
    - HARNESS_EXECUTION
    - EVALUATOR_RESULT_AND_REPLAY

implementation_order:
  - Freeze and commit the final exact Contract on canonical main; do not activate the Task yet.
  - CTO, Security and Quality independently review the same final Contract bytes; any non-PASS permanently stops P1.
  - After three exact PASS reviews, create one phase-delegated authorization and one governance-only Truth activation commit.
  - Create the one Task branch and one Task worktree from the activation commit.
  - Quality authors, validates and commits the complete Quality freeze before any Worker write.
  - Worker implements the admission adapter and parameterized harness without modifying Quality-owned bytes.
  - Integration adds the one verification entrypoint, Makefile target and mechanical code-map update.
  - Run the exact 16-case matrix, five replays, controlled failure, P1-001/P1-035 regressions and make verify.
  - Freeze exactly one candidate, generate Evidence, verify fresh-clone rebuild and rollback, and obtain final CTO/Security/Quality reviews.
  - On three final PASS reviews, Master issues the delegated Task Gate receipt, integrates locally to canonical main, synchronizes Truth atomically for both capabilities and removes Task resources.

