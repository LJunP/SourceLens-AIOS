frozen_population_requirement: >-
  Quality must freeze the exact six-task synthetic conformance Evaluation
  Matrix before Worker implementation. Every matrix_entry_id is identified by
  TaskSpec SHA-256, repository identity, base commit, tree, complete Environment
  Snapshot document SHA-256, SystemConfiguration SHA-256 and repetition_id. A
  display ID alone is never sufficient. Once frozen, population additions,
  removals, substitutions, retries promoted to repetitions or post-output
  exclusions fail closed.

conformance_data_boundary: >-
  Every Quality-owned outcome input is permanently labeled
  fixture_provenance=QUALITY_SYNTHETIC_CONFORMANCE, empirical_run=false,
  benchmark_eligible=false and capability_claim=false. It is a typed test vector
  for the counting algorithm, not a completed RunRecord, baseline execution or
  Patch Evidence Package. Worker outputs and independent verdicts must retain
  these labels and call their aggregate VTSR_COUNTING_CONFORMANCE_EXPECTATION;
  they cannot use VTSR_RESULT, benchmark score or equivalent empirical wording.

attempt_and_denominator_model: >-
  Each matrix_entry_id is one potential denominator contribution and owns a
  predeclared bounded attempt sequence. Every attempt has attempt_id,
  attempt_ordinal, attempt_kind PRIMARY or INFRASTRUCTURE_REPLACEMENT, exact
  matrix_entry_id and optional replaces_attempt_id. Every attempt has exactly
  one create-once terminal fixture outcome. A permitted infrastructure-invalid
  attempt remains in raw results; its replacement has identical frozen Task,
  configuration, environment and repetition identities, does not add a second
  denominator entry and is the only attempt eligible to supply that entry's
  non-invalid result. Duplicate ordinals, unlinked replacement, identity drift,
  multiple non-invalid outcomes or an unbounded replacement chain fail closed.

normative_counting_requirement: >-
  The kernel implements Evaluation Protocol v1.1 Section 7 exactly. Timeout,
  budget exhaustion, crash, missing Evidence, policy violation and ordinary
  system-attributable setup failure count as failures. Retry stays inside its
  scheduled run. Infrastructure-invalid exclusion requires a predeclared
  shared-harness reason, remains in raw results and requires the same
  configuration to be rerun under the frozen attempt_and_denominator_model.
  Synthetic conformance reports include expected numerator, denominator,
  invalid-attempt count, failure count and reason-code distribution without
  claiming an empirical system result.

