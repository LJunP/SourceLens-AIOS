schema_version: 2
record_type: sourcelens_aios_task_contract
task_id: AIOS-P1-001
phase: P1
title: Implement the minimum reproducible Evaluation Harness
status: DRAFT_READY_FOR_FOUNDER_TASK_AUTHORIZATION
execution_authorized: false

objective: >-
  Implement the smallest local Evaluation Harness that loads a versioned TaskSpec,
  EnvironmentSnapshot and SystemConfiguration, invokes a deterministic adapter,
  records observable execution evidence, evaluates the result with a separately
  frozen evaluator, replays the same run, and produces a hash-bound Evidence
  Manifest. This task proves harness conformance only; it does not prove Agent ability.

why_now:
  - P0 is complete and P1 entry is authorized.
  - Repository Intelligence and Agent claims cannot be compared without one reproducible evaluator and evidence path.
  - The previous governance and execution-carrier lineages are terminal and must not block ordinary local harness development.

research_hypothesis:
  statement: A minimal local harness can reproduce one deterministic conformance task and its normalized evaluator verdict from frozen inputs.
  falsifier: Any required input, action, result, evaluator verdict or artifact identity cannot be reproduced, or completion requires expanding into Agent Runtime or Trust Runtime.

claim_boundary:
  proves:
    - one visible synthetic fixture conforms to the harness contract
    - evidence and replay plumbing work for that fixture
  does_not_prove:
    - Direct Model baseline performance
    - SourceLens or Repository Intelligence improvement
    - Verified Task Success Rate
    - real software-engineering Agent capability
    - hidden-set validity
    - production readiness or hostile-principal resistance

source:
  canonical_repository: /Users/lijunpeng/Desktop/cc/project/SourceLens-AIOS
  canonical_branch: main
  task_branch: task/AIOS-P1-001-evaluation-harness
  parent_rule: Create from the accepted post-realignment main commit.
  inherited_source_worktree_write_allowed: false

owner:
  accountable_role: Chief AI Research Agent
  integration_role: Engineering Manager Agent
  worker_role: Evaluation Harness Engineer
  evaluator_owner_role: Quality and Evaluation Agent
  independent_reviewers:
    - Quality and Evaluation Agent
    - CTO Agent
    - Security Agent for declared boundary only

delegated_execution:
  model: TASK_LEVEL_AUTHORIZATION
  founder_approval_granularity: one task envelope, not individual files or commands
  ordinary_implementation_fixes_inside_scope: allowed
  worker_cannot_change:
    - this Task Contract
    - accepted schemas
    - evaluator or oracle bytes
    - acceptance criteria, metrics or permissions
  automatic_successor_or_replacement: forbidden
  escalation_conditions:
    - scope, path, budget, metric or permission expansion
    - use of network, provider, Secret, remote or production capability
    - source identity or evaluator contamination
    - independent review non-PASS after the task budget is exhausted
    - any stop condition

implementation_scope:
  worker_writable_paths:
    - evaluation-harness/harness/**
    - evaluation-harness/adapters/harness_stub/**
    - evaluation-harness/recording/**
    - evaluation-harness/replay/**
  integration_writable_paths:
    - scripts/verify-p1-harness.sh
    - Makefile
  quality_owned_preimplementation_paths:
    - evaluation-harness/evaluator/**
    - evaluation-harness/fixtures/visible/**
    - evaluation-harness/fixtures/oracle/**
  immutable_inputs:
    - docs/aios/tasks/P1-001_EVALUATION_HARNESS.yaml
    - docs/aios/schemas/task-spec.schema.json
    - docs/aios/schemas/environment-snapshot.schema.json
    - docs/aios/schemas/system-configuration.schema.json
    - docs/aios/schemas/run-record.schema.json
    - docs/aios/EVALUATION_PROTOCOL.md
    - docs/aios/BASELINE_ADAPTER_CONTRACT.md
  forbidden_paths:
    - /Users/lijunpeng/Desktop/cc/project/SourceLens/**
    - docs/aios/STRATEGIC_CONSTITUTION.md
    - docs/aios/MASTER_EXECUTION_PROTOCOL.md
    - historical archive and P0 evidence
    - backend-spring/src/main/**
    - analyzer-rust/src/**
    - web-console/src/**

separation_and_freeze_order:
  - Quality and Evaluation Agent creates and freezes the evaluator and oracle fixture before Worker implementation starts.
  - The freeze receipt binds evaluator, oracle, visible input, accepted schemas and Task Contract hashes.
  - The implementation Worker receives those paths as read-only inputs and may write only worker_writable_paths.
  - Engineering Manager owns only integration_writable_paths and cannot alter evaluator or oracle bytes.
  - Any evaluator, oracle, schema or Task Contract change after Worker start stops this Task and requires a separately reviewed decision.

minimum_components:
  quality_owned:
    - frozen deterministic evaluator
    - frozen visible synthetic fixture
    - frozen controlled-failure fixture
    - frozen oracle for the visible conformance fixture
  worker_owned:
    - TaskSpec loader using the accepted read-only schema
    - EnvironmentSnapshot and SystemConfiguration loaders using accepted read-only schemas
    - deterministic HARNESS_STUB adapter
    - bounded command/result recorder
    - normalized RunRecord
    - replay comparator
    - Evidence Manifest generator and verifier
    - controlled failure handling and recording

baseline_plan:
  harness_stub:
    name: HARNESS_STUB
    purpose: validate harness mechanics only
    included_in_vtsr_denominator: false
  future_true_baselines:
    B0: Direct Model with issue text plus frozen bounded textual context; no repository or tool access.
    B1: Model plus simple lexical/file search baseline.
    B2: Model plus SourceLens Repository Intelligence adapter.
  rule: B0, B1 and B2 runs begin only after this harness task passes its own gate and receive a separate experiment authorization.

environment:
  network: disabled
  provider: none
  secrets: none
  input: standalone hash-bound synthetic fixture
  task_worktree_write: exact_owned_paths_only
  canonical_main_write: forbidden
  system_under_test_checkout_write: forbidden
  remote_effects: forbidden
  production_effects: forbidden
  identity_claim: cooperative local development observation, not platform identity or strong isolation

budget:
  engineering_hours: 24
  calendar_days: 5
  implementation_iterations_inside_same_task: 3
  measurement_retries: 0
  new_runtime_services: 0
  new_databases: 0

required_evidence:
  - frozen input and configuration hashes
  - runtime and dependency observation
  - actual commands, cwd, start/end time and exit status
  - stdout/stderr or their hashes
  - primary RunRecord
  - controlled failure RunRecord
  - replay comparison
  - evaluator identity and verdict
  - pre-implementation evaluator/oracle freeze receipt and ownership map
  - Evidence Manifest with artifact checksums
  - source diff and rollback point
  - independent review reports

acceptance_criteria:
  - all contract schemas parse and reject malformed mandatory fields
  - one positive synthetic run completes with complete evidence
  - one controlled failure is recorded as failure and cannot be promoted to success
  - a fresh replay produces the same normalized verdict and artifact identity
  - the harness stub is never reported as B0 or as an Agent capability result
  - Worker and Integration writes are confined to their exact owned paths in the Task worktree
  - canonical main and the synthetic system-under-test checkout remain byte-identical
  - zero network, provider, Secret, remote or production effect
  - Quality, CTO and boundary-scoped Security reviews are PASS

failure_criteria:
  - evidence is incomplete, mutable or cannot be verified
  - replay result differs without a declared nondeterminism policy
  - evaluator or expected output is changed after observing implementation results
  - Worker or Integration writes an immutable or Quality-owned path
  - a forbidden effect occurs
  - the task requires Agent Runtime, Supervisor, Root Custody or platform sandbox work

stop_conditions:
  - budget exhausted without satisfying acceptance criteria
  - source, fixture or evaluator contamination
  - scope or permission expansion required
  - a higher-severity safety or data-integrity issue is demonstrated by direct evidence
  - three implementation iterations fail for the same cause without new evidence

completion_rule: >-
  Completion requires frozen artifacts, independent PASS reviews and Founder Gate.
  Task completion does not authorize B0/B1/B2 runs, P2 entry, production use or remote effects.
