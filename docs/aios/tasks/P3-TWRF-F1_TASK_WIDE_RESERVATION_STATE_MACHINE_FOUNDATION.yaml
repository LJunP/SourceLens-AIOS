acceptance:
  required:
    - The contract freezes states, events, legal and illegal transitions, terminal results and checkpoint results in executable form.
    - The exact old composite-key model produces a reproducible two-winner false accept for same-task different-workflow step-zero competition.
    - The new task-id-only model produces exactly one pre-effect winner and zero loser effects for the same frozen schedule.
    - Every required schedule class and crash boundary executes and is reported with a deterministic case identifier.
    - All six oracle invariants pass over every new-model case, including terminal replay while a later reservation is active.
    - The result verifier independently recomputes report identities and expected aggregate claims without importing benchmark implementation code.
    - Two clean executions are byte-identical after excluding no fields because wall-clock, random and host-specific inputs are forbidden.
    - A closed regular-file inventory binds path, byte length, mode and SHA-256 for every candidate artifact.
    - Product source diff is empty and network, Provider, Secret, credential, Docker, remote, production and public effects are zero.
  independent_review:
    required_role: QUALITY_EVALUATION_AGENT
    review_cycles: 1
    verdicts:
      - PASS
      - NON_PASS
  task_gate: MASTER_ACCEPTS_ONLY_AFTER_INDEPENDENT_QUALITY_EVALUATION_PASS
