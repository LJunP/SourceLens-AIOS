acceptance_criteria:
  - Quality freeze completes before Worker implementation and remains byte-identical afterward.
  - Both selected visible Tasks execute through the same parameterized runner and independently evaluate PASS.
  - Original P1-035 assets remain byte-identical; each execution projection differs at exactly the two allowed pointers.
  - Each EnvironmentSnapshot binds its selected deterministic source commit/tree and matches the projected TaskSpec reference.
  - The adapter never consumes evaluator/oracle/unselected/hidden bytes as declared semantic inputs.
  - The valid public-synthetic opaque hidden handoff is admitted without local Task materialization, adapter/evaluator invocation, RunRecord or VTSR scheduling.
  - All 22 atomic Quality cases match their frozen typed outcome with zero false accepts or replay mismatches.
  - P1-001, P1-011, P1-035, the new P1-037 verifier and complete make verify all PASS.
  - Evidence, fresh-clone rebuild and rollback verification PASS.
  - CTO, Security and Quality independently review the exact candidate and all return PASS.
  - One Task Gate receipt atomically binds HIDDEN_SET_PROTOCOL and PARAMETERIZED_EVALUATION_HARNESS; partial acceptance is false.

failure_criteria:
  - Either integrated capability cannot meet its acceptance criteria.
  - A third TaskSpec projection delta is required or an accepted dependency must be modified.
  - Hidden Task content, path, oracle, expected output or per-Task result appears in a public artifact.
  - Hidden admission triggers local execution or enters a scheduled/VTSR population.
  - A controlled path, symlink, hardlink, population, identity, binding or policy mutation is accepted.
  - Replay differs on any deterministic projection field.
  - Evidence cannot bind inputs, implementation, commands, evaluator output and candidate identity.

stop_conditions:
  - Any write occurs outside the exact role-owned paths or Task Evidence root.
  - Any historical or accepted immutable asset changes.
  - Real or historical hidden material is read, enumerated, created, restored or reused.
  - Network, Provider, Secret, remote, production or public effect is required or observed.
  - B0, B1, B2 or A0 execution, P2/P3 scope or a deferred Trust Runtime capability becomes necessary.
  - Scope, path, permission, role or budget expansion is required.
  - The same implementation root cause remains after two iterations without new Evidence.
  - Any final contract review remains non-PASS after the one bounded correction.
  - Any final candidate review, replay, rebuild or rollback is non-PASS.
  - A real architecture root prevents the integrated slice; the route then stops permanently and escalates Founder without a successor.

rollback:
  method: >-
    Before Task Gate, delete the unmerged Task worktree and branch after binding
    the terminal Evidence. After a PASS candidate but before local integration,
    retain the activation parent as the rollback anchor. After local fast-forward,
    verify that resetting a disposable clone to the activation parent restores
    the exact pre-Task tree; do not rewrite canonical history.

forbidden_actions:
  - create, read, enumerate, restore or reuse real or historical hidden material
  - reuse P1-036 Contract, candidate, fixture, partial implementation, nonce, branch, worktree or failed Evidence
  - modify accepted P1-001, P1-011 or P1-035 assets
  - Worker modification of Quality-owned schemas, fixtures, oracle, evaluator or freeze receipt
  - semantic-input repository wildcard reads or runtime discovery of extra semantic inputs
  - symlink, hardlink or special-file input artifacts
  - untracked private, offsite or historical Evidence as execution input
  - network, Provider, Secret, remote, production or public effect
  - B0, B1, B2 or A0 execution
  - benchmark, VTSR, Agent capability, true hidden-set secrecy/quality/custody, P1 completion, P2/P3 or production claim
  - Supervisor, Root Custody, Strong Isolation or hostile-principal resistance work
  - partial acceptance of either integrated capability
  - retry, resume, successor, replacement or correction chain

claim_boundary: COOPERATIVE_LOCAL_PUBLIC_SYNTHETIC_HIDDEN_ADMISSION_AND_PARAMETERIZED_HARNESS_REPRODUCIBLE_INTEGRATION_ONLY_NO_REAL_HIDDEN_SET_SECRECY_REPRESENTATIVENESS_HOSTILE_PRINCIPAL_PRODUCTION_P1_EXIT_P2_OR_P3_CLAIM

delegated_authority:
  phase_local: true
  task_gate_owner: MASTER_CEO_AGENT
  founder_gate: RESERVED_DECISIONS_ONLY
  founder_reserved_decisions: []
  external_effects:
    network: false
    provider: false
    secret: false
    remote: false
    production: false
    public: false
