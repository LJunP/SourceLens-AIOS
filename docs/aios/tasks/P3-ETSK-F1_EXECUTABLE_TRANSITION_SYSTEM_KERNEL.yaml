objective:
  statement: >-
    Build one deterministic executable transition-system Foundation in the
    evaluation harness so that the machine specification is the sole semantic
    source, the interpreter mutates state only through the declared transition
    relation, and an independent verifier can replay every event from the exact
    initial state and fail closed on semantic corruption.
  phase_value: >-
    Freeze a falsifiable state-machine and oracle contract for the later
    task-wide transactional Product Task without changing product source.
  success_claim: EXECUTABLE_TRANSITION_SYSTEM_KERNEL_FOUNDATION_ACCEPTED
  progress_credit_on_pass:
    p3_delivery_percent: 0
    p3_strict_exit_percent: 0
    governance_percent: 0

