acceptance_criteria:
  - A real accepted scanner executes against the fixture in two physically independent repository roots.
  - The complete raw pilot transaction can be independently replayed to the same byte-exact result.
  - Repository-root-independent graph bytes are equal across the two roots while physical provenance remains truthful and distinct.
  - The graph includes the declared symbol and relation kinds with deterministic ordering.
  - Every negative transaction is frozen completely and independently replayable.
  - All declared negative cases reject, false accepts equal zero and all six external effects remain zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes after integration.
