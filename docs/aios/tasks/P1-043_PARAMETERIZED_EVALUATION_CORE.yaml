acceptance_criteria:
  - Quality freezes the complete create-once, hash-bound executable plan and ownership package required above after activation and before Worker implementation.
  - A frozen local matrix expands into a complete, deterministic set of unique scheduled-run identities with exact TaskSpec, system configuration, environment, repetition, evaluator, and budget bindings.
  - The parameterized harness records every scheduled run exactly once and cannot silently add, remove, retry, or reclassify a run after outputs are observed.
  - Observable traces validate every observable category in Evaluation Protocol section 6, including version identities, observations/context references, concise rationale, plans/revisions, tool/policy events, checkpoints/resume, mutations, tests, usage/cost/latency, errors/retries/interventions, and stop reason, without requiring or storing hidden chain-of-thought.
  - The VTSR validator derives independently verified successes, eligible scheduled runs, failures, invalid runs, and reason-code distributions from frozen inputs and independent evaluator verdicts.
  - Timeout, budget exhaustion, crash, missing Evidence, policy violation, and attributable setup failure count as failures; only predeclared shared-infrastructure reason codes may be classified invalid.
  - Every infrastructure-invalid scheduled run remains in raw results with its reason code and is rerun under the identical frozen configuration; this protocol rerun is not a Task execution retry and cannot erase the invalid record.
  - Run-level VTSR includes every scheduled repetition, and any task-level repeated-run result uses the aggregation rule predeclared before outputs are observed.
  - Retry attempts remain inside their original run identity and cannot create a new denominator entry or erase a failure.
  - Controlled failure, invalid-run, duplicate-run, post-hoc exclusion, denominator drift, trace mutation, missing Evidence, false-success promotion, containment escape, symlink escape, Evidence overwrite, and sensitive-value retention probes are rejected with stable reason codes.
  - Fresh deterministic replay reproduces the normalized matrix, run-count projection, trace projection, VTSR aggregate, and Evidence manifest identities.
  - The independent evaluator verdict path remains Quality-owned, separate from Worker runtime, create-once, and non-overwritable; Worker cannot write schemas, oracle, expected results, artifact lifecycle, or final evaluator verdicts.
  - The exact candidate rebuilds from the frozen activation parent and passes Task checks plus repository make verify without network, Provider, Secret, remote, production, or public effects.
  - Rollback removes the unmerged Task worktree/branch and leaves canonical main and historical custody byte-identical.
  - CTO, Security, and Quality final reviews are PASS and the final claim stays within this Contract boundary.

failure_criteria:
  - any scheduled run, trace, evaluator verdict, count, replay result, or manifest identity cannot be reproduced
  - any failure or invalid run can be omitted, promoted, overwritten, or reclassified after outputs are inspected
  - any output escapes its role root, crosses a symlink, overwrites create-once Evidence, or retains a Secret or sensitive value
  - Worker can write Quality-owned schema, evaluator, oracle, expected result, artifact lifecycle, or final verdict bytes
  - implementation requires B0/B1/B2 execution, hidden data, Agent Runtime, P2/P3, or external effects
  - implementation or Evidence uses a failed P1-002 through P1-042 asset or the old Desktop workspace
  - candidate exceeds scope, budget, one-candidate limit, zero-retry rule, or two implementation iterations

stop_conditions:
  - a scope, path, budget, permission, external-effect, or claim-boundary expansion is required
  - Quality freeze cannot separate evaluator/oracle/verdict ownership from Worker runtime before implementation
  - source, fixture, evaluator, historical Evidence, or canonical main contamination is observed
  - the same engineering root cause remains unresolved after the two allowed implementation iterations
  - deterministic replay, rebuild, rollback, or any final independent review is NON_PASS
  - a major security risk or Founder-reserved decision is required

evidence:
  required:
    - frozen final Task Contract, original candidate identity, one bounded-correction binding, and phase-delegated authorization identities
    - create-once Quality executable plan, freeze receipt, ownership manifest, schemas, fixtures, oracle, evaluator identity/version/bytes, expected results, artifact lifecycle, handoff, and writer-map hashes
    - source parent, candidate commit/tree, diff, branch, worktree, and writer-scope evidence
    - matrix expansion, raw failure/invalid records, invalid reruns, repetition aggregation, full observable trace, VTSR count, mutation, replay, rebuild, and rollback results
    - containment/symlink/overwrite/redaction negative-probe results with stable reason codes
    - zero external-effect evidence and final CTO/Security/Quality reviews
    - Task Gate receipt and accepted artifact index

rollback:
