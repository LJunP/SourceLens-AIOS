mandatory_pre_execution_bindings:
  - Contract, Task authority, candidate and Quality Freeze identities
  - exact Task Card path, type, length and SHA-256
  - source identity, immutable base manifest and clean-state policy
  - Environment Snapshot and System Configuration identities
  - actual process architecture matched to the frozen runtime profile
  - absolute executable, realpath, digest, mode, version and architecture probe
  - ordered argv array, exact cwd, explicit non-secret environment and numeric timeout
  - fresh task-owned disposable source and Evidence roots
  - all bindings complete before the first child start or source/output mutation

path_and_evidence_invariants:
  - Resolve every owned root and ancestor component with lstat and realpath containment; no component may be a symlink.
  - Task-controlled inputs and Evidence leaves are regular non-symlink files with nlink one and exact length/hash before trusted read.
  - Host executable identity does not require nlink one, but does require the frozen path, realpath, digest, mode, version and runtime architecture binding.
  - Every output and Evidence leaf is absent before use and created atomically with exclusive create and no-follow behavior.
  - Visible, withheld and replay runs use distinct physical roots and never overwrite, rename, delete or clean a pre-existing object.
  - Completed Evidence is sealed and reverified before replay or review.
  - Canonical source is never a run materialization or mutation target.

required_real_runs:
  visible_conformance:
    timing: BEFORE_CANDIDATE_FREEZE
    actor: Worker under Quality-owned public inputs
    purpose: targeted implementation feedback only
  visible_formal_run:
    timing: AFTER_CANDIDATE_FREEZE
    actor: fresh Quality Admission Actor
    exact_candidate_and_harness_required: true
    candidate_mutation_allowed: false
  withheld_run_a:
    timing: AFTER_VISIBLE_FORMAL_RUN_ON_THE_SAME_FROZEN_CANDIDATE
    actor: the same fresh Quality Admission Actor
    candidate_mutation_allowed: false
  withheld_replay_b:
    timing: AFTER_RUN_A
    actor: fresh independent Quality Replay Actor
    run_a_path_receipt_or_verdict_input_allowed: false
    replay_scope: VISIBLE_FORMAL_AND_WITHHELD_MATRIX_ON_THE_SAME_FROZEN_CANDIDATE
    candidate_mutation_allowed: false
  stable_projection_exact_equality_required: true

required_runtime_evidence:
  - actual executable and argv, cwd, environment profile, timeout, exit code and duration
  - retained bounded stdout and stderr with exact identities
  - source/environment/system-configuration identities
  - typed patch operations, before/after content and patch hash
  - issue-specific and regression test artifacts
  - independent evaluator identity and verdict
  - rollback source identity, path set and clean-state equality
  - hidden commitment verification without withheld bytes in Worker or candidate Evidence

required_evidence:
  - exact Contract, authority, Quality Freeze, candidate and executing-module identities
  - retained visible, withheld A, independent replay B and negative-matrix run artifacts
  - independent evaluator verdicts, stable projection comparison and zero-false-accept receipt
  - exact rollback and six-false-external-effect receipts

minimum_negative_families:
  families:
    - Task Card or commitment substitution
    - path escape, root alias or scope substitution
    - symlink component or task-controlled hardlink substitution
    - base identity, source manifest or dirty-state drift
    - hidden canary, oracle or expected-result leakage into Worker, candidate or visible logs
    - empty patch and apply-without-material-change no-op patch
    - pre-existing output or Evidence leaf
    - actual alternate-architecture invocation before child or mutation
    - sealed artifact, manifest, length or checksum tamper
    - rollback content, path-set, source-identity or clean-state mismatch
    - executable, argv, cwd, env or timeout substitution
    - each of the six forbidden external effects
  false_accepts_allowed: 0

acceptance_criteria:
  - Contract, authority, Quality Freeze, candidate and executing-module identities match exactly.
  - One generic data-driven harness executes the visible and withheld Task Cards without Task-specific code or result-controlled behavior.
  - Worker starts within the first engineering hour and never receives or reads withheld paths or bytes before candidate freeze.
  - The actual process architecture and all source/environment/executable identities fail closed before child start or mutation.
  - The post-freeze visible formal run, withheld run A and independent replay B all use the same exact candidate and retain complete runtime Evidence, independent evaluator verdicts and exact rollback.
  - Run A and independent replay B have byte-equal frozen stable projections while dynamic fields remain outside the projection.
  - All required negative families execute with zero false accepts.
  - Targeted verification and accepted current-baseline regressions pass on one clean committed candidate.
  - One exact candidate receives one fresh CTO, Security and Quality TARGET_VERDICT PASS review cycle.
  - Reviewed and integrated trees are exactly equal and the single post-integration canonical make verify passes.

capability_projection_on_pass:
  accepted_atomic_capabilities:
    - HIDDEN_SET_PROTOCOL
    - PARAMETERIZED_EVALUATION_HARNESS
  strict_p1_completion: RECOMPUTE_FROM_CANONICAL_P1_EXIT_GATE_WITHOUT_PREDECLARED_PERCENTAGE
  complete_p1_exit_claim: false
  p1_070_entry_condition_satisfied: true

claim_boundary: >-
  ONE_LOCAL_SYNTHETIC_VISIBLE_AND_QUALITY_WITHHELD_TASK_COOPERATIVE_ROLE_SEPARATION_AND
  DATA_DRIVEN_OFFLINE_PARAMETERIZED_HARNESS_WITH_REAL_EXECUTION_INDEPENDENT_REPLAY_ZERO
  FALSE_ACCEPTS_AND_EXACT_ROLLBACK_ONLY_NO_COMMERCIAL_SECRECY_HOSTILE_PRINCIPAL_STRONG
  ISOLATION_MODEL_PROVIDER_B0_B1_B2_OBSERVABLE_TRACE_VTSR_BASELINE_REPORT_COMPLETE_P1
  EXIT_P2_P3_PRODUCTION_OR_PUBLIC_CLAIM

candidate_and_review:
  exact_candidates: 1
  final_review_cycles: 1
  post_freeze_repair: false
  reviewer_outputs_separate:
    - TARGET_VERDICT
    - IN_SCOPE_FINDINGS
    - INHERITED_OR_OUT_OF_SCOPE_OBSERVATIONS
  gate_relevance: >-
    A finding blocks only when the exact candidate adds or worsens it, or the target
    execution path directly depends on it; the finding reproducibly affects this
    Task claim, identity, offline permission, independence, Evidence or rollback;
    and candidate-to-risk causality is established. Unmodified unrelated baseline
    defects are recorded but cannot start a governance remediation chain.
  non_pass_effect: TERMINAL_TASK_AND_ROUTE_STOP_NO_CORRECTION_REPLACEMENT_OR_SECOND_REVIEW

integration:
  precondition: CTO_SECURITY_QUALITY_TARGET_VERDICTS_ALL_PASS
  method: ONE_LOCAL_SQUASH_COMMIT
  reviewed_tree_must_equal_integrated_tree: true
  canonical_full_make_verify_invocations: 1
  make_verify_nonpass: NON_DESTRUCTIVE_GIT_REVERT_AND_TERMINAL_ROUTE_STOP
  post_gate_truth_sync:
    - update canonical Truth and mechanically regenerate Project Code Map
    - run targeted Truth and Code Map checks only
    - do not run a second full make verify

rollback:
  run_level: Restore the exact source bytes, path set and clean identity inside the disposable run root; remove only objects proven task-owned.
  candidate_level: Preserve a NON_PASS candidate, tag and Evidence without integration or repair.
  integrated_level: Use non-destructive git revert of the exact integration commit; never reset or clean.

stop_conditions:
  - baseline, Goal, route packet, Contract or authority identity drift
  - historical or rejected engineering bytes are read or reused
  - hidden bytes, paths, oracle or expected result leak to Worker or candidate
  - Task-specific hardcode or inability to switch inputs through frozen data
  - actual architecture or another mandatory identity is not bound before child start or mutation
  - shell, free-form, dynamic-module or result-controlled execution
  - any negative family false accepts, replay differs or rollback is not exact
  - an external effect, Evidence damage, budget overrun or Phase boundary change
  - any final Reviewer TARGET_VERDICT NON_PASS
  - reviewed/integrated tree mismatch or canonical make verify NONPASS

forbidden_actions:
  - repair, retry, recover or reuse P1-068 or another terminal Task
  - create correction, successor, replacement, normalization, closure or remediation chains
  - configure API keys, network, Provider, Secret, remote, production or public effects
  - build P2/P3 or higher-phase systems
  - push, open a pull request, release or modify a remote
  - count Contract, Evidence, reviews, hashes or documentation as engineering progress
