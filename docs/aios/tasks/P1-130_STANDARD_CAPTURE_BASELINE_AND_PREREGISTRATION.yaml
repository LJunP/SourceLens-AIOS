stop_conditions:
  - Canonical start, Goal, Founder packet or accepted P1-129 identity drifts.
  - G0 cannot pass within the initial implementation and sole code-only repair.
  - The same normalized root cause repeats in adjacent iterations.
  - Secret bytes reach any prohibited sink.
  - Any non-loopback, DNS, proxy, redirect, fallback, retry, excess request, token or monetary effect occurs.
  - Any Evidence is overwritten or deleted, or any non-owned path is mutated.
  - The implementation and sole repair are exhausted.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Long-term Goal, P1 Objective, Exit Gate, Phase boundary, remote, production or public permission changes.
