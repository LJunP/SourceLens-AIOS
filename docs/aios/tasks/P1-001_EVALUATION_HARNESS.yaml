evidence_class_and_actual_execution_registry:
  policy: frozen-inputs/evaluation-policy-v10.json
  classes:
    calibration:
      id: PRE_EXECUTION_CONTRACT_CALIBRATION_ONLY
      denominator_eligible: false
      reclassification_forbidden: true
    actual_validator_test_vector:
      id: PRE_EXECUTION_ACTUAL_VALIDATOR_TEST_VECTOR_ONLY
      denominator_eligible: false
      reclassification_forbidden: true
    actual_scheduled_execution:
      id: P1_001_ACTUAL_SCHEDULED_EXECUTION
      denominator_eligible_only_after_exact_founder_start_authorization: true
  actual_matrix: [B0-primary, B0-replay, B2-primary, B2-replay]
  denominator_units: [B0, B2]
  acceptance_path: >-
    The actual path requires a Human-Founder Ed25519 signature under the frozen
    public key and namespace. The signed record binds the exact contract SHA,
    commit, tree, freeze receipt, five-review post-review seal, validity window,
    nonce, four exact slots and zero exclusions. The frozen preflight launcher
    admits each slot once into a fixed supervisor ledger; the actual validator
    derives that ledger from the signed nonce and rejects direct execution,
    replay, unknown fields, missing or extra attempts, and omitted FAIL,
    INVALID or ABORTED outcomes. Calibration and validator test-vector
    identities remain denominator-ineligible. The worker must not be able to
    write activation or supervisor-ledger roots; absent independently verified
    isolation, execution remains forbidden even with a valid signature.

