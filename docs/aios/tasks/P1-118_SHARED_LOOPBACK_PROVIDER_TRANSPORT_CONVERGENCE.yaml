architecture_constraints:
  - The only real Provider network primitive lives in evaluation-harness/adapters/shared-loopback-provider, not beneath evaluation-harness/harness.
  - The integration-owned evaluation-harness/harness/authorized-network-surfaces.json is the data-driven canonical allowlist for direct network primitives; it cannot bind a Task ID or nonce.
  - Experiment harnesses call the shared adapter and do not own direct network clients.
  - The shared adapter requires the exact active Founder profile, endpoint, model and request budget.
  - The transport never follows redirects, uses proxies or performs DNS resolution.
  - Secret material is read only after offline preflight, never serialized and overwritten after the bounded session.
  - HTTP error evidence retains only bounded, recursively redacted safe fields plus raw byte length and digest.
  - Successful responses are accepted only after strict status, content type, size and response-structure validation.
  - Token or cost fields absent from the gateway remain UNKNOWN and are not coerced to zero.
  - All retries, substitutions, non-loopback endpoints and unapproved external effects fail closed.
quality_freeze:
  offline_positive_matrix:
    - Exact packet, Truth, Contract and authority profile identities agree.
    - Shared transport accepts an injected deterministic response without opening a socket.
    - Safe error classifier retains bounded redacted diagnostic fields and raw response identity.
    - A harness imports the shared transport without declaring a direct network primitive.
    - Accounting records request, retry, connection, latency, token, cost and unknown values.
  offline_negative_matrix:
    - non-loopback host
    - wrong port or path
    - redirect enabled
    - proxy enabled
    - DNS enabled
    - model substitution
    - missing or excess profile
    - request cap zero or exceeded
    - retry request
    - malformed response
    - oversized response
    - non-JSON success response
    - missing completion content
    - Secret in diagnostic error
    - authorization header in diagnostic error
    - restricted source in request
    - direct network primitive beneath an experiment harness
  diagnostic_sequence:
    - Run one minimum safe request using the exact profile.
    - If non-2xx, retain only bounded recursively redacted diagnostic fields and adjust only the request contract.
    - Continue serially within the six-request total until one strict 2xx completion passes or the budget ends.
    - Do not repeat an identical rejected request.
  execution_semantics:
    - Offline preflight and its negative matrix complete before any Secret read or Provider request.
    - Every negative uses an independent one-time fixture.
    - All pre-execution negatives record target execution zero and network connection zero.
    - Exactly one controlled Secret read may serve the complete diagnostic session.
acceptance_criteria:
  - Exact packet, Goal, canonical activation parent, Contract, Truth and authority identities pass preactivation validation.
  - Offline worker self-test and independent negative matrix pass before Secret or Provider use.
  - The canonical legacy harness rejects direct network primitives beneath experiment harnesses.
  - At least one real HTTP 2xx completion from the exact loopback endpoint and model passes strict parsing.
  - Safe diagnostic Evidence proves the actual request-contract convergence without retaining Secret or restricted source.
  - Provider requests are at most six, automatic retries equal zero and successful connections are loopback only.
  - Token and cost accounting are truthful, including UNKNOWN when unavailable.
  - False accepts, non-loopback connections and remote, production or public effects equal zero.
  - Replay and rollback complete from exact retained identities.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - preactivation authority and safety receipts
  - frozen offline matrix and executable identity
  - worker self-test and independent offline negative results
  - pre-Secret pre-Provider receipt
  - per-request safe request, safe response, timing and accounting records
  - bounded redacted HTTP diagnostic classifications
  - successful strict 2xx completion receipt
  - unauthorized direct-network rejection evidence
  - transport replay and rollback receipts
  - exact candidate manifest and evidence tag
  - fresh CTO, Security and Quality reviews
  - reviewed-tree integration identity and one canonical make verify receipt
forbidden_actions:
  - Read, restore, compare, copy or reuse P1-117 Contract, candidate, source, fixture, test, diff or failed engineering asset.
  - Read any other rejected engineering lineage except exact terminal facts explicitly allowed by this Contract.
  - Read Secret or call Provider before the full offline preflight passes.
  - Make more than six Provider requests or any automatic retry.
  - Connect to any non-loopback address, follow redirects, use proxies or perform DNS resolution.
  - Persist Secret or authorization header in repository, Evidence, log, trace, prompt, review or Vault.
  - Egress restricted source, tests, patches, evaluator bytes, governance bytes or hidden material.
  - Modify the Long-term Goal, P1 Objective, P1 Exit Gate or Phase boundary.
  - Enter P2 or P3.
  - Push, modify remote state, or create production or public effects.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain.
stop_conditions:
  - Baseline, Goal, packet, Contract, authority, branch, worktree or clean-state identity drift.
  - Offline preflight or independent negative matrix cannot pass within the two implementation iterations.
  - A Secret is read or Provider request occurs before offline preflight PASS.
  - Six Provider requests are consumed without one strict HTTP 2xx completion.
  - A Secret, authorization header or restricted source reaches a prohibited sink.
  - Any non-loopback connection, redirect, proxy, DNS, retry, remote, production or public effect occurs.
  - Same normalized root cause repeats after the one allowed code-only repair.
  - Required write exceeds the allowlist or changes Phase, Goal, Objective or Exit Gate.
  - Any fresh final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed tree differs from integrated tree.
  - The single canonical make verify returns NONPASS.
  - Evidence is overwritten, deleted or loses exact identity.
claim_boundary: >-
  Cooperative-local shared loopback Provider request/response compatibility,
  bounded safe diagnostic evidence, accounting, replay and rollback only. This
  Task does not prove OpenAI provenance, model performance, benchmark quality,
  production readiness, P1 Exit, P2 entry or any remote/public capability.
