quality_freeze_after_activation:
  owner: Quality and Evaluation Agent
  worker_may_modify: false
  worker_must_start_within_engineering_hours: 1
  freezes:
    - executable Task Card and exact accepted-input identities
    - one common EnvironmentSnapshot, three SystemConfigurations, deterministic conformance-driver inputs and the B2 external truth-binding attestation
    - exact commands, expected canonical projections, common-envelope assertions and replay comparison keys
    - forbidden-feature, cross-contract, execution-safety, Evidence-path and result-spoof negative controls with maximum false accepts zero

minimal_safety_invariants:
  - All repository and external inputs are exact-identity-bound regular nlink-one leaves read through normalized physically contained paths without following symlinks.
  - The adapter executes only the Quality-frozen local conformance driver through one exact absolute Node.js executable; shell, PATH lookup, executable override, stdin program injection and inherited host environment are forbidden.
  - Child argv, cwd, timeout, expected exit, environment allowlist and output identities are validated before execution; cwd and referenced artifacts cannot escape their declared physical roots.
  - B0 has loop_limit one, enables no tools and receives no repository, search, terminal, graph, memory, feedback or hidden-evaluator capability.
  - B1 is one fixed-loop local synthetic driver and may declare only TaskSpec- and EnvironmentSnapshot-allowed file, lexical-search, structured-patch and verification-command capabilities; SourceLens graph, ranker, memory, extra Agent and undeclared network capabilities fail closed.
  - B2 binds only commit 09cf8dd6a1bcee138b949d117804d652000eb7cc and tree daa58725d293b954887dbe5b17aab5219b618658 through the fresh Quality external attestation; the dirty inherited working tree is never an input, an undeclared or unavailable capability is recorded failed or missing, and no capability or successful patch is synthesized.
  - Adapter code never decides verified task success; it emits observable RunRecord and Evidence for a separate evaluator and ignores any driver-supplied success or verdict field as authority.
  - Every Run A and Run B output leaf is atomic, create-once, task-owned, contained, regular and nlink one; pre-existing, symlinked, hardlinked or escaped targets fail closed without unrelated mutation.
  - Quality owns the Task Card, configurations, conformance drivers, expected projections and negative controls; Worker cannot modify or generate those bytes.
  - Run B is a fresh independent execution from the same frozen inputs and exact candidate, not a verdict copied or inferred from Run A.
  - Disposable scratch may be removed only by its creator after exact ownership, containment, device, inode and marker checks; finalized Evidence is never removed.

acceptance_criteria:
  - The frozen matrix contains exactly one B0, one B1 and one B2 conformance entry over the same TaskSpec, EnvironmentSnapshot, response format, budget and evaluator identity; the predeclared adapter configuration and B2 exact snapshot binding are the only treatment differences.
  - The Quality-frozen EnvironmentSnapshot binds the exact TaskSpec source, exact local Node.js executable and a locally present materializable runtime bundle; its container_image_digest is derived from real retained bundle bytes and is not an invented placeholder.
  - Before Worker mutation, Quality produces the successful external B2 truth-binding attestation at the exact declared path; commit, tree, physical source, capability inventory or zero-mutation proof drift fails closed.
  - All four schemas validate and the Baseline Adapter Contract cross-contract preflight passes before any driver is executed.
  - Each adapter invocation actually executes its local deterministic conformance driver without shell or network and retains exact executable, argv, cwd, environment, exit, signal, timeout, duration and raw stdout/stderr byte identities.
  - B0, B1 and B2 enforce their frozen capability boundaries and produce schema-valid RunRecord plus adapter-neutral observable Evidence without adapter-specific success logic; B2 records missing or failed behavior when the attested snapshot lacks an authorized offline task-repair entrypoint.
  - The frozen response format contains no patch bytes, so each independent evaluator result is an expected NON_PASS with PATCH_MISSING; terminal_status completed or a driver success or verdict field never becomes verified task success.
  - Synthetic conformance outputs are explicitly excluded from empirical baseline, VTSR, model, Agent, inherited SourceLens performance and P1 Exit claims.
  - Deterministic projections reproduce byte-for-byte in fresh Worker Run A and independent Quality Run B while nondeterministic physical and timing observations remain retained outside the equality projection.
  - Quality-frozen negative controls cover cross-contract identity drift, forbidden B0 tool or loop, forbidden B1 graph/memory/multi-Agent capability, absent or drifted B2 attestation, un-attested B2 capability, hidden/evaluator/reference-patch data access, malformed argv, cwd escape, executable drift, timeout, expected-exit mismatch, driver success spoof, budget overrun, symlink, hardlink, path escape and pre-existing output with zero false accepts.
  - Targeted verifier, schema/harness regressions, P1-035 accepted dataset regression, P1-048 accepted Experiment Pack regression, P1 safety and Code Map checks pass on the exact candidate before review.
  - Fresh CTO, Security and Quality reviews of the same exact candidate, manifest and Run A/Run B Evidence all return TARGET_VERDICT PASS before Task Gate.
  - Only after candidate Task Gate, the exact reviewed tree is fast-forward integrated into local canonical main; tree equality is verified and one clean canonical full make verify passes before terminal Task acceptance.

required_evidence:
  - exact Contract, authority record, Quality Task Card, fixture, accepted-input and candidate identities
  - actual Worker Run A raw execution artifacts and deterministic projections for B0, B1 and B2
  - executable negative-control results with expected reason codes and zero false accepts
  - fresh independent Quality Run B raw artifacts and exact deterministic-projection comparison
  - targeted verifier and declared regression results
  - fresh CTO, Security and Quality exact-candidate target verdicts
  - integration tree equality, clean canonical make verify and Task Gate receipt

rollback:
  run_level: Preserve finalized Evidence and remove only disposable scratch whose exact create receipt, ownership and physical containment still match; any mismatch performs zero deletion.
  candidate_level: Do not integrate a NON_PASS candidate; retain Evidence and an Evidence tag, then remove only the verified clean task worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence; do not reset or clean.

stop_conditions:
  - Worker has not started within 1 engineering hour after activation.
  - The exact accepted TaskSpec, schema, Baseline Adapter Contract, Quality fixture, runtime executable or source identity drifts.
  - Quality cannot produce the exact real local runtime materialization identity or successful external B2 snapshot attestation before Worker start.
  - Worker modifies or semantically contaminates Quality-owned driver, oracle, expected projection, Task Card or independent verdict bytes.
  - Any adapter accepts a forbidden capability, trusts a driver success field, hides a failed execution, escapes its path or overwrites Evidence.
  - Fresh Run B cannot reproduce the declared deterministic projection from the same frozen inputs and exact candidate.
  - One bounded same-Task repair is consumed and the exact candidate remains TARGET_NON_PASS.
  - The 24 engineering-hour, 8 calendar-day, one-correction, one-repair or one-candidate bound is exhausted.
  - A Provider/model, network, Secret, mutable inherited working tree, remote, production, public, empirical baseline or another Founder-reserved expansion is required.

forbidden_actions:
  - reading, restoring, retrying or reusing P1-049 candidate, implementation, Quality, Run or Review bytes
  - reading, restoring, retrying or reusing any historical rejected or terminal engineering, Quality, Review or Evidence asset body
  - changing the P1 Exit Gate, Phase route, Founder policy, authority-validator semantics or frozen schemas
  - creating successor, replacement, normalization, closure, feasibility, remediation or Route V2 or V3 work
  - network, Provider, Secret, dependency download, remote, production or public effects
  - push, pull request, release or remote mutation
  - P2 or P3 entry, Agent Shell, model-initiated canonical write, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime work
  - claiming a real B0/B1/B2 baseline, model or Agent performance, VTSR, superiority, inherited SourceLens capability, P1 Exit, production or hostile-principal security result from this Task

