host_execution_binding:
  must_complete_before:
    - first_child_process_start
    - first_source_materialization_mutation
  required_runtime_fields:
    - absolute_process_exec_path
    - executable_realpath
    - executable_byte_length_and_sha256
    - executable_mode_uid_gid_and_current_user_writability
    - runtime_version
    - runtime_reported_executing_architecture
    - platform
    - content_derived_binary_format_and_architecture_set
  binding_rules:
    - The runtime-reported executing architecture must be a member of the executable-content architecture set.
    - Thin Mach-O, fat Mach-O and ELF identities must be parsed directly from executable bytes without spawning a helper child.
    - Unknown, truncated, inconsistent or unsupported executable identity fails before any child or source mutation.
    - Every later action and mutation record binds the exact host-identity digest.

trace_contract:
  protocol_source: EVALUATION_PROTOCOL_V1_1_SECTION_6
  hidden_chain_of_thought_recorded: false
  required_observable_groups:
    - run_task_agent_model_prompt_and_tool_versions
    - observations_and_selected_context_references
    - concise_decision_rationale
    - plans_and_plan_revisions
    - tool_requests_policy_decisions_inputs_outputs_exit_codes_and_duration
    - checkpoints_and_resume_events
    - file_mutations_and_patch_hashes
    - tests_and_independent_verifier_results
    - token_cost_and_latency_accounting
    - errors_retries_human_interventions_and_stop_reason
  not_applicable_rule: >-
    Offline model, prompt, token and monetary fields remain present with closed
    explicit NOT_APPLICABLE or exact zero-valued accounting; omission is forbidden.
  integrity_rule: Raw stdout and stderr bytes remain separate immutable artifacts bound by length and SHA-256.

minimal_safety_invariants:
  - Canonical source is never a run materialization, patch target or Evidence output root.
  - Every run uses a fresh atomically created task-owned disposable source root and Evidence subroot.
  - No pre-existing file, directory, symlink or hardlink is overwritten, followed, renamed, removed or cleaned.
  - Input and Evidence leaves are contained, regular, non-symlinked, nlink one and exact-identity bound.
  - The accepted finite typed compiler is the only source-mutation compiler; proposal text, free-form code, diffs, ASTs, dynamic modules and result-controlled argv/cwd/env are never executed.
  - Run B is physically distinct, directly reexecutes frozen inputs and does not consume Run A receipt, verdict, projection path or success field.
  - Raw physical variation is retained; equality compares only the frozen stable semantic projection.
  - Every mutating run restores exact preimage bytes, frozen base commit/tree semantics and clean state.
  - Network, Provider, Secret, remote, production and public effects remain false.

negative_case_families:
  - missing_unknown_duplicate_or_wrong_type_trace_field
  - trace_event_order_gap_duplicate_or_reference_mismatch
  - host_identity_missing_or_not_first
  - child_or_source_mutation_before_host_binding
  - executable_path_realpath_hash_length_mode_or_writability_tamper
  - runtime_architecture_or_content_architecture_set_mismatch
  - unsupported_or_truncated_binary_identity
  - task_source_environment_tool_or_finite_result_identity_drift
  - input_path_escape_symlink_hardlink_type_or_nlink_drift
  - output_preexistence_path_escape_symlink_hardlink_type_or_nlink_drift
  - stdout_stderr_length_or_hash_tamper
  - action_argv_cwd_policy_exit_signal_duration_or_sequence_tamper
  - observation_context_rationale_plan_or_revision_omission
  - checkpoint_resume_mutation_patch_test_or_verifier_omission
  - token_cost_latency_error_retry_intervention_or_stop_reason_omission
  - cross_run_artifact_or_verdict_substitution
  - stable_projection_semantic_drift
  - rollback_omission_or_non_exact_restoration
  - any_external_effect_true

acceptance_criteria:
  - Goal, packet, activation parent, Contract, authority, branch, worktree, Evidence root and accepted input identities remain exact.
  - The implementation is clean-room and does not read, recover, compare, copy or reuse P1-068 or any other terminal/rejected engineering asset.
  - In each real run, host executable and actual executing architecture binding completes before the first child process and before the first source mutation.
  - One visible REP-001 lifecycle actually executes base issue/regression tests, admits one exact finite typed postimage, executes patched tests and restores the exact preimage.
  - The closed trace validates every Evaluation Protocol v1.1 section 6 observable group without hidden chain-of-thought and without missing-field substitution.
  - Run A and fresh independent Run B use distinct disposable roots, retain distinct raw Evidence and produce exact byte-equal frozen stable projections.
  - At least 24 frozen negative cases cover every declared negative family, all reject before forbidden effect where applicable, and false accepts equal zero.
  - Source and Evidence rollback are exact; no pre-existing object or canonical byte is changed by a formal run.
  - Targeted verification, accepted P1-035/P1-055/P1-066/P1-071 regressions, shell syntax and official Code Map check pass on one clean candidate.
  - One exact engineering candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on identical commit/tree and actual Evidence.
  - The reviewed tree equals the locally integrated tree and exactly one canonical make verify passes after integration.

required_evidence:
  - exact activation, Contract, authority, Goal, packet and accepted-input identities
  - Quality freeze manifest, closed schema, Task Card, oracle and negative matrix identities
  - Run A and physically independent Run B raw traces, action streams and stable projections
  - pre-child host executable and executing-architecture binding receipts
  - negative-case results with family coverage and zero false accepts
  - evaluator verdicts, projection equality and exact rollback receipts
  - exact candidate manifest, recoverable Evidence tag and three fresh final Reviews
  - integrated-tree equality and one canonical make verify receipt

rollback:
  run_level: Remove only each exact task-owned disposable source/Evidence subroot after ownership and exact-restoration verification; preserve retained formal Evidence.
  candidate_level: Do not integrate a final NON_PASS candidate; preserve its exact Git identity and Evidence.
  integrated_level: If the single canonical make verify is NONPASS, create one non-destructive git revert commit and terminally stop without reset, clean, retry or repair.
  evidence_rule: Never overwrite, delete, rename or rewrite pre-existing or retained Evidence.

