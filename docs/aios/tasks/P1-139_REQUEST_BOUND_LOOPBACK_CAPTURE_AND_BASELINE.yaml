acceptance_criteria:
  - Every repository allowlisted path is within the frozen P1 Phase role roots before activation.
  - No repository capture, recording or fixtures root is created or written.
  - Exact G0 v3, accepted P1-129 and accepted P1-101 identities pass before source execution.
  - Offline preflight performs zero Secret reads and zero Provider requests.
  - B0, B1 and B2 representative adapter, trace, replay and rollback controls pass.
  - The create-once, tamper, missing, reorder, duplicate, path, symlink and cross-binding negative matrix rejects with zero false accepts.
  - Independent OS-level process, filesystem and network observation is active before any Provider effect.
  - Each Provider response is bound to one exact pre-effect request receipt without ordinal-only inference.
  - Exactly 36 formal cells execute once and all results remain in the denominator.
  - The report is reconstructed from frozen request and response receipts and includes all Evaluation Protocol identities, metrics, failures, costs, uncertainty and reproduction commands.
  - Secret bytes never enter repository, Evidence, logs, trace, prompt, review or Vault.
  - Non-loopback, remote, production and public effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes.

required_evidence:
  - Exact Founder exception packet, token mapping, structured Decision, Goal, Contract, authority and activation-parent identities.
  - Pre-activation Phase role-root check and both canonical authority-entry PASS receipts.
  - Offline preflight and complete isolated negative-matrix records.
  - Independent OS observation setup and result receipts.
  - Create-once request and response receipts for every effected request.
  - Complete 36-cell denominator, RunRecords, traces, replay, rollback and stable projections.
  - Reproducible baseline report and executable reconstruct and verify commands.
  - Exact candidate manifest and fresh CTO, Security and Quality reviews.
  - Integrated-tree equality and canonical make verify receipt.

stop_conditions:
  - Canonical, Goal, Founder Decision, G0, P1-101 or P1-129 identity drift.
  - Any proposed repository allowlisted path is outside the current Phase role roots.
  - Active authority or P1 safety entry returns NON_PASS before source write.
  - Offline preflight reads a Secret, sends a Provider request or produces any network effect.
  - Exact request/response binding requires ordinal-only inference.
  - More than one diagnostic or exactly one 36-cell formal execution is required.
  - Automatic retry, non-loopback network, Secret persistence or an unauthorized external effect occurs.
  - False accepts exceed zero or Evidence is overwritten or deleted.
  - Initial implementation and sole same-Task repair are exhausted.
  - Adjacent iterations repeat the same normalized root cause.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Phase, permission, budget or critical residual-risk expansion is required.

forbidden_actions:
  - Restore P1-137 Task ID, authority or terminal execution lineage.
  - Create or write evaluation-harness/capture, evaluation-harness/recording or evaluation-harness/fixtures.
  - Modify or post-hoc bind P1-130 historical capture.
  - Read, restore, compare, copy or reuse P1-135 rejected engineering assets.
  - Rerun, replace, omit or beautify a formal cell.
  - Persist, hash, log, trace, review or disclose the Secret or Authorization header.
  - Use ordinal-only request/response mapping.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain after P1-139.
  - Use non-loopback network or produce remote, production, public or push effects.
  - Enter or execute P2 or P3.

rollback:
  task_worktree: remove_only_after_terminal_evidence_or_accepted_integration
  canonical_integration: non_destructive_git_revert_on_canonical_verify_non_pass
  evidence: append_only_no_overwrite_or_delete

claim_boundary: >-
  Cooperative-local request-bound loopback capture and reproducible P1
  baseline reporting only. PASS does not establish model generalization,
  production readiness, P2 entry, remote safety or hostile-principal
