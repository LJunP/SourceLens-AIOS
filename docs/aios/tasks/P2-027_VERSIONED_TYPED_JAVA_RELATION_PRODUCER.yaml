architecture_constraints:
  - Preserve the default accepted P1 scan-result v2 interface and behavior.
  - Expose typed relation output only through an explicit versioned opt-in interface.
  - Every relation binds source symbol identity, original target spelling, source span, relation category, resolution status and duplicate/conflict state.
  - Resolution status is exactly one of INTERNAL, EXTERNAL, UNRESOLVED or AMBIGUOUS and is derived from parsed declarations/imports, not from filename guessing.
  - Duplicate/conflict cases are preserved as truthful records rather than silently deduplicated.
  - Run real Java fixtures in at least two physically independent repository roots.
  - Bind exact scanner binary, build receipt, argv vector, process exit, stdout, stderr and raw effect observations.
  - Deterministic replay must be byte-exact and repository-root independent.
  - Do not build the graph kernel, context benchmark, authority system, parser, validator, governance pretask or Evidence platform.
quality_freeze:
  positive_matrix:
    - Default P1 scan result remains schema v2 and byte-compatible for a frozen representative fixture.
    - Versioned typed-relation output covers internal, external, unresolved, ambiguous, duplicate and conflict cases.
    - Two physical roots produce byte-identical normalized typed-relation output.
    - Exact scanner binary, build, argv, stdout, stderr and process lifecycle identities are recorded.
    - Provider, Secret and six external-effect counts are independently reconstructed as zero.
  negative_matrix:
    - unsupported relation schema version
    - missing source symbol identity
    - target spelling mutation
    - source span mutation
    - invalid relation category
    - invalid resolution status
    - missing duplicate or conflict record
    - path substitution
    - scanner binary identity drift
    - argv mutation
    - stdout or stderr mutation
    - process exit mutation
    - replay reorder
    - replay duplicate
    - replay missing record
    - symlink fixture root
  required_counts:
    physical_repository_roots_minimum: 2
    internal_relations_minimum: 1
    external_relations_minimum: 1
    unresolved_relations_minimum: 1
    ambiguous_relations_minimum: 1
    duplicate_or_conflict_relations_minimum: 1
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - Default accepted P1 scanner behavior remains compatible and independently tested.
  - Versioned typed Java relation output records every required semantic field and truthful resolution class.
  - Real cases for every required class are nonzero in frozen Evidence.
  - Two physically independent roots reproduce byte-identical normalized results.
  - All negative cases reject at their intended assertion and false accepts equal zero.
  - Scanner provenance and zero external effects are independently reconstructable from raw Evidence.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder source packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Default scan compatibility receipt and typed relation schema receipt.
  - Two-root real scanner execution receipts including exact binary, build, argv, exit, stdout and stderr identities.
  - Complete positive and negative matrix with intended reason codes and zero false accepts.
  - Deterministic replay and repository-root-independence receipts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
