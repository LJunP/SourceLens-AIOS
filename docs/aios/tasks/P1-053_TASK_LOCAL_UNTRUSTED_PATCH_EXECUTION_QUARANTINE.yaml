title: Task-local Untrusted Patch Execution Quarantine

objective: >-
  Clean-room implement and falsify one exact-host, deny-default, task-local
  quarantine around only each patched-test Node child. The trusted parent owns
  disposable materialization, structural patch admission, patch application,
  Evidence and exact rollback. The untrusted child receives only the declared
  materialization, exact argv, cwd and rebuilt environment, and must not obtain
  network, Secret, canonical, Evidence-root, undeclared host-filesystem, shell or
  descendant-process capability.

why_now:
  - The Founder authorized this bounded architecture route after the prior route proved that text denylisting is not a runtime security boundary.
  - Accepted P1-035 supplies one exact visible control and accepted P1-048 supplies accepted cooperative-local execution, replay, Evidence and rollback patterns.
  - The next falsifiable blocker on the Provider experiment path is whether one exact local runtime can deny the declared effects while executing the safe REP-001 patch.

