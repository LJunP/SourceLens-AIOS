title: Hidden-set Protocol

objective: >-
  Build and mechanically validate a versioned hidden-set access protocol that
  separates implementation roles from hidden task identity, content and oracle
  access. The protocol must support a hash-bound public enrollment receipt,
  bounded evaluation request, custodian-produced aggregate response and closed
  disclosure checks without creating, importing or reading any real hidden
  task. This closes only the P1 hidden-set protocol engineering requirement and
  makes no benchmark, Agent, P2, P3, production or hostile-principal claim.

why_now:
  - HIDDEN_SET_PROTOCOL is the first MISSING capability after the accepted representative Task Dataset in the Founder-frozen P1 Exit Gate order.
  - A visible representative dataset now exists, but unbiased future evaluation still requires a protocol that prevents implementation roles from receiving hidden task or oracle bytes.
  - Parameterized harness and baseline runs need a stable public handshake before any hidden evaluation can be admitted later.

