status: P0_REVIEW_REQUIRED

decision_vocabulary:
  KEEP: Preserve without planned behavior change in the current migration.
  REFACTOR: Preserve useful behavior or evidence while changing boundaries or implementation.
  QUARANTINE: Preserve but prohibit capability claims or mainline dependency until separately proven.
  FREEZE: Preserve in place and stop expansion during the declared phase.
  BUILD_NEW: The required asset does not currently exist and must be created in its assigned future phase.
  CANDIDATE_ARCHIVE: Preserve during P0; archive only after dependency review, regression evidence and Founder approval.

rules:
  - P0 decisions do not delete, move, clean, stash or revert inherited assets.
  - Path scopes are non-overlapping ownership scopes; cross-cutting requirements and future assets do not claim file ownership.
  - CANDIDATE_ARCHIVE is not approval to move or delete a file.
  - Existing functionality remains inherited capability until a phase independently verifies its replacement.
  - A BUILD_NEW asset cannot be represented as complete by relabeling an inherited artifact.

