objective: >-
  Implement the smallest offline-verifiable B0 Direct Model adapter compatibility path.
  It must bind one visible synthetic TaskSpec, ordered bounded textual context,
  response format and deterministic prerecorded response; enforce B0 no-tool,
  single-turn and zero-network constraints; emit a schema-valid RunRecord; record
  observable execution evidence; reject a controlled invalid response; and replay
  the normalized result byte-for-byte. This is real P1 code development, but it is
  adapter conformance only and not a model-performance experiment.

why_now:
  - AIOS-P1-001 Evaluation Harness passed Founder Gate and established the reproducible evidence path.
  - The P1 route requires comparable B0/B1/B2 adapters before real benchmark measurement.
  - B0 is the smallest baseline adapter and can be made locally testable without Provider access.

research_hypothesis:
  statement: >-
    A B0 adapter can enforce exact issue/context/configuration bindings and generate
    reproducible evidence without tools, iteration, network or a live model Provider.
  falsifier: >-
    The interface cannot be validated or replayed without live Provider access,
    modifying accepted schemas, weakening evaluator independence, or expanding into
    Repository Intelligence or Agent Runtime.

claim_boundary:
  proves_if_accepted:
    - B0 configuration and input-binding conformance for one visible synthetic fixture
    - no-tool single-turn adapter invocation through a deterministic offline response transport
    - controlled-failure rejection, replay equality and evidence-manifest verification
  does_not_prove:
    - a live Direct Model run
    - B0 model quality or benchmark performance
    - Verified Task Success Rate or inclusion in its denominator
    - comparison against B1, B2 or A0
    - Repository Intelligence or software-engineering Agent capability
    - hidden-set validity, production readiness or hostile-principal resistance

