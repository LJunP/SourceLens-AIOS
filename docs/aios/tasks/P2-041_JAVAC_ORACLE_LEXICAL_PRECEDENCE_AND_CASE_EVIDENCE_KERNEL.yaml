architecture_constraints:
  - Admit a closed regular-file source and external-symbol inventory before semantic parsing.
  - Bind every source and external input by normalized relative path, type, byte length and SHA-256.
  - Parse only exact admitted Java source bytes using the canonical JavaParser dependency.
  - Model unqualified lookup as ordered tiers and stop at the first non-empty tier.
  - Within the lexical tier, choose the nearest enclosing owner depth before detecting ambiguity.
  - Qualified targets resolve only by exact qualified identity and cannot be rewritten by imports.
  - Explicit imports precede same-package, attested java.lang and wildcard imports for unqualified targets.
  - Multiple candidates in the same winning tier are AMBIGUOUS; no candidates are UNRESOLVED.
  - A missing lexical owner, duplicate declaration or identity drift is a typed fail-closed result.
  - Every legal Java case is compiled by a real local javac oracle with exact argv, version, exit status, stdout and stderr retained.
  - Product and independent consumer must derive their results independently from the same closed case input.
  - Do not build P2-042 graph transactions or run P2-043 benchmarks in this Task.
prefreeze_gate:
  mandatory_cases:
    - nearest nested lexical owner shadows farther owner
    - same nearest lexical tier has real ambiguity
    - single-type explicit import precedence
    - wildcard import precedence
    - qualified target resists same-simple-name import hijack
    - missing lexical owner
    - duplicate declaration
    - unresolved target
    - source mutation
    - source identity drift
    - external inventory drift
  per_case_raw_evidence:
    - exact raw source files and source manifest identity
    - expected semantic tier and typed expected outcome
    - product result
    - independent-consumer result
    - javac oracle argv, version, exit status, stdout and stderr
    - typed verdict and reason
    - every artifact path, byte length and SHA-256 in a closed manifest
  forbidden_shortcuts:
    - JUnit name as Evidence
    - aggregate PASS as per-case proof
    - worker self-reported success field as authority
    - one generic expected result shared across cases
  required_results:
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
    external_effects_all_false: true
acceptance_criteria:
  - Nearest lexical owner precedence and same-tier ambiguity match real javac behavior.
  - Qualified and unqualified lookup precedence is deterministic, typed and fail-closed.
  - Every mandatory case has closed raw Evidence that independently reconstructs product, consumer and javac outcomes.
  - Source mutation, identity drift and external inventory drift are rejected before use.
  - The product and independent consumer agree on every case and the javac oracle agrees on every legal Java case.
  - The complete targeted matrix and independent evaluator pass with zero false accepts.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured decision, Goal, activation parent, Contract and Task authority identities.
  - Closed case inventory and per-case raw Evidence manifest.
  - Exact javac executable identity, version and per-case process receipts.
  - Product and independent-consumer results for every mandatory case.
  - Complete matrix and independent evaluator receipts with truthful counts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality Reviews of the same candidate and Evidence bytes.
