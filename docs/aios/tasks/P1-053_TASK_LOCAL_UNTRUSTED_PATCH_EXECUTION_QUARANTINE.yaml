forbidden_actions:
  - Read, recover, restore, replay, fix, integrate or reuse P1-052 rejected implementation, fixture, evaluator, candidate, Review body or Evidence body.
  - Use patch-content text, regex, token or AST capability denylisting as the runtime security boundary.
  - Access a real Secret, real external address, Provider, remote system, production system or public surface.
  - Modify accepted P1-035 or P1-048 bytes, canonical source outside the allowlist, immutable validators, the P1 Exit Gate, Phase route or capability policy.
  - Introduce Docker, a VM, root entitlement, App Sandbox signing work, dependency download, network transport, broader filesystem permission or a general-purpose sandbox platform.
  - Claim Strong Isolation, hostile-principal containment, sandbox escape resistance, Provider, Agent, P1 Exit, product or production capability.
  - Create a second candidate, successor, replacement, normalization, closure, feasibility, remediation or governance correction chain.
  - Push, open a PR, release, mutate a remote or create any network, Provider, Secret, remote, production or public effect.

rollback:
  run_level: Restore exact source bytes and verify exact frozen base tree, population and clean state inside each disposable materialization.
  candidate_level: Do not integrate a NON_PASS candidate; preserve Evidence and remove only a verified task-owned clean worktree after terminalization.
  integrated_level: Use non-destructive git revert of the exact integration commit and preserve all Evidence.

stop_conditions:
  - The exact sandbox-exec, Apple signature, macOS build, Node or trusted-parent Git identity drifts.
  - The deny-default profile cannot run both positive REP-001 tests while satisfying every frozen denial control.
  - Any formal negative control obtains a forbidden capability, any canary drifts, or any actual external effect occurs.
  - The child observes an undeclared environment key, creates a usable socket, launches a shell or produces any descendant process.
  - Runtime denial depends on a patch-content text, regex, token or AST capability denylist.
  - Docker, VM, root entitlement, App Sandbox signing, dependency download or broader permission is required.
  - An accepted input, Contract, Quality freeze, profile, runner, candidate or Evidence identity drifts.
  - P1-052 or another rejected engineering asset or review or Evidence body is read, recovered or reused.
  - Evidence is overwritten, escapes the task root or cannot prove create-once ownership.
  - Exact rollback, Run A/B stable equality or zero-false-accept requirement fails.
  - The same-Task bounded repair is exhausted, a second candidate is required, or scope, permission, target claim or Phase would expand.
  - Any fresh exact-candidate Reviewer returns TARGET_NON_PASS or the reviewed and integrated trees differ.
  - Canonical make verify returns NONPASS; only non-destructive revert is then allowed and P1-054 remains ineligible.

