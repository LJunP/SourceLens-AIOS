schema_version: 1
record_type: sourcelens_aios_phase_delegated_task_contract
task_id: AIOS-P1-015_RUN_RECORD_RFC3339_TEMPORAL_VALIDATION
phase: P1
title: RunRecord RFC3339 Temporal Validation
status: READY_FOR_PHASE_DELEGATED_EXECUTION
execution_authority: PHASE_DELEGATED
task_kind: EVALUATION_FOUNDATION_ENGINEERING
risk_level: medium

objective: >-
  Implement one deterministic local validator for the RunRecord started_at and
  ended_at fields. It must accept the four frozen valid RFC3339 forms, reject
  the three frozen invalid forms with exact typed outcomes, accept equal
  instants, and reproduce byte-identical normalized output from two fresh input
  materializations. No other RunRecord invariant is claimed.

why_now:
  - The accepted RunRecord schema declares date-time fields, while deterministic evaluation needs a mechanically tested strict timestamp and ordering rule.
  - A small fully covered temporal slice produces accepted engineering evidence sooner than another broad RunRecord contract.
  - This remains local P1 evaluation-foundation work and does not implement a trace runtime, baseline or P3 capability.

task_spec_ref: docs/aios/schemas/run-record.schema.json
read_context:
  - docs/aios/EVALUATION_PROTOCOL.md
  - docs/aios/schemas/run-record.schema.json
  - docs/aios/truth/project_state.yaml
dependencies:
  - AIOS-P1-001

capabilities:
  - RUN_RECORDING
  - DETERMINISTIC_REPLAY
  - EVIDENCE_MANIFEST
capability_claim: false

lineage:
  kind: INDEPENDENT_PHASE_INCREMENT
  retries: []
  remediates: []
  supersedes: []
  note: This Task validates only timestamp syntax and ordering and uses no P1-014 Contract or implementation bytes.

roles:
  accountable_owner: Engineering Manager Agent
  worker: RunRecord Temporal Engineer
  independent_reviewers:
