canonical_manifest_identity:
  json_canonicalization: RFC8785_JCS_UTF8
  path_rules:
    root_relative: true
    separator: "/"
    unicode_normalization: NFC
    ordering: ascending_unsigned_UTF8_bytes
    forbidden:
      - absolute path
      - dot or dot-dot component
      - NUL
      - backslash
      - symlink
      - hardlink
      - device or socket
  entry_schema:
    exact_fields:
      - path
      - byte_length
      - sha256
    byte_length: decimal_integer_of_exact_file_bytes
    sha256: lowercase_SHA256_of_exact_file_bytes
  root_derivation: >-
    Enumerate every permitted regular file except the root-manifest file itself, create
    path/byte_length/sha256 entries, sort by unsigned UTF-8 path bytes, encode the object
    {schema_version:"1",entries:[...]} as RFC8785 JCS with no trailing LF, and SHA-256
    those exact bytes. Store the manifest outside the covered root or exclude its exact
    declared filename to avoid a self-hash cycle.
  mutation_rule: any byte or path change creates a new root and dataset version

deduplication_contract:
  repository_identity_canonicalization: >-
    Lowercase scheme and host, remove a terminal .git, remove default port and trailing
    slash, preserve case-sensitive owner/repository path bytes, and bind the resulting
    UTF-8 NFC HTTPS identity plus exact source commit.
  normalized_patch_fingerprint: >-
    Generate git diff --no-ext-diff --no-renames --unified=0 from base to reference,
    normalize CRLF to LF, sort changed paths by unsigned UTF-8 bytes, emit for each path
    the UTF-8 literal "PATH", one NUL byte, the root-relative path, one LF, then preserve
    only added/deleted content lines after removing index/---/+++/@@ metadata lines, and
    hash the resulting exact bytes with SHA-256.
  pairwise_matrix:
    exact_pair_count: 28
    owner: independent Quality reviewer
    required_fields_per_pair:
      - lower_task_id
      - upper_task_id
      - same_repository
      - linked_issue_evidence
      - shared_commit_ancestry_evidence
      - changed_path_jaccard
      - normalized_patch_fingerprint_equal
      - normalized_content_five_token_shingle_jaccard
      - verdict
      - reason_codes
      - evidence_refs
    thresholds:
      changed_path_or_content_suspected_at_or_above: 0.70
    closed_verdicts:
      - NO_KNOWN_OVERLAP
      - DUPLICATE
      - UNKNOWN
    eligibility_rule: every one of 28 pair verdicts must be NO_KNOWN_OVERLAP

