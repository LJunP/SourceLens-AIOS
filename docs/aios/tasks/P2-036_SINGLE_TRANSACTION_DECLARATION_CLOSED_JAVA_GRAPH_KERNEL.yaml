typed_transaction_contract:
  stages:
    - ADMIT_SOURCE_AND_EXTERNAL_INPUT_IDENTITIES
    - PARSE_RAW_DECLARATION_AND_RELATION_FACTS
    - CLOSE_DECLARATION_TABLE
    - RESOLVE_TYPED_RELATION_TARGETS
    - ADMIT_EDGES
    - VERIFY_NODE_EDGE_SEMANTIC_CLOSURE
    - CANONICAL_SERIALIZE
  declaration_kinds:
    - CLASS
    - INTERFACE
    - ENUM
    - RECORD
    - ANNOTATION
    - LOCAL_CLASS
  relation_kinds:
    - EXTENDS
    - IMPLEMENTS
  target_classifications:
    - INTERNAL
    - EXTERNAL
    - UNRESOLVED
    - AMBIGUOUS
  fail_closed_rules:
    - INTERNAL requires exactly one declaration admitted by the same transaction.
    - EXTERNAL requires exactly one symbol in the exact closed attested external inventory.
    - UNRESOLVED and AMBIGUOUS carry no target identity.
    - Source kind, target kind and relation kind must satisfy the closed compatibility table.
    - Source span, lexical owner chain, local ordinal and binary name must bind one declaration fact.
    - Canonical serialization is unavailable until semantic closure passes.
    - Replay rebuilds declaration and external indices from raw admitted facts before re-resolving every relation.
