architecture_constraints:
  - The real network primitive lives only below scripts/p1-120-capacity-reserved-provider, outside the legacy evaluation-harness direct-network prohibition.
  - The experiment harness invokes the transport as a bounded child and never owns a direct network primitive.
  - Before Secret read or network effect, the transport atomically reserves one request, 8192 input tokens and 2048 output tokens against a create-once route ledger.
  - A reservation is never released or reused after a failed or successful request.
  - The transport uses the literal loopback address only, disables proxy, redirect, DNS, retry and model substitution, and validates the observed peer address and port.
  - Provider usage is UNKNOWN when absent; when present, all fields are non-negative integers, totals are consistent and observed usage stays within the reservation.
  - Only predeclared non-restricted synthetic disclosure bytes may enter a Provider request; repository source, tests, patches, evaluator, Truth, governance and hidden bytes are prohibited.
  - Provider response content is not treated as executable source, a patch or hidden reasoning and is reduced to bounded safe identities before Evidence retention.
  - Every formal run first invokes the accepted canonical B0, B1 or B2 adapter; B2 retains its real exact accepted P0 repository_analysis.scan child invocation.
  - The baseline report describes the exact disclosure-constrained route and must not be presented as a general model-performance or product-readiness result.
  - The preregistration is frozen before aggregate interpretation and does not enter or execute P2.
quality_freeze:
  offline_positive_matrix:
    - Exact packet, Truth, Contract, authority and active Founder profile identities agree.
    - Reservation ledger rejects any request that cannot reserve the complete 8192/2048 ceiling before Secret or network effect.
    - Injected deterministic responses validate without reading Secret or opening a socket.
    - The accepted B0/B1/B2 adapters execute in six distinct A/B configurations and B2 records a real repository_analysis.scan child.
    - Stable projection, replay, rollback and independent aggregate are executable.
  offline_negative_matrix:
    - non-loopback host, peer or port
    - wrong completion path or method
    - redirect, proxy or DNS enabled
    - model substitution
    - request 40
    - retry request
    - insufficient input or output reservation
    - reservation mutation, deletion, reorder or reuse
    - malformed, oversized or non-JSON response
    - non-integer, negative, inconsistent or over-reservation usage
    - Secret-like response bytes
    - restricted source or prohibited sink request
    - missing, reordered or tampered trace event
    - unexpected output or child invocation
    - rollback identity drift
    - denominator deletion, replacement or rerun
  diagnostic_sequence:
    - Use no more than three mutually distinct minimum diagnostic requests.
    - Stop diagnostics at the first strict HTTP 2xx completion.
    - Do not repeat a rejected diagnostic request.
    - Enter the 36-run formal matrix immediately after the first strict diagnostic PASS.
  formal_matrix:
    - Exactly six accepted configurations, B0 A/B, B1 A/B and B2 A/B.
    - Exactly six serial repetitions per configuration for exactly 36 scheduled runs.
    - Every scheduled run enters the denominator exactly once regardless of outcome.
    - Exactly one Provider request is attempted per formal run with no retry.
  execution_semantics:
    - The complete offline preflight passes before any Secret read or Provider request.
    - Every negative uses an independent one-time Task-owned fixture.
    - All pre-effect negatives record Secret reads, target executions and network connections as zero.
    - One controlled Secret read may serve the complete diagnostic and formal session.
acceptance_criteria:
  - Exact packet, Goal, canonical parent, Contract, Truth and authority identities pass both canonical authority and P1 safety entrypoints.
  - Offline worker self-test and independent negative matrix pass before Secret or Provider use.
  - At least one of at most three distinct diagnostics produces a strict HTTP 2xx completion from the exact endpoint and model.
  - Exactly 36 formal B0/B1/B2 A/B runs execute serially and all 36 remain in the denominator.
  - Provider requests equal diagnostics used plus 36 and do not exceed 39; automatic retries equal zero.
  - Every request was preceded by an atomic complete 8192/2048 capacity reservation and total reservations remain inside route caps.
  - Usage is truthfully validated or recorded UNKNOWN, without byte-length or request-max-token substitution.
  - Every B2 run contains a real invocation of exact accepted P0 repository_analysis.scan.
  - Safe request/response identity, RunRecord, trace, stable projection, replay, rollback and independent aggregate all pass exact validation.
  - False accepts, non-loopback connections and remote, production and public effects equal zero.
  - REPRODUCIBLE_BASELINE_REPORT and P2_CONTEXT_ENGINE_PREREGISTRATION are exact, independently recomputable accepted artifacts.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - preactivation authority and safety receipts
  - frozen offline matrix, disclosure contract, preregistration and executable identities
  - worker self-test and independent offline negative results
  - pre-Secret pre-Provider receipt
  - create-once append-only reservation ledger and independent verification
  - per-request safe request, safe response, peer, timing, usage and accounting records
  - all 36 raw run records and traces without denominator editing
  - exact B0/B1/B2 adapter and B2 repository_analysis.scan child identities
  - aggregate report, stable projections, replay and rollback receipts
  - exact candidate manifest and recoverable Evidence tag
  - fresh CTO, Security and Quality reviews
  - reviewed-tree integration identity and one canonical make verify receipt
forbidden_actions:
  - Read, restore, compare, copy or reuse P1-118 branch source, diff, fixture, test, manifest, Contract or failed engineering bytes.
  - Read any P1-118 material except its terminal receipt and safe accounting or trace.
  - Read any other rejected engineering lineage except exact canonical terminal facts.
  - Read Secret or call Provider before complete offline preflight PASS.
  - Make more than three diagnostic requests, fewer or more than 36 formal requests, more than 39 total requests or any retry.
  - Connect to a non-loopback address, follow redirects, use proxies, perform DNS resolution or substitute a model.
  - Persist Secret or authorization header in repository, Evidence, log, trace, prompt, review or Vault.
  - Egress repository source, tests, patches, evaluator, Truth, governance or hidden material.
  - Delete, replace, omit or rerun a scheduled formal result to improve the denominator.
  - Modify the Long-term Goal, P1 Objective, P1 Exit Gate or Phase boundary.
  - Enter P2 or P3.
  - Push, modify remote state, or create production or public effects.
  - Create a successor, replacement, correction, normalization, closure, feasibility or remediation chain.
stop_conditions:
  - Baseline, Goal, packet, Contract, authority, branch, worktree or clean-state identity drift.
  - Complete offline preflight cannot pass within the three implementation iterations.
  - A Secret is read or Provider request occurs before offline preflight PASS.
  - Three mutually distinct diagnostics are consumed without one strict HTTP 2xx completion.
  - A Secret, authorization header or restricted source reaches a prohibited sink.
  - Any non-loopback connection, redirect, proxy, DNS, retry, remote, production or public effect occurs.
  - Same normalized root cause repeats in adjacent implementation iterations.
  - Required write exceeds the allowlist or changes Phase, Goal, Objective or Exit Gate.
  - Any fresh final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed tree differs from integrated tree.
  - The single canonical make verify returns NONPASS.
  - Evidence is overwritten, deleted or loses exact identity.
