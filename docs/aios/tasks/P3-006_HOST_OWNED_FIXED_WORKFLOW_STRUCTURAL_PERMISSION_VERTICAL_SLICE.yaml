    - current canonical Truth and Strategic Constitution v2.6
    - accepted P3-001 product source and accepted receipt
    - current direct Founder P3 route decision
  prohibited_inputs:
    - P3-002 through P3-005 rejected branches or worktrees
    - P3-002 through P3-005 rejected product code, tests or candidates
    - P3-002 through P3-005 evaluators or engineering Evidence
  rejected_lineage_read: false
  rejected_lineage_compare: false
  rejected_lineage_copy: false
  rejected_lineage_reuse: false

stop_conditions:
  - Any write escapes the exact Task worktree or create-once Evidence root.
  - Any network, Provider, Secret, remote, production, public or existing-database capability becomes necessary.
  - The Agent must choose a tool, command, path, permission, transition or step order for the vertical slice to work.
  - The fixed five-state graph must expand or slot 2 behavior is required to satisfy slot 1 acceptance.
  - Candidate generation, same-Task repair or review-cycle budget is exhausted.

claim_boundary: >-
  Acceptance establishes only HOST_OWNED_FIXED_WORKFLOW_STRUCTURAL_PERMISSION,
  raises P3 delivery from 25% to 50%, and unlocks only slot 2. It does not accept
  isolation, complete trace, the strict P3 Exit Gate, P4 entry, production use or
  the Long-term Goal.

