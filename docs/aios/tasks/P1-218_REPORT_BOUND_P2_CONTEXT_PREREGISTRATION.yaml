quality_freeze:
  positive_cases:
    - Exact accepted P1-217 report and acceptance identities pass.
    - The complete preregistration validates and canonicalizes deterministically.
    - Independent reconstruction produces byte-identical stable projection.
  negative_cases:
    - accepted report path, length, hash, commit or tree drift
    - acceptance receipt drift
    - missing, extra or duplicate preregistration field
    - hypothesis, metric, baseline, sample, exclusion, uncertainty or stop-condition mutation
    - P2 execution or external-effect request
  required_false_accepts: 0
acceptance_criteria:
  - The exact accepted report and P1-217 acceptance receipt identities validate before preregistration parsing.
  - The preregistration freezes every required field in a closed machine-readable contract.
  - Independent verification rebuilds the same semantic projection without trusting a Worker PASS field.
  - All negative cases reject with zero false accepts.
  - No P2 experiment is executed and all six external effects remain false.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes after integration.
