  One Founder-authorized cooperative-local operator-owned loopback capture over
  the exact frozen 36-cell B0/B1/B2 A/B matrix, followed by canonical offline
  admission, evaluation, report reproduction and P2 preregistration. No direct
  OpenAI provenance, model superiority, P2/P3 entry, production, remote,
  public, hostile-principal or strong-isolation claim.
