    - main fast-forward or gate-close Truth update
    - B0, B1, B2 or A0 execution
    - VTSR or Agent capability claim
    - P2 or P3 entry
    - network, Provider, Secret, remote, production or public effects
    - Supervisor, Root Custody, strong isolation, Multi-Agent Runtime or full Trust Runtime
    - retry, resume, successor, replacement or correction chain
