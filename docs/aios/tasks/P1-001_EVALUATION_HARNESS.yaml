  founder_private_key_access: forbidden_to_all_agents_and_workers
  founder_execution_start: signed_exact_authorization_required_after_five_review_seal
  preflight_admission: exactly_once_per_matrix_slot_via_frozen_launcher
  activation_and_supervisor_ledger_worker_write: prohibited_and_must_be_technically_verified_before_start
  system_under_test_model_initiated_writes: prohibited
  system_under_test_shell: prohibited
  deterministic_controller_commands: predeclared_argv_only
  evaluator_commands: predeclared_argv_only_in_locked_container
  external_network_requests: 0
  remote_side_effects: 0
  production_access: prohibited
  human_approval_before_candidate_execution: required
  evaluator_invocation: exactly_one_candidate_path_argument_with_base_commit_and_tree_compiled_into_evaluator_v2
  oracle_custody: external_hash_frozen_read_only_not_candidate_mutable

metrics:
  primary:
    name: Reproducible Harness Conformance Rate
    numerator: configurations with schema-valid primary run and normalized fresh replay accepted by the frozen evaluator
    denominator: 2 scheduled configurations
    target: 2/2
  guardrails:
    evidence_completeness: 100_percent
    fresh_replay_success: 2/2
    deterministic_evaluator_agreement: 3/3_per_frozen_output
    source_identity_mismatch: 0
    forbidden_or_unsafe_actions: 0
    unrecorded_tool_actions_or_exit_codes: 0
    post_hoc_exclusions: 0
    external_network_requests: 0
    remote_side_effects: 0
    real_provider_cost_usd: 0
    human_interventions: record_exact_count
    wall_clock_tool_calls_compute_cost: record_all_and_remain_within_budget
  explicitly_not_measured:
    - VTSR superiority
    - repository_intelligence_improvement
    - model_quality_improvement
    - production_reliability
    - hidden_set_performance
    - multi_agent_benefit

budget_boundary:
  maximum_elapsed_engineering_hours: 24
  maximum_calendar_window_days: 5
  maximum_implementation_attempts: 3
  maximum_fixture_tasks: 1
  maximum_adapter_configurations: 2
  scheduled_primary_runs: 2
  scheduled_fresh_replays: 2
  maximum_changed_paths: 33
  maximum_new_runtime_dependencies: 0
  maximum_external_network_requests: 0
  maximum_real_provider_model_cost_usd: 0
  maximum_remote_side_effects: 0
  scope_expansion_requires_new_contract_and_founder_decision: true

required_artifacts:
  - schema-valid TaskSpec, EnvironmentSnapshot, two SystemConfigurations and RunRecords
  - B0 and B2 adapter definitions with exact hashes and narrow claim boundaries
  - raw primary and replay records, observable traces and evaluator inputs/outputs
  - normalized replay specification and artifact checksums
  - exact commands, exit codes, timings, tool calls, interventions and cost
  - immutable failure and invalid-run ledger with reason codes
  - successful RunRecord semantic-validation output and normalized replay identity
  - explicit calibration evidence-completeness validation against evaluation-policy-v8
  - Founder-signed exact-contract execution-start authorization, five-review seal and closed preflight admission registry
  - closed actual execution registry retaining exactly four outcomes including every FAIL, INVALID or ABORTED result and zero exclusions
  - actual-run registry validation against evaluation-policy-v10, including signature, nonce, admission, anti-reclassification and provenance joins
  - evidence manifest and reproduction receipt
  - independent Chief AI Research, CTO, Security, Quality and Product reviews
  - P1 Evaluation Foundation Conformance Report v0.1

success_criteria:
  - Both scheduled configurations run under the same frozen TaskSpec, environment class, budget policy and deterministic evaluator.
  - Reproducible Harness Conformance Rate is 2/2.
  - Both fresh replays reproduce normalized artifact identity and evaluator verdict.
  - Evidence completeness is 100 percent and every retained checksum verifies.
  - Deterministic evaluator agreement is 3/3 for each frozen output.
  - Every successful RunRecord satisfies the frozen semantic policy; schema validity alone is insufficient.
  - Every denominator-eligible RunRecord is classified as P1_001_ACTUAL_SCHEDULED_EXECUTION, is hash-bound by the closed execution registry, and started strictly after exact-contract Founder authorization.
  - Every run is preceded by one unique signed-authority preflight admission; all four admission IDs and outcomes are retained and joined exactly.
  - Calibration and validator test-vector records remain denominator-ineligible and cannot be reclassified.
  - Primary and replay records match the frozen normalized replay field set after only the four declared nondeterministic fields are excluded.
  - Source mismatch, forbidden action, unsafe action, post-hoc exclusion, unrecorded result, network request, real-provider cost and remote effect are all zero.
  - Independent reviewers accept only the narrow conformance claim.
  - The report explicitly makes no superiority, hidden-set, production, P1-exit or general capability claim.

failure_criteria:
  - Either adapter requires an adapter-specific TaskSpec, evaluator or success rule.
  - Either fresh replay fails normalized identity or deterministic verdict reproduction.
  - Any mandatory evidence, raw result, exit code, cost record or checksum is missing or inconsistent.
  - Any forbidden action, source drift, boundary violation, contamination, network or remote effect occurs.
  - Success requires exceeding budget, changing frozen inputs, expanding scope or weakening the oracle after output is observed.
  - Independent review rejects the conformance claim or finds implementation/evaluator coupling.

stop_conditions:
  - This exact contract has not passed all required pre-execution reviews or lacks Founder execution-start authorization.
  - Any frozen source, fixture, environment, evaluator, configuration, scope, ownership, metric, budget or oracle hash drifts.
  - Caller-selected base identity, mutable oracle, semantically false success, incomplete evidence or normalized replay ambiguity can reach PASS.
  - Any calibration or validator test-vector identity can enter the actual execution registry or denominator.
  - The actual 2/2 denominator lacks exactly four registry-bound primary/replay records created after exact-contract Founder start authorization.
  - Founder signature, exact contract/freeze/review binding, validity window, nonce, slot admission, failure retention, zero-exclusion or supervisor-ledger isolation can be bypassed.
  - Fixture provenance, redistribution, representativeness or year-one relevance cannot be defended.
  - A source-identity, secret, license, custody, network, sandbox or evaluator-independence blocker appears.
  - The evaluator or acceptance rule would need to change after adapter output is observed.
  - The task requires real-provider source egress, system-under-test writes or shell, remote repository effects, production access, business-code changes, UI, memory, multi-Agent, or broad runtime work.
  - Evidence cannot be reproduced from the frozen fixture bundle and image digest.
  - Any required guardrail fails and cannot be corrected in scope without weakening the oracle.
  - The 24-hour effort, five-day window, 33-path limit, zero-dependency limit or three-attempt limit is reached.
  - Three consecutive attempts encounter the same blocker without new evidence.

acceptance_criteria:
  - All success criteria pass and no failure criterion occurs.
  - Required artifacts and manifest independently replay from immutable identities.
  - Chief AI Research accepts falsifiability and claim boundary.
  - CTO accepts architecture and scope.
  - Security accepts trust and custody boundaries.
  - Quality and Evaluation independently accepts reproducibility and evidence.
  - Product Intelligence accepts only the fixture's bounded JTBD relevance.
  - Acceptance remains limited to P1-001 conformance and does not pass P1.

required_pre_execution_reviews:
  - Chief AI Research Agent
  - CTO Agent
  - Security Agent
  - Quality and Evaluation Agent
  - Product Intelligence Agent

forbidden_actions:
  - execute implementation, adapter runs or scheduled evaluation before this exact contract is independently accepted and Founder separately starts AIOS-P1-001
  - modify the inherited SourceLens worktree, P0 checkpoint or historical evidence
  - modify business behavior or build a user-facing feature
  - modify frozen fixture, TaskSpec, environment, configurations, evaluator, oracle, metric, budget or success rule after implementation output is observed
  - use hidden tasks or claim hidden-set performance
  - use real-provider source egress or nonzero model spend
  - allow system-under-test model-initiated writes, shell, external network or remote effects
  - claim VTSR improvement, benchmark superiority, production readiness, P1 completion or general capability

founder_decision:
  p1_entry_authorized: true
  contract_preparation_authorized: true
  contract_freeze_accepted: false
  execution_start_authorized: false
  required_next_decision: ACCEPT_OR_REJECT_EXACT_REVIEWED_CONTRACT_AND_START_AIOS_P1_001
