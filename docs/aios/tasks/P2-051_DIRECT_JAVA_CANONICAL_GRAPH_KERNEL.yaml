architecture_constraints:
  - Implement from canonical accepted specifications and accepted P0/P1 assets only.
  - Run the accepted scanner against the same minimal Java fixture in two physically distinct repository roots.
  - Preserve complete raw input, argv, process, stdout, stderr, exit, source, scanner, compiler and result identities.
  - Replay must actually execute from frozen raw inputs and reconstruct the graph; self-reported PASS or prewritten-hash comparison is insufficient.
  - Canonical symbol identity must be repository-root independent and bind file, type, method, field and source-span identities.
  - Relations must include package, ownership, extends, implements and references with internal, external, unresolved or ambiguous endpoint classification.
  - Node and edge ordering and serialized graph bytes must be deterministic.
  - Every negative case must retain its complete independent raw transaction through Evidence freeze and replay.
  - Do not build a parser, authority, validator, governance or Evidence-platform pretask.
