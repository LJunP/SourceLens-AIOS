role_separation:
  quality: freezes schema, positive fixture, mutation matrix and independent oracle before Worker starts
  worker: writes compiler, validator and self-test without importing, executing or copying Quality oracle runtime
  integration: wires one targeted command, candidate manifest, formal runs and canonical lifecycle
  final_reviewers:
    - fresh CTO Reviewer
    - fresh Security Reviewer
    - fresh Quality Reviewer
  implementer_self_acceptance_allowed: false

security_contract:
  json_duplicate_members: reject from raw UTF-8 bytes before JSON.parse or semantic use for every JSON trust-boundary input
  file_open: use O_RDONLY plus O_NOFOLLOW, then fstat the opened descriptor before and after reading; require regular file, nlink 1 and stable device and inode; repository containment and cooperative-local immutable-parent assumptions must be explicit
  paths: absolute repository root plus normalized repository-relative artifact paths; reject absolute artifact paths, parent escape, NUL and symlinks
  output: unique mkdtemp-owned parent, requested output absent, mkdir mode 0700 and file creation with exclusive mode 0400
  cleanup: remove only the exact temporary root created and owned by the current test
  environment: pass only an explicit minimal PATH, LC_ALL and TZ set; never record inherited environment values
  external_effects:
    network: false
    provider: false
    secret: false
    remote: false
    production: false
    public: false
    p2_entry: false
  hostile_principal_or_strong_isolation_claim: false

negative_matrix_minimum:
  count_per_independent_validator: 24
  required_categories:
    - duplicate object member before parse
    - missing and unknown field at top-level and nested object boundaries
    - wrong scalar type, enum, constant and integer bounds
    - missing or shell-string reproduction command
    - absolute path, parent escape, NUL and symlink input
    - accepted input SHA-256 or byte-length drift
    - duplicate or missing run ID
    - numerator greater than denominator
    - success plus failure plus invalid count mismatch
    - post-output exclusion or undeclared invalid reason
    - missing failure taxonomy, limitation, decision or stop rationale
    - benchmark, baseline, VTSR, P1 Exit or product claim widened
    - nondeterministic timestamp or host-specific output injected
    - output file omitted, extra, reordered or tampered
    - manifest identity, sort order or root mismatch
    - pre-existing output, symlink output or unowned cleanup target
    - network, Provider, Secret, remote, production or public permission widened
  false_accepts_required: 0
  unresolved_required: 0

candidate_and_formal_evidence:
  final_candidates: 1
  candidate_freeze_one_way: true
  provisional_manifest_preflight_before_candidate_commit: required
  final_manifest_schema_and_exact_diff_validation_after_candidate_commit: required
  manifest_population: every repository file changed from activation parent to candidate exactly once, lexicographically sorted
  candidate_manifest_exact_top_level_fields:
    - schema_version
    - record_type
    - activation_parent_commit
    - candidate_commit
    - candidate_tree
    - file_count
    - files
    - claim_boundary
  candidate_manifest_exact_per_file_fields:
    - path
    - sha256
    - byte_length
    - git_blob_oid
  candidate_manifest_preflight_identity: use explicit 40-hex provisional commit and tree sentinels, execute the same finite schema and exact diff, hash, byte-length and Git-blob checks in memory before the one candidate commit
  formal_run_a_and_b:
    candidate_identity_equal: required
    frozen_input_identity_equal: required
    roots: two distinct create-once roots under the task Evidence root
    stable_projection_exact_byte_equal: required
    raw_receipts_may_differ_only_in_declared_run_identity_and_root: true
    exact_reproduction_argv_executed: required
    fresh_bundle_rebuilt_before_validation: required
    direct_compiler_substitution_or_preexisting_bundle_validation: forbidden
  final_review_rounds: 1
  corrected_candidate_or_rereview_allowed: false

targeted_commands:
  quality_positive: node evaluation-harness/fixtures/baseline-report-reproduction-v1/quality-oracle.mjs --repository-root ABS --artifact-root ABS
  quality_self_test: node evaluation-harness/fixtures/baseline-report-reproduction-v1/quality-oracle.mjs --repository-root ABS --artifact-root ABS --self-test
  worker_positive: node evaluation-harness/baseline-report/reproduction-bundle-v1/self-test.mjs --repository-root ABS --artifact-root ABS --positive-only
  worker_self_test: node evaluation-harness/baseline-report/reproduction-bundle-v1/self-test.mjs --repository-root ABS --artifact-root ABS
  integration: bash scripts/verify-p1-baseline-report-reproduction-v1.sh

acceptance_criteria:
  - all accepted input identities match and remain unchanged
  - Quality schema bytes are frozen before Worker starts and remain exact
  - both independent implementations execute the finite schema recursively
  - positive input compiles to the exact three-file closed bundle and validates
  - two isolated compilations from identical inputs are byte-identical
  - the emitted argv reproduction entrypoint is resolved without shell evaluation and rebuilds all three files from frozen inputs in a fresh absent root before independent validation
  - Formal Run A and Run B execute that exact resolved argv and reproduce the retained reference bundle, manifest root and stable projection byte-for-byte
  - each independent validator rejects at least 24 reason-bound negatives with zero false accepts and zero unresolved cases
  - provisional and final candidate manifests match their schema and exact Git diff
  - fresh CTO, Security and Quality TARGET_VERDICT values are all PASS on the same candidate bytes
  - integrated tree equals reviewed tree and one canonical full make verify passes
  - Truth states prerequisite accepted, Gate item 7 still NOT_COMPLETE and P1 remains 2 of 8 complete

budget:
  engineering_hours: 8
  calendar_days: 3
  implementation_iterations: 2
  contract_corrections: 1
  same_task_repairs: 1
  candidates: 1
  final_review_rounds: 1

stop_conditions:
  - any Contract reviewer NON_PASS not closed by the one permitted pre-activation correction
  - need for a second Contract correction, second same-Task repair, second candidate or rereview
  - any read, restore, compare, fix or reuse of a forbidden engineering lineage
  - Quality byte drift or candidate manifest preflight or final NON_PASS
  - any final candidate reviewer TARGET_VERDICT NON_PASS
  - reviewed tree differs from integrated tree or canonical full make verify NONPASS
  - actual Evidence overwrite, deletion, unowned cleanup, external effect or scope expansion
  - task output is represented as a baseline result, VTSR observation, model result, P1 Exit or product capability

rollback_contract:
  task_local: all generated bundles use uniquely owned disposable roots; on NON_PASS clean only roots whose owner marker, device and inode match the current run
  candidate: preserve the one exact candidate with a local Evidence tag before any canonical integration; never reset or clean
  integration: if canonical full make verify is NONPASS, use one non-destructive git revert of the integration, preserve all Evidence and terminalize the Task without a corrected candidate or rereview
  external_effects: none exist to compensate because network, Provider, remote, production and public actions are forbidden

next_state_on_pass: ACCEPT_PREREQUISITE_ONLY_INTEGRATE_EXACT_CANDIDATE_RUN_FULL_VERIFY_SYNC_TRUTH_THEN_RECOMPUTE_GATE
next_state_on_nonpass: TERMINAL_ONCE_PRESERVE_EVIDENCE_SYNC_TRUTH_SELECT_DIFFERENT_GATE_OUTPUT
