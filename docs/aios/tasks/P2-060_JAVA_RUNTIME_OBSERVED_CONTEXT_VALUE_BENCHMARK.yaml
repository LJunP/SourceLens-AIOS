acceptance_criteria:
  - Quality freezes one exact six-task dataset identity before Worker mutation, exposes only four DEV tasks to Worker and keeps two validation task issues and oracle bytes sealed until candidate freeze.
  - The formal Worker, orchestrator, observer and independent reconstruction runtime are Java 17 standard-library implementations; Node.js, Hermes and rejected P2 runtime paths are absent from the formal execution closure.
  - An external expected source manifest binds every formal Worker, Evaluator, orchestrator and observer Git path, blob mode, regular non-symlink type, byte length and SHA-256 before any benchmark input is parsed.
  - Runtime admission independently reconstructs the actual candidate commit, tree, clean status, source manifest and working bytes through fixed Git executable observations and rejects caller identity claims.
  - Each actual run preserves raw argv, closed environment, process tree, socket observation, filesystem-write inventory, stdout, stderr and exit status sufficient for an independent consumer to reconstruct six external effects plus Provider and Secret counts.
  - The lexical baseline executes without importing, loading or invoking graph, symbol or treatment-only logic, and both arms use the same source-unit universe, byte budget and denominator.
  - Four public DEV tasks achieve graph aggregate recall strictly greater than lexical recall with no per-task regression, zero forbidden context, byte-exact two-root replay, zero false accepts and all reconstructed effects equal to zero before candidate freeze.
  - Exactly one candidate is frozen and exactly one sealed six-task validation is run; all six tasks remain in the denominator, graph macro recall is strictly greater than lexical macro recall and neither validation task regresses.
  - Fresh CTO, Security and Quality Reviews all return TARGET_VERDICT PASS on the same exact candidate, sealed result and source identities before integration.
  - Reviewed and integrated trees are exact-equal and the single canonical make verify returns PASS; only then may the P2 context-benchmark Exit item become ACCEPTED.
required_evidence:
  - Quality-owned public DEV freeze, sealed validation capsule and create-once freeze receipt with external identities.
  - Candidate source manifest reconstructed from Git and working bytes plus fixed Java, Java compiler, Git and observer executable identities.
  - Raw two-physical-root DEV transactions and independent replay with complete closed inventories and negative-matrix results.
  - Unique candidate commit/tree/diff/source identity and a create-once candidate-freeze receipt.
  - Unique sealed six-task raw transaction, independent evaluation report, effect reconstruction and reproduction command.
  - Fresh exact-candidate CTO, Security and Quality Review receipts.
  - Exact integration/tree-equality and one canonical make verify receipt if and only if all prior gates PASS.
rollback: >-
  Before candidate integration all Task work is isolated to the unique P2-060
  branch/worktree and external Evidence root. If the Task terminally stops, retain
  exact receipts and a content-addressed snapshot, then remove the branch/worktree
  after verifying preservation. If integration verification NONPASSes, use a
  non-destructive Git revert of the exact integration commit.
stop_conditions:
  - A rejected P2 engineering path is read, compared, restored, copied or used as implementation input.
  - Quality cannot prove the two validation tasks and oracle remained sealed from Worker before candidate freeze.
  - The Java runtime/source/observer identity or actual Git candidate binding drifts or cannot be independently reconstructed.
  - The lexical baseline executes graph, symbol or other target-only computation.
  - DEV does not strictly beat the lexical baseline without per-task regression within four total presealed implementation iterations.
  - Any false accept, forbidden context, two-root replay drift, undeclared input or externally reconstructed effect is nonzero or UNKNOWN.
  - A second candidate, second sealed execution or post-sealed repair would be required.
  - Any fresh final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or the one canonical make verify is NONPASS.
forbidden_actions:
  - Read, restore, compare, copy, execute or reuse any rejected P2 source, candidate, evaluator, fixture, test, formal Evidence or runtime transaction.
  - Use Node.js or Hermes anywhere in the formal Worker, orchestrator, observer, evaluator or runtime-environment normalization closure.
  - Access network, Provider, Secret, remote, production or public systems; push, fetch, create a PR, release or deployment; or enter P3.
  - Modify the accepted dataset, oracle, baseline, metric, byte budget, denominator or validation criteria after observing DEV or sealed results.
  - Create a successor, replacement, correction, normalization, closure, feasibility, remediation, authority, governance or general Evidence-platform Task.
claim_boundary: >-
  At most one offline cooperative-local six-task Java-runtime observed context
  benchmark may establish a narrowly accepted P2 context-selection value result.
  Activation, Quality freeze, DEV uplift, hashes, manifests, Knowledge sync or
  negative Research results do not themselves create P2 capability credit,
  production custody, hostile-principal security, P2 Exit or P3 authority.
