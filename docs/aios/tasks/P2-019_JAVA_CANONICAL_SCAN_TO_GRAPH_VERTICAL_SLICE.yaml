architecture_constraints:
  - The canonical scanner remains byte-for-byte unchanged by this Task.
  - The kernel consumes scan-result schema v2 JSON and rejects any other schema, non-Java primary language or malformed closed input fields.
  - Graph node identity is derived only from repository-relative file path, canonical symbol identity, kind and exact source span; repository absolute roots never enter stable output.
  - A resolved edge requires an exact source symbol, relation producer file and line, and one unambiguous Java target producer.
  - Java same-package and explicit-import targets may resolve only when the scanner symbol set proves the exact producer.
  - Repository-wide same-name matching is forbidden; ambiguous, external and unresolved endpoints remain explicitly classified and never become resolved edges.
  - Node and edge ordering, graph serialization and replay are deterministic across two physical repository roots.
  - The independent evaluator reconstructs the graph from raw scanner JSON and independently derives counts and classifications without trusting Worker summary or PASS fields.
quality_freeze:
  positive_matrix:
    - Real canonical scanner invocation over a Java fixture produces the bound raw scan JSON.
    - Same-package and explicit-import relations resolve to exact producer symbols.
    - Two-root scans produce byte-identical canonical graph output.
    - Exact raw-input replay reproduces byte-identical graph output.
    - The executable CLI produces the same bytes as the independently invoked kernel.
  negative_matrix:
    - non-Java primary language
    - unsupported scan-result schema
    - duplicate symbol identity
    - duplicate edge identity
    - ambiguous same-name producer
    - unimported cross-package same-name producer
    - missing source symbol
    - missing producer file or invalid producer line
    - absolute repository-root leakage
    - path escape and symlink input
    - raw-input mutation and identity drift
    - node or edge reorder, missing, extra and mutation
    - incorrect count, false-accept and external-effect summaries
  required_counts:
    languages: 1
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - A real accepted canonical scanner invocation is the source of every positive graph run.
  - The Java graph contains deterministic file and symbol nodes plus only evidence-backed resolved edges.
  - Ambiguous, external and unresolved relations are explicit and cannot be promoted by repository-wide same-name matching.
  - Two-root relocation, exact replay and raw/output mutation rejection are independently reproduced from frozen bytes.
  - The evaluator independently rederives graph semantics, counts, false accepts and effect summaries from raw scanner output rather than Worker control records.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder packet, structured Decision, Goal, activation parent, Contract and authority identities.
  - Real canonical scanner command, source identity, raw stdout/stderr and scan JSON identity for each positive run.
  - Two-root canonical graph bytes, exact replay and independent reconstruction receipts.
  - Closed negative-case ledger with persisted tampered inputs and mechanically derived summaries.
  - Exact candidate commit, tree, tracked diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and exact Evidence.
