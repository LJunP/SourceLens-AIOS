  - Need to modify authority or safety validators, Phase objective, Exit Gate or high-risk permissions
  - Any fresh final Reviewer TARGET_VERDICT NON_PASS
  - Reviewed tree mismatch or canonical make verify NONPASS

forbidden_actions:
