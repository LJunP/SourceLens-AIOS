architecture_constraints:
  - Preserve the accepted scan result contract and expose typed relation projection as a backward-compatible additive field.
  - Java INTERNAL resolution requires package, import, qualified-name and visible-scope producer proof.
  - TypeScript distinguishes relative workspace imports from bare package imports; a bare import cannot bind by repository-wide same name.
  - Rust INTERNAL resolution follows crate, self, super, module and use-path producer semantics.
  - Repository-wide same-name lookup is never sufficient evidence for INTERNAL classification.
  - Unproved endpoints remain explicitly EXTERNAL or UNRESOLVED rather than being promoted to INTERNAL.
  - Embedded absolute repository roots are rejected before projection and relation identity construction.
  - Zero-byte or source-location-free inputs use UNKNOWN location and never fabricate KNOWN_START line one.
  - Repository symlinks escaping the root are rejected before reads or projection.
  - Java, TypeScript and Rust each pass exact two-root relocation and replay-mutation rejection.
  - Every summary is mechanically derived from a closed structured case ledger; no PASS, count, false-accept or effect value is hard-coded.
quality_freeze:
  positive_matrix:
    - Java same-package, explicit-import and fully-qualified internal targets resolve with producer proof.
    - TypeScript relative workspace imports resolve while bare package imports remain external unless a declared workspace mapping proves otherwise.
    - Rust crate, self, super and module paths resolve to exact internal producers.
    - Java, TypeScript and Rust projections are byte-identical across two repository roots.
    - Exact typed projection replay reproduces the same bytes.
    - Existing scan result consumers remain backward compatible.
  negative_matrix:
    - Java unimported same-name symbol in a different package
    - Java ambiguous wildcard or duplicate producer
    - TypeScript bare package import with a repository-local same-name class
    - TypeScript ambiguous relative target
    - Rust unresolved crate or module path
    - embedded absolute repository root in target reference
    - zero-byte source with fabricated known line
    - repository-relative symlink escaping the root
    - path escape and source identity drift
    - projection mutation, missing entry, extra entry, duplicate entry and reorder
    - ledger expected/actual mutation and summary/count drift
    - hard-coded PASS, zero-false-accept or external-effect summary inconsistent with cases
  required_ledger_fields:
    - case_id
    - language
    - fixture_identity
    - source_identity
    - expected_classification
    - actual_classification
    - command
    - exit_status
    - observed_output_identity
    - rejection_reason
    - external_effects
  required_counts:
    languages: 3
    false_accepts: 0
    provider_requests: 0
    secret_reads: 0
acceptance_criteria:
  - The typed projection is produced by the real canonical scanner for Java, TypeScript and Rust fixtures.
  - INTERNAL classification is backed by exact language-scoped producer evidence and never repository-wide same-name matching.
  - Absolute-root leakage, fabricated location and repository-symlink escape cases reject with zero false accepts.
  - All three languages pass two-root relocation, exact replay and projection-mutation rejection.
  - A closed structured case ledger records every positive and negative case and mechanically derives all summary fields.
  - Existing scan contract regression remains PASS and no historical rejected P2 engineering asset is read or reused.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - Reviewed tree equals integrated canonical tree and exactly one canonical make verify passes after integration.
required_evidence:
  - Exact Founder token, structured Decision, Goal, activation parent, Contract and authority identities.
  - Real scanner outputs for Java, TypeScript and Rust positive and negative fixtures.
  - Closed structured case ledger and mechanically derived summary receipt.
  - Two-root relocation, exact replay and replay-mutation rejection Evidence for each language.
  - Symlink escape, zero-byte, embedded-root, ambiguous and same-name cross-binding negative Evidence.
  - Existing scan-contract regression output.
  - Exact candidate commit, tree, tracked diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and exact Evidence.
