architecture_constraints:
  - Open and hold the trusted owned-root directory descriptor before resolving any Evidence object.
  - Resolve every path component descriptor-relatively without following symlinks and without reopening a verified object from an absolute or receipt-supplied path.
  - Pass only a typed verified object handle across the verification-to-consumption boundary.
  - Bind type, device, inode, link count, byte length and SHA-256 before and after every read.
  - Fail closed on same-byte inode replacement, post-verification mutation, intermediate symlink, ancestor rename or replacement, external hardlink, concurrent churn and cross-transaction substitution.
  - Enforce create-once finalization, closed inventory and exact ownership-ledger cleanup with no undeclared lock or staging residue.
  - Use a small narrow native helper only when the high-level runtime cannot preserve the required descriptor semantics; do not build a new Trust Runtime or isolation platform.
  - Validate the production boundary in at least four fresh owned parent topologies, including a canonical-like root under /private/tmp.
  - Remain fully offline with zero Provider requests, Secret reads and external effects.
