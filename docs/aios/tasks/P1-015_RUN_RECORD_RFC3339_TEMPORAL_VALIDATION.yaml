    - Makefile
  external_evidence:
    - /Users/lijunpeng/Developer/.sourcelens-audit/p1-015-run-record-time-execution-20260716T153000Z/**

frozen_inputs:
  - docs/aios/schemas/run-record.schema.json
  - docs/aios/EVALUATION_PROTOCOL.md

implementation_requirements:
  - Read the eight Quality-frozen UTF-8 JSON inputs, each containing started_at and ended_at string fields.
  - For the accepted Task claim, distinguish exactly the frozen whole-second Z, nanosecond Z, positive-offset and negative-offset valid forms from the frozen missing-timezone and impossible-date invalid forms; behavior for untested timestamp forms remains UNKNOWN_NOT_CLAIMED.
  - Convert both valid timestamps to exact integer nanoseconds since Unix epoch without floating-point arithmetic.
  - Reject ended_at earlier than started_at and accept equality.
  - Emit normalized UTC strings with Z and exactly nine fractional digits plus non-negative duration_ns as a decimal string.
  - Emit exactly one closed JSON result plus LF on stdout and no stderr for expected PASS or FAIL.
  - Demonstrate byte-identical output from two physical copies of the same valid input.

quality_freeze:
  must_complete_before_worker_start: true
  freeze_commit_position: first_commit_after_activation_on_task_branch
  exact_paths:
    - evaluation-harness/fixtures/run-record-time/OWNERSHIP_MAP.json
    - evaluation-harness/fixtures/run-record-time/CASE_MATRIX.json
    - evaluation-harness/fixtures/run-record-time/ORACLE.json
    - evaluation-harness/fixtures/run-record-time/FREEZE_RECEIPT.json
    - evaluation-harness/fixtures/run-record-time/cases/Q01.json
    - evaluation-harness/fixtures/run-record-time/cases/Q02.json
    - evaluation-harness/fixtures/run-record-time/cases/Q03.json
    - evaluation-harness/fixtures/run-record-time/cases/Q04.json
    - evaluation-harness/fixtures/run-record-time/cases/Q05.json
    - evaluation-harness/fixtures/run-record-time/cases/Q06.json
    - evaluation-harness/fixtures/run-record-time/cases/Q07.json
    - evaluation-harness/fixtures/run-record-time/cases/Q08.json
  freeze_receipt_rule: Quality writes FREEZE_RECEIPT.json last, excludes itself from its sorted file manifest, and binds exact Contract hash and freeze commit/tree.
  ownership_rule: Quality owns every run-record-time fixture; Worker reads but never modifies them.

closed_result_contract:
