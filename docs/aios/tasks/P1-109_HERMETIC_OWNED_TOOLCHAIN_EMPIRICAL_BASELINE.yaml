architecture_constraints:
  - Use accepted canonical assets only and never derive implementation from P1-107 rejected bytes.
  - Materialize every writable Cargo, target, HOME, temporary and Evidence path under a fresh Task-owned root.
  - Treat system toolchain and dependency cache only as read-only materialization inputs; runtime resolution may not write or read mutable global package state.
  - Enforce OS-level denial of writes outside the Task-owned root during offline build, analyzer execution, patched-test execution and cleanup.
  - Admit model output only through a closed finite typed source-edit IR; free-form shell, path or source mutation is forbidden.
  - Patched tests execute with network, filesystem-write and child-process creation denied.
  - Reject Secret-like response bytes before hashing, parsing, logging, tracing or persistence.
  - B2 Provider context contains only accepted source metadata and excludes tests, reference patches, evaluator, hidden and governance material.
quality_freeze:
  offline_preflight:
    - Exact accepted P0 analyzer source and all required dependency bytes are materialized inside a fresh Task-owned root.
    - Cargo home, build target, process HOME and temporary directories are all Task-owned.
    - The complete six-task by three-system by two-repetition schedule is frozen with distinct B0, B1 and B2 SystemConfigurations.
    - The OS sandbox denies writes outside the owned root, and the predeclared non-owned sentinel inventory is byte and metadata identical before and after.
    - Secret reads, Provider requests, non-owned mutations and forbidden external effects are all zero.
    - Physical negative fixtures reject request 73, output overwrite, ancestor and leaf symlinks, ledger tamper, undeclared output and every forbidden Secret sink.
  formal_matrix:
    - Execute exactly 36 scheduled runs and issue no more than one Provider request per run with automatic retries equal to zero.
    - Preserve every outcome, including ordinary model failures, and compute VTSR from all eligible runs without deleting or rewriting failures.
    - Retain eighteen deterministic A/B stable projection comparisons while preserving true stochastic differences in raw Evidence.
    - Independently recompute all aggregate metrics, accounting, failure taxonomy, replay and rollback from retained raw records.
acceptance_criteria:
  - One complete offline preflight passes before the first Secret read or Provider request.
  - The complete 36-run schedule executes without retries, missing runs or undeclared executions.
  - All raw request, response, admission, execution, validation, result, replay and rollback Evidence required by the protocol is retained without Secret material.
  - Exactly eighteen A/B stable projection pairs are evaluated and all admissible deterministic projections are exact byte equal.
  - VTSR, false-success classification, token, cost and latency accounting are independently recomputable from retained records.
  - False accepts, undeclared executions, non-owned mutations and forbidden external effects all equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same source and Evidence bytes.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact Founder packet, Contract, authority, Goal and activation-parent identities.
  - Offline preflight receipts, sandbox policy, owned-root inventory and before/after non-owned sentinel identities.
  - Frozen task, profile, repetition schedule and immutable request ledger.
  - Raw 36-run request, response and outcome records with redaction-by-rejection rather than post-write cleanup.
  - Eighteen pair projections, independent recomputation, replay and rollback receipts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and formal Evidence.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: OWNED_DISPOSABLE_ROOT_REMOVAL_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Goal, accepted input, Founder packet, profile, Contract, authority or activation-parent identity drifts.
  - Offline preflight returns NON_PASS or any Secret read or Provider request occurs before it passes.
  - A rejected engineering lineage, path outside this Contract or permission beyond the exact Founder profile is required.
  - An infrastructure or safety failure, non-owned mutation, Secret sink, request 73 or forbidden external effect occurs.
  - The same-Task code-only repair is exhausted or the same normalized root cause repeats in adjacent iterations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the P1 Phase boundary changes.
claim_boundary: >-
  Cooperative-local hermetic owned-toolchain preflight and bounded 36-run
  B0/B1/B2 empirical baseline Evidence only; no independent OpenAI provenance,
  benchmark superiority, P1 exit, P2/P3 entry, non-loopback network, remote,
  production, public, hostile-principal or strong-isolation claim.
