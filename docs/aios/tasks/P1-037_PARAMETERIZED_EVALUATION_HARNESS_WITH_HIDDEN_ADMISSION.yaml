    - V07_THIRD_PROJECTION_DELTA_EXECUTION_PROJECTION_DRIFT
    - V08_REQUEST_HASH_DRIFT_REQUEST_BINDING_MISMATCH
    - H03_HIDDEN_ADMISSION_HASH_DRIFT_HIDDEN_ADMISSION_MISMATCH
    - H04_DIRECT_HIDDEN_FIELD_HIDDEN_DISCLOSURE_VIOLATION
    - H05_NESTED_HIDDEN_FIELD_HIDDEN_DISCLOSURE_VIOLATION
