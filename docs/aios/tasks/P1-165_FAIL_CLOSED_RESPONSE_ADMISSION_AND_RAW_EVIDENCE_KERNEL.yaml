acceptance_criteria:
  - Canonical authority, strict phase predecessor and P1 safety pass before Worker source mutation.
  - Exact accepted-input identities for P1-035, P1-101, P1-129 and P1-149 are verified from canonical bytes and accepted Git ancestry.
  - Real owned held-open loopback calibration proves valid observer PASS and rejects missing, forged, NON_PASS, wrong PID, wrong FD, wrong port, wrong peer, non-loopback, cross-binding and mutated stdout or stderr.
  - Response boundaries cover zero, cap minus one, exact cap, cap plus one, incomplete, truncated, multi-chunk, missing terminal, duplicate terminal and post-terminal bytes.
  - Secret-reflection cases cover exact, prefix, suffix, cross-chunk, split-boundary and binary sentinels without retaining sentinel bytes or hashes.
  - Real-filesystem tests cover owned-root preexistence, path escape, symlink, hardlink, create-once, missing identity, mutation, closed-inventory missing or extra, reorder, duplicate, cross-binding and Evidence-write failure.
  - Production critical reason codes propagate unchanged through helper, child process and wrapper boundaries.
  - Usage boundaries preserve UNKNOWN and validate integer and total consistency.
  - Exact output-token usage 2047 and 2048 are admitted, 2049 is rejected, and the 2048 case completes compiler, owned-copy apply, oracle/tests and rollback.
  - Exactly 36 synthetic cells run across B0, B1 and B2; B2 produces twelve real accepted P0 repository_analysis.scan child invocations.
  - All 36 cells traverse accepted P1-149 and P1-101 replay/rollback paths and preserve causal adapter identities.
  - Reference-answer scanning reports zero leaks.
  - Bounded concurrency proves create-once and accounting without duplicate or missing slots.
  - Worker, observer and Evidence-writer stalls are independently detected with observable progress receipts.
  - Independent raw-only evaluation reconstructs every admission, effect, taxonomy, denominator, verified-success and VTSR claim.
  - All negative matrices produce zero false accepts, zero unsafe persistence and zero unauthorized external effects.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same candidate and raw preflight Evidence.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
  - This Task grants no P1 Exit capability credit and cannot enter P1-166 before its complete Task Gate.
