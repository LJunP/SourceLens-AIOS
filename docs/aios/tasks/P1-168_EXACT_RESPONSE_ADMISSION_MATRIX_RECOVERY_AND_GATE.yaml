architecture_constraints:
  - Case identifiers are labels only and may never be parsed, coerced or regex-derived into numeric stimulus data.
  - Output usage is carried by a closed typed integer field independently from case_id, variant or display text.
  - The exact typed boundaries 2047 and 2048 are accepted, 2049 is rejected, and 2048_FULL_SPINE completes compiler, owned-copy apply, oracle/tests, P1-101 trace/replay and rollback.
  - One complete pre-freeze matrix enumerates and independently executes every frozen case; a large wrapper may not reveal predictable failures one by one across iterations.
  - The five P1-165 roots are explicit regression cases: profile-verification parent, forged-observer empty-row precedence, inventory ordering, non-regular versus hardlink precedence, and typed 2048 full-spine stimulus.
  - Accepted P1-149 and P1-101 behavior is read-only and unchanged.
  - The production helper remains data-driven and tests may not replace it with labels, Worker aggregates or self-reported PASS fields.
  - Response bytes remain in a unique owned transient quarantine until one closed decision validates exact request, cell, Task, profile, repetition, context, transport, observer, usage and Evidence identities.
  - Request, context, observation and transport records use closed exact keysets and reject extra, missing, duplicate, ambiguous or contradictory fields.
  - Independent evaluation reads raw Evidence only and does not trust Worker success, usage, effect, peer, observer, cell-result or aggregate fields.
  - No Secret read, Provider request, non-owned network connection or user-software mutation is permitted.
