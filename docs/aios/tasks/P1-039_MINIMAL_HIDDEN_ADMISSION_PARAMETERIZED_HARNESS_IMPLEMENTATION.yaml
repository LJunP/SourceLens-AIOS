      task_spec_path: evaluation-harness/datasets/p1-representative-task-dataset-v1/tasks/SL-P1-REP-006-DEDUPE-REFACTOR/task-spec.json
  quality_freeze_requirement: >-
    Quality resolves each declared TaskSpec from the accepted P1-035 dataset,
    freezes its exact path, regular-file type, byte length and SHA-256 into the
    admission manifest, and freezes every request/recipe/expected-result byte.
    No implementation-selected path, wildcard semantic input, symlink or
    undeclared sibling is admitted.
  worker_direct_input_rule: >-
    Worker implementation receives public interface schemas and admitted
    descriptors. The parameterized harness must obtain a task descriptor by
    calling the implemented admission adapter; a direct TaskSpec path accepted
    from CLI or an unadmitted handle is a failure.
