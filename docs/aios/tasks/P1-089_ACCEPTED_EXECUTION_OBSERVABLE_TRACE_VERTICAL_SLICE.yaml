implementation_rules:
  - Build only the smallest clean-room P1-089 composition from accepted canonical patterns.
  - Do not import Task-hardcoded P1-048, P1-066, P1-071 or P1-070 implementations into the P1-089 producer or verifier.
  - Ordinary implementation defects stay inside this Task and its one allowed code-only repair.
  - A failed first implementation must preserve a counterexample and normalized root cause before repair.
  - Quality bytes freeze once and are never modified after Worker source mutation starts.
  - Candidate freeze is one-way; post-freeze source repair, second candidate or second review cycle is prohibited.
  - Formal A/B runs must be separate top-level Node processes; an internal helper invoking run A then run B is not acceptable Evidence.
  - Cleanup may remove only exact Task-owned runtime artifacts after identity and inventory verification; Evidence is retained.

acceptance_criteria:
  - Goal, Founder packet, activation parent, accepted substrates, Contract, authority and clean state identities match exactly.
  - Exact cross-contract preflight passes before Worker mutation.
  - Quality freezes one satisfiable closed contract, oracle and independent negative matrix before Worker source write.
  - Two sequential top-level producer processes each create one actor-bound raw run with distinct authority, nonce, actor, runtime root, process and producer receipt.
  - Producer emits no success field, evaluator verdict or self-proclaimed independent-actor proof.
  - Two separate independent verifier processes each recompute and PASS the exact frozen run package without importing producer implementation.
  - A and B public stable projections are exact byte equal while raw actor and process identities remain distinct.
  - Every required observable trace field is present and truthful; non-occurring actions are explicit empty or false and not fabricated.
  - The mandatory negative matrix rejects every case with the frozen reason priority and zero false accepts.
  - Exact source identity, source-unchanged rollback, owned-artifact cleanup, residual zero and all six false external-effect assertions pass.
  - Targeted verification passes on one clean candidate commit.
  - One exact candidate and diff/hash manifest are frozen and preserved by one non-overwriting Evidence tag.
  - Fresh CTO, Security and Quality each return TARGET_VERDICT PASS for the same exact bytes.
  - Reviewed tree equals integrated tree and one canonical make verify passes after integration.

