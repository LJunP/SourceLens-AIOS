implementation_order:
  - Freeze the six source templates, TaskSpecs, coverage declaration, materialization recipe and dataset manifest under the dataset root.
  - Record a Quality-asset freeze receipt before validator implementation begins.
  - Implement the validator and self-test without changing frozen dataset bytes.
  - Run deterministic double materialization, TaskSpec validation, base-failure checks, population checks and mutation rejection.
  - Freeze one candidate, then generate Evidence, independent reviews and a delegated Task Gate receipt.

minimum_engineering_outputs:
  dataset:
    - closed dataset manifest and schema
    - six versioned TaskSpec instances conforming to the accepted TaskSpec schema
    - six standalone synthetic repository templates
    - deterministic Git materialization recipe and expected commit/tree per task
    - explicit development/validation split and declared coverage axes
    - task-local provenance, redistribution and claim-boundary metadata
  validator:
    - closed-schema and exact-population validation
    - TaskSpec schema validation
    - path-containment and symlink rejection
    - manifest SHA-256 and byte-length verification
    - deterministic double Git materialization with exact commit/tree equality
    - base revision clean-state verification
    - required-command base-failure sanity check
    - mutation tests for version, population, identity, split, provenance, path and hash drift

