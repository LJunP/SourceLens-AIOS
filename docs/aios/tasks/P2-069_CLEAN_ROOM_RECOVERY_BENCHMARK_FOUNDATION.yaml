acceptance_criteria:
- The exact accepted source-pack manifest is rehashed before use and every opened source-pack leaf is inventory-bound by relative path, byte length and SHA-256.
- The benchmark manifest contains exactly 12 tasks from 6 repositories with exactly 8 DEV and 4 HELD tasks, and the runner executes only the 8 DEV tasks.
- Each DEV task has an independently reconstructable maintenance query, base source identity, fix identity, production-Java retrieval corpus and production-Java ground-truth file set; tests, generated files and non-Java files are excluded from the scoring universe.
- B0 deterministic token-overlap and B1 deterministic BM25 use the same frozen query, corpus, top-k and UTF-8 byte budget per task, with deterministic path tie-breaking.
- DEV baseline outputs are byte-stable across two clean replays and include per-task recall, precision, reciprocal rank, selected paths, selected bytes and aggregate macro metrics.
- HELD source trees, PR-file payloads and build results are not opened or scored by implementation or DEV replay; only their pre-existing source-pack manifest fields remain in sealed custody.
- No product source changes, network effects, external writes outside the exact Task Evidence root, P3 entry or P2 capability claim occur.
- CTO, Security and Quality/Evaluation checks independently accept the exact candidate and Evidence inventory before the Task Gate is accepted.
required_evidence:
- Create-once source-pack installation binding and full read-set inventory with pre-read expected identity and post-read observed identity for every opened leaf.
- Frozen benchmark manifest, DEV task cards, HELD custody commitment and explicit DEV/HELD non-overlap proof.
- B0 and B1 algorithm specification, tokenization specification, ranking tie-break specification, top-k and byte-budget specification.
- Two independent clean DEV replay transactions with raw per-file scores, selections, metrics and exact-equality comparison.
- Negative tests for manifest drift, out-of-root traversal, symlink input, HELD task request, test-source leakage, duplicate task IDs, non-deterministic tie breaking and output overwrite.
- Exact candidate commit/tree, changed-file inventory, canonical verification, rollback instructions and three final review records.
rollback: >-
  Do not integrate the candidate; preserve the exact candidate and Evidence inventory,
  reset only the short-lived Task worktree by supported Git lifecycle after terminal
  accounting, and leave canonical main, the accepted source pack, P2-068 terminal
  accounting, P2, P3 HOLD and the Long-term Goal unchanged.
stop_conditions:
- Stop before execution if the accepted source-pack manifest, inventory or seal identity drifts or the configured artifact root is not the stable accepted source root.
- Stop if any P2-068 rejected branch, worktree, code, benchmark implementation or engineering Evidence is read, compared, copied or reused.
- Stop if a HELD task source leaf, PR-file payload or build result is opened by the Worker or DEV runner.
- Stop if any network, Provider, Secret, remote, production or public effect is requested or observed.
- Stop if any write escapes the Task branch allowlist or exact create-once Task Evidence root.
- Stop when two candidate generations, two implementation iterations, one same-Task repair or two review cycles are exhausted.
forbidden_actions:
- Read, compare, copy or reuse any P2-068 rejected engineering lineage input.
- Modify product source, accepted source-pack bytes, dataset split, oracle, metric, threshold, schedule or HELD custody.
- Execute Maven, Gradle, JVM tests or any build subprocess with network enabled; all real builds remain exact offline and sandbox-exec deny-network.
- Run HELD evaluation, tune on HELD, rerun-to-pass, replace a failed Task or create successor, remediation, normalization or closure chains.
- Use network, credentials, cookies, Authorization headers, uploads, Git fetch/clone/push, browser networking, Provider, remote, production or public release.
- Delete P2-068 terminal Evidence, modify Codex control-plane state, enter P3 or terminate the Long-term Goal.
claim_boundary: >-
  This Task may establish only P2_RECOVERY_BASELINE_ACCEPTED for one clean-room,
  source-bound Java benchmark foundation and its DEV simple-retrieval baselines. It
  does not claim Product Selector value, formal HELD performance, the P2 Exit Gate,
  P3 eligibility, production readiness or Long-term Goal completion.
