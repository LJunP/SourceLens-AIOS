    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical start, Goal, Founder decision, accepted-input or activation-parent identity drifts.
  - Any P1-147 rejected engineering asset is read or reused as an implementation input.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus four same-Task repairs are exhausted.
  - Any external effect occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
  - Evidence is overwritten or deleted, or the P1 Objective, Exit Gate or Phase boundary changes.
forbidden_actions:
