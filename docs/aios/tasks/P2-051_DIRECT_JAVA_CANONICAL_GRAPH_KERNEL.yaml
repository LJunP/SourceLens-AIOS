  - Two-root raw accepted-scanner pilot transactions and byte-exact replay receipt.
  - Complete deterministic graph positive matrix and full raw negative transaction set.
  - Closed Evidence manifest with path, type, byte length and SHA-256 identities.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
