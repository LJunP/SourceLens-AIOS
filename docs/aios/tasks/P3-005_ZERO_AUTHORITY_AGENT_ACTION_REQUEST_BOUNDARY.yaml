why_now: >-
  P3-001 already established the accepted durable checkpoint foundation. The exact
  Founder route now makes only slot 1 eligible. The current canonical AgentRuntime
  still calls ToolExecutionService directly, so the highest-value minimal change is
  to remove that authority-bearing dispatch and establish one typed, immutable,
  fail-closed request boundary before building the independent broker in slot 2.
objective: >-
  Make canonical AgentRuntime zero-authority with respect to tools: every LLM tool
  call becomes one immutable typed AgentActionRequest, enters one boundary with no
  tool, registry, sandbox or process executor dependency, and receives a durable
  DENY decision before AgentRuntime observes a result. If request freezing or denial
  persistence fails, no tool body or external effect may run.
success_claim: >-
  One local Java 17 product-path AgentRuntime action-request boundary proven to remove
  direct tool execution and to fail closed through durable pre-effect denial records.
  This is not broker, envelope-permission, isolation, trace-completeness, P3 Exit,
  production or hostile-principal acceptance.

