    - B0_RUN_B
    - B1_RUN_A
    - B1_RUN_B
    - B2_RUN_A
    - B2_RUN_B
  every_run_uses_unique_atomic_owned_root: true
  replay_recomputes_from_retained_artifacts: true
  stable_projection_exact_byte_equality_per_adapter: true
  rollback_exact_for_every_root: true
  mandatory_negative_false_accepts: 0
  external_effects_all_false: true

acceptance_criteria:
  - The exact Founder packet, Goal, activation parent and accepted dependencies remain identity-exact.
  - One Quality freeze precedes every Worker source mutation and its exact bytes remain immutable.
  - Distinct B0, B1 and B2 executables and SystemConfigurations consume the same TaskSpec, EnvironmentSnapshot, budgets, evaluator and public RunRecord contract.
  - B2 materializes and builds the accepted P0 snapshot offline and performs a real repository_analysis.scan operation with an independently verified external truth binding.
  - Six independent positive runs complete with exact per-adapter replay projection equality and exact rollback.
  - The verifier enumerates the complete physical inventory and proves final inventory equals the exact allowlist.
  - Every mandatory negative case is rejected with zero false accepts and zero nonowned residuals.
  - No adapter or producer supplies an authoritative success or independent-verdict claim.
  - Network, Provider, Secret, remote, production and public effects remain false.
  - Targeted verification passes on one clean exact candidate.
  - One exact candidate receives one fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes.
  - Reviewed tree equals integrated tree and exactly one canonical make verify passes after integration.

