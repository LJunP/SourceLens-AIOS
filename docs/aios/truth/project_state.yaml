capabilities:
  repository_intelligence:
    status: PARTIAL
    evidence_level: GATE_PASSED
    verified_scope: Java-focused scan AST relations code chunks retrieval and citations under local gates.
    limitations:
      - no task-conditioned benchmark against simple baselines
      - no hidden evaluation set
      - non-Java quality not established
      - source revision identity not consistently immutable
  agent_runtime:
    status: PARTIAL
    evidence_level: IMPLEMENTED
    verified_scope: Bounded conversation and tool loop with a maximum round count.
    limitations:
      - no durable task graph
      - no reliable checkpoint and resume contract
      - no independent completion verifier
  evaluation_research_foundation:
    status: PARTIAL
    evidence_level: TESTED
    verified_scope: Focused smoke tests and a 22-case deterministic retrieval regression corpus.
    limitations:
      - regression_corpus_explicitly_not_a_benchmark
      - no Baseline Suite
      - no hidden set
      - no reproducible Agent research harness
  trust_and_execution:
    status: PARTIAL
    evidence_level: GATE_PASSED
    verified_scope: Local sandbox flags audits release gates and selected negative tests.
    limitations:
      - lexical path controls can be bypassed through symlink resolution gaps
      - canonical repository revision is not immutably bound across the task
      - patch verification is not independent
      - checkpoint failure can be nonfatal in write paths
      - nonzero shell exit can be represented as a successful tool result
      - the default local executor provides a working directory but no filesystem or network isolation
      - raw preview can return unredacted content without the required acknowledgement and audit chain
      - artifact reads do not consistently verify stored checksums and audit persistence can fail open
      - source and chunk content can leave through LLM or embedding calls without DNS-resolved provider allowlisting
      - remote branch side effects do not have reliable rollback or reconciliation
  software_engineer_agent:
    status: NOT_PROVEN
    evidence_level: DEFINED
    limitations:
      - current AutoRepair may declare PATCH_READY without build and test verification
      - no full real issue to independent verification to evidence package loop
      - failed PR creation can leave a pushed remote branch without reliable rollback
  memory_and_learning:
    status: NOT_IMPLEMENTED
    evidence_level: DEFINED
    limitations:
      - transcript replay is not a measured memory system
  multi_agent_organization_runtime:
    status: NOT_IMPLEMENTED
    evidence_level: DEFINED
    limitations:
      - role documents and Codex reviews do not prove a product runtime
      - multi-Agent advantage has not been evaluated

