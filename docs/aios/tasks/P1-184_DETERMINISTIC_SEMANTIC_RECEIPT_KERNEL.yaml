acceptance_criteria:
  - The receipt schema and stable projection are closed, versioned, executable and machine-readable.
  - Paired receipts with different permitted observational noise produce exact-equal stable semantic bytes.
  - Mutating case, task, verdict, reason, expected, actual, count, taxonomy, identity, Evidence path/hash/length or order changes stable bytes or rejects.
  - Duplicate keys, unknown fields, NaN, Infinity, unsafe integers, invalid UTF-8, trailing payload, path escape, absolute Evidence paths, symlink and hardlink boundary violations reject.
  - Fresh owned roots in at least three parent topologies pass create-once, atomic finalization, closed inventory, cleanup and no-residue checks.
  - The independent evaluator reconstructs every projection from raw receipts without reading a generated summary as input.
  - Focused verification and Task-worktree make verify pass before one candidate freeze.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
required_evidence:
  - Exact Founder decision, Goal, activation parent, Contract and authority identities.
  - Raw paired receipts, independently reconstructed stable projections and exact equality receipts.
  - Complete semantic mutation and malformed-input negative matrix with zero false accepts.
  - Multi-topology create-once, atomic-finalization, closed-inventory, cleanup and no-residue receipts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
