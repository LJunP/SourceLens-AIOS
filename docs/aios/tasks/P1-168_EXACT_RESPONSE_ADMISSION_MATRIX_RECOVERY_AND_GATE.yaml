stop_conditions:
  - Canonical start, Goal, Founder decision, accepted-input, activation-parent or exact P1-165 Evidence identity drifts.
  - Safe filtered recovery cannot materialize exactly the nine manifest-bound regular files without path, type, mode, length, hash or inventory drift.
  - Any other rejected Task or unpermitted P1-165 asset is read, restored or reused.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Initial implementation plus four same-Task repairs are exhausted.
  - Any Secret read, Provider request, non-owned network effect or user-software mutation occurs.
  - Secret reflection, non-loopback, path escape, Evidence damage, permission expansion or actual budget overrun occurs.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or canonical make verify returns NONPASS.
forbidden_actions:
