  - The CLI builds a deterministic repository-root-independent graph from real scanner output.
  - Every graph node and edge has a closed schema and deterministic order.
  - Java TypeScript and Rust fixtures pass and root relocation produces identical output.
  - All negative cases reject with zero false accepts.
  - Stable replay and closed-manifest verification pass.
  - Provider requests, Secret reads and all six external effects equal zero.
  - One exact candidate receives fresh CTO Security and Quality TARGET_VERDICT PASS on the same bytes.
