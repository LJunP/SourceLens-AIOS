physical_owned_root_contract:
  cooperative_local_only: true
  acquire:
    - Every positive and negative runtime root must not exist before acquisition.
    - Creation is atomic, exclusive, non-recursive, and records device and inode ownership.
    - Every ancestor and the root are checked for path, type, symlink, realpath, and canonical containment before first write.
    - The root is recursively enumerated and proven empty before first write.
  inventory:
    - The verifier enumerates every physical descendant without following symlinks.
    - Regular files require one link unless the negative case deliberately creates a hardlink.
    - The external manifest binds every relative path, type, byte length, SHA-256, device, inode, and link count.
    - The complete inventory path set must equal the closed allowlist exactly.
  cleanup:
    - Cleanup may remove only a root created by this Task whose current device and inode equal the ownership receipt.
    - Unexpected, nonowned, preexisting, symlinked, hardlinked, or identity-drifted objects reject before cleanup.
    - Negative fixtures are independent, single-use, and leave zero nonowned residuals.

acceptance_criteria:
  - The Quality freeze exists before the first Worker source write and exact Quality bytes remain unchanged afterward.
  - TaskSpec, EnvironmentSnapshot, three SystemConfigurations, and every RunRecord validate against the accepted schemas and cross-contract preflight.
  - B0, B1, and B2 use distinct executables and configurations through one shared harness and independent evaluator.
  - B2 externally binds exact P0 commit 09cf8dd6a1bcee138b949d117804d652000eb7cc, tree daa58725d293b954887dbe5b17aab5219b618658, and analyzer subtree 408d57e9b4926f95ad059ab2675ee88dfc533096.
  - B2 starts the exact fixed local cargo command and obtains parseable SourceLens scan output; absence of the real repository_analysis.scan child is NON_PASS.
  - B0-A/B, B1-A/B, and B2-A/B are six separate child runs with distinct run IDs and owned roots.
  - Every adapter pair replays exactly and produces exact-byte-equal stable projections.
  - B1 exact rollback and B0/B2 no-mutation preservation are independently verified.
  - Every retained positive root has complete physical inventory and exact allowlist equality.
  - All required negative cases reject, false accepts equal zero, and nonowned residuals equal zero.
  - Network, Provider, Secret, remote, production, and public effects remain false.
  - Targeted verification, accepted input regressions, git diff check, and official Code Map check pass before candidate freeze.
  - One exact candidate receives fresh CTO, Security, and Quality TARGET_VERDICT PASS.
  - The reviewed tree equals the integrated tree and the single post-integration canonical make verify invocation passes.
  - Only after all preceding conditions does B0_B1_B2_COMPATIBILITY_ADAPTERS become ACCEPTED and strict P1 completion become 5/8 (62.5%).

required_evidence:
  - Exact Goal, Founder packet, Contract, canonical parent, accepted input, and P0 snapshot identities.
  - Quality Freeze identity and the external B2 truth-binding attestation.
  - Six raw run roots, external full-inventory manifests, RunRecords, evaluator receipts, replay receipts, and rollback receipts.
  - Negative matrix outcomes, zero false accepts, cleanup receipts, and zero nonowned residuals.
  - Exact candidate commit, tree, diff and hash manifest, and non-overwriting Evidence tag.
  - Fresh CTO, Security, and Quality reviews of the same exact candidate bytes and formal Evidence.
  - Reviewed-tree versus integrated-tree equality receipt and one canonical make verify result.

external_effects:
  network: false
  provider: false
  secret: false
  remote: false
  production: false
  public: false

rollback:
  run_level: >-
    Restore or prove unchanged the exact Task-owned disposable source tree,
    preserve positive Evidence, and remove only single-use negative fixtures
    whose live identity equals their ownership receipt.
  candidate_level: >-
    Do not integrate a final NON_PASS candidate; preserve its exact Git and
    external Evidence identities without rereview or correction.
  integrated_level: >-
    Use a non-destructive git revert of the exact integration commit if the
    single canonical make verify fails; never reset or clean.

stop_conditions:
  - Worker would need to change a Quality-owned frozen asset.
  - A required change falls outside the allowlisted paths.
  - A failed or rejected engineering asset must be read, restored, compared, copied, or reused.
  - Exact P0 B2 snapshot binding or the real repository_analysis.scan invocation cannot be proven.
  - Invalid input reaches a mutating action or child start.
  - Any preexisting or nonowned object is overwritten, followed, renamed, deleted, or cleaned.
  - Stable projections differ, rollback is not exact, false accepts exceed zero, or nonowned residuals exceed zero after the unique code-only repair.
  - The same normalized root cause occurs in both implementation iterations.
  - Any final Reviewer returns TARGET_VERDICT NON_PASS.
  - Reviewed and integrated trees differ or the single canonical make verify returns NON_PASS.
  - The Task requires a P1 Objective or Exit Gate change, external effect, P2/P3 entry, critical residual-risk acceptance, or irreversible action.

forbidden_actions:
  - Read, restore, compare, copy, or reuse P1-086, P1-089, P1-090, or any other rejected engineering source, fixture, candidate, test, diff, Quality implementation, or engineering Evidence.
  - Modify scripts/validate-current-task-authority.rb, scripts/check-p1-safety-boundary.sh, the P1 Objective, or the P1 Exit Gate.
  - Build a new authority kernel, Trust Runtime, Supervisor, Root Custody, sandbox platform, or Multi-Agent Runtime.
  - Execute free-form result-controlled code, shell, argv, cwd, environment, path, or module selection.
  - Use an API key, network, Provider, Secret, remote, production, or public effect.
  - Push, modify a remote, release, enter P2/P3, or create a successor, replacement, correction, normalization, closure, feasibility, or remediation chain.
  - Count Contract, Truth, Quality freeze, Review, hash, manifest, or receipt work as P1 capability progress.

