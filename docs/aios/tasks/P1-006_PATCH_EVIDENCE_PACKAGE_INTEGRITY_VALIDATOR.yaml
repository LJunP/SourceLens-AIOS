objective: >-
  Implement the smallest reusable, deterministic Patch Evidence Package integrity
  validator. It validates one frozen standalone synthetic package catalog against
  a Quality-owned closed package-manifest schema; proves referenced-path
  containment before content reads; verifies complete artifact population and
  SHA-256 bindings; checks TaskSpec, EnvironmentSnapshot and RunRecord schemas;
  checks package/task/run/source/environment/verification/rollback identity joins;
  and enforces the narrow structural invariants of a claimed verified-success
  package. It emits a typed canonical result and deterministic replay evidence.

why_now:
  - The active Goal makes a traceable, reversible Patch Evidence Package part of the only year-one product loop.
  - Evaluation Protocol v1.1 says a run cannot count as verified when mandatory package fields, independent verification, policy state or rollback evidence are incomplete.
  - P1-001 accepted local harness/evaluator/replay plumbing, but it did not implement a reusable Patch Evidence Package integrity contract or validator.
  - This increment is independent of the terminal P1-002 adapter, P1-003 dataset, P1-004 harness-admission and P1-005 VTSR-counting scopes.

research_hypothesis:
  statement: >-
    A standard-library-only validator can deterministically distinguish structurally
    complete, internally hash-bound synthetic Patch Evidence Packages from frozen
    one-fault packages without executing a baseline, judging patch correctness or
    using any stopped candidate.
  falsifier: >-
    The frozen package contract cannot produce one unambiguous result per fixture,
    path containment cannot be established before referenced bytes are read,
    replay differs, accepted P1-001 bytes drift, or completion requires a baseline,
    dataset, parameterized harness, VTSR counter, stopped partial, network or P2/P3 work.

claim_boundary:
  proves_if_accepted:
    - deterministic structural and hash-integrity validation for the exact frozen standalone synthetic package catalog
    - deterministic rejection of the exact frozen one-fault package fixtures with one typed primary reason
    - complete package artifact population, identity joins and replay for those fixtures
  does_not_prove:
    - patch correctness, issue resolution or independent evaluator correctness
    - B0, B1, B2 or A0 adapter conformance or execution
    - Agent capability, VTSR, benchmark performance or P1 exit
    - dataset or hidden-set validity
    - Repository Intelligence, P2 or P3 readiness
    - platform identity, strong isolation, hostile-principal resistance or production readiness

