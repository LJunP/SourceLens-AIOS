objective: >-
  Build a persistent task-bound tool-capability ledger that is created with an
  Agent Task, loaded by the production AgentRuntime, filters prompt exposure,
  and is re-read to reject every unauthorized tool invocation before any tool
  body runs.
architecture: >-
  Use a durable database grant record with exact Agent Task, project,
  conversation, policy identity, normalized tool allowlist, permission ceiling
  and ACTIVE/REVOKED status. ToolContext carries only the selected grant id;
  enforcement reloads the durable record and compares the runtime subject and
  requested tool. This architecture is independently authored from canonical
  main and does not read or reuse P3-002 engineering lineage.
why_now: >-
  P3-001 durable resume is accepted. P3-002 terminated without integration
  because a legacy JUnit TempDir escaped its Task write roots. P3 remains active,
  the capability milestone is still missing, and this is the milestone's final
  permitted independent product implementation Task.
preactivation:
  required_before_product_write:
    - Run the exact legacy JUnit TempDir-bearing test under sandbox-exec deny network with TMPDIR, java.io.tmpdir and Surefire argLine bound inside the exact Task worktree.
    - Prove every observed JUnit temp path is inside that worktree and absent after completion.
    - Freeze the exact Maven, JDK 17, sandbox profile, argv, cwd and temp-root receipt.
  failure_action: TERMINAL_BEFORE_PRODUCT_WRITE
scope:
  allowed_paths:
    - backend-spring/src/main/java/com/sourcelens/module/agent
    - backend-spring/src/main/resources/db/migration
    - backend-spring/src/test/java/com/sourcelens
  product_source_required: true
  task_local_database_fixtures_only: true
  network_allowed: false
  provider_allowed: false
  secret_allowed: false
  remote_allowed: false
  production_allowed: false
  public_release_allowed: false
budget:
  engineering_tasks: 1
  engineering_hours: 32
  calendar_days: 8
