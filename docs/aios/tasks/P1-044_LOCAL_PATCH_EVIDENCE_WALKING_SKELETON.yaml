acceptance_criteria:
  - Exact materialized base commit/tree equals 68ce8226eff4c5c7230b55b18a4cbea2f8e4a20f/900814727113d65f5dad8b63222e14f39b2cf38b; issue test yields the frozen assertion failure and base regression passes.
  - The exact visible reference patch changes only src/range.mjs; issue-specific and regression tests both pass after application.
  - An independent evaluator rematerializes a fresh base, verifies the exact Quality-frozen logical-to-content-addressed P1-011 environment binding and all four accepted schema identities, reapplies the exact patch, reruns tests and reaches the same verdict without trusting Worker-reported results; any environment, source or schema drift fails closed.
  - No-op and wrong patches, test-file mutation, absolute or parent path, cwd or symlink escape, and pre-existing output collision all fail closed while a root-external sentinel and ../MASTER_TASK_AUTHORITY.json remain byte-identical.
  - Non-allowlisted executable, network/provider/secret request, forbidden environment key or host-environment inheritance is rejected before spawn; the child receives replacement allowlisted environment only; timeout or output overflow terminates the full process group and retains a terminal ledger.
  - Worker-owned paths cannot create, overwrite or mutate the independent verdict; the verdict is written create-once in the separate Quality root.
  - The Evidence manifest binds source/environment/Task/Contract/candidate identity, actual argv, exit status, stdout/stderr hashes, patch, tests, verdict, all artifact hashes and lengths, and rollback receipt.
  - Fresh replay has the same normalized semantic projection and evaluator verdict; original Evidence bytes remain unchanged; input, hash, extra-file or symlink-artifact drift fails closed.
  - Rollback restores base commit/tree/clean status and any disposable workspace is destroyed only through ownership-safe cleanup.
  - P1-001, P1-011 and P1-035 regressions, Task-targeted tests, disposable rebuild/replay and full make verify pass; fresh CTO, Security and Quality reviewers pass the one frozen candidate.

required_evidence:
  - Task Contract and phase-delegated authority exact identities
  - Quality evaluation-plan freeze identity and ownership map
  - positive base, patched-worker and fresh-evaluator command ledgers
  - bounded negative-control results with root-external sentinel identity
  - create-once independent verdict
  - complete Evidence manifest with SHA-256 and byte lengths
  - replay comparison and immutable-original-Evidence proof
  - rollback receipt proving exact base and clean state
  - targeted regression, clean rebuild/replay and full make verify results
  - frozen candidate commit/tree/diff manifest and three fresh independent reviews

rollback:
  task_workspace: Restore or discard only a Task-owned disposable materialization after proving its base commit, tree and clean state.
  candidate_integration: Use local non-destructive git revert if a post-integration regression appears; never reset or clean.
  evidence: Never delete, overwrite or rewrite retained Evidence or Review bytes.

stop_conditions:
  - Goal, Phase or canonical source identity drift.
  - Task or Phase hour, calendar, Task-count, implementation-iteration or candidate budget exceeded.
  - Any need for network, Provider, Secret, remote, production, public, irreversible or beyond-envelope permission.
  - Evaluator contamination, Evidence overwrite or damage, non-reproducibility, or unprovable rollback.
  - A candidate-added or worsened high-severity safety, data-integrity or source-identity root cannot close within the one same-Task bounded repair.
  - The walking-skeleton architecture hypothesis is falsified within budget such that the P1 Exit critical path is not executable.
  - Any required change to mission, ICP, year-one outcome, P1 Objective or P1 Exit Gate.

forbidden_actions:
  - Read, restore, diff, checkout, cherry-pick or semantically reuse any P1-043 rejected Task body, engineering source/tree/candidate, partial implementation, Quality asset, oracle, fixture, nonce, Evidence or Review body.
  - Modify accepted P1-001, P1-011, P1-035 dataset or the four accepted schema bytes.
  - Modify files outside allowlisted_paths or let the Worker modify Quality-exclusive roots.
  - Modify, replace, delete, rename or traverse from the Evidence root to MASTER_TASK_AUTHORITY.json or any parent-directory artifact.
  - Network, Provider, Secret, remote, production, public, dependency download, fetch, push, PR, remote merge, release or external message.
  - Execute B0, B1, B2 or A0, enter P2/P3, or build Agent Shell, model-initiated canonical write, Supervisor, Root Custody, Strong Isolation, Full Trust Runtime or Multi-Agent Runtime.
  - Create a successor, replacement, normalization, closure, feasibility or remediation chain, a second candidate, or more than one bounded same-Task repair.
  - Delete, overwrite or rewrite historical Evidence, Review, terminal record or NON_PASS.

