acceptance_criteria:
  - Canonical authority, strict phase predecessor and P1 safety pass before restored source mutation.
  - Exact Goal, Founder decision, activation parent and P1-165 receipt, manifest and archive identities pass.
  - Safe filtered restore materializes exactly the nine manifest paths with exact mode, length and SHA-256, creates no sidecars or extras, and preserves immutable P1-165 Evidence.
  - Exact accepted-input identities for P1-035, P1-101, P1-129 and P1-149 are verified from canonical bytes and accepted Git ancestry.
  - The complete frozen matrix runs in one pre-freeze pass and names all expected cases before execution.
  - Every case uses closed typed stimulus data independent of case labels.
  - The five P1-165 implementation roots each have an independently executed regression assertion.
  - Output usage 2047 and 2048 are admitted, 2049 is rejected, and 2048_FULL_SPINE completes compiler, owned-copy apply, oracle/tests, trace/replay and rollback.
  - Exactly 36 synthetic cells run across B0, B1 and B2; B2 produces twelve real accepted P0 repository_analysis.scan child invocations.
  - All 36 cells traverse accepted P1-149 and P1-101 replay/rollback paths and preserve causal adapter identities.
  - All negative matrices produce zero false accepts, zero unsafe persistence and zero unauthorized external effects.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same candidate and raw preflight Evidence.
  - Reviewed tree equals integrated canonical tree and one canonical make verify passes.
  - This Task grants no P1 Exit capability credit and cannot enter P1-169 before its complete Task Gate.
required_evidence:
  - Exact Founder source packet, schema-compatible reissue, structured Decision, Goal, activation parent, Contract and authority identities.
  - Exact P1-165 receipt, manifest and archive verification plus filtered-restore receipt and closed recovered inventory.
  - Accepted-input identity receipt for P1-035, P1-101, P1-129 and P1-149.
  - Complete typed matrix inventory and raw per-case outcomes for all five historical roots and all frozen admission cases.
  - Synthetic 36-cell plan, adapter actions, P1-149 artifacts and P1-101 trace/replay/rollback receipts.
  - Raw-only independent evaluator result, closed inventory and reproduction command.
  - Task-worktree make verify receipt.
  - Candidate commit, tree, exact diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and preflight bytes.
  - Reviewed-tree versus integrated-tree equality and canonical make verify result.
