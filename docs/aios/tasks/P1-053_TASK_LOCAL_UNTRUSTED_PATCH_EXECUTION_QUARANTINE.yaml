execution_model:
  trusted_parent_responsibilities:
    - Verify every bound executable, Contract, profile, input and task-owned path before child launch.
    - Atomically create a unique disposable materialization and synthetic canaries without following or replacing pre-existing objects.
    - Materialize the exact REP-001 base, structurally admit and apply the exact test patch, record Evidence and perform exact rollback.
    - Rebuild the child environment from a literal allowlist and launch only the exact sandbox command.
  untrusted_child_boundary:
    - Each child runs under the deny-default OS runtime profile before importing patched materialization code.
    - The child receives read access to the declared materialization and only the minimum frozen runtime resources required by Node.
    - The child receives no write access and no network, Secret, canonical, Evidence-root, undeclared host-filesystem, shell, fork or descendant-process capability.
  exact_positive_commands:
    - /usr/local/bin/node test/issue.test.mjs
    - /usr/local/bin/node test/regression.test.mjs
  node_test_runner_process_isolation_allowed: false
  text_regex_token_or_ast_capability_denylist_as_security_boundary_allowed: false

