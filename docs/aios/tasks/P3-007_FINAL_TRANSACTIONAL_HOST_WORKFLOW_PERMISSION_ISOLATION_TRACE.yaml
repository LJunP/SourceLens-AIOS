objective: >-
  Deliver the smallest independently authored transactional host-owned finite-state
  Single-Agent workflow that closes the remaining P3 structural permission,
  fixed-handler resume isolation and complete observable trace outcomes without
  introducing an Agent-authored plan, dynamic capability ledger, generic tool broker,
  interpreter or open shell.
why_now: >-
  P3-001 has independently accepted durable checkpoint resume, while the final Founder
  route makes exactly one clean-room product slot eligible and keeps the strict Exit
  audit locked. The highest-value action is therefore one bounded vertical product
  slice that makes persisted state authoritative before model invocation and makes
  every effect transactionally fenced, ordered, replay-safe and traceable.
architecture:
  ownership: HOST_OWNED_FIXED_STATE
  persisted_state_is_authoritative: true
  sole_next_state_verified_before_model_invocation: true
  model_allowed_state: AGENT_EFFECT_FREE_PAYLOAD
  agent_output: CLOSED_STATE_SPECIFIC_TYPED_PAYLOAD_ONLY
  agent_authority: ZERO_EFFECT_AUTHORITY
  forbidden_runtime_primitives:
    - AGENT_AUTHORED_PLAN
    - AGENT_ACTION_REQUEST
    - DYNAMIC_GRANT
    - GENERIC_TOOL_REGISTRY
    - TOOL_BROKER
    - PLAN_INTERPRETER
    - OPEN_SHELL
  dispatch_protocol:
    exclusive_intent_committed_before_handler: true
    later_state_hidden_while_intent_in_flight: true
    state_advance_after_handler_success_and_durable_result_only: true
    failure_keeps_prior_state_and_durable_failure_trace: true
    crash_reconciliation: EXACT_IDEMPOTENCY_IDENTITY_OR_FAIL_CLOSED_NO_EFFECT_REPLAY
  complete_trace_events:
    - REQUEST
    - STATE_DECISION
    - DISPATCH_INTENT
    - HANDLER_START
    - HANDLER_RESULT
    - CHECKPOINT_COMMIT
    - ROLLBACK_OR_FAILURE
