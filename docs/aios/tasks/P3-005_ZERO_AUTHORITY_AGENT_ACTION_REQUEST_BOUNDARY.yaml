acceptance:
  compile:
    java_major: 17
    backend_test_compile_required: true
  product_path:
    - AgentRuntime constructor and fields contain no ToolExecutionService, ToolRegistry, AgentTool, SandboxExecutor or ProcessBuilder dependency.
    - AgentRuntime tool-call loop invokes only AgentActionRequestBoundary for tool requests.
    - AgentActionRequestBoundary contains no path that invokes a tool body, registry, sandbox or process.
  immutable_request:
    - Valid tool-call input becomes one typed AgentActionRequest with an immutable canonical JSON argument snapshot.
    - Mutating the caller argument map after submission cannot change the persisted request bytes.
  fail_closed_denial:
    - Every valid request persists one ACTION_DENIED_NO_TASK_ACTION_ENVELOPE record before returning a denial result.
    - Request freeze failure persists one fail-closed denial when persistence is available.
    - Denial persistence failure returns ACTION_DENIAL_RECORD_PERSISTENCE_FAILED and invokes zero tool bodies.
  tests:
    required_classes:
      - com.sourcelens.AgentActionRequestBoundaryTest
      - com.sourcelens.AgentRuntimeActionBoundaryTest
      - com.sourcelens.ToolExecutionServiceTest
    legacy_regression_subset:
      - com.sourcelens.ExecutionCheckpointServiceTest
      - com.sourcelens.ExecutionCheckpointH2IntegrationTest
    all_required_tests_pass: true
  static_negative_checks:
    - NO_AGENT_RUNTIME_TOOL_EXECUTION_SERVICE_REFERENCE
    - NO_ACTION_BOUNDARY_TOOL_REGISTRY_AGENT_TOOL_SANDBOX_EXECUTOR_PROCESS_BUILDER_REFERENCE
    - NO_PRODUCT_OR_TEST_PATH_OUTSIDE_ALLOWLIST
    - NO_DATABASE_MIGRATION
  external_effects_all_false: true
  candidate_manifest_required: true
  exact_test_receipt_required: true
  independent_review_required: true

