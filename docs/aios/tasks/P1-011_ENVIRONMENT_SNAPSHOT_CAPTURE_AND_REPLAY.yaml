    Keep canonical main unchanged until Task Gate. The activation commit is the
    rollback anchor; rejection deletes only the Task branch/worktree after
    Evidence preservation. Accepted integration must remain a local fast-forward
    descendant and retain the pre-integration commit as rollback reference.

delegated_authority:
  phase_local: true
  task_gate_owner: MASTER_CEO_AGENT
  founder_gate: RESERVED_DECISIONS_ONLY
  founder_reserved_decisions: []
  external_effects:
    network: false
    provider: false
    secret: false
    remote: false
    production: false
    public: false

completion_rule: >-
  Exact acceptance criteria, required Evidence, rollback proof and all three
  independent PASS reviews are required for the Master-owned Task Gate. PASS
  proves only local Environment Snapshot capture and replay conformance; it does
  not prove baseline performance, Agent ability, P1 completion, production
  readiness or hostile-principal resistance.
