architecture_constraints:
  - Build a new runtime; do not fork, rewrite or extend accepted P1-097/P1-099 adapter bytes.
  - Runtime dispatch is data-driven from frozen task and profile descriptors; generic runtime code cannot branch on a specific dataset Task ID.
  - A patch plan is a finite typed list of exact regular-file preimages and postimages, not a shell command or free-form program.
  - Patch plans may create or replace only declared Task-owned source files and may never modify tests.
  - B0 consumes a per-task frozen structured result and performs no tool call.
  - B1 executes only its per-task finite typed patch plan and declared local verification commands.
  - B2 first performs one real accepted-P0 repository_analysis.scan, proves the scan did not mutate source, and then executes only its per-task finite typed patch plan and declared local verification commands.
  - Every positive run uses an independently owned disposable root and returns it to the exact frozen source identity.
  - Raw records retain stochastic identifiers and timing; stable projection includes only declared deterministic fields.
quality_freeze:
  positive_matrix:
    task_count: 6
    profiles:
      - B0
      - B1
      - B2
    independent_runs_per_task_profile: 1
    scheduled_run_count: 18
  required_per_run:
    - exact TaskSpec and source inventory identity
    - exact SystemConfiguration and structured input identity
    - exact runtime and accepted-P0 executable identity where applicable
    - complete admission, execution, validation, result and rollback trace
    - exact output and RunRecord identity
    - deterministic stable projection
    - executable replay and exact rollback receipt
  negative_matrix:
    - task descriptor identity drift
    - task ID and descriptor mismatch
    - source preimage drift
    - source symlink
    - target path escape
    - target test-file mutation request
    - undeclared target file
    - patch operation reorder
    - patch postimage identity drift
    - SystemConfiguration drift
    - profile mismatch
    - B0 tool request
    - B1 undeclared command
    - B2 scan binding drift
    - output identity drift
    - missing trace event
    - reordered trace event
    - RunRecord identity drift
    - rollback identity drift
    - non-owned cleanup request
    - external-effect request
acceptance_criteria:
  - The new runtime contains no task-specific dispatch branch and reads all six task/profile plans from frozen data.
  - All 18 independent offline executions complete under the declared profile semantics.
  - Every B0 run performs zero tool calls.
  - Every B1 run applies only its finite typed plan and both declared tests pass.
  - Every B2 run performs one real exact accepted-P0 repository_analysis.scan, then applies only its finite typed plan and both declared tests pass.
  - All 18 runs produce exact identity-bound trace, output, RunRecord, stable projection, replay and rollback Evidence.
  - Every positive disposable source returns to its exact frozen pre-run identity.
  - Every negative case starts from a fresh one-time fixture and rejects with the expected stable reason code.
  - False accepts, undeclared executions, non-owned mutations and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same exact bytes.
  - The reviewed exact tree equals the integrated canonical tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact Founder packet, Contract, Goal, authority and activation parent identities.
  - Frozen dataset, descriptor, typed-plan, accepted-P0 source and executable bindings.
  - Raw 18-run outputs, traces, RunRecords, stable projections, replay and rollback receipts.
  - Complete negative matrix raw results and aggregate false-accept and external-effect counts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: DISPOSABLE_FIXTURE_EXACT_ROLLBACK_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Exact canonical parent, Goal, Founder packet, Contract, accepted dataset or accepted-P0 binding drifts.
  - Any P1-102/P1-104 rejected engineering asset is required.
  - An allowed path, Task budget or external-effect boundary must expand.
  - The sole same-Task code-only repair is exhausted or the same normalized root cause repeats.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, an external effect occurs, or the Phase boundary changes.
forbidden_actions:
  - Modify accepted P1-097/P1-099 adapter source or accepted P1-101 trace source.
  - Hardcode one dataset Task ID, expected answer or fixture-specific result into the generic runtime.
  - Execute arbitrary shell, eval, dynamic import from a Task plan, network, Provider or Secret access.
  - Read, restore, compare or reuse P1-102/P1-104 rejected source, fixture, runner, candidate or engineering bytes.
  - Enter P2/P3, push or modify a remote, or claim production or public readiness.
claim_boundary: >-
  Dataset-parameterized cooperative-local offline B0/B1/B2 execution runtime
  conformance over six accepted visible synthetic tasks only. This Task does
  not claim live-model performance, reproducible empirical baseline results,
  P1 completion, P2/P3 entry, production, public, hostile-principal or strong
  isolation capability.
