    - Quality fixture freeze manifest and hashes
    - source, runtime, dependency and policy input observations
    - actual argv, cwd, start/end time and exit status for verification commands
    - positive capture and verify results
    - two-materialization deterministic replay comparison
    - controlled source, dirty-state, runtime, dependency, policy, symlink and containment failures
    - candidate commit and tree
    - P1-001 regression and complete repository verification results
    - rollback proof
    - CTO, Security and Quality review reports

rollback:
