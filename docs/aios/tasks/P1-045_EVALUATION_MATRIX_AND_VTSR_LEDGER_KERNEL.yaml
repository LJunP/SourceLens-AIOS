quality_freeze_rule: >-
  After Task activation and before Worker implementation, a non-Worker Quality
  fixture author freezes the matrix, synthetic outcome fixtures, expected
  normative counts, mutation cases, ownership map and create-once verdict rules
  under the Quality-exclusive roots. The freeze receipt binds the physical
  fixture-author identity. Worker cannot modify those bytes or act as final
  Quality reviewer.

independent_recomputation_rule: >-
  The Quality evaluator is a disjoint implementation of the normative counting
  rules. It may read the frozen matrix, synthetic outcome fixtures, Task-local
  oracle and canonical serialization utility contract, but must not import,
  execute or copy Worker aggregation, normalization or ledger code. It writes a
  create-once verdict from raw retained inputs. The final Quality reviewer must
  be a fresh physical Agent instance distinct from the fixture author, evaluator
  author, Worker and owner; the Evidence binds all physical role identities.

runtime_and_environment_rule: >-
  Task code must not execute arbitrary shell or inherit the host environment.
  If a subprocess is unavoidable, the exact absolute executable path, realpath,
  SHA-256, byte length and mode are frozen; argv and cwd are bounded; the child
  receives a replacement allowlist-only environment. NODE_BIN, NODE_OPTIONS,
  NODE_PATH, HOME, tokens, Provider and Secret variables are rejected and cannot
  substitute a verifier. Exit zero alone never proves PASS; exact result
  artifacts and identities must also validate.

