architecture_constraints:
  - The kernel consumes scan-result schema v2 and never trusts repo_path as canonical identity.
  - Canonical file identity binds normalized repository-relative path and exact content SHA-256.
  - Canonical symbol identity binds file identity, language-independent symbol kind, name and exact source line span.
  - Graph nodes and edges are sorted deterministically and reject duplicate canonical identities.
  - Relation endpoints are classified as INTERNAL, EXTERNAL or UNRESOLVED without inventing internal authority.
  - Input paths must be normalized regular files inside the declared repository identity; path escape and symlink traversal fail closed.
  - The CLI is offline, read-only and writes its result only to stdout or a caller-owned explicit output file.
  - No historical rejected P2 implementation or test oracle is read or reused.
implementation_outputs:
  - analyzer-rust/src/graph_index.rs
  - analyzer-rust graph-index CLI subcommand
  - deterministic Rust unit and integration tests
  - one-command Task verifier
acceptance_criteria:
  - Java, TypeScript and Rust representative scan-result fixtures produce deterministic canonical graph bytes.
  - Repeating the same input from different absolute repository roots produces exactly identical graph identities and bytes.
  - Every internal edge resolves to exactly one canonical symbol node.
  - External and unresolved endpoints remain explicitly typed and never become fabricated internal nodes.
  - Duplicate identities, ambiguous endpoints, missing content digests, invalid spans, path escape, symlink input and tampered file identity are rejected.
  - Node and edge order remains stable across input order permutations.
  - Existing analyzer scan contract and full analyzer Rust tests pass.
  - Network, Provider, Secret, remote, production and public effects remain zero.
  - One exact candidate receives independent CTO, Security and Quality TARGET_VERDICT PASS.
  - Reviewed tree equals integrated tree and one canonical make verify passes.
required_evidence:
