execution_projection_contract:
  source: exact accepted P1-035 TaskSpec bytes
  projection_owner: Quality and Evaluation Agent
  allowed_json_pointer_deltas_in_order:
    - /environment_snapshot_ref
    - /verification/evaluator_version
  environment_snapshot_ref_rule: exact P1-011-derived snapshot_id for the selected Task materialization
  evaluator_version_rule: AIOS-P1-037-PARAMETERIZED-EVALUATOR/1.0.0
  all_other_fields_rule: canonical deep equality with the accepted P1-035 TaskSpec
  projection_identity_rule: >-
    Each binding receipt records original and projected path/hash/byte length,
    both exact deltas, source commit/tree, EnvironmentSnapshot identity and
    evaluator identity. Any third delta is EXECUTION_PROJECTION_DRIFT.
  original_asset_mutation_allowed: false

semantic_input_boundary:
  enforcement_claim: DECLARED_HASH_BOUND_INPUT_ADMISSION_NOT_OS_LEVEL_EXHAUSTIVE_READ_CONFINEMENT
  default: DENY
  manifest_population: exact
  canonicalization: UTF-8 canonical JSON with recursively sorted object keys and exactly one trailing LF
  path_form: normalized POSIX repository-relative path
  symlink: reject
  hardlink: reject
  special_file: reject
  entry_fields_in_order:
    - ordinal
    - role
    - path
    - media_type
    - schema_id
    - owner_role
    - visibility
    - byte_length
    - sha256
  accepted_dependency_inputs:
    - P1-035 dataset manifest, materialization recipe and selected Task artifacts
    - accepted TaskSpec schemas and P1-011 snapshot implementation
  quality_inputs:
    - projected TaskSpecs and execution-binding receipts
    - EnvironmentSnapshots and SystemConfigurations
    - evaluation requests and candidate patches
    - public-synthetic hidden enrollment, request and admission records
  adapter_exclusions:
    - Quality evaluator implementation
    - Quality oracle
    - unselected Task artifacts
    - real or historical hidden material
    - historical/offsite Evidence or untracked private material
  limitation: >-
    This contract verifies declared/configured semantic inputs and actual
    admission bytes. It does not claim hostile-principal resistance or prove
    that the cooperative-local Node process performed no other OS reads.

trusted_verification_substrate:
  pre_freeze_source: exact parent tracked tree
  post_freeze_source: exact candidate tracked tree
  candidate_derivation: parent plus only exact allowed path diffs
  access_mode: read-only declared verification substrate
  os_level_exhaustive_read_confinement_claim: false
  exact_entrypoints:
    - ./scripts/verify-p1-harness.sh
    - ./scripts/verify-p1-environment-snapshot.sh
    - ./scripts/verify-p1-task-dataset.sh
    - ./scripts/verify-p1-parameterized-harness.sh
    - make verify
  runtime_observation:
    node_executable: /usr/local/bin/node
    git_executable: /usr/bin/git
    capture_fields:
      - executable realpath
      - version
      - SHA-256
      - byte length
  forbidden_substrate:
    - historical hidden material
    - offsite custody
    - external historical Evidence
    - untracked private material

quality_freeze:
  must_complete_before_worker_start: true
  freeze_commit_position: first commit after activation on the Task branch
  roots:
    - evaluation-harness/fixtures/parameterized-harness
    - evaluation-harness/evaluator/parameterized
  required_artifacts:
    - OWNERSHIP_MAP.json
    - CASE_MATRIX.json
    - ORACLE.json
    - SEMANTIC_INPUT_MANIFEST.json
    - VERIFICATION_SUBSTRATE_DECLARATION.json
    - task-spec, environment, configuration and request schemas
    - hidden enrollment, hidden request and hidden admission schemas
    - REP-001 and REP-005 original-to-projection binding receipts
    - two projected TaskSpecs
    - two P1-011-derived EnvironmentSnapshots
    - two SystemConfigurations
    - visible and hidden positive/negative fixtures
    - parameterized independent evaluator and self-test
    - QUALITY_FREEZE_RECEIPT.json written last
  receipt_rule: >-
    The receipt excludes itself from its manifest and is externally identified
    by its fixed path and Git blob in the Quality freeze commit. It binds the
    exact Task Contract, parent commit/tree, Quality commit/tree, Owner map,
    semantic manifest, evaluator/oracle and every other Quality artifact by
    path/hash/byte length. Worker write access to both Quality roots is denied.

interfaces:
  visible_cli: >-
    node evaluation-harness/harness/parameterized/cli.mjs run --request FILE --output NEW_DIRECTORY
  hidden_cli: >-
    node evaluation-harness/harness/parameterized/cli.mjs admit-hidden --request FILE --admission FILE --output NEW_DIRECTORY
  replay_cli: >-
    node evaluation-harness/harness/parameterized/replay.mjs --evidence DIRECTORY --output NEW_DIRECTORY
  visible_run_interface: run(TaskSpec, EnvironmentSnapshot, SystemConfiguration, repetition_id) -> RunRecord
  visible_success_exit_status: 0
  evaluated_failure_exit_status: 1
  invalid_input_exit_status: 2
  unexpected_internal_failure_exit_status: 3

visible_execution_requirements:
  - Run the accepted P1-035 validator as an independent trusted-verification subprocess; do not import it into the adapter or runner.
  - Deterministically materialize each selected source-template and verify exact P1-035 commit/tree before candidate work.
  - Validate exactly two allowed execution-projection deltas and all four accepted contract schemas.
  - The fixture-patch adapter may consume only its exact semantic manifest and selected fresh workspace and may output only a candidate patch and action ledger.
  - The adapter must not read the Quality evaluator, oracle, unselected Tasks or hidden-admission content.
  - The independent evaluator applies the candidate patch in a separate fresh materialization, verifies changed-path scope, runs exact required commands and emits the canonical verdict.
  - Evaluator success must be based on patch applicability, required issue/regression commands, policy and Evidence; patch byte equality with a reference solution is forbidden as a success oracle.
  - Spawn errors, timeout, signal and nonzero exits must produce typed command ledger records rather than missing Evidence.

hidden_admission_requirements:
  mode: HIDDEN_EXTERNAL_CUSTODIAN
  visibility: PUBLIC_SYNTHETIC_ONLY
  successful_status: HIDDEN_HANDOFF_ADMITTED
  execution_route: EXTERNAL_CUSTODIAN_ONLY
  scheduled_run: false
  included_in_vtsr_denominator: false
  local_materialization: forbidden
  adapter_or_evaluator_invocation: forbidden
  run_record_creation: forbidden
  allowed_public_fields:
    - schema_version
    - request_id
    - mode
    - request_sha256
    - admission_id
    - hidden_set_public_id
    - hidden_set_version
    - environment_snapshot_id
    - evaluator_identity_sha256
    - execution_route
    - status
    - scheduled_run
    - included_in_vtsr_denominator
  recursively_forbidden_data:
    - hidden task identity
    - hidden path, repository or source
    - prompt or context
    - oracle, expected patch or expected result
    - per-Task result
    - private manifest bytes or locator
    - Secret or credential
  field_scan_rule: forbidden-field scan precedes generic unknown-field schema rejection

closed_reason_precedence:
  order:
    - INVOCATION_CONTRACT_VIOLATION
    - AUTHORITY_OR_SOURCE_IDENTITY_MISMATCH
    - OWNER_OR_STAGE_VIOLATION
    - QUALITY_FREEZE_IDENTITY_MISMATCH
    - MANIFEST_OR_SCHEMA_VIOLATION
    - PATH_LEXICAL_VIOLATION
    - PATH_CONTAINMENT_VIOLATION
    - SYMLINK_HARDLINK_OR_NONREGULAR_FILE_VIOLATION
    - ARTIFACT_POPULATION_MISMATCH
    - ARTIFACT_IDENTITY_MISMATCH
    - HIDDEN_DISCLOSURE_VIOLATION
    - EXECUTION_PROJECTION_DRIFT
    - ENVIRONMENT_IDENTITY_MISMATCH
    - REQUEST_BINDING_MISMATCH
    - HIDDEN_ADMISSION_REQUIRED
    - HIDDEN_ADMISSION_MISMATCH
    - POLICY_BOUNDARY_MISMATCH
    - ISSUE_TEST_FAILED
    - REGRESSION_TEST_FAILED
    - EVALUATOR_OR_ORACLE_IDENTITY_MISMATCH
    - REPLAY_MISMATCH
    - PASS
  rule: first failure only; remaining checks are NOT_EVALUATED_AFTER_FIRST_FAILURE

