architecture_constraints:
  - Implement from current canonical accepted assets without reading or reusing P1-141 engineering.
  - Calibrate the OS observer against a unique owned local server and held-open connection before reading Secret.
  - Atomically retain observer command, raw stdout, raw stderr, exit status and sample timestamps.
  - Start real-request observation before the request and cover the complete request lifecycle.
  - Persist request receipt before effect and persist HTTP status, response bytes, usage and response receipt before final observer verdict.
  - A missing instantaneous sample cannot destroy the transport before response Evidence is durable.
  - Any observed non-loopback connection is an immediate NON_PASS.
  - A strict diagnostic HTTP 2xx completion is required before the formal matrix.
  - HTTP 401 or 403 is classified as credential rejection rather than an observer failure.
  - Execute the 36 formal cells exactly once; failures remain in the denominator and are not replaced, rerun or beautified.
  - Reconstruct the report from frozen request and response receipts rather than filename order or self-comparison.
quality_freeze:
  offline_preflight:
    - Syntax and import checks for every new executable module.
    - Canonical authority and P1 safety entrypoints PASS before source mutation and before Secret input.
    - Exact accepted P1-129 adapter and P1-101 trace/replay identities are admitted.
    - B0, B1 and B2 each complete one representative adapter/trace/replay/rollback control.
    - An owned loopback server plus held-open connection produces durable positive OS-observer Evidence.
    - Missing, forged, reordered, cross-process and non-loopback observer records reject.
    - Request/response create-once, tamper, missing, duplicate, cross-binding, path and symlink cases reject.
    - Filesystem, process and network observation artifacts use closed inventories.
    - False accepts, Secret reads and Provider requests equal zero.
  formal_execution:
    - One diagnostic request either yields a strict HTTP 2xx completion or a durable exact failure classification.
    - A strict diagnostic PASS automatically enters one 36-cell formal execution.
    - All 36 scheduled cells remain in the denominator.
    - Request and response receipts bind execution, cell, task, profile, repetition, exact bytes, endpoint, model, process, timing, reservation, HTTP, peer and usage.
    - Formal report records source, environment, configuration, prompts, policy, tool, evaluator, trace, cost, uncertainty, failure taxonomy and reproduction commands.
    - False accepts, non-loopback connections, remote, production and public effects equal zero.
acceptance_criteria:
  - Complete offline preflight passes before the sole Secret read and before any Provider request.
  - The calibrated observer proves its positive controlled loopback case and rejects every frozen negative case.
  - One strict diagnostic HTTP 2xx completion is durably retained.
  - Exactly 36 formal Provider requests execute with zero automatic retries and all cells remain in the denominator.
  - Every request has a pre-effect create-once request receipt and every response has a durably bound response receipt.
  - The reproducible baseline report is rebuilt from frozen receipts and independently verified.
  - Replay, rollback, output closed inventory and external-effect observations pass with zero false accepts.
  - Secret persistence and unauthorized external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on identical bytes.
  - Reviewed tree equals integrated tree and one post-integration canonical make verify passes.
required_evidence:
  - Exact Founder source packet, structured decision, Contract, authority, Goal and activation identities.
  - Complete offline preflight raw and aggregate outputs.
  - Controlled observer calibration command, stdout, stderr, status, timestamps and negative results.
  - One diagnostic and 36 formal request/response receipts with closed inventories.
  - Raw adapter, trace, replay, rollback, evaluator and external-effect observation artifacts.
  - Reproducible baseline report, reconstruction command, independent verify command and result.
  - Exact candidate commit, tree, manifest, Evidence tag and fresh CTO/Security/Quality reviews.
  - Reviewed/integrated tree equality and one canonical make verify receipt.
rollback:
  strategy: DISPOSABLE_OWNED_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Canonical parent, Goal, Founder decision, accepted input or Contract identity drifts.
  - P1-141 rejected engineering or another rejected lineage would be required.
  - Offline preflight cannot prove the held-open loopback observer before Secret input.
  - A non-loopback, remote, production or public effect occurs.
  - Secret bytes enter repository, Evidence, logs, traces, prompts, reviews or Vault.
  - The one diagnostic does not produce a strict HTTP 2xx completion.
  - Formal execution returns NON_PASS or would require a rerun.
  - The two same-Task repairs are exhausted or the same normalized root cause repeats adjacently.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, permissions expand, or the Phase boundary changes.
claim_boundary: >-
