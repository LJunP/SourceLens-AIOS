acceptance:
  required:
    - Agent proposal data cannot select or widen executable, path, argv, environment, Docker option, credential, network target, resource limit or handler.
    - An immutable authorization anchor is persisted separately from the mutable invocation row and hash-binds all host-derived parameters.
    - Intent and checkpoint reservation are durable before any Docker effect; replay and crash reconciliation cannot duplicate the action.
    - Exactly one hash-chained durable terminal trace is accepted; no checkpoint advances before that acceptance.
    - Stage-aware cleanup records ACK-unknown, confirmed failure and confirmed absence without claiming absence from an unacknowledged rm.
    - Content-addressed custody rejects symlink, hardlink, mode, path, length or SHA-256 drift before effect.
    - The exact OCI create profile and post-start inspect state are attested; any drift fails closed and initiates cleanup.
    - Focused unit and H2 integration tests cover success, replay, conflicting proposal, anchor drift, pre-effect transaction failure, crash windows, orphan reconciliation, duplicate terminal, checkpoint gating, trace tamper, custody drift and cleanup stages.
    - One process-real pinned-image probe demonstrates zero false accepts, zero forbidden effects and zero checkpoint advancement before accepted terminal for AF_INET, AF_INET6, DNS, outside write, child spawn, privilege escalation and resource overflow attempts.
    - Fresh CTO, Security and Quality/Evaluation reviewers independently accept the same frozen candidate.
  task_gate: INDEPENDENT_CTO_SECURITY_QUALITY_ACCEPTANCE_AND_TEST_EVIDENCE_PASS
required_evidence:
  - candidate manifest with exact parent commit/tree, changed-file inventory and source hashes
  - focused unit and H2 integration test receipt with replay
  - process-real Docker preflight, exact argv/profile, image custody and hostile-probe receipt
  - immutable Cycle 1 finding set and three independent review records
  - if needed, one repair manifest that closes only frozen findings and proves no regression
  - Product Task Gate PASS or terminal NON_PASS receipt
non_goals:
  - Generic tool runtime or dynamic registry
  - Open shell or Agent-selected command execution
  - Privileged broker, separate OS principal or stronger isolation platform
  - Provider, Secret, credential, remote, production or public effect
  - P3 strict Exit Audit, P3 Phase Gate, P4 entry or project completion
