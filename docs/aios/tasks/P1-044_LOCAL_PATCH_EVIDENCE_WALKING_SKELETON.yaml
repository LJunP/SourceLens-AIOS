  After Task activation and before Worker implementation, a non-Worker Quality
  asset author freezes the Task-local executable evaluation plan, oracles,
  expected results, mutation cases and create-once verdict rules under the
  quality-exclusive roots. The Worker cannot modify those bytes or act as the
  final Quality reviewer.

