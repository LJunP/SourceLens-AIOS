acceptance_criteria:
  - Before any HELD source or payload read, exact candidate commit/tree, branch/worktree cleanliness, terminal receipt, all manifest-bound raw Evidence, product correctness, authority, source-to-class provenance, replay and closed environment independently PASS without identity drift.
  - P2-078 remains terminal NON_PASS; this Task performs no DEV rerun, product implementation, repair, retuning, threshold change or retroactive Task acceptance.
  - Preactivation PASS opens exactly the four P2-069 HELD tasks once; the accepted source pack, split, query, corpus, oracle, B1 control, metric, top-k 10, 131072-byte UTF-8 budget, candidate parameters and schedule remain byte-identical and immutable.
  - Every scheduled HELD task remains in the denominator; identity drift, missing oracle data or budget mismatch is INVALID and cannot be removed, replaced, repaired or rerun.
  - Under the original preregistered criterion, the exact candidate has higher macro task-relevant-evidence recall than the equal-budget deterministic lexical B1 control and does not increase forbidden-context admission; precision and reciprocal rank are retained as disclosed secondary metrics.
  - One create-once raw transaction binds exact inputs, candidate/runtime binaries, argv, cwd, closed environment, sandbox profile, stdout, stderr, exit, write inventory, per-task rankings, selected bytes, metrics and the zero-rerun lifecycle.
  - CTO, Security and Quality/Evaluation independently accept the exact immutable candidate, preactivation receipt, one-shot HELD transaction and complete raw Evidence before the Master Task Gate accepts K1 and K2.
required_evidence:
  - Create-once P2-079 authority, Contract lifecycle binding and preactivation receipt proving zero HELD reads before PASS.
  - Exact candidate Git identity and clean-state receipt; exact P2-078 terminal receipt and 166-leaf reviewer raw-manifest verification with no HELD or prohibited-lineage leaf.
  - Exact source-to-class, JDK 17, compiler, Surefire, sandbox-exec, replay, closed-environment, product-path and negative-test provenance inherited only as manifest-bound P2-078 Evidence.
  - Exact P2-069 accepted SOURCE_PACK, BENCHMARK_MANIFEST, B1 control and DEV/HELD non-overlap identities plus the original preregistration Artifact identity.
  - One and only one formal HELD dispatch transaction with raw per-task treatment/control selections and metrics, full denominator accounting, no rerun and no mutation.
  - Exact candidate integration identity only after formal PASS, or terminal non-integration proof after any NON_PASS.
  - Exact CTO, Security and Quality/Evaluation verdict records plus Master Task Gate and P2 Exit-Gate eligibility receipt when applicable.
rollback: >-
  On any preactivation or formal HELD NON_PASS, integrate nothing, preserve exact terminal
  Evidence, keep P2-078 terminal NON_PASS, consume the final slot, keep the implementation
  freeze, P2 and the Long-term Goal active, P3 HOLD, and create no successor or repair.
stop_conditions:
  - Stop with zero HELD reads if candidate, terminal receipt, raw manifest, product correctness, authority, source-to-class, replay, closed-environment, accepted source-pack or preregistration identity does not PASS exactly.
  - Stop if any product source, evaluator, dataset, split, oracle, metric, threshold, ranking, parameter, DEV result or candidate byte would need mutation or if a DEV rerun is requested.
  - Stop if any HELD source or payload is opened before the preactivation PASS receipt is create-once sealed.
  - Stop after the first formal HELD dispatch regardless of PASS, NON_PASS, INVALID, process failure or missing result; no rerun or replacement exists.
  - Stop if network, Provider, Secret, remote, production, public, deletion, database modification, P3 entry or Long-term Goal termination is requested or observed.
forbidden_actions:
  - Retroactively accept P2-078, create a Product DEV Task, second candidate, implementation repair, same-Task repair, successor, replacement, remediation, normalization or closure chain.
  - Modify or rerun DEV; mutate product, evaluator, dataset, split, oracle, metric, threshold, ranking, parameter, schedule, accepted B1 or the exact frozen candidate.
  - Read any P2-070 through P2-077 rejected engineering lineage; access to rejected bytes is overridden only for exact P2-078 candidate and manifest-bound Evidence.
  - Read HELD before preactivation PASS, dispatch HELD more than once, remove invalid tasks from the denominator, replace a task or rerun to pass.
  - Use network, Provider, Secret, remote, production, public release, deletion, database modification, P3 entry or Long-term Goal termination.
claim_boundary: >-
  This Task may only admit exact frozen P2-078 candidate e0c0f4d78b64b95b359746ab7c2fec4beed4311f
  for one untouched formal HELD dispatch and, on independent PASS, establish K1 and K2 plus
  P2 Exit-Gate eligibility. It cannot retroactively PASS P2-078, change the Exit Gate,
  authorize P3, claim production readiness, close P2 or terminate the Long-term Goal.
