acceptance_criteria:
  - the new Quality-frozen visible bundle passes admission, execution, evaluator, controlled-failure, promotion and replay checks
  - every referenced input, adapter and evaluator execution-closure file is hash- and byte-length-bound to its exact reference-map path, contains no symlink component, and has equal pre-spawn and post-execution identity
  - all fifteen declared atomic negative admission cases fail closed for their single typed expected reason
  - task/run/evidence identities for the new bundle contain no hard-coded AIOS-P1-001 identity
  - legacy P1-001 CLI, evaluator self-test, harness self-test and frozen evidence verification remain PASS
  - P1-001 contract, accepted schemas, evaluator, oracle, visible fixtures, harness_stub adapter and accepted evidence remain byte-identical
  - evidence is create-once, its closed population verifies, and fresh replay is byte-equal on normalized output and evaluator verdict
  - the final diff is confined to exact owned paths and the canonical main is not advanced by implementation
  - full make verify, fresh-clone rebuild and rollback verification pass
  - zero network, Provider, Secret, remote, production or public effect
  - CTO, Security and Quality independently return PASS on the same frozen candidate and evidence

failure_criteria:
  - accepted schema, P1-001 evaluator/oracle/fixture/adapter/evidence bytes change
  - any P1-002 or P1-003 rejected or hidden material is read, copied, reused or merged
  - a declared path/hash/length/symlink negative case is accepted
  - controlled failure is promoted, replay diverges, or evidence cannot be verified
  - a tracked write occurs outside exact owner scope, or an ephemeral test effect falls outside its three exact patterns or remains after self-test cleanup
  - any forbidden external effect occurs
  - the objective requires B0/B1/B2 execution, Repository Intelligence, Agent Runtime or P3 Trust work

stop_conditions:
  - source, Goal, Task Contract, authorization, Quality freeze or parent identity drifts
  - activation commit/receipt is not the unique implementation parent, or main moves outside the single authorized activation commit
  - a manifest reference, symlink status, consumed-byte identity or execution-closure identity drifts
  - scope, path, budget, metric, permission or claim expansion is required
  - the accepted P1-001 behavior cannot be preserved within two in-task implementation iterations
  - evidence, rebuild, rollback or offsite verification fails after the allowed implementation budget
  - CTO, Security or Quality final review is non-PASS
  - the same blocking cause recurs without new engineering evidence

