title: Versioned Representative Task Dataset

objective: >-
  Build and mechanically validate one versioned, visible, standalone synthetic
  software-engineering Task Dataset that can be deterministically materialized
  into clean Git repositories and consumed later by the common P1 Evaluation
  Harness. The dataset must directly close the P1 Exit Gate requirement for at
  least one representative task set without claiming benchmark, Agent, P2, P3,
  production or hostile-principal capability.

why_now:
  - VERSIONED_REPRESENTATIVE_TASK_DATASET is the first missing capability in the Founder-frozen P1 Exit Gate order.
  - P1-001 provides an accepted deterministic harness-conformance basis, but it contains only one mechanics fixture rather than a representative software-engineering task set.
  - Parameterized harness, baseline adapters and VTSR work require stable task identities, source materialization and declared coverage before they can produce comparable runs.

