  - Captured Provider result and accepted adapter execution have separate exact provenance.
  - All 12 B2 cells retain real exact accepted P0 repository_analysis.scan child receipts.
  - formal-015 and formal-018 remain failures and are not deleted, replaced or rerun.
  - Independent evaluation applies frozen patches, runs exact task tests and records complete failure taxonomy.
  - Replay reconstructs each stable result from frozen raw inputs, adapter receipts and identity bindings.
  - The complete real-filesystem negative matrix rejects with zero false accepts.
  - Closed output inventory rejects extra, missing, mutation and reorder.
  - Independent OS-level observation reports zero network, Provider, Secret, remote, production and public effects.
