objective: >-
  Build and execute one clean-room, cooperative-local observable-trace vertical
  slice that records every SUT and evaluator action, restores an actual disposable
  Git worktree to its exact frozen logical state, truthfully retains any physical
  inode replacement, proves physically independent A/B stable-projection equality,
  and rejects every frozen negative control with zero false accepts.

why_now:
  - Strict P1 completion is 4/8 (50%) and OBSERVABLE_TRACE remains NOT_COMPLETE.
  - P1-076 established that inode equality is not a feasible rollback invariant
    for the pinned host Git restore behavior, while exact state restoration remains
    feasible and is the requirement in Evaluation Protocol v1.1.
  - The Founder authorized one formal Phase architecture revision from physical
    identity preservation to state-equivalent rollback with observed physical
    replacement; this is attempt ordinal 4 and not a P1-076 retry or repair.

