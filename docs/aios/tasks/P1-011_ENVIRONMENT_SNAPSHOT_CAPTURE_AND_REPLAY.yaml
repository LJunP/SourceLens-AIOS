schema_version: 1
record_type: sourcelens_aios_phase_delegated_task_contract
task_id: AIOS-P1-011_ENVIRONMENT_SNAPSHOT_CAPTURE_AND_REPLAY
phase: P1
title: Environment Snapshot Capture and Replay Verification
status: READY_FOR_PHASE_DELEGATED_EXECUTION
execution_authority: PHASE_DELEGATED
task_kind: EVALUATION_FOUNDATION_ENGINEERING
risk_level: medium

objective: >-
  Implement the smallest deterministic local Environment Snapshot capture and
  verification capability needed by the accepted P1 Evaluation Harness. The
  capability must bind a clean synthetic Git source identity, an explicit
  target-runtime declaration, declared dependency lockfiles, model/prompt/tool
  declarations and the existing P1 safety policy into a schema-valid snapshot;
  separately record the capture tool's observed local Node identity; reproduce the same deterministic
  identity projection from two fresh materializations; and reject controlled
  source, runtime, dependency and policy drift.

why_now:
  - AIOS-P1-001 proved visible synthetic harness conformance, but it consumes a manually frozen EnvironmentSnapshot rather than a reproducible capture path.
  - Reproducible environment identity is required before comparable local baseline evaluation can be trusted.
  - This is a bounded P1 engineering increment and does not require Repository Intelligence, Agent Runtime or P3 Trust Runtime.

