provider_execution_rules:
  - Resolve and connect only to literal 127.0.0.1 port 8787 with no DNS, proxy, redirect or fallback.
  - Use only POST /v1/chat/completions and exact model identifier gpt-5.6-luna.
  - Do not send restricted source bytes, tests, reference patches, evaluator bytes, Truth, governance, hidden material or Secrets.
  - Read the API Key only from the local process environment or a controlled temporary Secret file.
  - Never persist, hash, echo, log or retain the API Key in repository or Evidence.
  - Perform zero automatic Provider retries, including after ambiguous send or timeout.
  - Enforce request, input-token, output-token and USD caps before each call.
  - Record Provider provenance only as Founder-attested and not independently verified.
  - If currency metering is unavailable, report exact calls, tokens and latency and use UNKNOWN_GATEWAY_METERING_UNAVAILABLE.
acceptance_criteria:
  - The experiment specification, dataset split, Environment Snapshot, Evaluator, counting rule, metrics and exclusions are frozen before the first Provider call.
  - B0, B1 and B2 each retain at least two preregistered independent repetitions.
  - All preregistered success, failure, timeout, invalid and exclusion outcomes remain present in raw Evidence and aggregates.
  - Raw results and the stable aggregate report are reproducible from the retained non-secret inputs and receipts.
  - VTSR, false-success, unsafe-action, Evidence-completeness, latency, exact calls and exact token counts are independently recomputable.
  - No result-dependent metric, task, run, exclusion or Gate change occurs.
  - Provider requests are at most 144, input tokens at most 3000000, output tokens at most 300000, spend at most USD 25 and automatic retries equal zero.
  - Restricted source egress, remote, production and public effects equal zero.
  - The report keeps adapter conformance separate from empirical model performance and keeps Provider provenance unverified.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes and Evidence.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact governing Founder packet, activation projection, Contract, authority, Goal and activation-parent identities.
  - Accepted canonical dataset, adapters, observable trace, Environment Snapshot, Evaluator and counting-rule identities.
  - Frozen experiment specification and pre-call manifest.
  - Raw response-derived results with no Secret or restricted source bytes.
  - Exact per-call latency and token accounting with request count and zero-retry receipts.
  - Complete outcome ledger, aggregate report, replay and reproduction receipts.
  - Provider provenance and monetary-metering limitation statement.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: DISPOSABLE_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
