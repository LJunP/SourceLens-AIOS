architecture_constraints:
  - Reuse the accepted canonical adapters by invocation; do not fork or rewrite them.
  - Record observable events only; never retain hidden chain-of-thought.
  - Bind exact TaskSpec, Environment Snapshot, SystemConfiguration, executable, input, output, RunRecord and child invocation identities.
  - B2 must retain the real accepted P0 repository_analysis.scan child invocation.
  - Stable projection includes only predeclared deterministic fields; stochastic differences remain visible in raw trace bytes.
  - Replay and rollback are executable checks, not documentation claims.
quality_freeze:
  positive_matrix:
    - B0 A and B0 B each run through the accepted canonical adapter and emit a complete shared trace.
    - B1 A and B1 B each run through the accepted canonical adapter and emit a complete shared trace.
    - B2 A and B2 B each run through the accepted canonical adapter and bind a real accepted P0 repository_analysis.scan child invocation.
    - Each trace contains admission, execution, validation, result and rollback events in the declared order.
    - Each deterministic A/B pair has exact-equal stable projection bytes.
    - Raw stochastic fields remain retained and are not normalized into false equality.
  negative_matrix:
    - tampered event bytes
    - missing required event
    - reordered event
    - TaskSpec identity drift
    - Environment Snapshot identity drift
    - SystemConfiguration identity drift
    - executable identity drift
    - input identity drift
    - output identity drift
    - RunRecord identity drift
    - child invocation identity drift
    - unexpected output
    - undeclared child invocation
    - external-effect request
  execution_semantics:
    - PRE_EXECUTION negatives must record target execution zero.
    - POST_EXECUTION negatives may perform exactly one declared offline cooperative-local target execution and must reject before admission.
    - Every negative case starts from its own fresh one-time fixture.
acceptance_criteria:
  - Six independent B0/B1/B2 A/B positive runs pass through the accepted canonical adapters.
  - Every positive trace contains the complete declared event sequence and exact identity bindings.
  - Both B2 traces record a real invocation of the exact accepted P0 repository_analysis.scan.
  - Three deterministic stable projection pairs are exact byte equal.
  - Raw stochastic differences are retained without falsification.
  - Replay reproduces the stable projection and detects raw or projected identity drift.
  - Rollback returns each disposable target to its declared clean source state.
  - Every predeclared negative case rejects with its expected stable reason code.
  - PRE_EXECUTION and POST_EXECUTION cases obey the exact Founder-approved execution semantics.
  - False accepts, non-owned residuals, undeclared executions and all six external effects equal zero.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed exact tree equals the canonical integrated tree.
  - Exactly one post-integration canonical make verify invocation passes.
required_evidence:
  - Exact Founder packet, activation projection, Contract, authority, Goal and activation parent identities.
  - Exact accepted P1-099 integration receipt and canonical adapter source identities.
  - Raw six-run outputs, traces, RunRecords, stable projections, replay and rollback receipts.
  - Complete negative matrix raw results and aggregate false-accept/external-effect counts.
  - Exact candidate commit, tree, diff/hash manifest and recoverable Evidence tag.
  - Fresh CTO, Security and Quality reviews of the same candidate and Evidence bytes.
  - Reviewed-tree versus integrated-tree equality and one canonical make verify result.
rollback:
  strategy: DISPOSABLE_FIXTURE_CLEANUP_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
stop_conditions:
  - Accepted canonical adapter identity, Goal, route packet or activation identity drifts.
  - A rejected engineering lineage is required.
  - A required path exceeds this Contract or an external effect is required.
  - The single same-Task code-only repair is exhausted.
  - The same normalized root cause repeats in adjacent implementation iterations.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
  - Evidence is overwritten or deleted, or the Phase boundary changes.
claim_boundary: >-
  Accepted canonical cooperative-local offline B0/B1/B2 execution observable
  trace, deterministic stable projection, replay and rollback only; no model
  performance, baseline superiority, P1 exit, P2/P3 entry, production, public,
  remote, provider, hostile-principal or strong-isolation claim.
