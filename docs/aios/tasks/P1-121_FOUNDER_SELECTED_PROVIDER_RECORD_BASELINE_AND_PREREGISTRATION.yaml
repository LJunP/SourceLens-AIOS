quality_freeze:
  offline_preflight:
    - Exact Goal, packet, Contract, profile, selector, accepted canonical inputs and activation identities match.
    - The selected ZCode configuration path is a regular non-symlink input and no Secret value is emitted.
    - Complete selector matching, duplicate selector, disabled record, endpoint/model-only ambiguity and missing Secret cases reject before Secret delivery or network.
    - Atomic reservation rejects request 40, retry, reservation mutation, counter reset, token cap excess and malformed usage.
    - Loopback peer, path, redirect, proxy, DNS, fallback and response-size boundaries fail closed.
    - Current accepted B0/B1/B2 adapters, P1-101 observable trace and P1-070 counting inputs match their canonical accepted identities.
    - Six TaskSpecs by three configurations by two repetitions freeze to exactly thirty-six unique scheduled run IDs.
    - Every negative case starts from an independent, owned, one-time fixture.
    - Offline preflight performs zero Secret extraction, Provider requests and network connections.
  formal_execution:
    - At most three distinct minimal diagnostics are retained; no automatic retry occurs.
    - After the first strict diagnostic completion, exactly thirty-six formal requests execute serially without replacement.
    - Each run retains exact TaskSpec, EnvironmentSnapshot, SystemConfiguration, prompt, request, response, RunRecord and trace identities.
    - B0 has no tools; B1 exposes only the declared finite local tool boundary; B2 records the real accepted P0 repository_analysis.scan child.
    - Replay validates deterministic stable projection while raw stochastic differences remain visible.
    - Rollback returns every disposable run root to its predeclared state.
    - The independent aggregate reports numerator, denominator, failures, invalids, reason distribution, token usage state, cost state and latency.
  negative_matrix:
    - selector identity drift
    - duplicate matching Provider records
    - disabled selected Provider
    - endpoint drift
    - API format drift
    - model substitution
    - Secret missing or Secret sink request
    - reservation missing, mutation, reset, overflow or request 40
    - automatic retry request
    - non-loopback peer, redirect, proxy, DNS or fallback request
    - request, response, RunRecord, trace or scheduled-run identity drift
    - formal denominator deletion, replacement, duplicate or reorder
    - missing or forged B2 repository_analysis.scan child
    - rollback or replay drift
    - remote, production or public effect request
acceptance_criteria:
  - The complete offline preflight and negative matrix PASS with zero false accepts, zero Secret extraction and zero Provider/network effects.
  - Exactly one Founder-selected Provider record is selected and its Secret is delivered transiently without disclosure or persistence.
  - One strict loopback diagnostic completion passes within at most three distinct requests and zero automatic retries.
  - Exactly thirty-six unique formal B0/B1/B2 A/B runs execute and all remain in the denominator.
  - Provider request count is at most thirty-nine, all reservations precede Secret/network effects, and total reserved and actual usage remains within caps or is explicitly UNKNOWN where unavailable.
  - Every B2 run records a real exact accepted P0 repository_analysis.scan child invocation.
  - RunRecord, observable trace, stable projection, replay, rollback and independent aggregate pass their frozen validators.
  - False accepts, non-loopback connections, remote, production and public effects equal zero.
  - A reproducible baseline report contains the exact matrix, reproduction command, raw and aggregate results, failures, uncertainty, cost, limitations and no unsupported provenance or superiority claim.
  - A P2 context-engine preregistration freezes hypothesis, baseline, treatment, dataset, primary metric, guardrails, stopping rule, budget and no P2 execution.
  - One exact candidate receives fresh CTO, Security and Quality TARGET_VERDICT PASS on the same bytes.
  - The reviewed exact tree equals the canonical integrated tree and exactly one canonical make verify invocation passes.
required_evidence:
  - Exact Founder packet, Goal, activation parent, Contract, authority, Provider selector and profile identities.
  - Offline preflight raw cases, aggregate, zero-effect observation and selector redaction receipt.
  - Append-only reservation and request ledger with no Secret values or hashes.
  - Diagnostic request/response identity receipts and strict admission results.
  - Thirty-six raw run directories, requests, redacted responses, RunRecords, traces, stable projections, replay and rollback receipts.
  - B2 real repository_analysis.scan child receipts.
  - Independent aggregate, reproducible baseline report and offline P2 preregistration.
  - One exact candidate commit/tree/manifest, one recoverable Evidence tag and fresh CTO/Security/Quality reviews.
  - Reviewed-tree/integrated-tree equality and one canonical make verify result.
rollback:
  strategy: OWNED_DISPOSABLE_RUN_ROOTS_AND_NON_DESTRUCTIVE_GIT_REVERT_AFTER_CANONICAL_INTEGRATION
  forbidden:
    - git reset
    - git clean
    - destructive history rewrite
    - Evidence overwrite or deletion
stop_conditions:
  - Goal, packet, selector, profile, accepted canonical input or activation identity drifts.
  - The complete non-Secret selector does not identify exactly one enabled Provider record.
  - Secret extraction, delivery or sink boundaries cannot be proved before network use.
  - A rejected engineering lineage is required.
  - A required path, external effect or claim exceeds this Contract.
  - Three distinct diagnostic requests produce no strict completion.
  - An adjacent implementation iteration repeats the same normalized root cause.
  - All three implementation iterations are exhausted.
  - A formal scheduled run is removed, replaced, cosmetically rerun or omitted from the denominator.
  - Secret leakage, Evidence overwrite/deletion, non-loopback network, remote, production or public effect occurs.
  - Any final Reviewer, reviewed/integrated equality check or canonical make verify returns NON_PASS.
forbidden_actions:
  - Read, restore, compare, copy or reuse any P1-120 rejected engineering byte.
  - Infer a Secret from endpoint/model-only matching, recursive search, arbitrary first match or cross-Provider fallback.
  - Persist, print, hash, log, trace, review or import a Secret into repository, Evidence or Vault.
  - Use a non-loopback peer, redirect, proxy, DNS resolution or fallback endpoint.
  - Retry a Provider request automatically or exceed the exact request, token, cost, iteration or candidate limits.
  - Delete, replace, reorder, duplicate or cosmetically rerun a scheduled formal denominator entry.
  - Modify accepted canonical adapters, hidden assets, evaluator criteria, P1 Objective, P1 Exit Gate or Phase boundary.
  - Push, modify remote state, enter P2/P3, or produce production/public effects.
  - Use git reset, git clean, destructive history rewrite, or overwrite/delete retained Evidence.
claim_boundary: >-
  One Founder-selected cooperative-local loopback baseline over the exact
  predeclared B0/B1/B2 matrix plus one offline P2 experiment preregistration.
  No direct OpenAI provenance, model superiority, P2/P3 entry, production,
  remote, public, hostile-principal or strong-isolation claim.
