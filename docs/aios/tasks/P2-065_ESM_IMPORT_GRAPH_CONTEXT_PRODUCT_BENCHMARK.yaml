  Admit bounded regular .mjs source through the real SourceLens chunk and scan
  paths, derive deterministic repository-relative static ESM import and reverse-
  dependent graph context, use those persisted same-scan relations in the real
  Code QA selector, and determine on the complete accepted six-task sample
  whether graph-conditioned selection beats deterministic lexical retrieval
  under identical within-task UTF-8 byte budgets without increasing forbidden-
